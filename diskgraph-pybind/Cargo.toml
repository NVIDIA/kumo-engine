[package]
name = "diskgraph-pybind"
version = "0.1.0"
edition = "2021"
license.workspace = true

[lib]
name = "_c"
crate-type = ["cdylib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
# abi3-py310: build a single stable-ABI (limited API) extension whose
# floor is CPython 3.10 (the org-wide minimum). One `cp310-abi3` wheel
# loads unchanged on 3.10, 3.11, 3.12, 3.13 and 3.14+ — no per-version
# rebuild. pyo3 0.28 supports CPython up to 3.14. All bindings here stay
# within the limited API (#[pyclass], #[pyo3(get/set/signature)],
# create_exception!, PyDict/PyList/PyString/PyTuple), so abi3 is clean.
pyo3 = { version = "0.28", features = ["abi3-py310", "hashbrown"] }
pyo3-log = "0.13"
arrow = { version = "58.4.0", features = ["pyarrow"] }
arrow-array = "58.4.0"
arrow-schema = "58.4.0"
parquet = { version = "58.4.0", features = ["arrow"] }
diskgraph-engine = { path = "../diskgraph-engine" }
diskgraph-core = { path = "../diskgraph-core" }
diskgraph-index = { path = "../diskgraph-index" }
diskgraph-ingest = { path = "../diskgraph-ingest" }
diskgraph-rowpack = { path = "../diskgraph-rowpack" }
diskgraph-train-table = { path = "../diskgraph-train-table" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
crossbeam-channel = "0.5"
rand = "0.8"
memmap2 = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
anyhow = { workspace = true }
tokio = { version = "1.33", features = ["full"] }
uuid = { version = "1.4.0", features = ["v4", "serde"] }
rayon = "1"
tracing = { workspace = true, features = ["log"] }
tracing-log = "0.2"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
pyo3-build-config = { version = "0.28", features = ["resolve-config"] }
