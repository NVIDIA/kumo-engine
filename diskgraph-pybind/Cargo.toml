[package]
name = "diskgraph-pybind"
version = "0.1.0"
edition = "2021"

[lib]
name = "_c"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.26", features = ["extension-module", "abi3-py37", "hashbrown"] }
arrow = { version = "57.2.0", features = ["pyarrow"] }
arrow-array = "57.2.0"
arrow-schema = "57.2.0"
parquet = { version = "57.2.0", features = ["arrow"] }
diskgraph-engine = { path = "../diskgraph-engine" }
diskgraph-core = { path = "../diskgraph-core" }
diskgraph-ingest = { path = "../diskgraph-ingest" }
diskgraph-train-table = { path = "../diskgraph-train-table" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam-channel = "0.5"
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
anyhow = { workspace = true }
tokio = { version = "1.33", features = ["full"] }
uuid = { version = "1.4.0", features = ["v4", "serde"] }
tracing = { workspace = true }
