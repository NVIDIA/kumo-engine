title = "Kumo secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "These password values are synthetic inputs for authentication tests."
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^[A-Za-z]+Pass[0-9]+$''']
paths = [
  '''^test/rest/auth/test_direct_connect_auth_routes\.py$''',
  '''^test/rest/driver/test_direct_connect_auth_storage\.py$''',
  '''^ui/src/pages/Login/__tests__/DirectConnectLogin\.test\.tsx$''',
]

[[allowlists]]
description = "Allow only the four known test-only legacy encrypted key vectors."
targetRules = ["private-key"]
condition = "AND"
regexTarget = "match"
regexes = ['''ONbItCYj9KjrReydwgScQPK\+96UsdM1wDwvhtOLY|MIIE6jAcBgoqhkiG9w0BDAEDMA4ECCKQ2/opcFpN|MIIE6TAbBgkqhkiG9w0BBQMwDgQInb4\+n0m93y4C|MIIE6jAcBgoqhkiG9w0BDAEGMA4ECJaiNrqYzGvM''']
paths = ['''^test/connector/local/test_legacy_private_key\.py$''']

[[allowlists]]
description = "This Storybook example shows the YOUR_API_KEY documentation placeholder."
targetRules = ["curl-auth-header"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^YOUR_API_KEY$''']
paths = ['''^packages/kumo-ui-catalog/src/stories/components/ui/Markdown\.stories\.tsx$''']

[[allowlists]]
description = "This loopback benchmark authentication-scheme label is not a credential."
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^synthetic_sigv4$''']
paths = ['''^scripts/benchmarks/object_store/compare_streams\.py$''']
