name: Build an identified Engine wheel
description: Build the clean product tree and record its source and wheel receipt
inputs:
  product:
    description: Checked-out product source
    required: true
  output:
    description: Fresh output directory
    required: true
runs:
  using: composite
  steps:
    - name: Install the public build tool
      shell: bash
      run: python -I -m pip --isolated install --index-url https://pypi.org/simple ziglang
    - name: Build and record the exact wheel
      shell: bash
      env:
        PRODUCT: ${{ inputs.product }}
        OUTPUT: ${{ inputs.output }}
      run: python "$GITHUB_ACTION_PATH/build.py" "$PRODUCT" "$OUTPUT"
