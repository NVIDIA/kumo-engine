name: kumo-pytorch-report
description: Collect test and benchmark evidence for this workflow attempt.
inputs:
  pattern:
    description: Evidence artifact selection.
    required: true
  plan:
    description: Planned jobs and bindings.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      if: inputs.pattern != ''
      with:
        pattern: ${{ inputs.pattern }}
        path: ${{ runner.temp }}/evidence
    - name: Account for selected jobs and binding results
      if: always()
      env:
        PLAN_JSON: ${{ inputs.plan }}
        GH_TOKEN: ${{ github.token }}
      shell: bash
      working-directory: packages/experimental/kumo-pytorch
      run: python3 -m tests.e2e.ci_plan results --directory "$RUNNER_TEMP/evidence" --output "$RUNNER_TEMP/results.json"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      if: always()
      with:
        name: kumo-pytorch-results${{ github.run_attempt != 1 && format('-attempt-{0}', github.run_attempt) || '' }}
        path: |
          ${{ runner.temp }}/results.json
          ${{ runner.temp }}/results.md
        if-no-files-found: error
