name: PyTorch — Examples and Installation

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      prebuilt-diskgraph-wheel:
        description: The caller uploaded this run's diskgraph-wheel artifact.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  diskgraph-wheel:
    name: Setup / DiskGraph Build
    if: ${{ !inputs.prebuilt-diskgraph-wheel }}
    uses: ./.github/workflows/_diskgraph-wheel.yml
    with:
      readable-output: true

  notebooks:
    name: Examples / Notebooks
    needs: diskgraph-wheel
    if: ${{ !cancelled() && (needs.diskgraph-wheel.result == 'success' || (inputs.prebuilt-diskgraph-wheel && needs.diskgraph-wheel.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: packages/experimental/kumo-pytorch
    env:
      KUMO_CI_LABEL: Example notebooks
      KUMO_CI_REPORTS: |
        $RUNNER_TEMP/*.xml
        $RUNNER_TEMP/*acquisition.json
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/kumo-pytorch-setup
        with:
          diskgraph-wheel-artifact: diskgraph-wheel
          notebooks: 'true'
      # Each examples/<name>/walkthrough.ipynb runs in a copy of its folder; the JSON it
      # writes must equal the committed files byte for byte.
      - name: Every example notebook, failing on drift from its committed files
        run: |
          python3 "$GITHUB_WORKSPACE/test/kumo_pytorch/ci_reporting.py" run \
            --title "$KUMO_CI_LABEL / Every example notebook, failing on drift from its committed files" -- bash -e -o pipefail <<'KUMO_CI_COMMAND'
          python -m pytest -m notebook --require-imports -q --durations=0 --junitxml="$RUNNER_TEMP/notebook-tests.xml"
          KUMO_CI_COMMAND
      - name: Publish readable results and full logs
        if: ${{ always() }}
        uses: ./.github/actions/kumo-pytorch-results
        with:
          title: Example notebooks
          artifact: kumo-pytorch-diagnostics-notebooks
          status: ${{ job.status }}

  install:
    name: Installation / Package
    needs: diskgraph-wheel
    if: ${{ !cancelled() && (needs.diskgraph-wheel.result == 'success' || (inputs.prebuilt-diskgraph-wheel && needs.diskgraph-wheel.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: packages/experimental/kumo-pytorch
    env:
      KUMO_CI_LABEL: Installed wheel checks
      KUMO_CI_REPORTS: |
        $RUNNER_TEMP/*.xml
        $RUNNER_TEMP/*acquisition.json
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            packages/experimental/kumo-pytorch/pyproject.toml
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: diskgraph-wheel
          path: ${{ runner.temp }}/diskgraph-wheel
      # The wheel is built from the sdist, so this also checks the sdist is complete.
      - name: Build the sdist, then the wheel from it
        run: |
          python3 "$GITHUB_WORKSPACE/test/kumo_pytorch/ci_reporting.py" run \
            --title "$KUMO_CI_LABEL / Build the sdist, then the wheel from it" -- bash -e -o pipefail <<'KUMO_CI_COMMAND'
          uv build --package kumo-pytorch --out-dir "$RUNNER_TEMP/dist"
          KUMO_CI_COMMAND
      - name: Install the wheel and DiskGraph's into a fresh environment
        working-directory: ${{ runner.temp }}
        run: |
          python3 "$GITHUB_WORKSPACE/test/kumo_pytorch/ci_reporting.py" run \
            --title "$KUMO_CI_LABEL / Install the wheel and DiskGraph's into a fresh environment" -- bash -e -o pipefail <<'KUMO_CI_COMMAND'
          set -euo pipefail
          uv venv --python 3.12 fresh
          wheel=$(ls dist/kumo_pytorch-*.whl)
          uv pip install --python fresh/bin/python --torch-backend cpu \
            "kumo-pytorch[dev,examples] @ file://$RUNNER_TEMP/$wheel" diskgraph-wheel/diskgraph-*.whl \
            nbclient==0.11.0 ipykernel==7.4.0
          KUMO_CI_COMMAND
      - name: Copy the README, tests and examples out of the source tree
        run: |
          python3 "$GITHUB_WORKSPACE/test/kumo_pytorch/ci_reporting.py" run \
            --title "$KUMO_CI_LABEL / Copy the README, tests and examples out of the source tree" -- bash -e -o pipefail <<'KUMO_CI_COMMAND'
          mkdir "$RUNNER_TEMP/stage"
          cp -R README.md pyproject.toml docs tests conformance examples "$RUNNER_TEMP/stage/"
          KUMO_CI_COMMAND
      - name: kumo.pytorch imports from the installed wheel
        working-directory: ${{ runner.temp }}/stage
        run: |
          python3 "$GITHUB_WORKSPACE/test/kumo_pytorch/ci_reporting.py" run \
            --title "$KUMO_CI_LABEL / kumo.pytorch imports from the installed wheel" -- bash -e -o pipefail <<'KUMO_CI_COMMAND'
          ../fresh/bin/python -I -c '
          import importlib.metadata, sys
          import diskgraph, kumo.pytorch
          print("kumo-pytorch", importlib.metadata.version("kumo-pytorch"), kumo.pytorch.__file__)
          print("diskgraph", importlib.metadata.version("diskgraph"), diskgraph.__file__)
          assert kumo.pytorch.__file__.startswith(sys.prefix), "not the installed wheel"
          '
          KUMO_CI_COMMAND
      - name: README quick start on DiskGraph, from the installed wheel
        working-directory: ${{ runner.temp }}/stage
        run: |
          python3 "$GITHUB_WORKSPACE/test/kumo_pytorch/ci_reporting.py" run \
            --title "$KUMO_CI_LABEL / README quick start on DiskGraph, from the installed wheel" -- bash -e -o pipefail <<'KUMO_CI_COMMAND'
          ../fresh/bin/python -m pytest -p no:cacheprovider -q --require-imports \
            "tests/test_docs_code.py::test_page_code_runs_in_order[README.md]" --junitxml="$RUNNER_TEMP/install-readme.xml"
          KUMO_CI_COMMAND
      - name: Every example notebook, from the installed wheel
        working-directory: ${{ runner.temp }}/stage
        run: |
          python3 "$GITHUB_WORKSPACE/test/kumo_pytorch/ci_reporting.py" run \
            --title "$KUMO_CI_LABEL / Every example notebook, from the installed wheel" -- bash -e -o pipefail <<'KUMO_CI_COMMAND'
          ../fresh/bin/python -m pytest -p no:cacheprovider -m notebook --require-imports -q \
            --durations=0 tests/test_notebooks.py --junitxml="$RUNNER_TEMP/install-notebooks.xml"
          KUMO_CI_COMMAND
      - name: Publish readable results and full logs
        if: ${{ always() }}
        uses: ./.github/actions/kumo-pytorch-results
        with:
          title: Installed wheel checks
          artifact: kumo-pytorch-diagnostics-install
          status: ${{ job.status }}
