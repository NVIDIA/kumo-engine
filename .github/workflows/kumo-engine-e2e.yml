name: Kumo Engine shared E2E

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      scales:
        type: string
        required: true
      run_controls:
        type: boolean
        default: false
      write_reference:
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read
  id-token: write

jobs:
  wheel:
    if: github.ref == 'refs/heads/main' && vars.ENGINE_E2E_ENABLED == 'true'
    uses: ./.github/workflows/kumo-engine-pr.yml
    with:
      build_only: true
  cases:
    needs: wheel
    runs-on:
      group: ${{ vars.ENGINE_E2E_RUNNER_GROUP }}
      labels: ${{ vars.ENGINE_E2E_RUNNER_LABEL }}
    environment:
      name: gha-kumo-workflow-tests
      deployment: false
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(vars.ENGINE_E2E_MAX_PARALLEL || '1') }}
      matrix:
        scale: ${{ fromJSON(inputs.scales) }}
        control: ${{ inputs.run_controls && fromJSON('[false, true]') || fromJSON('[false]') }}
        case: [adtech_binary, delivery_multiclass, delivery_multilabel, delivery_multilabel_ranking,
               delivery_regression, delivery_forecasting, commerce_static_link, commerce_temporal_link,
               streaming_temporal_link, community_regression, payments_binary, fraud_binary]
    env:
      CASE: ${{ format('{0}{1}', matrix.case, matrix.control && '-control' || '') }}
      SCALE: ${{ matrix.scale }}
      WRITE_REFERENCE: ${{ inputs.write_reference }}
      ENGINE_E2E_DATA_S3: ${{ vars.ENGINE_E2E_DATA_S3 }}
      REFERENCES_S3: ${{ vars.ENGINE_E2E_REFERENCES_S3 }}
      RESULTS_S3: ${{ vars.ENGINE_E2E_RESULTS_S3 }}
      DISKGRAPH_DATA_ROOT: /mnt/localssd
      CUDA_VISIBLE_DEVICES: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: engine-pr-wheel-${{ github.sha }}
          path: ${{ runner.temp }}/wheel
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6
        with:
          role-to-assume: arn:aws:iam::926922431314:role/gha-kumo-workflow-tests
          role-duration-seconds: 21600
          aws-region: us-west-2
      - name: Install the wheel and run one case outside the checkout
        id: case
        run: |
          unset PYTHONPATH PYTHONHOME
          python -I -m venv "$RUNNER_TEMP/e2e-venv"
          wheels=("$RUNNER_TEMP"/wheel/*.whl)
          test "${#wheels[@]}" = 1
          "$RUNNER_TEMP/e2e-venv/bin/python" -I -m pip --isolated install "${wheels[0]}[s3]"
          mkdir -p "$RUNNER_TEMP/e2e"
          cp -r packages/kumo-engine/test/cases "$RUNNER_TEMP/e2e/"
          cd "$RUNNER_TEMP/e2e"
          mode=()
          if [[ "$CASE" == *-control ]]; then mode+=(--control); fi
          if [[ "$WRITE_REFERENCE" == true ]]; then mode+=(--write-reference); else
            aws s3 cp "${REFERENCES_S3%/}/$SCALE/$CASE.json" reference.json
          fi
          "$RUNNER_TEMP/e2e-venv/bin/python" -E -s "cases/${CASE%-control}.py" --scale "$SCALE" \
            --scratch "$DISKGRAPH_DATA_ROOT" --source-sha "$GITHUB_SHA" \
            --reference reference.json --output result.json "${mode[@]}"
      - name: Preserve results and an explicitly requested reference
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/e2e"
          cd "$RUNNER_TEMP/e2e"
          test -f result.json || python3 -c 'import json,os; print(json.dumps(dict(status="failed", phase="setup", case=os.environ["CASE"].removesuffix("-control"), control=os.environ["CASE"].endswith("-control"))))' > result.json
          aws s3 cp result.json "${RESULTS_S3%/}/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/$SCALE/$CASE.json"
          if [[ "$WRITE_REFERENCE" == true && '${{ steps.case.outcome }}' == success ]]; then
            aws s3 cp reference.json "${REFERENCES_S3%/}/$SCALE/$CASE.json"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: always()
        with:
          name: engine-e2e-${{ env.CASE }}-${{ matrix.scale }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e/result.json
          if-no-files-found: error
