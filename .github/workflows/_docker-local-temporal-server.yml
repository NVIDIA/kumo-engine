name: (Manual) Legacy Local Temporal Server docker build for Snowflake

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      kumo_repo_ref:
        description: 'Your development branch name'
        required: true
        default: 'development'
        type: string
      # Allow specifying the Snowflake image repo as input. We currently assume
      # only the base URL changes; the rest of the path and credentials are static.
      snowflake_image_repo:
        description: 'Base URL for the Snowflake image repo to use'
        required: false
        default: 'lfwgwbp-kumo-snowservices.registry.snowflakecomputing.com'
        type: string
  workflow_dispatch:
    inputs:
      kumo_repo_ref:
        description: 'Your development branch name'
        required: true
        default: 'development'
      # Allow specifying the Snowflake image repo as input. We currently assume
      # only the base URL changes; the rest of the path and credentials are static.
      snowflake_image_repo:
        description: 'Base URL for the Snowflake image repo to use'
        required: false
        default: 'lfwgwbp-kumo-snowservices.registry.snowflakecomputing.com'
        type: string

env:
  SNOWFLAKE_REGISTRY: ${{ inputs.snowflake_image_repo }}
  SNOWFLAKE_REGISTRY_USER: kumo_snowservices
  SNOWFLAKE_REGISTRY_PAT: ${{ secrets.SNOWFLAKE_REGISTRY_PAT }}

permissions:
  contents: read

jobs:
  build:
    name: Build legacy local Temporal image
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.kumo_repo_ref }}

      - name: Clone kumo repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: kumo-ai/kumo
          token: ${{ secrets.GITHUB_TOKEN }}
          path: docker/kumo
          ref: ${{ inputs.kumo_repo_ref }}

      - name: Free up disk space
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo swapoff -a
          sudo rm -rf /swapfile /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost $AGENT_TOOLSDIRECTORY
          sudo apt clean
          sudo ls -lrt /var/tmp
          sudo rm -rf /var/tmp/*
          df -h

      - name: Install fuse-overlayfs
        run: |
          sudo apt -y update
          sudo apt-get install -y fuse-overlayfs
          sudo curl -fL \
            "https://github.com/containers/fuse-overlayfs/releases/download/v1.16/fuse-overlayfs-x86_64" \
            -o /usr/bin/fuse-overlayfs
          sudo chmod +x /usr/bin/fuse-overlayfs
          fuse-overlayfs --version
          mkdir -vp ~/.config/containers
          printf "[storage]\ndriver=\"overlay\"\n[storage.options]\nmount_program=\"/usr/bin/fuse-overlayfs\"\n" > ~/.config/containers/storage.conf
          cat ~/.config/containers/storage.conf

      - name: Log in to Snowflake Registry
        uses: redhat-actions/podman-login@4934294ad0449894bcd1e9f191899d7292469603   #  v1.7
        with:
          username: ${{ env.SNOWFLAKE_REGISTRY_USER }}
          password: ${{ env.SNOWFLAKE_REGISTRY_PAT }}
          registry: ${{ env.SNOWFLAKE_REGISTRY }}

      - name: Declare variables
        id: vars
        shell: bash
        run: |
          pwd
          ls
          echo ${{ inputs.kumo_repo_ref }} > ./docker/kumo_version.txt
          cat ./docker/kumo_version.txt

      - name: Check disk space and inodes
        run: |
          df -h
          df -i

      - name: Build image
        id: build-image
        uses: Wandalen/wretry.action@e68c23e6309f2871ca8ae4763e7629b9c258e1ea   #  v3.8.0
        with:
          action: redhat-actions/buildah-build@7a95fa7ee0f02d552a32753e7414641a04307056 # v2
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          token: ${{ secrets.GITHUB_TOKEN }}
          with: |
            image: local-temporal-server
            tags: ${{ inputs.kumo_repo_ref }}
            context: ./docker
            containerfiles: |
              ./docker/Dockerfile.localtemporal.rootuser
          attempt_limit: 3
          attempt_delay: 2000

      - name: Check disk space and inodes
        id: check-disk-space
        if: ${{ always() }}
        run: |
          df -h
          df -i

      - name: Push to Snowflake Registry
        id: push-to-snowflake
        uses: Wandalen/wretry.action@e68c23e6309f2871ca8ae4763e7629b9c258e1ea   #  v3.8.0
        with:
          action: redhat-actions/push-to-registry@5ed88d269cf581ea9ef6dd6806d01562096bee9c   #  v2.8
          with: |
            image: ${{ env.INPUT_IMAGE }}
            tags: ${{ env.INPUT_TAGS }}
            registry: ${{ env.SNOWFLAKE_REGISTRY }}/kumo_app_db/image_repo/kumo_repo
          attempt_limit: 3
          attempt_delay: 2000

      - name: Print image URL
        run: |
          echo "Image pushed to Snowflake: ${{ steps.push-to-snowflake.outputs.registry-paths }}"
