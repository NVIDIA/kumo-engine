name: (Manual) Kumo UI build

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      kumo_repo_ref:
        description: "Your development branch name"
        required: true
        default: "development"
        type: string
      image_tag_suffix:
        description: "Appended to the pushed tag only, never to the baked
          version. The kumo3 orchestrator pushes <ref>_tmp and promotes to <ref>
          once every image in the set has built."
        required: false
        default: ''
        type: string
    outputs:
      build_success:
        value: ${{ jobs.build.outputs.build_success }}
  workflow_dispatch:
    inputs:
      kumo_repo_ref:
        description: "Your development branch name"
        required: true
        default: "development"
      image_tag_suffix:
        description: "Appended to the pushed tag only, never to the baked version"
        required: false
        default: ''
        type: string

permissions:
  contents: read
  id-token: write
  issues: write
  packages: read
  pull-requests: write

# Keyed on everything that selects the pushed tag, so runs writing different
# tags stay parallel. cancel-in-progress is false: a queued build
# waits rather than killing an in-flight push.
concurrency:
  group: kumo-ui-image-${{ inputs.kumo_repo_ref }}${{ inputs.image_tag_suffix }}
  cancel-in-progress: false

env:
  ECR_IMAGE_REGISTRY: 926922431314.dkr.ecr.us-west-2.amazonaws.com

jobs:
  build:
    environment: gha-kumo-ui-image-publish
    name: Build Kumo UI docker image
    runs-on: ubuntu-22.04
    outputs:
      build_success: ${{ steps.set-output.outputs.success }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.kumo_repo_ref }}

      - name: Clone Kumo repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          repository: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: docker/kumo
          ref: ${{ inputs.kumo_repo_ref }}

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be #  v1.3.1

      - name: Install fuse-overlayfs (upstream)
        timeout-minutes: 15
        run: |
          apt_get() { for i in 1 2 3; do sudo timeout -k 15 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120 "$@" && return 0; sleep 10; done; return 1; }
          apt_get update
          apt_get install -y fuse-overlayfs
          # apt's 1.7.1 (2021) has rmdir/ENOTEMPTY races on heavy pip uninstalls; pin upstream v1.16.
          curl -fL \
            "https://github.com/containers/fuse-overlayfs/releases/download/v1.16/fuse-overlayfs-x86_64" \
            -o /tmp/fuse-overlayfs
          echo "30c6b9e192600d6854e13397974c709d7cabd980b7d1a4d67defd8eb69677e91  /tmp/fuse-overlayfs" \
            | sha256sum -c -
          sudo install -m 0755 /tmp/fuse-overlayfs /usr/bin/fuse-overlayfs
          fuse-overlayfs --version
          mkdir -vp ~/.config/containers
          printf "[storage]\ndriver=\"overlay\"\n[storage.options]\nmount_program=\"/usr/bin/fuse-overlayfs\"\n" > ~/.config/containers/storage.conf
          cat ~/.config/containers/storage.conf

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::926922431314:role/gha-kumo-ui-image-publish
          aws-region: us-west-2

      - name: Log in to AWS ECR
        run: |
          aws ecr get-login-password --region us-west-2 |
            podman login \
              --username AWS \
              --password-stdin "${ECR_IMAGE_REGISTRY}"

      # Direct buildah-build calls: the Wandalen/wretry.action wrapper is
      # blocked by the org actions allowlist (its internal
      # @v3.8.0_js_action ref is not allowlisted).
      - name: Build Image
        id: build-image
        uses: redhat-actions/buildah-build@7a95fa7ee0f02d552a32753e7414641a04307056 # v2
        with:
          image: kumo-ui
          tags: ${{ inputs.kumo_repo_ref }}${{ inputs.image_tag_suffix }}
          context: ./docker
          containerfiles: |
            ./docker/Dockerfile.ui
          extra-args: |
            --ulimit nofile=65535:65535

      # wretry used to export the nested action's inputs as INPUT_* env vars;
      # later steps rely on them.
      - name: Export Build Image env
        run: |
          echo "INPUT_IMAGE=kumo-ui" >> "$GITHUB_ENV"
          echo "INPUT_TAGS=${{ inputs.kumo_repo_ref }}${{ inputs.image_tag_suffix }}" >> "$GITHUB_ENV"

      - name: Check Disk Space and inodes
        id: check-disk-space
        if: ${{ always() }}
        run: |
          df -h
          df -i

      - name: Push To AWS ECR
        id: push-to-ecr
        uses: redhat-actions/push-to-registry@5ed88d269cf581ea9ef6dd6806d01562096bee9c #  v2.8
        with:
          image: ${{ env.INPUT_IMAGE }} # env var set by previous Build Image step
          tags: ${{ env.INPUT_TAGS }} # env var set by previous Build Image step
          registry: ${{ env.ECR_IMAGE_REGISTRY }}/kumo

      - name: Print Image Url
        run: |
          echo "Image pushed to AWS ECR: ${{ steps.push-to-ecr.outputs.registry-paths }}"

      - name: Set output
        if: ${{ success() }}
        id: set-output
        run: echo "success=true" >> $GITHUB_OUTPUT

  post-comment-failure:
    needs: build
    if: ${{ failure() || cancelled() || needs.build.outputs.build_success != 'true' }}
    uses: ./.github/workflows/_post_comment_image_build.yml
    with:
      image_type: "ui"
      build_failure: true
    secrets: inherit
