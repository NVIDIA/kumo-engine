name: PR change table tests

"on":
  pull_request:
    paths:
      - '.github/scripts/pr-change-table*'
      - '.github/workflows/pr-change-table*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          persist-credentials: false
      - run: node --test .github/scripts/pr-change-table.test.cjs
