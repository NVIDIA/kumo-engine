name: PR change table tests

"on":
  pull_request:
    paths:
      - '.github/scripts/pr-change-table*'
      - '.github/workflows/pr-change-table*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          persist-credentials: false
      - run: node --test .github/scripts/pr-change-table.test.cjs
