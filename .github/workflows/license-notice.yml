name: Third-party license notice

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ startsWith(github.ref, 'refs/pull/') || github.run_number }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  license_notice:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.10'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
      - name: Populate the DiskGraph Cargo source cache
        run: cargo fetch --locked --manifest-path packages/diskgraph/Cargo.toml
      - name: Check Cargo workspace license declarations
        run: python scripts/check_cargo_license_metadata.py --manifest-path packages/diskgraph/Cargo.toml
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b  # v2.90.1
        with:
          tool: cargo-deny@0.20.2
      - name: Check the full DiskGraph Cargo graph against deny.toml
        working-directory: packages/diskgraph
        run: cargo deny check licenses
      - name: Reproduce the in-tree DiskGraph artifact manifest
        run: python packages/diskgraph/scripts/generate_artifact_manifest.py --repo-root packages/diskgraph --check packages/diskgraph/third_party/artifact-manifest.json
      - name: Check the generated notice and deny-by-default policy
        run: |
          python scripts/gen_third_party.py --check THIRD-PARTY.txt
          python scripts/gen_third_party.py --artifact kumo-bundled-source --check KUMO-THIRD-PARTY.txt
          python scripts/gen_third_party.py --artifact kumo-core-bundled-source --check packages/kumo-core/THIRD-PARTY.txt
          python scripts/gen_third_party.py --artifact kumo-sdk-bundled-source --check packages/kumo-sdk/THIRD-PARTY.txt
          python scripts/gen_third_party.py --artifact glove-6b-50d-bundled-data --check tools/glove-6b-50d/THIRD-PARTY.txt
      - name: Run focused generator tests
        run: python -m unittest test.scripts.test_gen_third_party test.scripts.test_refresh_diskgraph_notice_inventory test.scripts.test_cargo_license_metadata
      - name: Run focused npm notice tests
        run: |
          python -m pip install pytest==9.0.3
          python -m pytest -q --confcutdir=test/scripts/release test/scripts/release/test_generate_npm_third_party.py
