name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace

  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pre-install specific versions to fix kumoapi grpcio-tools build isolation issues
          pip install "setuptools<82" grpcio-tools maturin pytest
      - name: Build and Test Python Package
        working-directory: ./diskgraph-pybind
        env:
          PYTHONPATH: python
          KUMO_GITHUB_BOT_TOKEN: ${{ secrets.KUMO_GITHUB_BOT_TOKEN }}
        run: |
          # Rewrite SSH URLs to HTTPS directly in pyproject.toml so pip uses the token
          sed -i "s|git+ssh://git@github.com/|git+https://${KUMO_GITHUB_BOT_TOKEN}@github.com/|g" pyproject.toml

          pip install -e ".[test]" --no-build-isolation
          pytest python/tests/
