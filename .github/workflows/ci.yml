name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    env:
      # Reduce linker memory pressure on CI runners with limited RAM.
      RUSTFLAGS: "-C target-feature=+aes,+sse2 -C link-arg=-Wl,--no-keep-memory"
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build and Test
        run: cargo test --workspace

  python-test:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pre-install specific versions to fix kumoapi grpcio-tools build isolation issues
          pip install "setuptools<82" grpcio-tools maturin pytest
      - name: Build and Test Python Package
        working-directory: ./diskgraph-pybind
        env:
          PYTHONPATH: python
          KUMO_GITHUB_BOT_TOKEN: ${{ secrets.KUMO_GITHUB_BOT_TOKEN }}
        run: |
          # Rewrite SSH URLs to HTTPS directly in pyproject.toml so pip uses the token
          sed -i "s|git+ssh://git@github.com/|git+https://${KUMO_GITHUB_BOT_TOKEN}@github.com/|g" pyproject.toml

          pip install -v -e ".[test]" --no-build-isolation

          # Pre-build the ingest binary so the pytest fixture doesn't hang compiling it
          cd .. && cargo build --release --bin ingest && cd diskgraph-pybind

          pytest -v -s python/tests/
