name: EC2 Benchmark

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: ec2-benchmark
  cancel-in-progress: false

env:
  WARN_THRESHOLD: 12
  FAIL_THRESHOLD: 20
  BASELINE_ROOT: /mnt/localssd/benchmark_baseline
  DATA_ROOT: /mnt/localssd/benchmark_data
  CONFIG_LIST: scripts/benchmarks/benchmark_configs/config_list.txt
  S3_PREFIX: s3://kumo-unit-test/diskgraph-datagenerator

jobs:
  benchmark:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Build release
        run: cargo build --release

      - name: Cache benchmark data
        run: |
          set -euo pipefail
          mkdir -p "${DATA_ROOT}"

          while IFS= read -r config_path || [[ -n "$config_path" ]]; do
            [[ -z "$config_path" || "$config_path" =~ ^[[:space:]]*# ]] && continue
            config="${GITHUB_WORKSPACE}/${config_path}"
            [[ ! -f "$config" ]] && continue

            dataset=$(python3 -c "import json; print(json.load(open('${config}'))['dataset_name'])")
            local_dir="${DATA_ROOT}/${dataset}"

            # On schedule: always refresh from S3.
            # On push: only download if data is missing locally.
            if [[ "${{ github.event_name }}" == "schedule" ]] || [[ ! -d "${local_dir}" ]]; then
              echo "Syncing ${dataset} from S3..."
              aws s3 sync "${S3_PREFIX}/${dataset}/" "${local_dir}/" --quiet
            else
              echo "Using cached data for ${dataset}"
            fi

            # Generate local config by rewriting S3 paths to local paths.
            _CFG="${config}" _LOCAL_DIR="${local_dir}" python3 -c "
            import json, os
            config = os.environ['_CFG']
            s3_prefix = os.environ['S3_PREFIX']
            data_root = os.environ['DATA_ROOT']
            local_dir = os.environ['_LOCAL_DIR']
            with open(config) as f:
                cfg = json.load(f)
            for table in cfg.get('tables', []):
                src = table.get('source', {})
                paths = src.get('paths', [])
                src['paths'] = [p.replace(s3_prefix + '/', data_root + '/') for p in paths]
            with open(local_dir + '/diskgraph_config.json', 'w') as f:
                json.dump(cfg, f, indent=2)
            "
            echo "Prepared local config: ${local_dir}/diskgraph_config.json"
          done < "${CONFIG_LIST}"

      - name: Run all benchmarks
        id: benchmark
        run: |
          set -euo pipefail

          overall_failed=0
          overall_warned=0
          summary=""

          while IFS= read -r config_path || [[ -n "$config_path" ]]; do
            # Skip empty lines and comments
            [[ -z "$config_path" || "$config_path" =~ ^[[:space:]]*# ]] && continue

            config="${GITHUB_WORKSPACE}/${config_path}"
            if [[ ! -f "$config" ]]; then
              echo "::warning::Config not found: ${config_path}"
              continue
            fi

            dataset=$(python3 -c "import json; print(json.load(open('${config}'))['dataset_name'])")
            local_config="${DATA_ROOT}/${dataset}/diskgraph_config.json"
            stats_file="/mnt/localssd/diskgraph-index/${dataset}/ingest_stats.json"
            baseline_file="${BASELINE_ROOT}/${dataset}/ingest_stats.json"

            echo "::group::Benchmark: ${dataset}"
            echo "Config: ${local_config}"
            echo "Stats:  ${stats_file}"
            echo "Baseline: ${baseline_file}"

            # Run ingest with --col-stats using local data
            if ! COL_STATS_ENABLED=true ./diskgraph-ingest/scripts/ingest_s3.sh "${local_config}"; then
              echo "::error::Ingest failed for ${dataset}"
              overall_failed=1
              summary="${summary}| ${dataset} | FAIL (ingest error) | - | - |\n"
              echo "::endgroup::"
              continue
            fi

            # Compare against baseline
            if [[ ! -f "$stats_file" ]]; then
              echo "::warning::No stats file produced for ${dataset}"
              summary="${summary}| ${dataset} | WARN (no stats) | - | - |\n"
              echo "::endgroup::"
              continue
            fi

            if [[ ! -f "$baseline_file" ]]; then
              echo "No baseline found for ${dataset} — saving current run as baseline."
              mkdir -p "$(dirname "$baseline_file")"
              cp "$stats_file" "$baseline_file"
              summary="${summary}| ${dataset} | NEW BASELINE | - | - |\n"
              echo "::endgroup::"
              continue
            fi

            # Regression check
            result=$(python3 - <<PYEOF
          import json, sys

          with open("${stats_file}") as f:
              current = json.load(f)["stats"]["perf"]
          with open("${baseline_file}") as f:
              base = json.load(f)["stats"]["perf"]

          warn_threshold = ${WARN_THRESHOLD}
          fail_threshold = ${FAIL_THRESHOLD}
          metrics = ["encode_wall_ms", "pk_map_wall_ms", "edges_map_wall_ms", "index_wall_ms"]
          warned = False
          failed = False

          for m in metrics:
              if m not in current or m not in base:
                  continue
              cur = current[m]
              bas = base[m]
              if bas == 0:
                  continue
              delta_pct = ((cur - bas) / bas) * 100
              status = "OK"
              if delta_pct > fail_threshold:
                  status = "FAIL"
                  failed = True
                  print(f"::error::${dataset}: {m} is {delta_pct:+.1f}% vs baseline ({cur}ms vs {bas}ms)")
              elif delta_pct > warn_threshold:
                  status = "WARN"
                  warned = True
                  print(f"::warning::${dataset}: {m} is {delta_pct:+.1f}% vs baseline ({cur}ms vs {bas}ms)")
              print(f"  {m}: {bas}ms -> {cur}ms ({delta_pct:+.1f}%) {status}")

          cur_total = sum(current.get(m, 0) for m in metrics)
          bas_total = sum(base.get(m, 0) for m in metrics)
          if bas_total > 0:
              total_delta = ((cur_total - bas_total) / bas_total) * 100
              print(f"  TOTAL: {bas_total}ms -> {cur_total}ms ({total_delta:+.1f}%)")
              if total_delta > fail_threshold:
                  failed = True
                  print(f"::error::${dataset}: overall {total_delta:+.1f}% vs baseline")
              elif total_delta > warn_threshold:
                  warned = True
                  print(f"::warning::${dataset}: overall {total_delta:+.1f}% vs baseline")

          if failed:
              print("STATUS:FAIL")
              print(f"DELTA:{total_delta:+.1f}%")
              sys.exit(1)
          elif warned:
              print("STATUS:WARN")
              print(f"DELTA:{total_delta:+.1f}%")
          else:
              print("STATUS:OK")
              print(f"DELTA:{total_delta:+.1f}%")
          PYEOF
            )
            rc=$?

            echo "$result"

            if [[ $rc -ne 0 ]]; then
              overall_failed=1
              delta=$(echo "$result" | grep "^DELTA:" | tail -1 | cut -d: -f2)
              summary="${summary}| ${dataset} | FAIL | ${delta} | regression |\n"
            elif echo "$result" | grep -q "STATUS:WARN"; then
              overall_warned=1
              delta=$(echo "$result" | grep "^DELTA:" | tail -1 | cut -d: -f2)
              summary="${summary}| ${dataset} | WARN | ${delta} | review recommended |\n"
            else
              delta=$(echo "$result" | grep "^DELTA:" | tail -1 | cut -d: -f2)
              summary="${summary}| ${dataset} | OK | ${delta} | - |\n"
            fi

            echo "::endgroup::"
          done < "${CONFIG_LIST}"

          # Print summary
          echo ""
          echo "## Benchmark Summary"
          echo "| Dataset | Status | Delta | Notes |"
          echo "|---------|--------|-------|-------|"
          echo -e "$summary"

          if [[ $overall_failed -ne 0 ]]; then
            echo "::error::One or more benchmarks failed regression check."
            exit 1
          fi

      - name: Save baselines
        if: success()
        run: |
          set -euo pipefail
          while IFS= read -r config_path || [[ -n "$config_path" ]]; do
            [[ -z "$config_path" || "$config_path" =~ ^[[:space:]]*# ]] && continue
            config="${GITHUB_WORKSPACE}/${config_path}"
            [[ ! -f "$config" ]] && continue

            dataset=$(python3 -c "import json; print(json.load(open('${config}'))['dataset_name'])")
            stats_file="/mnt/localssd/diskgraph-index/${dataset}/ingest_stats.json"
            baseline_file="${BASELINE_ROOT}/${dataset}/ingest_stats.json"

            if [[ -f "$stats_file" ]]; then
              mkdir -p "$(dirname "$baseline_file")"
              cp "$stats_file" "$baseline_file"
              echo "Saved baseline for ${dataset}"
            fi
          done < "${CONFIG_LIST}"
