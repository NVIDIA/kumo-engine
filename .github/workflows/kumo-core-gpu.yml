name: Kumo Core GPU

# NVIDIA's GPU runners don't run pull_request jobs. copy-pr-bot copies each
# trusted pull request to a pull-request/<number> branch, and pushes to those
# branches run this workflow.
on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - "pull-request/[0-9]+"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      gpu: ${{ steps.match.outputs.gpu }}
    steps:
      - name: Check whether the pull request changes code
        id: match
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Skip only if every file in the pull request is docs, UI, Helm or tooling.
          files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/${GITHUB_REF_NAME#pull-request/}/files" --jq '.[].filename')"
          if grep -q -v -E '^(ui/|docs/|helm/|tools/|benchmark/)|\.md$' <<< "$files"; then
            echo gpu=true >> "$GITHUB_OUTPUT"
          else
            echo gpu=false >> "$GITHUB_OUTPUT"
          fi

  # Built on a CPU runner so the GPU job doesn't spend its time compiling.
  # This condition gates both jobs.
  diskgraph-wheel:
    needs: changes
    if: >-
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.gpu == 'true')
    permissions:
      contents: read
    uses: ./.github/workflows/_diskgraph-wheel.yml

  gpu:
    name: kumo-core-gpu
    # Runs only when diskgraph-wheel succeeds. Checked explicitly because on
    # manual runs the skipped changes job would otherwise skip this job too.
    needs: [diskgraph-wheel]
    if: ${{ !cancelled() && needs.diskgraph-wheel.result == 'success' }}
    env:
      FAISS_GPU_AMD64_RELEASE_TAG: faiss-gpu-amd64-1.14.3-cu130sm120-cp314-v1
      FAISS_GPU_AMD64_RELEASE_ASSET: faiss_gpu-1.14.3+cu130sm120-cp314-cp314-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
      FAISS_GPU_AMD64_RELEASE_SHA256: ed9162596b6b1e9eeffc11675cd57eef622d891c27e8c02e2315930fee0f67aa
    runs-on: linux-amd64-gpu-t4-latest-1
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Kumo with CUDA dependencies
        uses: ./.github/actions/setup
        with:
          cuda-version: cu130
          diskgraph-wheel-artifact: diskgraph-wheel

      - name: Expose pip-installed CUDA runtime libraries
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import os
          from pathlib import Path

          import nvidia

          library_dirs = sorted({
              str(path)
              for root in nvidia.__path__
              for path in Path(root).glob('*/lib')
              if path.is_dir()
          })
          if not library_dirs:
              raise SystemExit('No pip-installed NVIDIA library directories found')
          current = os.environ.get('LD_LIBRARY_PATH', '')
          print(f"LD_LIBRARY_PATH={':'.join(library_dirs)}:{current}")
          PY

      - name: Download checksum-pinned CUDA Faiss wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api=(curl --fail --silent --show-error --location --retry 5 --retry-all-errors
            --header "Authorization: Bearer $GH_TOKEN"
            --header 'X-GitHub-Api-Version: 2022-11-28')
          # Look the asset up by release tag and name: its ID differs in each
          # repository that carries the release.
          asset_url="$("${api[@]}" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$FAISS_GPU_AMD64_RELEASE_TAG" \
            | python -c 'import json, os, sys; name = os.environ["FAISS_GPU_AMD64_RELEASE_ASSET"]; urls = [a["url"] for a in json.load(sys.stdin)["assets"] if a["name"] == name]; print(urls[0]) if urls else sys.exit("Release asset not found: " + name)')"
          "${api[@]}" --header 'Accept: application/octet-stream' \
            --output "3rdparty/kumo-wheels/$FAISS_GPU_AMD64_RELEASE_ASSET" \
            "$asset_url"
          printf '%s  %s\n' \
            "$FAISS_GPU_AMD64_RELEASE_SHA256" \
            "3rdparty/kumo-wheels/$FAISS_GPU_AMD64_RELEASE_ASSET" \
            | sha256sum --check -

      - name: Install and smoke-test checksum-pinned CUDA Faiss wheel
        run: |
          set -euo pipefail
          uv pip install --force-reinstall --no-deps \
            "3rdparty/kumo-wheels/$FAISS_GPU_AMD64_RELEASE_ASSET"
          python - <<'PY'
          from importlib import metadata

          import faiss
          import numpy

          assert metadata.version('faiss-gpu') == '1.14.3+cu130sm120'
          resources = faiss.StandardGpuResources()
          index = faiss.index_cpu_to_gpu(resources, 0, faiss.IndexFlatL2(1))
          index.add(numpy.array([[0.0]], dtype='float32'))
          assert index.ntotal == 1
          _, neighbors = index.search(numpy.array([[0.0]], dtype='float32'), 1)
          assert neighbors.tolist() == [[0]]
          print('Checksum-pinned CUDA Faiss GPU search succeeded')
          PY

      - name: Show GPU
        run: nvidia-smi

      - name: Run CUDA-selected package suite
        run: make test-kumo-core-gpu

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kumo-core-gpu-coverage
          path: |
            packages/kumo-core/.coverage*
            packages/kumo-core/coverage.xml
          if-no-files-found: ignore
