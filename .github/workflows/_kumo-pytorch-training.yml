name: PyTorch full-population training
on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      bindings:
        description: JSON list of registered training bindings.
        type: string
        required: true

permissions:
  contents: read
  id-token: write

defaults:
  run:
    shell: bash
    working-directory: packages/experimental/kumo-pytorch

jobs:
  train:
    name: ${{ startsWith(matrix.binding, 'S') && 'Synthetic' || startsWith(matrix.binding, 'M') && 'MBD' || 'AML' }} ${{ matrix.binding }}
    strategy:
      fail-fast: false
      matrix:
        binding: ${{ fromJSON(inputs.bindings) }}
    runs-on: ${{ vars.KUMO_PYTORCH_BINDING_RUNNER || 'linux-amd64-gpu-rtxpro6000-latest-1' }}
    timeout-minutes: 4320
    environment: {name: gha-kumo-workflow-tests, deployment: false}
    permissions: {contents: read, id-token: write}
    env:
      BINDING: ${{ matrix.binding }}
      SCRATCH: ${{ vars.KUMO_PYTORCH_BINDING_SCRATCH }}
      STAGE_FULL_BINDING: 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          persist-credentials: false
      - name: Select read access for this binding
        run: |
          policy=$(python3 -m e2e.datasets.binding_sources "$BINDING" --policy)
          jq -e '.Statement[0].Resource | length > 0' <<< "$policy"
          echo "DATASET_SESSION_POLICY=$policy" >> "$GITHUB_ENV"
      - uses: ./.github/actions/kumo-pytorch-stage
      - uses: ./.github/actions/kumo-pytorch-setup
        with:
          diskgraph-wheel-artifact: diskgraph-wheel
          torch-backend: cu130
      - name: Train for two complete epochs
        env:
          KUMO_PYTORCH_DIAGNOSTICS: ${{ runner.temp }}/pytorch-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python -m tests.e2e.ci_command "$KUMO_PYTORCH_DIAGNOSTICS/training.log" \
            python -m tests.e2e.runs binding-train "$BINDING" --e2e-dir "$TMPDIR" --output "$KUMO_PYTORCH_DIAGNOSTICS/report.json"
      - uses: ./.github/actions/kumo-pytorch-results
        if: always()
        with:
          name: binding-train-${{ matrix.binding }}
          path: ${{ runner.temp }}/pytorch-${{ github.run_id }}-${{ github.run_attempt }}/report.json
