name: kumo-pytorch end-to-end

# The end-to-end flows at S (train, persist, fresh-process batch inference on
# DiskGraph, serving) on every main commit that changes kumo-pytorch or
# DiskGraph. Not a required check. Pull requests run it only when they change
# the flows or this workflow.
on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      prebuilt-wheel:
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kumo-pytorch-t2a-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash
    working-directory: packages/experimental/kumo-pytorch

jobs:
  diskgraph-wheel:
    if: ${{ !inputs.prebuilt-wheel }}
    uses: ./.github/workflows/_diskgraph-wheel.yml

  plan:
    name: Plan the end-to-end runs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - id: matrix
        run: echo "matrix=$(python3 tests/e2e/tiers.py t2a)" >> "$GITHUB_OUTPUT"

  run:
    name: End-to-end ${{ matrix.flow }} seed ${{ matrix.seed }} (size S)
    needs: [diskgraph-wheel, plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (inputs.prebuilt-wheel || needs.diskgraph-wheel.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/kumo-pytorch-setup
        with:
          diskgraph-wheel-artifact: diskgraph-wheel
      - name: Train, persist, infer and serve
        env:
          KUMO_PYTORCH_DIAGNOSTICS: &evidence_dir ${{ runner.temp }}/pytorch-${{ github.run_id }}-${{ github.run_attempt }}
          FLOW: ${{ matrix.flow }}
          SEED: ${{ matrix.seed }}
        run: |
          python -m tests.e2e.ci_command "$KUMO_PYTORCH_DIAGNOSTICS/training.log" \
            python -m tests.e2e.runs t2a "$FLOW" "$SEED" --e2e-dir "$RUNNER_TEMP/e2e"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kumo-pytorch-t2a-${{ github.run_attempt }}-${{ matrix.flow }}-seed${{ matrix.seed }}
          path: |
            ${{ runner.temp }}/e2e/t2a/${{ matrix.flow }}-seed${{ matrix.seed }}/
            !${{ runner.temp }}/e2e/t2a/**/index/**
          retention-days: 14
      - uses: ./.github/actions/kumo-pytorch-results
        if: always()
        with: {name: 't2a-log-${{ matrix.flow }}-${{ matrix.seed }}'}

  checks:
    name: kumo-pytorch-t2a
    needs: run
    if: ${{ !cancelled() && needs.run.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/kumo-pytorch-setup
        with:
          diskgraph-wheel-artifact: diskgraph-wheel
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: kumo-pytorch-t2a-${{ github.run_attempt }}-*-seed*
          path: ${{ runner.temp }}/e2e-runs
      - name: Place the runs where the checks read them
        run: |
          mkdir -p "$RUNNER_TEMP/e2e/t2a"
          for run in "$RUNNER_TEMP"/e2e-runs/kumo-pytorch-t2a-"$GITHUB_RUN_ATTEMPT"-*; do
            mv "$run" "$RUNNER_TEMP/e2e/t2a/${run##*/kumo-pytorch-t2a-"$GITHUB_RUN_ATTEMPT"-}"
          done
      - name: Check the runs
        env:
          KUMO_PYTORCH_DIAGNOSTICS: *evidence_dir
          KUMO_PYTORCH_E2E_REUSE_ONLY: '1'
        run: |
          python -m tests.e2e.ci_command "$KUMO_PYTORCH_DIAGNOSTICS/pytest.log" \
            python -m pytest --junitxml="$KUMO_PYTORCH_DIAGNOSTICS/junit.xml" -q --t2a --e2e-dir "$RUNNER_TEMP/e2e" --durations=0 \
            tests/e2e/test_lifecycle.py
      - name: Summarize metrics and run times
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/e2e/t2a/metrics.json" ]; then
            {
              echo '### T2a metrics'
              echo '```json'
              cat "$RUNNER_TEMP/e2e/t2a/metrics.json"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: ./.github/actions/kumo-pytorch-results
        if: always()
        with: {name: kumo-pytorch-t2a-checks}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: kumo-pytorch-t2a-predictions-and-metrics-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/e2e/t2a/metrics.json
            ${{ runner.temp }}/e2e/t2a/*/*.json
            ${{ runner.temp }}/e2e/t2a/*/*.parquet
            ${{ runner.temp }}/e2e/t2a/*/*-predictions/*
            !${{ runner.temp }}/e2e/t2a/**/index/**
          retention-days: 14
