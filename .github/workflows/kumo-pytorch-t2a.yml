# Manual Small entry point. The Medium entry point calls the same jobs with its tier.
name: PyTorch model tier
on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
  workflow_call:
    inputs:
      tier:
        type: string
        default: t2a
      prebuilt-wheel:
        type: boolean
        default: false
      seed_start:
        type: string

permissions:
  contents: read

concurrency:
  group: kumo-pytorch-${{ inputs.tier || 't2a' }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  diskgraph-wheel:
    if: ${{ !inputs.prebuilt-wheel }}
    uses: ./.github/workflows/_diskgraph-wheel.yml

  plan:
    name: Select model runs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      seed_start: ${{ steps.select.outputs.seed_start }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - id: select
        working-directory: packages/experimental/kumo-pytorch
        env:
          TIER: ${{ inputs.tier || 't2a' }}
          START: ${{ inputs.seed_start }}
        run: |
          matrix=$(python3 tests/e2e/tiers.py "$TIER")
          start=${START:-$(( $(date -u +%s) / 86400 * 12 ))}
          [[ "$start" =~ ^[0-9]+$ ]]
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "seed_start=$start" >> "$GITHUB_OUTPUT"

  training:
    name: Training · H&M ${{ inputs.tier == 't2b' && 'Medium' || 'Small' }} · ${{ matrix.flow }} (seed ${{ matrix.seed }})
    needs: [diskgraph-wheel, plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (inputs.prebuilt-wheel || needs.diskgraph-wheel.result == 'success') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/_kumo-pytorch-training.yml
    permissions: {contents: read, id-token: write}
    with:
      binding: ''
      tier: ${{ inputs.tier || 't2a' }}
      flow: ${{ matrix.flow }}
      seed: ${{ format('{0}', matrix.seed) }}

  lifecycle:
    name: Lifecycle · H&M ${{ inputs.tier == 't2b' && 'Medium' || 'Small' }}
    needs: training
    if: ${{ !cancelled() && needs.training.result == 'success' }}
    uses: ./.github/workflows/_kumo-pytorch-lifecycle.yml
    with:
      tier: ${{ inputs.tier || 't2a' }}

  conformance:
    name: Package tests
    needs: [diskgraph-wheel, plan]
    if: ${{ !cancelled() && inputs.tier == 't2b' && needs.plan.result == 'success' && (inputs.prebuilt-wheel || needs.diskgraph-wheel.result == 'success') }}
    uses: ./.github/workflows/_kumo-pytorch-conformance.yml
    with:
      seed_start: ${{ needs.plan.outputs.seed_start }}
