# Builds Linux x86_64 and macOS ARM64 `kumo-engine` wheels with
# packages/kumo-engine/scripts/build_wheel.sh.
#
# Release flow:
#   1. Change the root VERSION file and run scripts/stamp_version.py, merge it.
#   2. Create and publish a GitHub release tagged `kumo-engine-v<version>`.
#   3. This workflow builds the wheels at that tag and attaches them to the
#      release once `check-requirements` shows each wheel installs from
#      PyPI, alone and with each extra, on every Python version it claims.
#   4. Once the `kumo-engine-release` environment approves it, `kitmaker`
#      publishes the attached wheels to PyPI and pypi.nvidia.com through
#      Kitmaker (scripts/kitmaker_release.py).
# A manual run only builds the wheel (as `<version>+<commit>`) and stores it as
# a workflow artifact. The wheel bundles kumo-api, kumo-pql, kumo-core and
# every provider; kumo-glove-6b-50d stays on PyPI.

name: Kumo Engine - Build and publish wheel

on:  # yamllint disable-line rule:truthy
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      retention_days:
        description: How long GitHub keeps the uploaded artifact.
        type: number
        required: false
        default: 30

permissions:
  contents: read

# One run per release at a time: a second run could replace an attachment
# while the first is publishing it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    # The repository publishes other releases (e.g. kumo-sdk-v*); only
    # kumo-engine tags build here.
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
      || startsWith(github.event.release.tag_name, 'kumo-engine-v') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            platform: manylinux_2_34_x86_64
          - arch: arm64
            runner: macos-15
            platform: macosx_14_0_arm64
          # - arch: aarch64
          #   runner: ubuntu-24.04-arm
          #   platform: manylinux_2_34_aarch64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Check release tag matches the VERSION file
        if: ${{ github.event_name == 'release' }}
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if [ "${RELEASE_TAG}" != "kumo-engine-v${version}" ]; then
            echo "Tag ${RELEASE_TAG} does not match the VERSION file ${version}; expected kumo-engine-v${version}."
            exit 1
          fi
          python scripts/stamp_version.py --check

      - name: Set up Rust
        # This org's Actions allowlist only permits dtolnay/rust-toolchain at
        # @master or a pinned SHA, not @stable.
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88  # master, allowlisted
        with:
          toolchain: stable

      # cargo-zigbuild shells out to `zig`; without it on PATH it falls back
      # to `python -m ziglang`, which needs the ziglang package installed.
      - name: Install zig
        if: ${{ runner.os == 'Linux' }}
        run: pip install ziglang

      - name: Cache Stanford's glove.6B.zip
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: ~/.cache/kumo/glove.6B.zip
          key: glove-6b-zip-617afb2fe6cbd085c235baf7a465b96f4112bd7f7ccb2b2cbd649fed9cbcf2fb

      - name: Build wheel
        env:
          GITHUB_TOKEN: ${{ secrets.KUMO_GITHUB_BOT_TOKEN }}
          IS_RELEASE: ${{ github.event_name == 'release' }}
          WHEEL_ARCH: ${{ matrix.arch }}
          WHEEL_PLATFORM: ${{ matrix.platform }}
          MACOSX_DEPLOYMENT_TARGET: '14.0'
        run: |
          test "$(uname -m)" = "${WHEEL_ARCH}"
          args=()
          if [[ "${WHEEL_PLATFORM}" == manylinux_* ]]; then
            args+=(--platform-tag "${WHEEL_PLATFORM}")
          fi
          if [ "${IS_RELEASE}" = "true" ]; then
            args+=(--release)
          fi
          ./packages/kumo-engine/scripts/build_wheel.sh "${args[@]}"

      # GitHub-hosted artifact storage, not S3: no AWS role to provision.
      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kumo-engine-wheel-${{ matrix.arch }}-${{ github.sha }}
          path: packages/kumo-engine/dist/*.whl
          retention-days: ${{ inputs.retention_days || 30 }}
          if-no-files-found: error

  check-requirements:
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: x86_64-manylinux_2_34
          - arch: arm64
            platform: aarch64-apple-darwin
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: kumo-engine-wheel-${{ matrix.arch }}-${{ github.sha }}
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Resolve the wheel and each extra from PyPI
        env:
          WHEEL_PLATFORM: ${{ matrix.platform }}
          MACOSX_DEPLOYMENT_TARGET: '14.0'
        run: >-
          python3 packages/kumo-engine/scripts/check_pypi_requirements.py
          dist/kumo_engine-*.whl --platform "${WHEEL_PLATFORM}"

  attach-to-release:
    needs: [build, check-requirements]
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: kumo-engine-wheel-*-${{ github.sha }}
          merge-multiple: true
          path: dist

      - name: Attach wheel to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "${RELEASE_TAG}" dist/*.whl --clobber

  kitmaker:
    needs: [attach-to-release]
    if: ${{ github.event_name == 'release' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: manylinux_2_34_x86_64
          - arch: arm64
            platform: macosx_14_0_arm64
    runs-on: linux-amd64-cpu8
    timeout-minutes: 180
    environment: kumo-engine-release
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: kumo-engine-wheel-${{ matrix.arch }}-${{ github.sha }}
          path: dist

      - name: Publish through Kitmaker
        env:
          KITMAKER_API_TOKEN: ${{ secrets.KITMAKER_API_TOKEN }}
          KITMAKER_PIC: ${{ vars.KITMAKER_PIC }}
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          WHEEL_PLATFORM: ${{ matrix.platform }}
        run: >-
          python3 scripts/kitmaker_release.py --project-id 6903
          --project kumo-engine --platform "${WHEEL_PLATFORM}"
          --repo "${REPO}" --tag "${RELEASE_TAG}" dist/kumo_engine-*.whl
