# Builds Linux x86_64/ARM64, Windows x86_64 and macOS ARM64 wheels with
# packages/kumo-engine/scripts/build_wheel.sh.
#
# Release flow:
#   1. Change the root VERSION file and run scripts/stamp_version.py, merge it.
#   2. Create and publish a GitHub release tagged `kumo-engine-v<version>`.
#   3. This workflow builds the wheels at that tag and attaches them to the
#      release once `check-requirements` resolves each platform's Python
#      dependencies and `wheel-smoke` tests the finished Linux x86_64 wheel
#      on all eight GPU task types. The agent skill zips
#      (`kumo-data-science-<host>.zip`, built from the same commit by
#      `skill-zips`) are attached beside them; the docs and install scripts
#      link to them by release tag.
#   4. Once the `kumo-engine-release` environment approves it, `kitmaker`
#      publishes the attached wheels to PyPI and pypi.nvidia.com through
#      Kitmaker (scripts/kitmaker_release.py).
# A manual run builds and tests the wheel (as `<version>+<commit>`) and stores
# it as a workflow artifact. The wheel bundles kumo-api, kumo-pql, kumo-core and
# every provider; kumo-glove-6b-50d stays on PyPI.

name: Kumo Engine - Build and publish wheel

on:  # yamllint disable-line rule:truthy
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      retention_days:
        description: How long GitHub keeps the uploaded artifact.
        type: number
        required: false
        default: 30

permissions:
  contents: read

# One run per release at a time: a second run could replace an attachment
# while the first is publishing it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    # The repository publishes other releases (e.g. kumo-sdk-v*); only
    # kumo-engine tags build here.
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
      || startsWith(github.event.release.tag_name, 'kumo-engine-v') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            machine: x86_64
            runner: ubuntu-22.04
            platform: manylinux_2_34_x86_64
          - arch: arm64
            machine: arm64
            runner: macos-15
            platform: macosx_14_0_arm64
          - arch: aarch64
            machine: aarch64
            runner: ubuntu-24.04-arm
            platform: manylinux_2_34_aarch64
          - arch: windows-x86_64
            machine: x86_64
            runner: windows-2022
            platform: win_amd64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
        env:
          # Notice hashes describe the committed bytes, including on Windows.
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Check release tag matches the VERSION file
        if: ${{ github.event_name == 'release' }}
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if [ "${RELEASE_TAG}" != "kumo-engine-v${version}" ]; then
            echo "Tag ${RELEASE_TAG} does not match the VERSION file ${version}; expected kumo-engine-v${version}."
            exit 1
          fi
          python scripts/stamp_version.py --check

      - name: Set up Rust
        # This org's Actions allowlist only permits dtolnay/rust-toolchain at
        # @master or a pinned SHA, not @stable.
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master, allowlisted
        with:
          toolchain: stable

      - name: Activate installed MSVC build tools
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $installation) {
            throw 'Runner image needs Visual Studio x64 C++ tools and the Windows SDK.'
          }
          & "$installation\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          foreach ($name in @('cl', 'link', 'cmake')) {
            Get-Command $name -ErrorAction Stop | Select-Object Name, Source
          }
          foreach ($name in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          # Git Bash also has link.exe; Rust must use Microsoft's linker.
          $linker = (Get-Command link.exe -ErrorAction Stop).Source
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # cargo-zigbuild shells out to `zig`; without it on PATH it falls back
      # to `python -m ziglang`, which needs the ziglang package installed.
      - name: Install zig
        if: ${{ runner.os == 'Linux' }}
        run: pip install ziglang

      - name: Cache Stanford's glove.6B.zip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/kumo/glove.6B.zip
          key: glove-6b-zip-617afb2fe6cbd085c235baf7a465b96f4112bd7f7ccb2b2cbd649fed9cbcf2fb

      - name: Build wheel
        env:
          GITHUB_TOKEN: ${{ secrets.KUMO_GITHUB_BOT_TOKEN }}
          IS_RELEASE: ${{ github.event_name == 'release' }}
          WHEEL_ARCH: ${{ matrix.machine }}
          WHEEL_PLATFORM: ${{ matrix.platform }}
          MACOSX_DEPLOYMENT_TARGET: '14.0'
          PYTHON: python
        run: |
          test "$(uname -m)" = "${WHEEL_ARCH}"
          args=()
          if [[ "${WHEEL_PLATFORM}" == manylinux_* ]]; then
            args+=(--platform-tag "${WHEEL_PLATFORM}")
          fi
          if [ "${IS_RELEASE}" = "true" ]; then
            args+=(--release)
          fi
          ./packages/kumo-engine/scripts/build_wheel.sh "${args[@]}"

      - name: Verify wheel payload
        env:
          WHEEL_PLATFORM: ${{ matrix.platform }}
        run: >-
          python packages/kumo-engine/scripts/verify_platform_wheel.py
          packages/kumo-engine/dist/kumo_engine-*.whl
          --platform-tag "${WHEEL_PLATFORM}"

      - name: Test Windows path validation
        if: ${{ runner.os == 'Windows' }}
        run: |
          cargo --config packages/diskgraph/.cargo/config.toml \
            test --manifest-path packages/diskgraph/Cargo.toml \
            --release --locked -p diskgraph-ingest --lib \
            disk_manager::path_safety::tests
          cargo --config packages/diskgraph/.cargo/config.toml \
            test --manifest-path packages/diskgraph/Cargo.toml \
            --release --locked -p diskgraph-ingest --lib \
            rejects_windows_profiling_before_output_changes

      # GitHub-hosted artifact storage, not S3: no AWS role to provision.
      # Native Windows wheels are experimental internal CI artifacts only.
      - name: Upload wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kumo-engine-wheel-${{ matrix.arch }}-${{ github.sha }}
          path: packages/kumo-engine/dist/*.whl
          retention-days: ${{ inputs.retention_days || 30 }}
          if-no-files-found: error

  # The kumo-data-science agent skill, one zip per host, for anyone who installs it without the
  # wheel: a docs download link or an install script. The wheel carries the same packages for
  # kumo.engine.install_skills(); both are built from this commit.
  skill-zips:
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
      || startsWith(github.event.release.tag_name, 'kumo-engine-v') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Build the skill zips
        run: python3 agent-skills/scripts/package_skill.py --zip dist

      - name: Upload skill zips
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kumo-data-science-zips-${{ github.sha }}
          path: dist/*.zip
          retention-days: ${{ inputs.retention_days || 30 }}
          if-no-files-found: error

  check-requirements:
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: x86_64-manylinux_2_34
          - arch: arm64
            platform: aarch64-apple-darwin
          - arch: aarch64
            platform: aarch64-manylinux_2_34
          - arch: windows-x86_64
            platform: x86_64-pc-windows-msvc
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: kumo-engine-wheel-${{ matrix.arch }}-${{ github.sha }}
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false

      - name: Resolve the wheel and each extra from PyPI
        env:
          WHEEL_PLATFORM: ${{ matrix.platform }}
          MACOSX_DEPLOYMENT_TARGET: '14.0'
        run: >-
          python3 packages/kumo-engine/scripts/check_pypi_requirements.py
          dist/kumo_engine-*.whl --platform "${WHEEL_PLATFORM}"

  wheel-smoke:
    needs: [build]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/kumo-engine-wheel-smoke.yml
    with:
      wheel_artifact: kumo-engine-wheel-x86_64-${{ github.sha }}

  platform-qualification:
    needs: [build]
    uses: ./.github/workflows/kumo-engine-platform-smoke.yml

  attach-to-release:
    needs: [build, check-requirements, wheel-smoke, platform-qualification, skill-zips]
    if: ${{ github.event_name == 'release' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
          - arch: arm64
          - arch: aarch64
          # Native Windows remains experimental; Windows releases use WSL.
          # - arch: windows-x86_64
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: kumo-engine-wheel-${{ matrix.arch }}-${{ github.sha }}
          path: dist

      - name: Attach wheel to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "${RELEASE_TAG}" dist/*.whl --clobber

      # The zips are the same for every architecture: one job attaches them,
      # so the matrix jobs do not overwrite each other's upload.
      - name: Download skill zips
        if: ${{ matrix.arch == 'x86_64' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: kumo-data-science-zips-${{ github.sha }}
          path: zips

      - name: Attach skill zips to the GitHub release
        if: ${{ matrix.arch == 'x86_64' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "${RELEASE_TAG}" zips/*.zip --clobber

  kitmaker:
    needs: [attach-to-release]
    if: ${{ github.event_name == 'release' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native Windows remains experimental; Windows releases use WSL.
          # - arch: windows-x86_64
          #   platform: win_amd64
          - arch: aarch64
            platform: manylinux_2_34_aarch64
          - arch: x86_64
            platform: manylinux_2_34_x86_64
          - arch: arm64
            platform: macosx_14_0_arm64
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/kitmaker-portal.yml
    secrets:
      KITMAKER_API_TOKEN: ${{ secrets.KITMAKER_API_TOKEN }}
    with:
      project: kumo-engine
      project_id: 6903
      platform: ${{ matrix.platform }}
      artifact: kumo-engine-wheel-${{ matrix.arch }}-${{ github.sha }}
      release_tag: ${{ github.event.release.tag_name }}
      upload: true
