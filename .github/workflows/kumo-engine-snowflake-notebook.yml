name: Snowflake notebook platform checks

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      mode:
        description: Snowflake scenario
        type: choice
        default: graph-ui
        options: [graph-ui, engine]

permissions:
  contents: read

concurrency:
  group: snowflake-notebook-engine-lifecycle
  cancel-in-progress: false

jobs:
  configuration:
    name: Check protected Snowflake environment
    if: >-
      github.repository == 'NVIDIA/kumo-engine' &&
      startsWith(github.ref, 'refs/heads/') &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - &check-environment
        name: Verify maintainer-protected environment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 packages/kumo-engine/test/snowflake_notebook/check_environment.py
  wheel:
    needs: configuration
    uses: ./.github/workflows/kumo-engine-pr.yml
    with:
      build_only: true
    permissions:
      contents: read
      pull-requests: read
      id-token: write

  engine-lifecycle:
    needs: [configuration, wheel]
    name: Snowflake notebook engine checks (UI excluded)
    if: >-
      github.repository == 'NVIDIA/kumo-engine' &&
      startsWith(github.ref, 'refs/heads/') &&
      github.event_name == 'workflow_dispatch' && inputs.mode == 'engine'
    runs-on: ubuntu-22.04
    timeout-minutes: 80
    environment: snowflake-mlops-test
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - *check-environment
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.12'
      - name: Require the environment credentials
        env:
          SNOWFLAKE_TEST_CONFIG: ${{ secrets.SNOWFLAKE_TEST_CONFIG }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, 'packages/kumo-engine/test/snowflake_notebook')
          from resources import require
          require()
          missing = [name for name in ('SNOWFLAKE_TEST_CONFIG', 'SNOWFLAKE_PRIVATE_KEY', 'SNOWFLAKE_PRIVATE_KEY_PASSPHRASE') if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing snowflake-mlops-test environment secrets: ' + ', '.join(missing))
          PY
      - name: Install the notebook submission client
        run: python -m pip --isolated install --require-hashes -r packages/kumo-engine/test/snowflake_notebook/client-requirements.txt
      - name: Download this dispatch's wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: engine-pr-wheel-${{ github.sha }}
          path: ${{ runner.temp }}/snowflake-wheel
      - name: Stage this dispatch's candidate
        env:
          SNOWFLAKE_TEST_CONFIG: ${{ secrets.SNOWFLAKE_TEST_CONFIG }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
        run: |
          export SNOWFLAKE_TEST_CANDIDATE="$RUNNER_TEMP/snowflake-candidate.json"
          printf 'SNOWFLAKE_TEST_CANDIDATE=%s\n' "$SNOWFLAKE_TEST_CANDIDATE" >> "$GITHUB_ENV"
          python packages/kumo-engine/test/snowflake_notebook/staging.py \
            --wheel "$RUNNER_TEMP"/snowflake-wheel/*.whl \
            --source-ref "$GITHUB_SHA" --github-run "$GITHUB_RUN_ID" \
            --output "$SNOWFLAKE_TEST_CANDIDATE"
      - name: Expire terminal test attempts older than one day
        env:
          SNOWFLAKE_TEST_CONFIG: ${{ secrets.SNOWFLAKE_TEST_CONFIG }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
        run: python packages/kumo-engine/test/snowflake_notebook/retention.py --execute
      - name: Prepare this revision's notebook tests
        run: |
          python packages/kumo-engine/test/snowflake_notebook/prepare.py \
            --output-dir "$RUNNER_TEMP/snowflake-payload" \
            --candidate "$SNOWFLAKE_TEST_CANDIDATE"
      - name: Execute the installed-wheel notebook lifecycle
        env:
          SNOWFLAKE_TEST_CONFIG: ${{ secrets.SNOWFLAKE_TEST_CONFIG }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
        run: |
          set +e
          python packages/kumo-engine/test/snowflake_notebook/launch.py \
            --payload-manifest "$RUNNER_TEMP/snowflake-payload/manifest.json" \
            --preflight-payload "$RUNNER_TEMP/snowflake-payload/preflight" \
            --lifecycle-payload "$RUNNER_TEMP/snowflake-payload/lifecycle" \
            --output-dir "$RUNNER_TEMP/snowflake-result" --execute
          launcher_exit=$?
          set -e
          test -f "$RUNNER_TEMP/snowflake-result/summary.json"
          printf '%s\n' "$launcher_exit" > "$RUNNER_TEMP/snowflake-result/launcher-exitcode.txt"
          python packages/kumo-engine/test/snowflake_notebook/verify.py \
            --summary "$RUNNER_TEMP/snowflake-result/summary.json"
      - name: Recover owned notebook submissions
        if: always()
        timeout-minutes: 5
        env:
          SNOWFLAKE_TEST_CONFIG: ${{ secrets.SNOWFLAKE_TEST_CONFIG }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
        run: python packages/kumo-engine/test/snowflake_notebook/recover.py --output-dir "$RUNNER_TEMP/snowflake-result" --execute
      - name: Prepare public aggregate results
        if: always()
        run: |
          python packages/kumo-engine/test/platform_summary.py \
            --platform snowflake --scenario engine \
            --input "$RUNNER_TEMP/snowflake-result" \
            --output "$RUNNER_TEMP/snowflake-engine-public"
      - name: Retain execution evidence and qualification gaps
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: snowflake-engine-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/snowflake-engine-public/
          if-no-files-found: warn
          retention-days: 7
  notebook-ui:
    needs: [configuration, wheel]
    name: Snowflake notebook graph UI
    if: >-
      github.repository == 'NVIDIA/kumo-engine' &&
      startsWith(github.ref, 'refs/heads/') &&
      github.event_name == 'workflow_dispatch' && inputs.mode == 'graph-ui'
    runs-on: ubuntu-22.04
    timeout-minutes: 140
    environment: snowflake-mlops-test
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - *check-environment
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: '22'
      - name: Require the protected test credentials
        env:
          SNOWFLAKE_TEST_CONFIG: ${{ secrets.SNOWFLAKE_TEST_CONFIG }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
          SNOWFLAKE_UI_CREDENTIALS: ${{ secrets.SNOWFLAKE_UI_CREDENTIALS }}
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, 'packages/kumo-engine/test/snowflake_notebook')
          from resources import require
          require()
          names = ('SNOWFLAKE_TEST_CONFIG', 'SNOWFLAKE_PRIVATE_KEY', 'SNOWFLAKE_PRIVATE_KEY_PASSPHRASE', 'SNOWFLAKE_UI_CREDENTIALS')
          if any(not os.environ.get(name) for name in names):
              raise SystemExit('Configure the required protected Snowflake environment secrets before running UI tests')
          PY
      - name: Install the existing Snowflake submission client
        run: python -m pip --isolated install --require-hashes -r packages/kumo-engine/test/snowflake_notebook/client-requirements.txt
      - name: Download this dispatch's wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: engine-pr-wheel-${{ github.sha }}
          path: ${{ runner.temp }}/snowflake-wheel
      - name: Stage this dispatch's candidate
        env:
          SNOWFLAKE_TEST_CONFIG: ${{ secrets.SNOWFLAKE_TEST_CONFIG }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
        run: |
          export SNOWFLAKE_TEST_CANDIDATE="$RUNNER_TEMP/snowflake-candidate.json"
          printf 'SNOWFLAKE_TEST_CANDIDATE=%s\n' "$SNOWFLAKE_TEST_CANDIDATE" >> "$GITHUB_ENV"
          python packages/kumo-engine/test/snowflake_notebook/staging.py \
            --wheel "$RUNNER_TEMP"/snowflake-wheel/*.whl \
            --source-ref "$GITHUB_SHA" --github-run "$GITHUB_RUN_ID" \
            --output "$SNOWFLAKE_TEST_CANDIDATE"
      - name: Expire terminal test attempts older than one day
        env:
          SNOWFLAKE_TEST_CONFIG: ${{ secrets.SNOWFLAKE_TEST_CONFIG }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
        run: python packages/kumo-engine/test/snowflake_notebook/retention.py --execute
      - name: Install the locked browser test tools
        run: |
          npm ci --prefix packages/kumo-engine/test/snowflake_notebook/browser
          node packages/kumo-engine/test/snowflake_notebook/browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Run the same graph notebook UI command as local testing
        env:
          SNOWFLAKE_TEST_CONFIG: ${{ secrets.SNOWFLAKE_TEST_CONFIG }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
          SNOWFLAKE_UI_CREDENTIALS: ${{ secrets.SNOWFLAKE_UI_CREDENTIALS }}
        run: |
          python packages/kumo-engine/test/snowflake_notebook/graph_notebook.py \
            --execute --source-ref "${{ github.sha }}" \
            --output-dir "$RUNNER_TEMP/snowflake-graph"
      - name: Stop and delete this attempt's notebook
        if: always()
        timeout-minutes: 15
        env:
          SNOWFLAKE_TEST_CONFIG: ${{ secrets.SNOWFLAKE_TEST_CONFIG }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
          SNOWFLAKE_UI_CREDENTIALS: ${{ secrets.SNOWFLAKE_UI_CREDENTIALS }}
        run: |
          python packages/kumo-engine/test/snowflake_notebook/cleanup.py \
            --output-dir "$RUNNER_TEMP/snowflake-graph" --execute
      - name: Prepare public aggregate results
        if: always()
        run: |
          python packages/kumo-engine/test/platform_summary.py \
            --platform snowflake --scenario graph \
            --input "$RUNNER_TEMP/snowflake-graph" \
            --output "$RUNNER_TEMP/snowflake-graph-public"
      - name: Retain UI assertions and exports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: snowflake-graph-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/snowflake-graph-public/
          if-no-files-found: warn
          retention-days: 7
