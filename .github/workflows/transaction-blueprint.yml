name: Transaction Blueprint

on:  # yamllint disable-line rule:truthy
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  blueprint:
    name: transaction-blueprint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect package and policy changes
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: python3 scripts/transaction_ci_paths.py --base "$BASE_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Set up Python and uv
        if: steps.paths.outputs.changed == 'true'
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          python-version: '3.12'
          version: '0.13.8'
      - name: Install locked package dependencies
        if: steps.paths.outputs.changed == 'true'
        working-directory: packages/experimental/kumo-transaction
        run: uv sync --frozen --extra dev
      - name: Check package style
        if: steps.paths.outputs.changed == 'true'
        working-directory: packages/experimental/kumo-transaction
        run: |
          uv run --frozen --extra dev ruff check src tests recipes benchmarks scripts
          uv run --frozen --extra dev ruff format --check src tests recipes benchmarks scripts
      - name: Run CPU unit, contract and recipe-smoke tests
        if: steps.paths.outputs.changed == 'true'
        working-directory: packages/experimental/kumo-transaction
        env:
          PYTHONPATH: src
        run: uv run --frozen --extra dev pytest tests/unit tests/contract tests/recipe_smoke -q
      - name: Build and verify wheel legal metadata
        if: steps.paths.outputs.changed == 'true'
        working-directory: packages/experimental/kumo-transaction
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/transaction-wheel" .
          uv run --frozen --extra dev python ../../../scripts/check_python_license_metadata.py --wheel-dir "$RUNNER_TEMP/transaction-wheel"
      - name: Unrelated change
        if: steps.paths.outputs.changed == 'false'
        run: echo "No Transaction Blueprint or integration-policy changes."
