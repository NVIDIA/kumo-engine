name: Repository layout
"on":
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - run: python3 development/tooling/check_layout.py
