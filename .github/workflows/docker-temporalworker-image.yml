name: Kumo temporal worker Docker Image

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      validate_oidc_only:
        description: Configure OIDC credentials and verify ECR login without building or pushing images
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      validate_oidc_only:
        description: Configure OIDC credentials and verify ECR login without building or pushing images
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  ECR_IMAGE_REGISTRY: 926922431314.dkr.ecr.us-west-2.amazonaws.com


jobs:
  build:
    environment: gha-kumo-temporalworker-image-publish
    name: Build Kumo docker image
    runs-on: ubuntu-22.04-large

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Clone kumo repository
        if: ${{ !inputs.validate_oidc_only }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: kumo-ai/kumo
          token: ${{ secrets.GITHUB_TOKEN }}
          path: docker/kumo
          ref: master

      - name: Install fuse-overlayfs (upstream)
        if: ${{ !inputs.validate_oidc_only }}
        run: |
          sudo apt -y update
          sudo apt-get install -y fuse-overlayfs
          # apt's 1.7.1 (2021) has rmdir/ENOTEMPTY races on heavy pip uninstalls; pin upstream v1.16.
          sudo curl -fL \
            "https://github.com/containers/fuse-overlayfs/releases/download/v1.16/fuse-overlayfs-x86_64" \
            -o /usr/bin/fuse-overlayfs
          sudo chmod +x /usr/bin/fuse-overlayfs
          fuse-overlayfs --version
          mkdir -vp ~/.config/containers
          printf "[storage]\ndriver=\"overlay\"\n[storage.options]\nmount_program=\"/usr/bin/fuse-overlayfs\"\n" > ~/.config/containers/storage.conf
          cat ~/.config/containers/storage.conf

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7  # v6.0.0
        with:
          role-to-assume: arn:aws:iam::926922431314:role/gha-kumo-temporalworker-image-publish
          role-duration-seconds: 14400
          aws-region: us-west-2

      - name: Log in to AWS ECR
        shell: bash
        run: |
          aws ecr get-login-password --region us-west-2 \
            | podman login --username AWS --password-stdin "${ECR_IMAGE_REGISTRY}"

      - name: Validate OIDC identity
        if: ${{ inputs.validate_oidc_only }}
        run: aws sts get-caller-identity


      - name: Declare variables
        if: ${{ !inputs.validate_oidc_only }}
        id: vars
        shell: bash
        run: |
          pwd
          ls
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            date_pst=$(TZ="America/Los_Angeles" date +'%Y%m%d')
            echo "kumo_sha=nightly-${date_pst}" >> $GITHUB_OUTPUT
            echo "nightly-${date_pst}" > ./docker/kumo_version.txt
          else
            echo "kumo_sha=${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "${{ github.sha }}" > ./docker/kumo_version.txt
          fi

      - name: Stage DiskGraph Source
        if: ${{ !inputs.validate_oidc_only }}
        shell: bash
        run: |
          ./scripts/diskgraph stage-source --out docker/diskgraph-source

      - name: Prepare AWS build secrets
        if: ${{ !inputs.validate_oidc_only }}
        shell: bash
        run: |
          install -d -m 700 "$RUNNER_TEMP/build-secrets"
          install -m 600 /dev/null "$RUNNER_TEMP/build-secrets/aws_access_key_id"
          install -m 600 /dev/null "$RUNNER_TEMP/build-secrets/aws_secret_access_key"
          install -m 600 /dev/null "$RUNNER_TEMP/build-secrets/aws_session_token"
          printf %s "$AWS_ACCESS_KEY_ID" > "$RUNNER_TEMP/build-secrets/aws_access_key_id"
          printf %s "$AWS_SECRET_ACCESS_KEY" > "$RUNNER_TEMP/build-secrets/aws_secret_access_key"
          printf %s "$AWS_SESSION_TOKEN" > "$RUNNER_TEMP/build-secrets/aws_session_token"

      - name: Build Image
        if: ${{ !inputs.validate_oidc_only }}
        id: build-image
        uses: redhat-actions/buildah-build@7a95fa7ee0f02d552a32753e7414641a04307056 # v2
        with:
          image: kumo-temporalworker
          tags: latest ${{ steps.vars.outputs.kumo_sha }}
          context: ./docker
          containerfiles: |
            ./docker/Dockerfile.temporalworker
          build-args: |
            GITHUB_TOKEN=${{ secrets.KUMO_GITHUB_BOT_TOKEN }}
          extra-args: |
            --secret id=aws_access_key_id,src=${{ runner.temp }}/build-secrets/aws_access_key_id
            --secret id=aws_secret_access_key,src=${{ runner.temp }}/build-secrets/aws_secret_access_key
            --secret id=aws_session_token,src=${{ runner.temp }}/build-secrets/aws_session_token

      - name: Push To AWS ECR
        if: ${{ !inputs.validate_oidc_only }}
        id: push-to-ecr
        uses: redhat-actions/push-to-registry@5ed88d269cf581ea9ef6dd6806d01562096bee9c   #  v2.8
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: ${{ env.ECR_IMAGE_REGISTRY }}/kumo


      - name: Build Databricks Image
        if: ${{ github.event_name == 'schedule' && !inputs.validate_oidc_only }}
        id: build-image-databricks
        uses: redhat-actions/buildah-build@7a95fa7ee0f02d552a32753e7414641a04307056 # v2
        with:
          image: kumo-temporalworker
          tags: latest_databricks ${{ steps.vars.outputs.kumo_sha }}_databricks
          context: ./docker
          containerfiles: |
            ./docker/Dockerfile.temporalworker.databricks
          build-args: |
            GITHUB_TOKEN=${{ secrets.KUMO_GITHUB_BOT_TOKEN }}
          extra-args: |
            --secret id=aws_access_key_id,src=${{ runner.temp }}/build-secrets/aws_access_key_id
            --secret id=aws_secret_access_key,src=${{ runner.temp }}/build-secrets/aws_secret_access_key
            --secret id=aws_session_token,src=${{ runner.temp }}/build-secrets/aws_session_token

      - name: Remove AWS build secrets
        if: ${{ always() && !inputs.validate_oidc_only }}
        run: rm -rf "$RUNNER_TEMP/build-secrets"

      - name: Push Databricks images to AWS ECR
        if: ${{ github.event_name == 'schedule' && !inputs.validate_oidc_only }}
        id: push-to-ecr-databricks
        uses: redhat-actions/push-to-registry@5ed88d269cf581ea9ef6dd6806d01562096bee9c   #  v2.8
        with:
          image: ${{ steps.build-image-databricks.outputs.image }}
          tags: ${{ steps.build-image-databricks.outputs.tags }}
          registry: ${{ env.ECR_IMAGE_REGISTRY }}/kumo

      - name: Print Image Url
        if: ${{ !inputs.validate_oidc_only }}
        run: |
          echo "Image pushed to AWS ECR: ${{ steps.push-to-ecr.outputs.registry-paths }} ${{ steps.push-to-ecr-databricks.outputs.registry-paths }}"


      - name: Send Slack notification on failure
        if: ${{ failure() }}
        uses: ./.github/actions/slack-notification-action
        with:
          channel-id: "C05MUC2FTRN"
          job-status: ${{ job.status }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
