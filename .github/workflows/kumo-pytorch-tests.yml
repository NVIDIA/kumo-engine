name: kumo-pytorch tests

# kumo-pytorch's CPU checks: golden cases on the in-memory engine, the test
# suite (DiskGraph tests skip here), style and the package build. Pull requests
# run it through kumo-pytorch-gate.
on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
    paths:
      - 'packages/experimental/kumo-pytorch/**'
      - '.github/actions/kumo-pytorch-setup/**'
      - '.github/workflows/kumo-pytorch-tests.yml'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kumo-pytorch-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cpu:
    name: kumo-pytorch-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: packages/experimental/kumo-pytorch
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/kumo-pytorch-setup
      - name: Golden cases on the in-memory engine
        run: python -m conformance --engine in_memory
      - name: Test suite
        run: python -m pytest -q
      - name: Style
        run: |
          uvx ruff@0.17.3 check .
          uvx ruff@0.17.3 format --check .
      - name: Package build
        run: uv build --wheel --out-dir "$RUNNER_TEMP/kumo-pytorch-wheel" .

  notify:
    name: Alert on a failure on main
    needs: [cpu]
    # Main pushes and the schedule only; a call from kumo-pytorch-gate has the PR's event.
    if: ${{ failure() && (github.event_name == 'push' || github.event_name == 'schedule') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/kumo-pytorch-alert
        with:
          github-token: ${{ github.token }}
