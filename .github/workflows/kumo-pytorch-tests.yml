name: kumo-pytorch tests

# kumo-pytorch's CPU checks: golden cases on the in-memory engine, the test
# suite, style and the package build. The in-memory engine computes column
# statistics with DiskGraph's collector, so DiskGraph is built from this commit.
on:  # yamllint disable-line rule:truthy
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash
    working-directory: packages/experimental/kumo-pytorch

jobs:
  diskgraph-wheel:
    uses: ./.github/workflows/_diskgraph-wheel.yml

  cpu:
    name: kumo-pytorch-tests
    if: false
    needs: diskgraph-wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps: &package_steps
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          ref: 7571ab2f1117dea282ce421653244e32dbe35aae
          persist-credentials: false
      - id: aws
        if: env.STAGE_PINNED_DATASETS == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6
        with:
          role-to-assume: arn:aws:iam::926922431314:role/gha-kumo-workflow-tests
          aws-region: us-west-2
          # Intersect the role's existing grants with read-only dataset and anchor access.
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"s3:GetObject",
            "Resource":["arn:aws:s3:::kumo-engine-arena/datasets/*","arn:aws:s3:::kumo-engine-arena/anchors/*",
            "arn:aws:s3:::kumo-test-dataplane-bucket/scale-bench/extracts/kumo-pytorch/streaming-25b/c160/a585a4d806d51fdcd03ecae37b395a572765e7f9e5edf5c691ea7bd525fb4495/viewers.parquet",
            "arn:aws:s3:::kumo-test-dataplane-bucket/scale-bench/extracts/kumo-pytorch/streaming-25b/c160/0c5c424f33b3641b17f5584d678475d14373e83b0f85d80d78e40639010c3549/sessions.parquet"]}]}
          output-env-credentials: false
          output-credentials: true
          unset-current-credentials: true
      - name: Stage pinned datasets
        if: env.STAGE_PINNED_DATASETS == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws.outputs.aws-session-token }}
        run: |
          root="$RUNNER_TEMP/kumo-pytorch-data"
          python3 -m e2e.datasets.staging e2e/datasets/pins/*.json --root "$root"
          find "$root" -type f -printf 'Verified %s bytes  %P\n' | sort
          echo "KUMO_PYTORCH_DATA_ROOT=$root" >> "$GITHUB_ENV"
          # Bash also reads this before running package code inside the shared setup action.
          echo 'unset ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN' > "$RUNNER_TEMP/without-oidc"
          echo "BASH_ENV=$RUNNER_TEMP/without-oidc" >> "$GITHUB_ENV"
      - uses: ./.github/actions/kumo-pytorch-setup
        with:
          diskgraph-wheel-artifact: diskgraph-wheel
      - name: Golden cases on the in-memory engine
        run: python -m conformance --engine in_memory
      - name: Test suite
        run: python -m pytest -v
      - name: Style
        run: |
          uvx ruff@0.17.3 check .
          uvx ruff@0.17.3 format --check .
      - name: Package build
        run: uv build --wheel --out-dir "$RUNNER_TEMP/kumo-pytorch-wheel" .

  nightly:
    name: kumo-pytorch-tests (nightly datasets)
    if: github.event_name == 'workflow_dispatch' && github.repository == 'NVIDIA/kumo-engine' && github.ref == 'refs/heads/codex/nightly-453-7571ab2f-once'
    needs: diskgraph-wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: {name: gha-kumo-workflow-tests, deployment: false}
    permissions: {contents: read, id-token: write}
    env:
      STAGE_PINNED_DATASETS: 'true'
    steps: *package_steps

  hm-lifecycle:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/nightly-453-7571ab2f-once'
    needs: diskgraph-wheel
    uses: ./.github/workflows/_kumo-pytorch-t2b.yml
