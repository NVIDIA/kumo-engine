name: PyTorch suite
run-name: >-
  PyTorch suite · ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || 'nightly' }}

on:  # yamllint disable-line rule:truthy
  pull_request:
  schedule:
    - cron: '17 10 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash
    working-directory: packages/experimental/kumo-pytorch

jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions: {contents: read}
    outputs:
      plan: ${{ steps.select.outputs.plan }}
      training_bindings: ${{ steps.select.outputs.training_bindings }}
      evidence_pattern: ${{ steps.select.outputs.evidence_pattern }}
    steps:
      - &checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          persist-credentials: false
      - id: select
        run: python3 -m tests.e2e.ci_plan plan --output "$RUNNER_TEMP/plan.json"

  diskgraph-wheel:
    needs: plan
    uses: ./.github/workflows/_diskgraph-wheel.yml
    with: {diagnostics: true}

  cpu:
    name: kumo-pytorch-tests
    if: github.repository == 'NVIDIA/kumo-engine' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: [plan, diskgraph-wheel]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions: {contents: read, id-token: write}
    environment: {name: gha-kumo-workflow-tests, deployment: false}
    steps:
      - *checkout
      - uses: ./.github/actions/kumo-pytorch-stage
      - uses: ./.github/actions/kumo-pytorch-setup
        with:
          diskgraph-wheel-artifact: diskgraph-wheel
      - name: Golden cases on the in-memory engine
        env: &diagnostics
          KUMO_PYTORCH_DIAGNOSTICS: ${{ runner.temp }}/pytorch-${{ github.run_id }}-${{ github.run_attempt }}
        run: python -m tests.e2e.ci_command "$KUMO_PYTORCH_DIAGNOSTICS/golden.log" python -m conformance --engine in_memory
      - name: Test suite
        env: *diagnostics
        run: |
          python -m tests.e2e.ci_command "$KUMO_PYTORCH_DIAGNOSTICS/pytest.log" \
            python -m pytest -q --complete-fixtures --junitxml="$KUMO_PYTORCH_DIAGNOSTICS/junit.xml"
      - name: Style
        env: *diagnostics
        run: |
          python -m tests.e2e.ci_command "$KUMO_PYTORCH_DIAGNOSTICS/style.log" \
            bash -ec 'uvx ruff@0.17.3 check . && uvx ruff@0.17.3 format --check .'
      - name: Package build
        env: *diagnostics
        run: |
          python -m tests.e2e.ci_command "$KUMO_PYTORCH_DIAGNOSTICS/build.log" \
            uv build --wheel --out-dir "$RUNNER_TEMP/kumo-pytorch-wheel" .
      - uses: ./.github/actions/kumo-pytorch-results
        if: always()
        with: {name: kumo-pytorch-tests}

  distribution:
    needs: [plan, diskgraph-wheel]
    uses: ./.github/workflows/kumo-pytorch-diskgraph.yml
    with: {prebuilt-wheel: true}

  hm-small:
    needs: [plan, diskgraph-wheel]
    uses: ./.github/workflows/kumo-pytorch-t2a.yml
    with: {prebuilt-wheel: true}

  hm-lifecycle:
    needs: [plan, diskgraph-wheel]
    uses: ./.github/workflows/_kumo-pytorch-t2b.yml

  binding-train:
    if: github.repository == 'NVIDIA/kumo-engine' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: [plan, diskgraph-wheel]
    permissions: {contents: read, id-token: write}
    uses: ./.github/workflows/_kumo-pytorch-training.yml
    with: {bindings: '${{ needs.plan.outputs.training_bindings }}'}

  results:
    if: always()
    needs: [plan, diskgraph-wheel, cpu, distribution, hm-small, hm-lifecycle, binding-train]
    runs-on: ubuntu-24.04
    permissions: {contents: read, actions: read}
    steps:
      - *checkout
      - uses: ./.github/actions/kumo-pytorch-report
        with:
          pattern: ${{ needs.plan.outputs.evidence_pattern }}
          plan: ${{ needs.plan.outputs.plan }}

  gate:
    name: kumo-pytorch-gate
    if: always()
    needs: [plan, results]
    runs-on: ubuntu-24.04
    steps:
      - *checkout
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: kumo-pytorch-results${{ github.run_attempt != 1 && format('-attempt-{0}', github.run_attempt) || '' }}
          path: ${{ runner.temp }}
      - env:
          PLAN_JSON: ${{ needs.plan.outputs.plan }}
          PRODUCERS_SUCCEEDED: ${{ needs.plan.result == 'success' && needs.results.result == 'success' }}
        run: |
          test "$PRODUCERS_SUCCEEDED" = true
          python3 -m tests.e2e.ci_plan gate --results "$RUNNER_TEMP/results.json"
