name: kumo-pytorch tests

# Native package and conformance checks share a DiskGraph wheel from this commit.
on:  # yamllint disable-line rule:truthy
  pull_request:
    paths:
      - 'packages/experimental/kumo-pytorch/**'
      - 'packages/diskgraph/**'
      - 'scripts/diskgraph'
      - '.github/workflows/_diskgraph-wheel.yml'
      - '.github/actions/kumo-pytorch-setup/**'
      - '.github/workflows/kumo-pytorch-tests.yml'
  push:
    branches: [main]
    paths:
      - 'packages/experimental/kumo-pytorch/**'
      - 'packages/diskgraph/**'
      - 'scripts/diskgraph'
      - '.github/workflows/_diskgraph-wheel.yml'
      - '.github/actions/kumo-pytorch-setup/**'
      - '.github/workflows/kumo-pytorch-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  diskgraph-wheel:
    uses: ./.github/workflows/_diskgraph-wheel.yml

  cpu:
    name: kumo-pytorch-tests
    needs: diskgraph-wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: packages/experimental/kumo-pytorch
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/kumo-pytorch-setup
        with:
          diskgraph-wheel-artifact: diskgraph-wheel
      - name: DiskGraph conformance
        env:
          CONFORMANCE_REPROS: ${{ runner.temp }}/conformance-repros
          PYTEST_ADDOPTS: --basetemp=${{ runner.temp }}/conformance-cases --junitxml=${{ runner.temp }}/conformance.xml
        run: python -m conformance --engine diskgraph
      - name: Package test suite
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: >-
          python -m pytest -q --require-imports --ignore=tests/conformance
          --junitxml="$RUNNER_TEMP/package-tests.xml"
      - name: Style
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          uvx ruff@0.17.3 check .
          uvx ruff@0.17.3 format --check .
      - name: Package build
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv build --wheel --out-dir "$RUNNER_TEMP/kumo-pytorch-wheel" .
      - name: Preserve test results and reproducers
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kumo-pytorch-test-results
          path: |
            ${{ runner.temp }}/conformance.xml
            ${{ runner.temp }}/package-tests.xml
            ${{ runner.temp }}/conformance-repros
            ${{ runner.temp }}/conformance-cases/**/case.json
          if-no-files-found: warn
          retention-days: 14
