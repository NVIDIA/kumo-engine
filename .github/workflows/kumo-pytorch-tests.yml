name: PyTorch — Package Tests

# kumo-pytorch's CPU checks: DiskGraph golden cases, the test suite, style
# and the package build. DiskGraph is built from this commit.
# Pull requests run these checks through kumo-pytorch-gate.
on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
    paths:
      - 'packages/experimental/kumo-pytorch/**'
      - 'packages/diskgraph/**'
      - 'scripts/diskgraph'
      - '.github/workflows/_diskgraph-wheel.yml'
      - '.github/actions/kumo-pytorch-setup/**'
      - '.github/workflows/kumo-pytorch-tests.yml'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_call:
    inputs:
      prebuilt-diskgraph-wheel:
        description: The caller uploaded this run's diskgraph-wheel artifact.
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kumo-pytorch-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  diskgraph-wheel:
    name: Setup / DiskGraph Build
    if: ${{ !inputs.prebuilt-diskgraph-wheel }}
    uses: ./.github/workflows/_diskgraph-wheel.yml

  cpu:
    name: Correctness / Package Tests
    needs: diskgraph-wheel
    if: ${{ !cancelled() && (needs.diskgraph-wheel.result == 'success' || (inputs.prebuilt-diskgraph-wheel && needs.diskgraph-wheel.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: packages/experimental/kumo-pytorch
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/kumo-pytorch-setup
        with:
          diskgraph-wheel-artifact: diskgraph-wheel
      - name: DiskGraph conformance
        run: python -m conformance --engine diskgraph
      - name: Test suite
        run: python -m pytest -q --ignore=tests/conformance
      - name: Style
        run: |
          uvx ruff@0.17.3 check .
          uvx ruff@0.17.3 format --check .
      - name: Package build
        run: uv build --wheel --out-dir "$RUNNER_TEMP/kumo-pytorch-wheel" .
