name: kumo-pytorch tests

# kumo-pytorch's CPU checks: golden cases on the in-memory engine, the test
# suite, style and the package build. The in-memory engine computes column
# statistics with DiskGraph's collector, so DiskGraph is built from this commit.
on:  # yamllint disable-line rule:truthy
  pull_request:
    paths:
      - 'packages/experimental/kumo-pytorch/**'
      - 'packages/diskgraph/**'
      - 'scripts/diskgraph'
      - '.github/workflows/_diskgraph-wheel.yml'
      - '.github/actions/kumo-pytorch-setup/**'
      - '.github/workflows/kumo-pytorch-tests.yml'
      - '.github/workflows/kumo-pytorch-t2b.yml'
      - '.github/workflows/_kumo-pytorch-t2b.yml'
  push:
    branches: [main]
    paths:
      - 'packages/experimental/kumo-pytorch/**'
      - 'packages/diskgraph/**'
      - 'scripts/diskgraph'
      - '.github/workflows/_diskgraph-wheel.yml'
      - '.github/actions/kumo-pytorch-setup/**'
      - '.github/workflows/kumo-pytorch-tests.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: Package suite, CUDA measurements or Streaming 25B campaign
        type: choice
        required: true
        default: package
        options: [package, cuda, l01-cuda, all, smoke, training, lifecycle, full]
  schedule:
    - cron: '17 10 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ endsWith(inputs.mode, 'cuda') && 'cuda' || inputs.mode && inputs.mode != 'package' && '25b' || github.event_name == 'schedule' && 'nightly' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash
    working-directory: packages/experimental/kumo-pytorch

jobs:
  diskgraph-wheel:
    uses: ./.github/workflows/_diskgraph-wheel.yml

  cpu:
    name: kumo-pytorch-tests
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'package'
    needs: diskgraph-wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions: {contents: read, id-token: write}
    environment:
      name: >-
        ${{ github.repository == 'NVIDIA/kumo-engine' &&
          ((github.event_name == 'schedule' && github.ref == 'refs/heads/main') ||
           (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) &&
          'gha-kumo-workflow-tests' || 'kumo-pytorch-public' }}
      deployment: false
    env:
      STAGE_PINNED_DATASETS: >-
        ${{ github.repository == 'NVIDIA/kumo-engine' &&
          ((github.event_name == 'schedule' && github.ref == 'refs/heads/main') ||
           (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    steps:
      - &checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          persist-credentials: false
      - &dataset_credentials
        id: aws
        if: env.STAGE_PINNED_DATASETS == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6
        with:
          role-to-assume: arn:aws:iam::926922431314:role/gha-kumo-workflow-tests
          aws-region: us-west-2
          # Intersect the role's existing grants with read-only dataset and anchor access.
          inline-session-policy: >-
            ${{ env.DATASET_SESSION_POLICY || '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"s3:GetObject",
            "Resource":["arn:aws:s3:::kumo-engine-arena/datasets/*","arn:aws:s3:::kumo-engine-arena/anchors/*",
            "arn:aws:s3:::kumo-test-dataplane-bucket/scale-bench/extracts/kumo-pytorch/streaming-25b/c160/a585a4d806d51fdcd03ecae37b395a572765e7f9e5edf5c691ea7bd525fb4495/viewers.parquet",
            "arn:aws:s3:::kumo-test-dataplane-bucket/scale-bench/extracts/kumo-pytorch/streaming-25b/c160/0c5c424f33b3641b17f5584d678475d14373e83b0f85d80d78e40639010c3549/sessions.parquet"]}]}' }}
          output-env-credentials: false
          output-credentials: true
          unset-current-credentials: true
      - &stage_datasets
        name: Stage pinned datasets
        if: env.STAGE_PINNED_DATASETS == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws.outputs.aws-session-token }}
        run: |
          root="$RUNNER_TEMP/kumo-pytorch-data"
          pins=(e2e/datasets/pins/*.json)
          if [[ -n "${DATASET_PIN:-}" ]]; then pins=("$DATASET_PIN"); fi
          python3 -m e2e.datasets.staging "${pins[@]}" --root "$root"
          echo "KUMO_PYTORCH_DATA_ROOT=$root" >> "$GITHUB_ENV"
          # Bash also reads this before running package code inside the shared setup action.
          echo 'unset ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN' > "$RUNNER_TEMP/without-oidc"
          echo "BASH_ENV=$RUNNER_TEMP/without-oidc" >> "$GITHUB_ENV"
      - &package_setup
        uses: ./.github/actions/kumo-pytorch-setup
        with:
          diskgraph-wheel-artifact: diskgraph-wheel
      - name: Golden cases on the in-memory engine
        run: python -m conformance --engine in_memory
      - name: Test suite
        run: python -m pytest -q
      - name: Style
        run: |
          uvx ruff@0.17.3 check .
          uvx ruff@0.17.3 format --check .
      - name: Package build
        run: uv build --wheel --out-dir "$RUNNER_TEMP/kumo-pytorch-wheel" .

  hm-lifecycle:
    if: github.event_name == 'schedule' || github.event_name == 'pull_request'
    needs: diskgraph-wheel
    uses: ./.github/workflows/_kumo-pytorch-t2b.yml

  cuda:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'cuda' && github.repository == 'NVIDIA/kumo-engine'
    needs: diskgraph-wheel
    runs-on: linux-amd64-gpu-rtxpro6000-latest-1
    timeout-minutes: 45
    steps:
      - *checkout
      - &cuda_setup
        uses: ./.github/actions/kumo-pytorch-setup
        with:
          diskgraph-wheel-artifact: diskgraph-wheel
          torch-backend: cu130
      - run: python -m tests.e2e.runs cuda --e2e-dir "$RUNNER_TEMP/cuda" --repetitions 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        if: always()
        with:
          name: cuda-measurements
          path: |
            ${{ runner.temp }}/cuda/**/*.json
            ${{ runner.temp }}/cuda/**/*.xml
          if-no-files-found: error

  l01-source:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'l01-cuda' && github.repository == 'NVIDIA/kumo-engine' && github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    permissions: {contents: read, pull-requests: read}
    outputs: {policy: '${{ steps.source.outputs.policy }}'}
    steps:
      - *checkout
      - id: source
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq \
              '.[] | select(.state == "open" and .head.repo.full_name == .base.repo.full_name) | .head.sha' | grep -Fx "$GITHUB_SHA"
          fi
          jq -c '{Version:"2012-10-17",Statement:[{Effect:"Allow",Action:"s3:GetObject",
            Resource:[.objects[].key | "arn:aws:s3:::kumo-engine-arena/" + .]}]}' \
            e2e/datasets/pins/aml-l01.json | sed 's/^/policy=/' >> "$GITHUB_OUTPUT"

  l01-cuda:
    needs: [diskgraph-wheel, l01-source]
    runs-on: linux-amd64-gpu-rtxpro6000-latest-1
    timeout-minutes: 90
    environment: {name: gha-kumo-workflow-tests, deployment: false}
    permissions: {contents: read, id-token: write}
    env:
      STAGE_PINNED_DATASETS: 'true'
      DATASET_PIN: e2e/datasets/pins/aml-l01.json
      DATASET_SESSION_POLICY: ${{ needs.l01-source.outputs.policy }}
    steps:
      - *checkout
      - run: test -n "$DATASET_SESSION_POLICY"
      - *dataset_credentials
      - *stage_datasets
      - *cuda_setup
      - name: Run paired CUDA fits
        run: |
          sudo -n -- env PATH="$PATH" KUMO_PYTORCH_DATA_ROOT="$KUMO_PYTORCH_DATA_ROOT" \
            "$(command -v python)" -m tests.e2e.runs l01 --cuda --cgroup-parent /sys/fs/cgroup \
            --e2e-dir "$RUNNER_TEMP/l01" --repetitions 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        if: always()
        with:
          name: l01-cuda-measurements
          path: |
            ${{ runner.temp }}/l01/*/timings.json
            ${{ runner.temp }}/l01/*/*/*/l01/results.json
            ${{ runner.temp }}/l01/*/*/*/cuda.xml
          if-no-files-found: error

  streaming-25b:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.mode != 'package' && !endsWith(inputs.mode, 'cuda') &&
      github.repository == 'NVIDIA/kumo-engine' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/pull-request/'))
    needs: diskgraph-wheel
    runs-on: ${{ vars.KUMO_PYTORCH_25B_RUNNER || 'linux-amd64-gpu-rtxpro6000-latest-1' }}
    environment: {name: gha-kumo-workflow-tests, deployment: false}
    timeout-minutes: 720
    steps:
      - *checkout
      - name: Check scratch for the full index
        env:
          SCRATCH: ${{ vars.KUMO_PYTORCH_25B_SCRATCH || runner.temp }}
        run: |
          [[ "$SCRATCH" == /* && -d "$SCRATCH" && -w "$SCRATCH" ]] || {
            echo "::error::Set KUMO_PYTORCH_25B_SCRATCH to a writable scratch directory"; exit 1;
          }
          available=$(df -B1 --output=avail "$SCRATCH" | tail -1)
          (( available >= 3 * 1024**4 )) || { echo "::error::25B needs 3 TiB of free scratch"; exit 1; }
          mkdir -p "$SCRATCH/kumo-pytorch-25b/tmp"
          echo "TMPDIR=$SCRATCH/kumo-pytorch-25b/tmp" >> "$GITHUB_ENV"
          echo "KUMO_PYTORCH_25B_ROOT=$SCRATCH/kumo-pytorch-25b/cache" >> "$GITHUB_ENV"
      - *package_setup
      - name: Run the full-source campaign
        id: campaign
        env:
          MODE: ${{ inputs.mode }}
        run: |
          suite=tests/e2e/test_streaming.py
          smoke="$suite::test_streaming_weekly_session_forecast[25b-full]"
          campaign="$suite::test_streaming_campaign"
          case "$MODE" in
            all) nodes=("$smoke" "$campaign") ;;
            smoke) nodes=("$smoke") ;;
            *) nodes=("$campaign[$MODE]") ;;
          esac
          python -m pytest -q --durations=0 -o tmp_path_retention_policy=none \
            --junitxml="$RUNNER_TEMP/streaming-25b.xml" "${nodes[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        if: always() && steps.campaign.outcome != 'skipped'
        with:
          name: streaming-25b-${{ inputs.mode }}
          path: ${{ runner.temp }}/streaming-25b.xml
          if-no-files-found: error
