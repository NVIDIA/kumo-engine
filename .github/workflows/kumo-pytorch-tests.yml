name: PyTorch suite
run-name: >-
  PyTorch suite · ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && 'manual nightly replay' || 'nightly' }}

on:  # yamllint disable-line rule:truthy
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash
    working-directory: packages/experimental/kumo-pytorch

jobs:
  plan:
    name: Select suite jobs
    runs-on: ubuntu-24.04
    permissions: {contents: read, pull-requests: read}
    outputs:
      plan: ${{ steps.select.outputs.plan }}
      training: ${{ steps.select.outputs.training }}
      evidence_pattern: ${{ steps.select.outputs.evidence_pattern }}
    steps:
      - &checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          persist-credentials: false
      - name: Verify manual replay revision
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq \
            '.[] | select(.state == "open" and .head.repo.full_name == .base.repo.full_name) | .head.sha' | grep -Fx "$GITHUB_SHA"
      - id: select
        run: python3 -m tests.e2e.ci_plan plan --output "$RUNNER_TEMP/plan.json"

  diskgraph-wheel:
    name: Build
    if: github.repository == 'NVIDIA/kumo-engine' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/_diskgraph-wheel.yml
    with: {diagnostics: true}

  package-tests:
    name: ${{ matrix.group }}
    if: github.repository == 'NVIDIA/kumo-engine' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: [plan, diskgraph-wheel]
    # A single matrix call groups the dataset job and its three conformance peers in Actions.
    strategy:
      matrix: {group: [Package tests]}
    permissions: {contents: read, id-token: write}
    uses: ./.github/workflows/_kumo-pytorch-package-tests.yml
    with:
      seed_start: ${{ format('{0}', fromJSON(needs.plan.outputs.plan).seed_start) }}

  distribution:
    name: Distribution
    needs: [plan, diskgraph-wheel]
    uses: ./.github/workflows/_kumo-pytorch-distribution.yml

  training:
    name: Training · ${{ matrix.label }}
    if: github.repository == 'NVIDIA/kumo-engine' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: [plan, diskgraph-wheel]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.training) }}
    permissions: {contents: read, id-token: write}
    uses: ./.github/workflows/_kumo-pytorch-training.yml
    with:
      binding: ${{ matrix.binding || '' }}
      tier: ${{ matrix.tier || '' }}
      flow: ${{ matrix.flow || '' }}
      seed: ${{ matrix.seed || '' }}

  lifecycle:
    name: Lifecycle · ${{ matrix.dataset }}
    needs: [plan, training]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {dataset: H&M Small, tier: t2a}
          - {dataset: H&M Medium, tier: t2b}
    uses: ./.github/workflows/_kumo-pytorch-lifecycle.yml
    with: {tier: '${{ matrix.tier }}'}

  results:
    name: Publish results
    outputs:
      gate_outcome: ${{ steps.validate.outcome }}
    if: always()
    needs: [plan, diskgraph-wheel, package-tests, distribution, training, lifecycle]
    runs-on: ubuntu-24.04
    permissions: {contents: read, actions: read}
    steps:
      - *checkout
      - uses: ./.github/actions/kumo-pytorch-report
        with:
          pattern: ${{ needs.plan.outputs.evidence_pattern }}
          plan: ${{ needs.plan.outputs.plan }}

      - name: Validate the published report
        id: validate
        continue-on-error: true
        env:
          PLAN_JSON: ${{ needs.plan.outputs.plan }}
        run: python3 -m tests.e2e.ci_plan gate --results "$RUNNER_TEMP/results.json"

  gate:
    name: kumo-pytorch-gate
    if: always()
    needs: [plan, results]
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful planning, publication, and validation
        working-directory: .
        env:
          ACCEPTED: ${{ needs.plan.result == 'success' && needs.results.result == 'success' && needs.results.outputs.gate_outcome == 'success' }}
        run: test "$ACCEPTED" = true
