name: PyTorch suite
run-name: >-
  PyTorch suite · ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && 'manual nightly replay' || 'nightly' }}

on:  # yamllint disable-line rule:truthy
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash
    working-directory: packages/experimental/kumo-pytorch

jobs:
  plan:
    name: Select suite jobs
    runs-on: ubuntu-24.04
    permissions: {contents: read, pull-requests: read}
    outputs:
      plan: ${{ steps.select.outputs.plan }}
      training: ${{ steps.select.outputs.training }}
      evidence_pattern: ${{ steps.select.outputs.evidence_pattern }}
    steps:
      - &checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          persist-credentials: false
      - name: Verify manual replay revision
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq \
            '.[] | select(.state == "open" and .head.repo.full_name == .base.repo.full_name) | .head.sha' | grep -Fx "$GITHUB_SHA"
      - id: select
        run: python3 -m tests.e2e.ci_plan plan --output "$RUNNER_TEMP/plan.json"

  diskgraph-wheel:
    name: Build
    if: github.repository == 'NVIDIA/kumo-engine' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/_diskgraph-wheel.yml
    with: {diagnostics: true}

  cpu:
    name: Package tests
    if: github.repository == 'NVIDIA/kumo-engine' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: [plan, diskgraph-wheel]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions: {contents: read, id-token: write}
    environment: {name: gha-kumo-workflow-tests, deployment: false}
    steps:
      - *checkout
      - uses: ./.github/actions/kumo-pytorch-stage
      - uses: ./.github/actions/kumo-pytorch-setup
        with:
          diskgraph-wheel-artifact: diskgraph-wheel
      - name: Golden cases on the in-memory engine
        env: &diagnostics
          KUMO_PYTORCH_DIAGNOSTICS: ${{ runner.temp }}/pytorch-${{ github.run_id }}-${{ github.run_attempt }}
        run: python -m tests.e2e.ci_command "$KUMO_PYTORCH_DIAGNOSTICS/golden.log" python -m conformance --engine in_memory
      - name: Test suite
        env: *diagnostics
        run: |
          python -m tests.e2e.ci_command "$KUMO_PYTORCH_DIAGNOSTICS/pytest.log" \
            python -m pytest -q --complete-fixtures --junitxml="$KUMO_PYTORCH_DIAGNOSTICS/junit.xml"
      - name: Style
        env: *diagnostics
        run: |
          python -m tests.e2e.ci_command "$KUMO_PYTORCH_DIAGNOSTICS/style.log" \
            bash -ec 'uvx ruff@0.17.3 check . && uvx ruff@0.17.3 format --check .'
      - name: Package build
        env: *diagnostics
        run: |
          python -m tests.e2e.ci_command "$KUMO_PYTORCH_DIAGNOSTICS/build.log" \
            uv build --wheel --out-dir "$RUNNER_TEMP/kumo-pytorch-wheel" .
      - uses: ./.github/actions/kumo-pytorch-results
        if: always()
        with: {name: kumo-pytorch-tests}

  distribution:
    name: Distribution
    needs: [plan, diskgraph-wheel]
    uses: ./.github/workflows/_kumo-pytorch-distribution.yml

  conformance:
    name: Package tests
    needs: [plan, diskgraph-wheel]
    uses: ./.github/workflows/_kumo-pytorch-conformance.yml
    with:
      seed_start: ${{ format('{0}', fromJSON(needs.plan.outputs.plan).seed_start) }}

  training:
    name: Training · ${{ matrix.label }}
    if: github.repository == 'NVIDIA/kumo-engine' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: [plan, diskgraph-wheel]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.training) }}
    permissions: {contents: read, id-token: write}
    uses: ./.github/workflows/_kumo-pytorch-training.yml
    with:
      binding: ${{ matrix.binding || '' }}
      tier: ${{ matrix.tier || '' }}
      flow: ${{ matrix.flow || '' }}
      seed: ${{ matrix.seed || '' }}

  lifecycle:
    name: Lifecycle · ${{ matrix.dataset }}
    needs: [plan, training]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {dataset: H&M Small, tier: t2a}
          - {dataset: H&M Medium, tier: t2b}
    uses: ./.github/workflows/_kumo-pytorch-lifecycle.yml
    with: {tier: '${{ matrix.tier }}'}

  results:
    name: Publish results
    outputs:
      gate_outcome: ${{ steps.validate.outcome }}
    if: always()
    needs: [plan, diskgraph-wheel, cpu, distribution, conformance, training, lifecycle]
    runs-on: ubuntu-24.04
    permissions: {contents: read, actions: read}
    steps:
      - *checkout
      - uses: ./.github/actions/kumo-pytorch-report
        with:
          pattern: ${{ needs.plan.outputs.evidence_pattern }}
          plan: ${{ needs.plan.outputs.plan }}

      - name: Validate the published report
        id: validate
        continue-on-error: true
        env:
          PLAN_JSON: ${{ needs.plan.outputs.plan }}
        run: python3 -m tests.e2e.ci_plan gate --results "$RUNNER_TEMP/results.json"

  gate:
    name: kumo-pytorch-gate
    if: always()
    needs: [plan, results]
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful planning, publication, and validation
        working-directory: .
        env:
          ACCEPTED: ${{ needs.plan.result == 'success' && needs.results.result == 'success' && needs.results.outputs.gate_outcome == 'success' }}
        run: test "$ACCEPTED" = true
