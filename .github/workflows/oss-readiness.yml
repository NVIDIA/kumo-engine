name: OSS Readiness

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  repository-checks:
    runs-on: ubuntu-24.04
    steps:
      # A blob-less clone without persisted credentials cannot fetch file
      # contents later, so check out the commit the scans read (the PR head,
      # not the merge commit) to download its file contents up front.
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          filter: blob:none
          fetch-depth: 0

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: "3.14"

      - name: Test repository readiness checks
        run: |
          uvx --python 3.14 --from pytest==9.0.3 --with vulture==2.14 \
            python -m pytest -c /dev/null --confcutdir=test/scripts \
            -p no:cacheprovider -q \
            test/scripts/test_check_public_references.py \
            test/scripts/test_check_dead_code.py \
            test/scripts/test_check_oss_readiness.py \
            test/scripts/test_check_secrets.py

      # Pull requests check only the files they change. Pushes to main check
      # the whole tree, so a recorded public-reference count that is no longer
      # reached, or a finding in an unchanged file, is still reported.
      - name: Check public references and all configured Python code
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            ./scripts/check_oss_readiness.sh
            exit
          fi
          if [[ -z "$BASE_SHA" || -z "$HEAD_SHA" ]]; then
            echo "::error::Could not determine the commit range to scan."
            exit 2
          fi
          ./scripts/check_oss_readiness.sh --diff "$BASE_SHA" "$HEAD_SHA"

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-24.04
    env:
      # Keep the version aligned with .mise.toml. The checksum is the
      # linux_x64 entry in the release's gitleaks_<version>_checksums.txt.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Restore pinned Gitleaks
        id: gitleaks-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/gitleaks
          key: gitleaks-${{ env.GITLEAKS_VERSION }}-${{ env.GITLEAKS_SHA256 }}

      - name: Download and verify pinned Gitleaks
        if: steps.gitleaks-cache.outputs.cache-hit != 'true'
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --proto '=https' --tlsv1.2 --retry 3 -fsSLo "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks

      - name: Scan changed commits for sensitive values
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks/gitleaks
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: |
          if [[ -z "$BASE_SHA" || -z "$HEAD_SHA" ]]; then
            echo "::error::Could not determine the commit range to scan."
            exit 2
          fi
          ./scripts/check_secrets.sh --diff "$BASE_SHA" "$HEAD_SHA"
