name: Kumo Proxy Docker Image

on:  # yamllint disable-line rule:truthy
  workflow_call:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

env:
  ECR_IMAGE_REGISTRY: 926922431314.dkr.ecr.us-west-2.amazonaws.com
  SNOWFLAKE_REGISTRY: lfwgwbp-kumo-snowservices.registry.snowflakecomputing.com
  SNOWFLAKE_REGISTRY_USER: kumo_snowservices
  SNOWFLAKE_REGISTRY_PAT: ${{ secrets.SNOWFLAKE_REGISTRY_PAT }}

permissions:
  contents: read

jobs:
  build:
    name: Build Kumo docker image
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Clone kumo repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: kumo-ai/kumo
          token: ${{ secrets.GITHUB_TOKEN }}
          path: docker/kumo
          ref: master

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be   #  v1.3.1

      - name: Install fuse-overlayfs (upstream)
        run: |
          sudo apt -y update
          sudo apt-get install -y fuse-overlayfs
          # apt's 1.7.1 (2021) has rmdir/ENOTEMPTY races on heavy pip uninstalls; pin upstream v1.16.
          sudo curl -fL \
            "https://github.com/containers/fuse-overlayfs/releases/download/v1.16/fuse-overlayfs-x86_64" \
            -o /usr/bin/fuse-overlayfs
          sudo chmod +x /usr/bin/fuse-overlayfs
          fuse-overlayfs --version
          mkdir -vp ~/.config/containers
          printf "[storage]\ndriver=\"overlay\"\n[storage.options]\nmount_program=\"/usr/bin/fuse-overlayfs\"\n" > ~/.config/containers/storage.conf
          cat ~/.config/containers/storage.conf


      - name: Log in to Snowflake Registry
        uses: redhat-actions/podman-login@4934294ad0449894bcd1e9f191899d7292469603   #  v1.7
        with:
          username: ${{ env.SNOWFLAKE_REGISTRY_USER }}
          password: ${{ env.SNOWFLAKE_REGISTRY_PAT }}
          registry: ${{ env.SNOWFLAKE_REGISTRY }}

      - name: Declare variables
        id: vars
        shell: bash
        run: |
          pwd
          ls
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            date_pst=$(TZ="America/Los_Angeles" date +'%Y%m%d')
            echo "kumo_sha=nightly-${date_pst}" >> $GITHUB_OUTPUT
            echo "nightly-${date_pst}" > ./docker/kumo_version.txt
          else
            echo "kumo_sha=${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "${{ github.sha }}" > ./docker/kumo_version.txt
          fi

      - name: Build Image
        id: build-image
        uses: Wandalen/wretry.action@e68c23e6309f2871ca8ae4763e7629b9c258e1ea   #  v3.8.0
        with:
          action: redhat-actions/buildah-build@7a95fa7ee0f02d552a32753e7414641a04307056 # v2
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          token: ${{ secrets.GITHUB_TOKEN }}
          with: |
            image: kumo-proxy
            tags: latest ${{ steps.vars.outputs.kumo_sha }}
            context: ./docker
            containerfiles: |
              ./docker/Dockerfile.proxy
            build-args: |
              GITHUB_TOKEN=${{ secrets.KUMO_GITHUB_BOT_TOKEN }}
          attempt_limit: 3
          attempt_delay: 2000

      - name: Push To Snowflake Registry
        id: push-to-snowflake
        if: ${{ github.event_name == 'schedule' }}
        uses: Wandalen/wretry.action@e68c23e6309f2871ca8ae4763e7629b9c258e1ea   #  v3.8.0
        with:
          action: redhat-actions/push-to-registry@5ed88d269cf581ea9ef6dd6806d01562096bee9c   #  v2.8
          # image and tags set by previous Build Image step
          with: |
            image: ${{ env.INPUT_IMAGE }}
            tags: ${{ env.INPUT_TAGS }}
            registry: ${{ env.SNOWFLAKE_REGISTRY }}/kumo_app_db/image_repo/kumo_repo
          attempt_limit: 3
          attempt_delay: 2000

      - name: Send Slack notification on failure
        if: ${{ failure() }}
        uses: ./.github/actions/slack-notification-action
        with:
          channel-id: "C05MUC2FTRN"
          job-status: ${{ job.status }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
