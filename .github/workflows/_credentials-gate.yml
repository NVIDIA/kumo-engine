name: Credentials gate

# Decides whether a run gets the jobs that need cloud credentials. A fork's
# pull_request run gets no secrets or OIDC token, so it skips them; they run
# once copy-pr-bot pushes a vetted commit to pull-request/<number>. Same-repo
# pull requests already run those jobs on pull_request, so their copies skip
# them.
on:  # yamllint disable-line rule:truthy
  workflow_call:
    outputs:
      run:
        description: "'true' when this run should run the jobs that need cloud credentials."
        value: ${{ jobs.gate.outputs.run }}
      base:
        description: "On pull-request/<number> pushes, the pull request's merge base. Empty otherwise."
        value: ${{ jobs.gate.outputs.base }}

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
      base: ${{ steps.gate.outputs.base }}
    steps:
      - name: Decide whether to run the credentialed jobs
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          run=true
          base=''
          if [[ "$GITHUB_EVENT_NAME" == pull_request && "$PR_HEAD_REPO" != "$GITHUB_REPOSITORY" ]]; then
            run=false
          elif [[ "$GITHUB_REF" == refs/heads/pull-request/* ]]; then
            pr_url="repos/$GITHUB_REPOSITORY/pulls/${GITHUB_REF_NAME#pull-request/}"
            if [[ "$(gh api "$pr_url" --jq .head.repo.full_name)" == "$GITHUB_REPOSITORY" ]]; then
              run=false
            fi
            base_ref="$(gh api "$pr_url" --jq .base.ref)"
            base="$(gh api "repos/$GITHUB_REPOSITORY/compare/$base_ref...$GITHUB_SHA" --jq .merge_base_commit.sha)"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
