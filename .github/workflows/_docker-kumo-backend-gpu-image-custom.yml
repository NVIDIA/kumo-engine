name: Kumo backend GPU image build

# Builds kumo/kumo-backend-gpu — hosts pool activity pods (cache + overflow)
# that run train/predict via GPU subprocesses (kumo-auto, kumo-pred,
# kumo-pred). Self-contained: builds directly on NVIDIA's public nvcr.io
# cuda base (CUDA/Python/torch env inlined as the Dockerfile's `base` stage)
# — no separate kumo-base image.

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      kumo_repo_ref:
        description: 'Your development branch name'
        required: true
        default: 'development'
        type: string
      bake_glove_level:
        description: 'GloVe bake: basic (complete default model-plan bundle), all (~8GB), or none (explicit local/AMI builds only)'
        required: false
        default: 'basic'
        type: string
      runner_label:
        description: 'GitHub runner label'
        required: false
        default: 'ubuntu-22.04-large'
        type: string
      target_platform:
        description: 'Container platform'
        required: false
        default: 'linux/amd64'
        type: string
      cuda_arch_list:
        description: 'Semicolon-separated CUDA compute capabilities for ARM wheels'
        required: false
        default: ''
        type: string
      exercise_gpu:
        description: "Run device-backed CUDA smoke tests (requires an NVIDIA runner)"
        required: false
        default: false
        type: boolean
      image_tag_suffix:
        description: 'Architecture suffix appended to the image tag'
        required: false
        default: ''
        type: string
      push_image:
        description: 'Push the tested image to ECR'
        required: false
        default: true
        type: boolean
    outputs:
      build_success:
        value: ${{ jobs.build.outputs.build_success }}

permissions:
  contents: read
  id-token: write
  issues: write
  pull-requests: write

env:
  ECR_IMAGE_REGISTRY: 926922431314.dkr.ecr.us-west-2.amazonaws.com
  FAISS_GPU_AMD64_RELEASE_REPOSITORY: kumo-ai/kumo
  FAISS_GPU_AMD64_RELEASE_TAG: faiss-gpu-amd64-1.14.3-cu130sm120-cp314-v1
  FAISS_GPU_AMD64_RELEASE_ASSET: faiss_gpu-1.14.3+cu130sm120-cp314-cp314-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
  FAISS_GPU_AMD64_RELEASE_SHA256: ed9162596b6b1e9eeffc11675cd57eef622d891c27e8c02e2315930fee0f67aa

jobs:
  build:
    environment: ${{ (inputs.push_image || inputs.bake_glove_level != 'none') && 'gha-kumo-backend-gpu-publish' || '' }}
    name: Build kumo-backend-gpu image
    runs-on: ${{ inputs.runner_label }}
    outputs:
      build_success: ${{ steps.set-output.outputs.success }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          ref: ${{ inputs.kumo_repo_ref }}

      - name: Validate architecture inputs
        run: |
          if [ "${{ inputs.push_image }}" = "true" ] \
             && [ "${{ inputs.target_platform }}" = "linux/arm64" ] \
             && [ -z "${{ inputs.image_tag_suffix }}" ]; then
            echo "ARM64 pushes require image_tag_suffix to avoid overwriting AMD64 tags" >&2
            exit 1
          fi

      - name: Install fuse-overlayfs
        run: |
          sudo apt -y update
          sudo apt-get install fuse-overlayfs
          mkdir -vp ~/.config/containers
          echo "[storage]"           > ~/.config/containers/storage.conf
          echo "driver=\"overlay\"" >> ~/.config/containers/storage.conf
          echo "[storage.options]"  >> ~/.config/containers/storage.conf
          echo "mount_program=\"/usr/bin/fuse-overlayfs\"" \
                                    >> ~/.config/containers/storage.conf

      - name: Configure AWS credentials
        if: ${{ inputs.push_image || inputs.bake_glove_level != 'none' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::926922431314:role/gha-kumo-backend-gpu-publish
          aws-region: us-west-2

      - name: Log in to AWS ECR
        if: ${{ inputs.push_image }}
        shell: bash
        run: |
          aws ecr get-login-password --region us-west-2 \
            | podman login --username AWS --password-stdin "$ECR_IMAGE_REGISTRY"

      - name: Declare variables
        shell: bash
        run: |
          echo ${{ inputs.kumo_repo_ref }} > ./kumo_version.txt
          cat ./kumo_version.txt

      - name: Stage DiskGraph Source
        shell: bash
        run: |
          ./scripts/diskgraph stage-source --out docker/diskgraph-source

      - name: Download checksum-pinned CUDA 13 Faiss wheel
        if: ${{ inputs.target_platform == 'linux/amd64' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.KUMO_GITHUB_BOT_TOKEN }}
        run: |
          if [[ ! "$FAISS_GPU_AMD64_RELEASE_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "FAISS_GPU_AMD64_RELEASE_SHA256 must be a lowercase SHA-256 digest" >&2
            exit 1
          fi
          download_dir=$(mktemp -d "$RUNNER_TEMP/faiss-gpu-amd64-release.XXXXXX")
          gh release download "$FAISS_GPU_AMD64_RELEASE_TAG" \
            --repo "$FAISS_GPU_AMD64_RELEASE_REPOSITORY" \
            --pattern "$FAISS_GPU_AMD64_RELEASE_ASSET" \
            --dir "$download_dir"
          test -f "$download_dir/$FAISS_GPU_AMD64_RELEASE_ASSET"
          (
            cd "$download_dir"
            printf '%s  %s\n' "$FAISS_GPU_AMD64_RELEASE_SHA256" "$FAISS_GPU_AMD64_RELEASE_ASSET" \
              | sha256sum --check --strict -
          )
          install -m 0644 "$download_dir/$FAISS_GPU_AMD64_RELEASE_ASSET" \
            "3rdparty/kumo-wheels/$FAISS_GPU_AMD64_RELEASE_ASSET"

      - name: Refresh AWS credentials for image build
        if: ${{ inputs.push_image || inputs.bake_glove_level != 'none' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::926922431314:role/gha-kumo-backend-gpu-publish
          aws-region: us-west-2

      # Direct buildah-build call: the Wandalen/wretry.action wrapper is
      # blocked by the org actions allowlist (its internal
      # @v3.8.0_js_action ref is not allowlisted).
      # Tokens/credentials are passed as buildah secrets, NOT build-args:
      # build args consumed by a RUN are recorded *expanded* in the image
      # history, which shipped them in every previously pushed image.
      - name: Prepare build secrets
        run: |
          mkdir -p "$RUNNER_TEMP/build-secrets"
          printf '%s' "${{ env.AWS_ACCESS_KEY_ID }}" > "$RUNNER_TEMP/build-secrets/aws_access_key_id"
          printf '%s' "${{ env.AWS_SECRET_ACCESS_KEY }}" > "$RUNNER_TEMP/build-secrets/aws_secret_access_key"
          printf '%s' "${{ env.AWS_SESSION_TOKEN }}" > "$RUNNER_TEMP/build-secrets/aws_session_token"

      - name: Build Image
        id: build-image
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034  # v2
        with:
          image: kumo-backend-gpu
          tags: ${{ inputs.kumo_repo_ref }}${{ inputs.image_tag_suffix }}
          context: .
          containerfiles: |
            ./docker/Dockerfile.kumo_backend_gpu
          build-args: |
            BAKE_GLOVE_LEVEL=${{ inputs.bake_glove_level }}
            AWS_REGION=us-west-2
            CUDA_ARCH_LIST=${{ inputs.cuda_arch_list }}
          extra-args: |
            --platform=${{ inputs.target_platform }}
            --secret id=aws_access_key_id,src=${{ runner.temp }}/build-secrets/aws_access_key_id
            --secret id=aws_secret_access_key,src=${{ runner.temp }}/build-secrets/aws_secret_access_key
            --secret id=aws_session_token,src=${{ runner.temp }}/build-secrets/aws_session_token

      # wretry used to export the nested action's inputs as INPUT_* env vars;
      # later steps rely on them.
      - name: Export Build Image env
        run: |
          echo "INPUT_IMAGE=kumo-backend-gpu" >> "$GITHUB_ENV"
          echo "INPUT_TAGS=${{ inputs.kumo_repo_ref }}${{ inputs.image_tag_suffix }}" >> "$GITHUB_ENV"

      # TODO(kumo3): add a NODE_TYPE=trainer6 build alongside if/when
      # trainer6 nodes return in pool-integrated clusters. Today the
      # legacy worker workflow builds it; pool architecture has not
      # surfaced a need yet.

      - name: Test Kumo Import Inside Image
        run: |
          podman run --rm ${{ env.INPUT_IMAGE }}:${{ env.INPUT_TAGS }} \
            python3 -c "import kumo, numpy, torch; torch.from_numpy(numpy.array([0]))"
          podman run --rm ${{ env.INPUT_IMAGE }}:${{ env.INPUT_TAGS }} \
            python3 -c "from kumo.runtime import init; init('rest-api')"
          podman run --rm ${{ env.INPUT_IMAGE }}:${{ env.INPUT_TAGS }} \
            python3 -c "import pool.worker_main"
          if [ "${{ inputs.target_platform }}" = "linux/arm64" ]; then
            faiss_check="assert m.version('faiss-gpu') == '1.14.3'"
          else
            faiss_check="assert m.version('faiss-gpu') == '1.14.3+cu130sm120'"
          fi
          podman run --rm ${{ env.INPUT_IMAGE }}:${{ env.INPUT_TAGS }} \
            python3 -c "import importlib.metadata as m, faiss; ${faiss_check}; assert hasattr(faiss, 'StandardGpuResources')"
          podman run --rm ${{ env.INPUT_IMAGE }}:${{ env.INPUT_TAGS }} \
            test -x /opt/app/bin/kumo-auto -a -x /opt/app/bin/kumo-pred

      - name: Verify baked runtime artifacts
        env:
          BAKE_GLOVE_LEVEL: ${{ inputs.bake_glove_level }}
        run: |
          podman run --rm --network none \
            -e BAKE_GLOVE_LEVEL \
            -e BAKE_GLOVE_VERIFY_ONLY=true \
            "${INPUT_IMAGE}:${INPUT_TAGS}" \
            /tmp/install_glove_files
          if [[ "${BAKE_GLOVE_LEVEL}" != none ]]; then
            podman run --rm --network none \
              "${INPUT_IMAGE}:${INPUT_TAGS}" \
              python3 -c "from pathlib import Path; root=Path('/opt/app/artifacts/glove'); names=('glove_6B_index.parquet','glove_6B_50d_emb.npy'); assert all((root / name).is_file() for name in names)"
          fi

      - name: Exercise ARM GPU kernels
        if: ${{ inputs.target_platform == 'linux/arm64' && inputs.exercise_gpu }}
        run: |
          nvidia-smi
          podman run --rm --device nvidia.com/gpu=all \
            ${{ env.INPUT_IMAGE }}:${{ env.INPUT_TAGS }} \
            python3 -c "import faiss, numpy, torch; from torch_geometric.utils import scatter; assert torch.cuda.is_available(); x=torch.tensor([1.0, 2.0], device='cuda'); i=torch.tensor([0, 0], device='cuda'); assert scatter(x, i, reduce='sum').item() == 3.0; r=faiss.StandardGpuResources(); g=faiss.index_cpu_to_gpu(r, 0, faiss.IndexFlatL2(1)); g.add(numpy.array([[0.0]], dtype='float32')); assert g.ntotal == 1"

      - name: Check Disk Space and inodes
        if: ${{ always() }}
        run: |
          df -h
          df -i

      - name: Push To AWS ECR
        if: ${{ inputs.push_image }}
        id: push-to-ecr
        uses: redhat-actions/push-to-registry@5ed88d269cf581ea9ef6dd6806d01562096bee9c   #  v2.8
        with:
          image: ${{ env.INPUT_IMAGE }}
          tags: ${{ env.INPUT_TAGS }}
          registry: ${{ env.ECR_IMAGE_REGISTRY }}/kumo

      - name: Print Image Url
        if: ${{ inputs.push_image }}
        run: |
          echo "Image pushed: ${{ steps.push-to-ecr.outputs.registry-paths }}"

      - name: Set output
        if: ${{ success() }}
        id: set-output
        run: echo "success=true" >> $GITHUB_OUTPUT

      - name: Clean up local image
        if: ${{ always() }}
        run: |
          podman image rm "${{ env.INPUT_IMAGE }}:${{ env.INPUT_TAGS }}" || true

  post-comment-failure:
    needs: build
    if: ${{ failure() || cancelled() || needs.build.outputs.build_success != 'true' }}
    uses: ./.github/workflows/_post_comment_image_build.yml
    with:
      image_type: 'kumo-backend-gpu'
      build_failure: true
    secrets: inherit
