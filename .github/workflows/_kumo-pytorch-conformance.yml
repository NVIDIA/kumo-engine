name: PyTorch engine conformance

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      seed_start:
        description: First extra conformance seed batch, shared by all shards
        required: true
        type: string

permissions:
  contents: read

jobs:
  conformance:
    name: Engine conformance (shard ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix: {shard: [0, 1, 2]}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/kumo-pytorch-conformance
        with:
          shard: ${{ matrix.shard }}
          seed_start: ${{ inputs.seed_start }}
