name: PyTorch engine conformance

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      seed_start:
        description: First extra conformance seed batch, shared by all shards
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: packages/experimental/kumo-pytorch

jobs:
  conformance:
    name: Engine conformance (shard ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix: {shard: [0, 1, 2]}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/kumo-pytorch-setup
        with:
          diskgraph-wheel-artifact: diskgraph-wheel
      - name: Check every property on the day's seed batches
        env:
          KUMO_PYTORCH_DIAGNOSTICS: ${{ runner.temp }}/pytorch-${{ github.run_id }}-${{ github.run_attempt }}
          CONFORMANCE_REPROS: ${{ runner.temp }}/conformance-repros
          START: ${{ inputs.seed_start }}
          SHARD: ${{ matrix.shard }}
        run: |
          python -m tests.e2e.ci_command "$KUMO_PYTORCH_DIAGNOSTICS/conformance.log" \
            python -m conformance --engine all --seeds 12 --seed-start "$START" --shard "$SHARD"
      - uses: ./.github/actions/kumo-pytorch-results
        if: always()
        with:
          retention-days: 14
          name: kumo-pytorch-t2b-conformance-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/conformance-repros
            ${{ runner.temp }}/pytorch-${{ github.run_id }}-${{ github.run_attempt }}/conformance-shard-*.json
