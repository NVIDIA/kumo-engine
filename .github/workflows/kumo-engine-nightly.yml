name: Kumo Engine Nightly
on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      product_ref:
        description: Product revision to build and test
        type: string
        default: main
  push:
    branches: ['pull-request/[0-9]+']
    paths:
      - '.github/workflows/kumo-engine-nightly.yml'
      - '.github/actions/engine-gpu-smoke/**'
      - 'packages/kumo-engine/scripts/nightly_check.py'
      - 'packages/kumo-engine/test/wheel_gpu_smoke.py'
      - 'packages/kumo-engine/test/test_nightly_model_reuse.py'
      - 'packages/kumo-engine/test/test_training_table_export.py'
      - 'test/scripts/test_engine_nightly*'
permissions:
  contents: read
concurrency:
  group: engine-nightly-${{ github.ref }}
  cancel-in-progress: false
env:
  NIGHTLY_ROOT: ${{ vars.KUMO_ENGINE_NIGHTLY_ROOT }}
  INPUT_SHA256: ${{ vars.KUMO_ENGINE_NIGHTLY_INPUT_SHA256 }}
  REFERENCE_SHA256: ${{ vars.KUMO_ENGINE_NIGHTLY_REFERENCE_SHA256 }}
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          persist-credentials: false
      - name: Require the existing RTX route and admitted inputs
        env:
          RTX_RUNNER: ${{ vars.KUMO_ENGINE_NIGHTLY_RTX_RUNNER }}
        run: |
          test -n "$RTX_RUNNER"
          [[ "$NIGHTLY_ROOT" = /* ]]
          [[ "$INPUT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$REFERENCE_SHA256" =~ ^[0-9a-f]{64}$ ]]
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          ref: ${{ inputs.product_ref || github.sha }}
          path: product
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: product/packages/diskgraph
      - name: Build the exact product tree with the existing builder
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nightly-wheel"
          test -z "$(git -C product status --porcelain)"
          git -C product rev-parse HEAD 'HEAD^{tree}' > "$RUNNER_TEMP/nightly-wheel/source.txt"
          python -I -m pip --isolated install --index-url https://pypi.org/simple ziglang
          (cd product && packages/kumo-engine/scripts/build_wheel.sh --output-dir "$RUNNER_TEMP/nightly-wheel") 2>&1 | tee "$RUNNER_TEMP/nightly-wheel/build.log"
          cmp "$RUNNER_TEMP/nightly-wheel/source.txt" <(git -C product rev-parse HEAD 'HEAD^{tree}')
          test -z "$(git -C product status --porcelain)"
          python - <<'PY'
          import email, hashlib, json, os, subprocess, zipfile
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'nightly-wheel'
          revision, tree = (root / 'source.txt').read_text().splitlines()
          [wheel] = root.glob('*.whl')
          short = subprocess.check_output(['git', '-C', 'product', 'rev-parse', '--short', 'HEAD'], text=True).strip()
          expected = Path('product/VERSION').read_text().strip() + '+' + short
          with zipfile.ZipFile(wheel) as archive:
              [name] = [n for n in archive.namelist() if n.endswith('.dist-info/METADATA')]
              metadata = email.message_from_bytes(archive.read(name))
          if metadata['Name'].replace('_', '-') != 'kumo-engine' or metadata['Version'] != expected:
              raise SystemExit('Wheel does not identify the selected product revision')
          (root / 'build.json').write_text(json.dumps(dict(revision=revision, tree=tree,
              version=expected, wheel_sha256=hashlib.sha256(wheel.read_bytes()).hexdigest(),
              harness=os.environ['GITHUB_SHA']), indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: always()
        with:
          name: nightly-wheel
          path: ${{ runner.temp }}/nightly-wheel
          if-no-files-found: error
          compression-level: 0
  gpu:
    needs: build
    runs-on: ${{ vars.KUMO_ENGINE_NIGHTLY_RTX_RUNNER }}
    strategy:
      fail-fast: false
      matrix:
        shard: [node, other]
    env:
      CUDA_VISIBLE_DEVICES: '0'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: nightly-wheel
          path: ${{ runner.temp }}/nightly-wheel
      - name: Check the admitted metadata before installation
        id: inputs
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['NIGHTLY_ROOT'])
          manifest = root / 'inputs/manifest.json'
          reference = root / 'reference.json'
          for path, key in [(manifest, 'INPUT_SHA256'), (reference, 'REFERENCE_SHA256')]:
              if hashlib.sha256(path.read_bytes()).hexdigest() != os.environ[key]:
                  raise SystemExit('Admitted nightly metadata checksum differs')
          data = json.loads(manifest.read_text())
          profile = data['candidate_dependencies']
          resolved = (manifest.parent / profile).resolve()
          if not resolved.is_relative_to(manifest.parent.resolve()):
              raise SystemExit('Dependency profile escapes the input root')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f'profile={resolved}\nprofile_sha256={data["files"][profile]}\n')
          PY
      - uses: ./.github/actions/engine-gpu-smoke
        with:
          wheel-path: ${{ runner.temp }}/nightly-wheel/*.whl
          install-only: 'true'
          dependency-profile: ${{ steps.inputs.outputs.profile }}
          dependency-profile-sha256: ${{ steps.inputs.outputs.profile_sha256 }}
      - name: Run eight primary fits under the existing GPU lock
        run: |
          set -euo pipefail
          exec 9>"$NIGHTLY_ROOT/gpu-study.lock"
          flock 9
          processes="$(nvidia-smi --query-compute-apps=pid --format=csv,noheader)"
          test -z "$processes"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          out="$RUNNER_TEMP/nightly-result"
          mkdir -p "$out/setup" "$RUNNER_TEMP/nightly-harness"
          cp "$RUNNER_TEMP/nightly-wheel/build.json" "$out/setup/"
          cp "$RUNNER_TEMP/engine-gpu-smoke/"*.json "$out/setup/"
          cp packages/kumo-engine/scripts/nightly_check.py packages/kumo-engine/test/wheel_gpu_smoke.py "$RUNNER_TEMP/nightly-harness/"
          python="$RUNNER_TEMP/engine-smoke-venv/bin/python"
          "$python" -I "$RUNNER_TEMP/nightly-harness/nightly_check.py" run --input-root "$NIGHTLY_ROOT/inputs" --input-sha256 "$INPUT_SHA256" --output-dir "$out" --expected-version "$ENGINE_SMOKE_VERSION" --shard "$SHARD" 2>&1 | tee "$RUNNER_TEMP/nightly-run.log"
          if [[ "$SHARD" = node ]]; then
            "$python" -I -m pip --isolated install --index-url https://pypi.org/simple --target "$RUNNER_TEMP/nightly-test-tools" pytest pytest-subtests
            mkdir -p "$RUNNER_TEMP/nightly-tests"
            cp -R packages/kumo-engine/test "$RUNNER_TEMP/nightly-tests/test"
            cp packages/kumo-engine/README.md "$RUNNER_TEMP/nightly-tests/README.md"
            ENGINE_NIGHTLY_PYTEST_TOOLS="$RUNNER_TEMP/nightly-test-tools" "$python" -I "$RUNNER_TEMP/nightly-tests/test/test_nightly_model_reuse.py" --behavior "$out/behavior"
          fi
      - name: Retain results and failures without full input indexes
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/nightly-result/setup"
          if [[ -f "$RUNNER_TEMP/nightly-run.log" ]]; then cp "$RUNNER_TEMP/nightly-run.log" "$RUNNER_TEMP/nightly-result/run.log"; fi
          for path in "$RUNNER_TEMP/nightly-wheel/build.json" "$RUNNER_TEMP/engine-gpu-smoke/"*.json; do
            if [[ -f "$path" ]]; then cp "$path" "$RUNNER_TEMP/nightly-result/setup/"; fi
          done
          if [[ -f "$NIGHTLY_ROOT/reference.json" ]]; then cp "$NIGHTLY_ROOT/reference.json" "$RUNNER_TEMP/nightly-result/reference.json"; fi
          python - <<'PY'
          import os, tarfile
          from pathlib import Path
          temporary = Path(os.environ['RUNNER_TEMP'])
          root = temporary / 'nightly-result'
          with tarfile.open(temporary / f'nightly-{os.environ["SHARD"]}.tar.gz', 'w:gz', dereference=True) as archive:
              for directory, dirs, names in os.walk(root):
                  directory = Path(directory)
                  dirs[:] = [d for d in dirs if not (directory / d).is_symlink()
                             and not (directory == root and d == 'work')]
                  for name in names:
                      path = directory / name
                      if path.is_file():
                          archive.add(path, arcname=str(path.relative_to(root)), recursive=False)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: always()
        with:
          name: nightly-${{ matrix.shard }}
          path: ${{ runner.temp }}/nightly-${{ matrix.shard }}.tar.gz
          if-no-files-found: error
          compression-level: 0
  required:
    if: always()
    needs: [build, gpu]
    runs-on: ubuntu-22.04
    steps:
      - name: Require both completed shards
        env:
          RESULT: ${{ needs.gpu.result }}
        run: test "$RESULT" = success
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          pattern: nightly-*
          path: ${{ runner.temp }}/nightly-artifacts
      - name: Validate the complete candidate comparison
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/nightly-artifacts"
          python - <<'PY'
          import os, tarfile
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'nightly-artifacts'
          for shard in ('node', 'other'):
              with tarfile.open(root / f'nightly-{shard}/nightly-{shard}.tar.gz') as archive:
                  archive.extractall(root / shard, filter='data')
          PY
          python -I packages/kumo-engine/scripts/nightly_check.py compare --input-root "$root/node/input-metadata" --input-sha256 "$INPUT_SHA256" --results-dir "$root" --reference "$root/node/reference.json" --reference-sha256 "$REFERENCE_SHA256" --output-dir "$RUNNER_TEMP/nightly-summary"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: always()
        with:
          name: nightly-summary
          path: ${{ runner.temp }}/nightly-summary
          if-no-files-found: error
