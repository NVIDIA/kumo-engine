name: Kumo Engine nightly

# Activation and scheduling remain separate from this change.
on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      write_reference:
        description: Explicitly replace the stored reference after review
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read
  id-token: write

concurrency:
  group: engine-nightly
  cancel-in-progress: false

jobs:
  nightly:
    if: github.ref == 'refs/heads/main' && vars.ENGINE_E2E_ENABLED == 'true'
    uses: ./.github/workflows/kumo-engine-e2e.yml
    with:
      scales: '["100M", "1B"]'
      write_reference: ${{ inputs.write_reference }}
