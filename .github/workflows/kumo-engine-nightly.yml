name: Kumo Engine Nightly
on:  # yamllint disable-line rule:truthy
  push:
    branches: [main, 'pull-request/[0-9]+']
    paths:
      - 'packages/kumo-engine/**'
      - 'packages/kumo-core/**'
      - 'packages/kumo-api/**'
      - 'packages/diskgraph/**'
      - '.github/workflows/kumo-engine-nightly.yml'
permissions:
  contents: read
concurrency:
  group: engine-nightly-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/pull-request/') }}
jobs:
  admit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      configuration: ${{ steps.admit.outputs.configuration }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Admit main or a current approved PR copy
        id: admit
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_CONFIGURATION: ${{ vars.KUMO_ENGINE_NIGHTLY_CONFIG }}
        run: python packages/kumo-engine/scripts/nightly_job.py admit
  wheel:
    needs: admit
    if: ${{ startsWith(github.ref, 'refs/heads/pull-request/') || vars.KUMO_ENGINE_NIGHTLY_ENABLED == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '4'
      CARGO_TARGET_DIR: ${{ github.workspace }}/packages/diskgraph/target
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: packages/diskgraph -> target
          shared-key: engine-pr-py312-glibc234-zig017-czb024
          cache-workspace-crates: false
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Prepare the public build tools
        run: |
          export PIP_BUILD_CONSTRAINT="$RUNNER_TEMP/engine-build-constraints.txt"
          printf '%s\n' 'ziglang==0.17.0' > "$PIP_BUILD_CONSTRAINT"
          python -I -m pip --isolated install --index-url https://pypi.org/simple 'pip==25.3' 'ziglang==0.17.0' 'cargo-zigbuild==0.24.0'
          echo "PIP_BUILD_CONSTRAINT=$PIP_BUILD_CONSTRAINT" >> "$GITHUB_ENV"
      - uses: ./.github/actions/build-engine-wheel
        with:
          product: .
          output: ${{ runner.temp }}/nightly-wheel
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: engine-nightly-wheel-${{ github.sha }}
          path: ${{ runner.temp }}/nightly-wheel
          if-no-files-found: error
          compression-level: 0
  gpu:
    name: Sixteen nightly learning cases
    needs: [admit, wheel]
    if: ${{ !cancelled() && needs.wheel.result == 'success' && (startsWith(github.ref, 'refs/heads/pull-request/') || vars.KUMO_ENGINE_NIGHTLY_ENABLED == 'true') }}
    runs-on:
      group: nv-gpu-amd64-rtxpro6000-1gpu
      labels: linux-amd64-gpu-rtxpro6000-latest-1
    environment:
      name: gha-kumo-workflow-tests
      deployment: false
    timeout-minutes: 180
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    env:
      NIGHTLY_CONFIGURATION: ${{ needs.admit.outputs.configuration }}
      CUDA_VISIBLE_DEVICES: '0'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Reserve time for artifact upload
        run: echo "NIGHTLY_DEADLINE=$(( $(date +%s) + 165 * 60 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.11.28'
          enable-cache: false
      - name: Admit main or a current approved PR copy
        env:
          GH_TOKEN: ${{ github.token }}
        run: python packages/kumo-engine/scripts/nightly_job.py admit
      - name: Create the job directory and require free space
        run: |
          python packages/kumo-engine/scripts/nightly_job.py create
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: engine-nightly-wheel-${{ github.sha }}
          path: ${{ env.NIGHTLY_JOB_ROOT }}/wheel
      - name: Prepare the isolated download tool
        run: |
          python -m venv "$NIGHTLY_JOB_ROOT/tools"
          uv --no-config pip install --python "$NIGHTLY_JOB_ROOT/tools/bin/python" --cache-dir "$NIGHTLY_JOB_ROOT/cache" --default-index https://pypi.org/simple boto3
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        id: fixture-credentials
        with:
          role-to-assume: arn:aws:iam::926922431314:role/gha-kumo-workflow-tests
          aws-region: us-west-2
          output-env-credentials: false
          output-credentials: true
          unset-current-credentials: true
      - name: Download immutable inputs and reference
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.fixture-credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.fixture-credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.fixture-credentials.outputs.aws-session-token }}
        run: '"$NIGHTLY_JOB_ROOT/tools/bin/python" -I packages/kumo-engine/scripts/nightly_job.py prepare'
      - name: Resolve the candidate wheel's own requirements
        run: |
          set -euo pipefail
          python -m venv "$NIGHTLY_JOB_ROOT/env"
          mapfile -t wheels < <(find "$NIGHTLY_JOB_ROOT/wheel" -maxdepth 1 -name '*.whl' -type f)
          test "${#wheels[@]}" = 1
          uv --no-config pip install --python "$NIGHTLY_JOB_ROOT/env/bin/python" --cache-dir "$NIGHTLY_JOB_ROOT/cache" --default-index https://pypi.org/simple "${wheels[0]}" 'duckdb>=1.4,<2'
          "$NIGHTLY_JOB_ROOT/env/bin/python" -I -m pip --isolated check
          python - <<'PY'
          import email, hashlib, json, os, shutil, zipfile
          from pathlib import Path
          work = Path(os.environ['NIGHTLY_JOB_ROOT'])
          [wheel] = (work / 'wheel').glob('*.whl')
          with zipfile.ZipFile(wheel) as archive:
              [name] = [n for n in archive.namelist() if n.endswith('.dist-info/METADATA')]
              metadata = email.message_from_bytes(archive.read(name))
          evidence = Path(os.environ['NIGHTLY_EVIDENCE_ROOT'])
          setup = evidence / 'setup'
          setup.mkdir()
          shutil.copyfile(work / 'wheel/build.json', setup / 'build.json')
          digest = hashlib.file_digest(wheel.open('rb'), 'sha256').hexdigest()
          (setup / 'wheel.json').write_text(json.dumps(dict(sha256=digest, version=metadata['Version'])))
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write(f'ENGINE_NIGHTLY_WHEEL={wheel}\nENGINE_NIGHTLY_VERSION={metadata["Version"]}\n')
          PY
      - name: Run sixteen cases
        run: |
          set -euo pipefail
          remaining=$(( NIGHTLY_DEADLINE - $(date +%s) ))
          test "$remaining" -gt 0
          cp packages/kumo-engine/scripts/nightly_check.py "$NIGHTLY_JOB_ROOT/nightly_check.py"
          cp packages/kumo-engine/test/wheel_gpu_smoke.py "$NIGHTLY_JOB_ROOT/wheel_gpu_smoke.py"
          cd "$NIGHTLY_JOB_ROOT"
          timeout --signal=TERM --kill-after=30s "${remaining}s" "$NIGHTLY_JOB_ROOT/env/bin/python" -I "$NIGHTLY_JOB_ROOT/nightly_check.py" \
            --input-root "$NIGHTLY_JOB_ROOT/inputs" --input-sha256 "$NIGHTLY_MANIFEST_SHA256" \
            --reference "$NIGHTLY_JOB_ROOT/reference.json" --reference-sha256 "$NIGHTLY_REFERENCE_SHA256" \
            --policy "$NIGHTLY_JOB_ROOT/policy.json" --policy-sha256 "$NIGHTLY_POLICY_SHA256" \
            --wheel "$ENGINE_NIGHTLY_WHEEL" --expected-version "$ENGINE_NIGHTLY_VERSION" \
            --scratch "$NIGHTLY_JOB_ROOT/scratch" --output-dir "$NIGHTLY_EVIDENCE_ROOT" \
            2>&1 | tee "$NIGHTLY_JOB_ROOT/run.log"
      - name: Stage the native log
        if: always() && env.NIGHTLY_JOB_ROOT != ''
        run: |
          if [[ -f "$NIGHTLY_JOB_ROOT/run.log" ]]; then
            cp "$NIGHTLY_JOB_ROOT/run.log" "$NIGHTLY_EVIDENCE_ROOT/run.log"
          fi
      - name: Retain results before cleanup
        id: evidence
        if: always() && env.NIGHTLY_EVIDENCE_ROOT != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: engine-nightly-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.NIGHTLY_EVIDENCE_ROOT }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Remove this job's temporary work
        if: always()
        env:
          NIGHTLY_EVIDENCE_UPLOADED: ${{ steps.evidence.outcome == 'success' && 'true' || 'false' }}
        run: python packages/kumo-engine/scripts/nightly_job.py cleanup
