name: Kumo Base Root User Image

on:  # yamllint disable-line rule:truthy
  # Only trigger manually via the "Run workflow" button in the Actions tab
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to build and publish'
        required: false
        default: 'base-root-314-cu130-torch2120-ubuntu22'
        type: string
# on:  # yamllint disable-line rule:truthy
#  pull_request:
#  workflow_dispatch:
#  schedule:
#    - cron: "*/15 * * * *"  # Every 15min

permissions:
  contents: read
  id-token: write

env:
  REGISTRY_USER: kumo+kumo_internal
  IMAGE_REGISTRY: quay.io
  REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
  ECR_IMAGE_REGISTRY: 926922431314.dkr.ecr.us-west-2.amazonaws.com

jobs:
  build:
    environment: gha-kumo-base-image-publish
    name: Build Kumo docker base image
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be   #  v1.3.1

      - name: Install fuse-overlayfs (upstream)
        run: |
          sudo apt -y update
          sudo apt-get install -y fuse-overlayfs
          # apt's 1.7.1 (2021) has rmdir/ENOTEMPTY races on heavy pip uninstalls; pin upstream v1.16.
          sudo curl -fL \
            "https://github.com/containers/fuse-overlayfs/releases/download/v1.16/fuse-overlayfs-x86_64" \
            -o /usr/bin/fuse-overlayfs
          sudo chmod +x /usr/bin/fuse-overlayfs
          fuse-overlayfs --version
          mkdir -vp ~/.config/containers
          printf "[storage]\ndriver=\"overlay\"\n[storage.options]\nmount_program=\"/usr/bin/fuse-overlayfs\"\n" > ~/.config/containers/storage.conf
          cat ~/.config/containers/storage.conf

      - name: Log in to Quay Registry
        uses: redhat-actions/podman-login@4934294ad0449894bcd1e9f191899d7292469603   #  v1.7
        with:
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}
          registry: ${{ env.IMAGE_REGISTRY }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::926922431314:role/gha-kumo-base-image-publish
          aws-region: us-west-2

      - name: Log in to AWS ECR
        shell: bash
        run: |
          aws ecr get-login-password --region us-west-2 \
            | podman login --username AWS --password-stdin "$ECR_IMAGE_REGISTRY"

      - name: Build Image
        id: build-image
        uses: redhat-actions/buildah-build@7a95fa7ee0f02d552a32753e7414641a04307056   #  v2.17
        with:
          image: kumo
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          token: ${{ secrets.GITHUB_TOKEN }}
          # CUDA 13 / cu130 is the required GPU base (host driver >=580).
          tags: ${{ inputs.image_tag || 'base-root-314-cu130-torch2120-ubuntu22' }}
          layers: true
          context: ./docker
          containerfiles: |
            ./docker/Dockerfile.base.rootuser
          build-args: |
            git_personal_token=${{ secrets.GITHUB_TOKEN }}

      - name: Validate Image
        id: validate-image
        run: |
          podman run --name base_test \
            ${{ steps.build-image.outputs.image }}:${{ inputs.image_tag || 'base-root-314-cu130-torch2120-ubuntu22' }} \
            python3 -c "import jupyter"
          echo "CONTAINER_RETURN=$(podman inspect base_test --format='{{.State.ExitCode}}')" >> $GITHUB_OUTPUT

      - name: Push To AWS ECR
        id: push-to-ecr
        uses: redhat-actions/push-to-registry@5ed88d269cf581ea9ef6dd6806d01562096bee9c   #  v2.8
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: ${{ env.ECR_IMAGE_REGISTRY }}/kumo

      - name: Print Image Url
        run: |
          echo "Image pushed to AWS ECR: ${{ steps.push-to-ecr.outputs.registry-paths }}"
