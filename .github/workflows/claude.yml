# Required secret: ANTHROPIC_API_KEY (an NVIDIA Inference Hub key).
# Required variables: ANTHROPIC_BASE_URL (e.g. https://inference-api.nvidia.com)
# and CLAUDE_MODEL (a gateway model slug).
name: Claude Code

"on":
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
  # Automatic UI review: fires once when a PR is *opened* against a UI file
  # (types is restricted to `opened`, so later commits/`synchronize` do NOT
  # re-trigger it). Handled by the `auto-review-ui` job below; the review-ui
  # skill itself filters to the reviewable ui/src and ui/tests paths.
  # On demand afterwards: comment `/review-ui` on the PR to re-run it (handled
  # via the `issue_comment` trigger above, also by the `auto-review-ui` job).
  pull_request:
    types: [opened]
    paths:
      - "ui/**"

# Default token scope; each job declares its required permissions.
permissions:
  contents: read

jobs:
  claude:
    # Trusted @claude requests run independently of /review-ui requests.
    if: |
      (github.event_name == 'issue_comment' &&
       contains(github.event.comment.body, '@claude') &&
       contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
       contains(github.event.comment.body, '@claude') &&
       contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' &&
       contains(github.event.review.body, '@claude') &&
       contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' &&
       (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
       contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        # The LiteLLM-based Anthropic-compatible proxy rejects context_management and cache_control scope fields.
        # Disable other Anthropic endpoint calls as well.
        env:
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
          CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS: "1"
          DISABLE_PROMPT_CACHING: "1"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--model \"${{ vars.CLAUDE_MODEL }}\""

  # UI review. Runs automatically once when a PR is opened, and on demand
  # whenever someone comments `/review-ui` on the PR. Runs the /review-ui skill
  # in --dry-run mode, posts findings as a sticky comment, and fails the check
  # only on [HIGH] violations. [MEDIUM] is advisory.
  auto-review-ui:
    # Automatic reviews require same-repo PRs; forks receive no secrets.
    # On-demand reviews require a trusted comment author.
    if: |
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '/review-ui') &&
       contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    # One in-flight review per PR; a newer trigger cancels the stale run so a
    # burst of comments cannot stack up concurrent reviews.
    concurrency:
      group: ui-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Minimal scopes: pull-requests: write only posts the sticky comment.
    # Keep permissions tight because this job reads untrusted PR content.
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
      FINDINGS_FILE: ui-review-findings.md
      COMMENT_FILE: ui-review-comment.md
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # Resolve the PR head commit being reviewed. The auto path only fires on
      # `opened`, so the sticky verdict can outlive the commit it graded — stamp
      # the SHA into every comment so a stale verdict is obvious after new pushes.
      # `pull_request` events carry head.sha directly; the `/review-ui` comment
      # path does not, so fall back to querying the PR head via gh.
      - name: Resolve reviewed commit SHA
        id: sha
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          SHA="$EVENT_SHA"
          if [[ -z "$SHA" ]]; then
            SHA=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid -q .headRefOid)
          fi
          echo "head_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "commit_md=[\`${SHA:0:7}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${SHA})" >> "$GITHUB_OUTPUT"

      # Immediate signal in the PR conversation that the review has started.
      # Uses the same sticky header as the final result, so the result comment
      # overwrites this one when the review finishes (~a few minutes).
      - name: Post "review started" comment
        uses: marocchino/sticky-pull-request-comment@70d2764d1a7d5d9560b100cbea0077fc8f633987 # v3.0.2
        with:
          header: ui-review
          number: ${{ env.PR_NUMBER }}
          message: |
            ## UI Review (`/review-ui`)

            🔄 Running automated UI review on commit ${{ steps.sha.outputs.commit_md }}… results will replace this comment shortly.

            <sub>[View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})</sub>

      - name: Run /review-ui (dry-run)
        id: review
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        # The LiteLLM-based Anthropic-compatible proxy rejects context_management and cache_control scope fields.
        # Disable other Anthropic endpoint calls as well.
        env:
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
          CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS: "1"
          DISABLE_PROMPT_CACHING: "1"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          claude_args: "--model \"${{ vars.CLAUDE_MODEL }}\" --max-turns 60"
          prompt: |
            Run /review-ui ${{ env.PR_NUMBER }} --dry-run

            HEADLESS CI MODE:
            - This is an automated dry-run. Do NOT post any review or comment to
              GitHub — this workflow owns the PR comment. Skip Step 4 of the skill.
            - Execute the skill's analysis (Steps 0-3) and print every finding to
              stdout in the documented format, one finding per line:
                [SEVERITY] **Rule Name** (file:line) explanation
            - ALSO write the exact same findings, one per line, to the file
              `${{ env.FINDINGS_FILE }}` at the repository root. Each line must
              begin with `[HIGH]` or `[MEDIUM]` so the workflow can grade them.
            - If there are zero violations, write the single line
              `No violations found.` to `${{ env.FINDINGS_FILE }}`.
            - Do not modify any source files.

      - name: Grade findings and build comment
        id: grade
        if: always()
        shell: bash
        run: |
          set -uo pipefail

          # Resolve the commit this review actually graded so the sticky comment
          # is not ambiguous after later pushes (the auto path only fires on
          # `opened`). On `pull_request` the PR head SHA is on the event; on the
          # `/review-ui` comment trigger it isn't, so fall back to the PR's
          # current head via the API, then to github.sha.
          REVIEWED_SHA="${{ github.event.pull_request.head.sha }}"
          if [[ -z "$REVIEWED_SHA" ]]; then
            REVIEWED_SHA="$(gh pr view "$PR_NUMBER" --json headRefOid -q .headRefOid 2>/dev/null || true)"
          fi
          REVIEWED_SHA="${REVIEWED_SHA:-${{ github.sha }}}"
          COMMIT_LINE="<sub>Reviewed commit [\`${REVIEWED_SHA:0:7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${REVIEWED_SHA})</sub>"

          # Fail closed: if the review step itself did not succeed (error,
          # timeout, cancellation), a missing findings file does NOT mean
          # "no violations" — we simply have no result to grade. Post an
          # errored comment and mark the step so the check fails, rather than
          # silently passing green.
          REVIEW_OUTCOME="${{ steps.review.outcome }}"
          if [[ "$REVIEW_OUTCOME" != "success" ]]; then
            echo "::error::review-ui step did not succeed (outcome=$REVIEW_OUTCOME); cannot grade findings."
            echo "review_failed=true" >> "$GITHUB_OUTPUT"
            echo "high_count=0" >> "$GITHUB_OUTPUT"
            echo "medium_count=0" >> "$GITHUB_OUTPUT"
            {
              echo "## UI Review (\`/review-ui\`)"
              echo ""
              echo "⚠️ **The review did not complete** (step outcome: \`$REVIEW_OUTCOME\`)."
              echo ""
              echo "This is **not** a clean pass — the review-ui step errored, timed out, or was cancelled before producing findings. Re-run by commenting \`/review-ui\` on this PR, or inspect the run for details."
              echo ""
              echo "<sub>[View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})</sub>"
              echo ""
              echo "$COMMIT_LINE"
            } > "$COMMENT_FILE"
            exit 0
          fi

          # Step succeeded but produced no findings file. The skill is told to
          # write `No violations found.` for a clean run, so a missing file here
          # means the model never emitted its result — we cannot tell "clean"
          # from "never graded". Fail closed rather than assume no violations.
          if [[ ! -f "$FINDINGS_FILE" ]]; then
            echo "::error::review-ui succeeded but wrote no findings file; cannot distinguish a clean pass from a lost result."
            echo "review_failed=true" >> "$GITHUB_OUTPUT"
            echo "high_count=0" >> "$GITHUB_OUTPUT"
            echo "medium_count=0" >> "$GITHUB_OUTPUT"
            {
              echo "## UI Review (\`/review-ui\`)"
              echo ""
              echo "⚠️ **The review did not produce a findings file** despite completing."
              echo ""
              echo "This is **not** a clean pass — no findings were emitted to grade. Re-run by commenting \`/review-ui\` on this PR, or inspect the run for details."
              echo ""
              echo "<sub>Reviewed commit: ${{ steps.sha.outputs.commit_md }} · [View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})</sub>"
            } > "$COMMENT_FILE"
            exit 0
          fi

          HIGH_COUNT=$(grep -cE '^\s*\[HIGH\]' "$FINDINGS_FILE" || true)
          MEDIUM_COUNT=$(grep -cE '^\s*\[MEDIUM\]' "$FINDINGS_FILE" || true)
          HIGH_COUNT=${HIGH_COUNT:-0}
          MEDIUM_COUNT=${MEDIUM_COUNT:-0}

          echo "high_count=$HIGH_COUNT" >> "$GITHUB_OUTPUT"
          echo "medium_count=$MEDIUM_COUNT" >> "$GITHUB_OUTPUT"
          echo "Graded review-ui findings: HIGH=$HIGH_COUNT MEDIUM=$MEDIUM_COUNT"

          {
            echo "## UI Review (\`/review-ui\`)"
            echo ""
            if [[ "$HIGH_COUNT" -gt 0 ]]; then
              echo "❌ **$HIGH_COUNT [HIGH]** violation(s) — must be fixed before merge."
            else
              echo "✅ No **[HIGH]** violations."
            fi
            if [[ "$MEDIUM_COUNT" -gt 0 ]]; then
              echo ""
              echo "ℹ️ **$MEDIUM_COUNT [MEDIUM]** violation(s) — informational, do not block merge."
            fi
            echo ""
            echo "<details><summary>Findings</summary>"
            echo ""
            echo '```'
            cat "$FINDINGS_FILE"
            echo '```'
            echo ""
            echo "</details>"
            echo ""
            echo "_[HIGH] fails this check; [MEDIUM] is advisory. Per the UI Catalog + Presentation Migration Plan._"
            echo ""
            echo "$COMMIT_LINE"
          } > "$COMMENT_FILE"

      - name: Post sticky review comment
        if: always()
        uses: marocchino/sticky-pull-request-comment@70d2764d1a7d5d9560b100cbea0077fc8f633987 # v3.0.2
        with:
          header: ui-review
          number: ${{ env.PR_NUMBER }}
          path: ${{ env.COMMENT_FILE }}

      - name: Fail on review error or HIGH violations
        if: always() && (steps.grade.outputs.review_failed == 'true' || steps.grade.outputs.high_count != '0')
        run: |
          if [[ "${{ steps.grade.outputs.review_failed }}" == "true" ]]; then
            echo "::error::review-ui step did not complete; failing the check (no findings to grade)."
          else
            echo "::error::review-ui found ${{ steps.grade.outputs.high_count }} [HIGH] violation(s). See the PR comment."
          fi
          exit 1
