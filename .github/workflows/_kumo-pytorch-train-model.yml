name: Package model training
on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      tier:
        description: Dataset tier selected by the suite planner.
        type: string
        required: true
      matrix:
        description: Model flows and training seeds for this tier.
        type: string
        required: true

permissions: {contents: read}

jobs:
  train:
    name: ${{ inputs.tier == 't2a' && 'H&M Small' || 'H&M Medium' }} · ${{ matrix.flow }} (seed ${{ matrix.seed }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.tier == 't2a' && 30 || 75 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with: {persist-credentials: false}
      - uses: ./.github/actions/kumo-pytorch-setup
        with: {diskgraph-wheel-artifact: diskgraph-wheel}
      - name: Train, persist, infer and serve
        shell: bash
        working-directory: packages/experimental/kumo-pytorch
        env:
          KUMO_PYTORCH_DIAGNOSTICS: ${{ runner.temp }}/pytorch-${{ github.run_id }}-${{ github.run_attempt }}
          TIER: ${{ inputs.tier }}
          FLOW: ${{ matrix.flow }}
          SEED: ${{ matrix.seed }}
        run: |
          python -m tests.e2e.ci_command "$KUMO_PYTORCH_DIAGNOSTICS/training.log" \
            python -m tests.e2e.runs "$TIER" "$FLOW" "$SEED" --e2e-dir "$RUNNER_TEMP/e2e"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: kumo-pytorch-${{ inputs.tier }}-${{ github.run_attempt }}-${{ matrix.flow }}-seed${{ matrix.seed }}
          path: |
            ${{ runner.temp }}/e2e/${{ inputs.tier }}/${{ matrix.flow }}-seed${{ matrix.seed }}/
            !${{ runner.temp }}/e2e/${{ inputs.tier }}/**/index/**
          retention-days: 14
      - uses: ./.github/actions/kumo-pytorch-results
        if: always()
        with:
          name: ${{ inputs.tier }}-log-${{ matrix.flow }}-${{ matrix.seed }}
