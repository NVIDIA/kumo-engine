name: Auto UI client code gen using Orval

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
  # Schema analysis waits for approval of the exact commit by copy-pr-bot.
  push:
    branches: ["pull-request/[0-9]+"]
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.ref }}-${{ startsWith(github.ref, 'refs/heads/pull-request/') && 'approved' || github.run_number }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/pull-request/') }}

permissions:
  contents: read

jobs:
  check-openapi-changes:
    name: Check OpenAPI Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: github.event_name == 'push'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout the approved commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the copied PR and find its merge base
        id: pr
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            const { setCopiedPullRequestOutputs } = require('./.github/scripts/copied-pr.cjs');
            await setCopiedPullRequestOutputs({ github, context, core });

      - name: Check for backend/API changes
        id: backend-changes
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47
        with:
          base_sha: ${{ steps.pr.outputs.base }}
          files: |
            .github/actions/setup/**
            .github/scripts/copied-pr.cjs
            .github/scripts/openapi-pr.cjs
            .github/workflows/ui-client-code-generate.yml
            rest/app.py
            rest/config/**
            rest/main.py
            rest/routers/**
            rest/scripts/download_schema.py
            rest/utils/routers.py
            ui/src/gen/spec/**

      - name: Set up backend packages
        if: steps.backend-changes.outputs.any_changed == 'true'
        uses: ./.github/actions/setup
        with:
          python-version: "3.14"
          github_token: ${{ github.token }}
          ref: ${{ steps.pr.outputs.head }}

      - name: Download openapi.json files
        if: steps.backend-changes.outputs.any_changed == 'true'
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE" \
            DEPLOY_STAGE=dev_local python -m rest.scripts.download_schema
          jq -e '.paths | length > 0' ui/src/gen/spec/v0_openapi.json
          jq -e '.paths | length > 0' ui/src/gen/spec/v1_openapi.json

      - name: Set up Node.js
        if: steps.backend-changes.outputs.any_changed == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"

      - name: Install UI dependencies
        if: steps.backend-changes.outputs.any_changed == 'true'
        run: |
          cd ui
          npm run install:catalog
          npm ci --ignore-scripts

      - name: Run linting and prettier
        if: steps.backend-changes.outputs.any_changed == 'true'
        run: |
          cd ui
          npm run lint-format-codegen --subdir=spec

      - name: Check for schema changes
        if: steps.backend-changes.outputs.any_changed == 'true'
        id: openapi-changes
        run: |
          if git diff --quiet --exit-code -- ui/src/gen/spec/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --binary -- ui/src/gen/spec/ > "$RUNNER_TEMP/openapi-schema.patch"
          fi

      - name: Upload the schema patch
        if: steps.openapi-changes.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openapi-schema-patch
          path: ${{ runner.temp }}/openapi-schema.patch
          if-no-files-found: error
          retention-days: 7

      - name: Summarize schema analysis
        env:
          SCHEMA_CHANGED: ${{ steps.openapi-changes.outputs.changed }}
          API_CHANGED: ${{ steps.backend-changes.outputs.any_changed }}
        run: |
          if [[ "$SCHEMA_CHANGED" == true ]]; then
            echo 'OpenAPI schemas need regeneration. Download the schema patch from this run.' >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$API_CHANGED" == true ]]; then
            echo 'OpenAPI schemas are up to date.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No OpenAPI-related files changed.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Analyzed commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Update the OpenAPI PR comment
        env:
          SCHEMA_CHANGED: ${{ steps.openapi-changes.outputs.changed }}
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            const { reportOpenAPI } = require('./.github/scripts/openapi-pr.cjs');
            await reportOpenAPI({ github, context, changed: process.env.SCHEMA_CHANGED === 'true' });

  trigger-codegen:
    name: Trigger UI Codegen
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
      packages: read
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/trigger-ui-codegen')
    steps:
      # Capture the PR HEAD SHA as the very first step to minimise the TOCTOU
      # window between comment submission and checkout. All subsequent steps use
      # this pinned SHA so that a race-condition push to the PR branch cannot
      # silently change which code gets checked out and executed.
      - name: Get PR details
        id: pr-details
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('ref', pr.data.head.ref);
            core.setOutput('sha', pr.data.head.sha);

      - name: Verify commenter has write access
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor,
            });
            if (!['admin', 'write'].includes(perm.permission)) {
              core.setFailed(`User ${context.actor} does not have write access (${perm.permission})`);
            }

      - name: Verify PR author has write access
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            const prAuthor = pr.data.user.login;
            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: prAuthor,
            });
            if (!['admin', 'write'].includes(perm.permission)) {
              core.setFailed(`PR author ${prAuthor} does not have write access (${perm.permission}). Refusing to execute untrusted code.`);
            }

      - name: Post starting comment
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            });

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🔄 **UI client code generation started**\n\nView progress: ${context.payload.repository.html_url}/actions/runs/${context.runId}`
            });

      - name: Checkout base branch (trusted local actions)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          token: ${{ secrets.KUMO_GITHUB_BOT_TOKEN }}

      - name: Set up Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: "3.14"
          activate-environment: true

      - name: Set up backend packages
        uses: ./.github/actions/setup
        with:
          python-version: "3.14"
          github_token: ${{ secrets.KUMO_GITHUB_BOT_TOKEN }}
          ref: ${{ steps.pr-details.outputs.sha }}

      # Must run AFTER "Set up backend packages": that step's setup action
      # re-checks-out the repo into the workspace root with clean=true, which
      # deletes any untracked sibling dir (including pr-branch/). Checking out
      # pr-branch here keeps it intact for the steps below.
      - name: Checkout PR branch into subdirectory
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ steps.pr-details.outputs.sha }}
          # Shallow checkout to avoid a full clone of git history
          fetch-depth: 1
          path: pr-branch
          token: ${{ secrets.KUMO_GITHUB_BOT_TOKEN }}

      - name: Download openapi.json files
        run: |
          cd pr-branch
          PYTHONPATH="$GITHUB_WORKSPACE/pr-branch" \
            DEPLOY_STAGE=dev_local python -m rest.scripts.download_schema
          jq -e '.paths | length > 0' ui/src/gen/spec/v0_openapi.json
          jq -e '.paths | length > 0' ui/src/gen/spec/v1_openapi.json

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"

      - name: Install UI dependencies
        run: |
          cd pr-branch/ui
          npm run install:catalog
          npm ci --ignore-scripts

      - name: Run linting and prettier
        run: |
          cd pr-branch/ui
          npm run lint-format-codegen --subdir=spec

      - name: Check for Spec changes
        id: openapi-changes
        run: |
          if git -C pr-branch diff --quiet --exit-code ui/src/gen/spec/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Generate orval schema/types/api
        if: steps.openapi-changes.outputs.changed == 'true'
        run: |
          cd pr-branch/ui
          npx orval
          npm run inject-zod-schemas
          npm run lint-format-codegen

      - name: Configure Git
        if: steps.openapi-changes.outputs.changed == 'true'
        run: |
          git -C pr-branch config user.name "kumo-github-bot"
          git -C pr-branch config user.email "github-actions@github.com"

      - name: Revert/Remove unrelated changes
        if: steps.openapi-changes.outputs.changed == 'true'
        run: |
          cd pr-branch
          # Stash only ui/src/gen/ changes
          git add ui/src/gen/
          git stash push -m "Preserve ui/src/gen changes" ui/src/gen/

          # Reset all other changes (both staged and unstaged)
          git reset --hard HEAD

          # Clean all untracked files and directories
          git clean -fdx

          # Restore the ui/src/gen/ changes
          git stash pop

      - name: Commit and push changes
        if: steps.openapi-changes.outputs.changed == 'true'
        id: commit-changes
        run: |
          cd pr-branch
          git add ui/src/gen/
          git commit -m "Regenerated UI client code based on OpenAPI spec changes"
          git pull --rebase origin ${{ steps.pr-details.outputs.ref }}
          git push origin HEAD:${{ steps.pr-details.outputs.ref }}

  codegen:
    name: Manual Codegen (workflow_dispatch)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      packages: read
    if: github.event_name == 'workflow_dispatch'
    outputs:
      spec_changed: ${{steps.openapi-changes.outputs.changed}}
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 40

      - name: Set up Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: "3.14"
          activate-environment: true

      - name: Set up backend packages
        uses: ./.github/actions/setup
        with:
          python-version: "3.14"
          github_token: ${{ secrets.KUMO_GITHUB_BOT_TOKEN }}

      - name: Download openapi.json files
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE" \
            DEPLOY_STAGE=dev_local python -m rest.scripts.download_schema
          jq -e '.paths | length > 0' ui/src/gen/spec/v0_openapi.json
          jq -e '.paths | length > 0' ui/src/gen/spec/v1_openapi.json

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"

      - name: Install UI dependencies
        run: |
          cd ui
          npm run install:catalog
          npm ci

      - name: Run linting and prettier
        run: |
          cd ui
          npm run lint-format-codegen --subdir=spec

      - name: Check for Spec changes
        id: openapi-changes
        run: |
          if git diff --quiet --exit-code ui/src/gen/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Generate orval schema/types/api
        if: steps.openapi-changes.outputs.changed == 'true'
        run: |
          cd ui
          npx orval
          npm run inject-zod-schemas
          npm run lint-format-codegen

      - name: Revert/Remove unrelated changes
        if: steps.openapi-changes.outputs.changed == 'true'
        run: |
          # Stash only ui/src/gen/ changes
          git add ui/src/gen/
          git stash push -m "Preserve ui/src/gen changes" ui/src/gen/

          # Reset all other changes (both staged and unstaged)
          git reset --hard HEAD

          # Clean all untracked files and directories
          git clean -fdx

          # Restore the ui/src/gen/ changes
          git stash pop

      - name: Configure Git
        if: steps.openapi-changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Create branch
        if: steps.openapi-changes.outputs.changed == 'true'
        run: |
          BRANCH="openapi-changes-${{ github.run_id }}"
          git checkout -b $BRANCH
          echo "branch_name=$BRANCH" >> $GITHUB_ENV
          git push origin $BRANCH

      - name: Commit changes and Create Pull Request
        if: steps.openapi-changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0  # v8.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Regenerated orval code based on OpenAPI spec files"
          title: "`UI`: Regenerated orval code based on OpenAPI spec files"
          body: |
            This PR was automatically generated because changes were detected in:
            `ui/src/gen/spec/`
          branch: ${{ env.branch_name }}
          base: main
