name: PyTorch Medium model suite
on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      seed_start:
        description: First extra conformance seed batch (default derived from the date)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  suite:
    uses: ./.github/workflows/kumo-pytorch-t2a.yml
    with:
      tier: t2b
      seed_start: ${{ inputs.seed_start }}
