name: PyTorch — Nightly Suite

# The nightly tier: existing package regressions, the end-to-end flows at M,
# conformance on both engines, and AML checks. Not a required check. Pull
# requests run it when they change this workflow, the tiers' configuration,
# shared setup, or the standalone AML testing suite.
on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      seed_start:
        description: First extra conformance seed batch (default derived from the date)
        required: false
  pull_request:
    paths:
      - 'test/kumo_pytorch/**'
      - 'packages/experimental/kumo-pytorch/tests/e2e/tiers.py'
      - 'packages/experimental/kumo-pytorch/tests/e2e/runs.py'
      - '.github/actions/kumo-pytorch-setup/**'
      - '.github/workflows/_kumo-pytorch-aml-checks.yml'
      - '.github/workflows/kumo-pytorch-t2b.yml'

permissions:
  contents: read

concurrency:
  # Different candidate revisions can validate without cancelling older training
  # evidence. Repeated runs of one revision and updates to one PR still group.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash
    working-directory: packages/experimental/kumo-pytorch

jobs:
  dataset-tooling:
    name: Setup / Dataset Tools
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: '3.12'
      - name: Test acquisition without AWS or service fixtures
        run: |
          uvx --python 3.12 --from pytest==8.4.2 python -m pytest \
            -c test/kumo_pytorch/pytest.ini --confcutdir=test/kumo_pytorch \
            test/kumo_pytorch/checks -q --junitxml="$RUNNER_TEMP/tooling.xml"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: kumo-pytorch-tooling-tests
          path: ${{ runner.temp }}/tooling.xml
          retention-days: 14

  diskgraph-wheel:
    name: Setup / DiskGraph Build
    uses: ./.github/workflows/_diskgraph-wheel.yml

  benchmark-memory:
    name: Profiler / Host Memory
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Validate Linux file-cache conditioning
        run: |
          mkdir -p "$RUNNER_TEMP/benchmark-memory"
          docker run --rm --network none --read-only --cgroupns private \
            --pids-limit 64 --memory 256m --cap-add SYS_ADMIN \
            --security-opt apparmor=unconfined \
            -e PYTHONDONTWRITEBYTECODE=1 -e PYTHONPATH=/app \
            --mount "type=bind,src=$GITHUB_WORKSPACE/test/kumo_pytorch/benchmarking,dst=/app/test/kumo_pytorch/benchmarking,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/benchmark-memory,dst=/out" \
            --mount type=volume,dst=/scratch \
            python:3.12-slim-bookworm python -c \
            'from test.kumo_pytorch.benchmarking.validate_cache import main; raise SystemExit(main(["--workdir", "/scratch", "--output", "/out/cache-validation.json"]))'
      - name: Validate complete workers and cgroup cleanup
        run: |
          docker run --rm --network none --read-only --cgroupns private \
            --pids-limit 64 --memory 256m --cap-add SYS_ADMIN \
            --security-opt apparmor=unconfined \
            -e PYTHONDONTWRITEBYTECODE=1 -e PYTHONPATH=/app \
            --mount "type=bind,src=$GITHUB_WORKSPACE/test/kumo_pytorch,dst=/app/test/kumo_pytorch,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/benchmark-memory,dst=/out" \
            python:3.12-slim-bookworm python -c \
            'import os,subprocess; from pathlib import Path; subprocess.run(["mount","-o","remount,rw","/sys/fs/cgroup"],check=True); root=Path("/sys/fs/cgroup"); control=root/"supervisor"; control.mkdir(); (control/"cgroup.procs").write_text(str(os.getpid())); (root/"cgroup.subtree_control").write_text("+memory"); from test.kumo_pytorch.benchmarking.validate_isolation import main; raise SystemExit(main(["--output","/out/isolation"]))'
      - name: Show Linux collector validation
        if: ${{ always() }}
        run: |
          python - <<'PYTHON' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          for path in sorted((Path(os.environ['RUNNER_TEMP']) / 'benchmark-memory').rglob('*-validation.json')):
              result = json.loads(path.read_text())
              if 'status' not in result:
                  continue
              print(f'### {path.stem}')
              print(f"Status: **{result['status']}**. Kernel: `{result['kernel']}`.")
              for check in result.get('checks', []):
                  print(f'- {check}')
          PYTHON
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: kumo-pytorch-benchmark-memory
          path: ${{ runner.temp }}/benchmark-memory
          retention-days: 14

  aml-training-acceptance:
    name: Training / AML / Acceptance
    needs: diskgraph-wheel
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment:
      name: gha-kumo-workflow-tests
      deployment: false
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/kumo-pytorch-setup
        with:
          diskgraph-wheel-artifact: diskgraph-wheel
          torch-extra: cpu
      - name: Read pinned AML inputs with the Engine test role
        id: aml-credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::926922431314:role/gha-kumo-workflow-tests
          aws-region: us-west-2
          output-env-credentials: false
          output-credentials: true
          unset-current-credentials: true
      - name: Download and verify pinned sources and anchors
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aml-credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aml-credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aml-credentials.outputs.aws-session-token }}
        run: |
          python -m test.kumo_pytorch.data fetch --dataset hi-small \
            --data-dir "$RUNNER_TEMP/aml-training-data" --report "$RUNNER_TEMP/aml-training-acquisition.json"
      - name: Train all five AML model-workload combinations for 100 CPU updates and repeat exactly
        run: |
          python -m test.kumo_pytorch.training_acceptance \
            --data-dir "$RUNNER_TEMP/aml-training-data" --output "$RUNNER_TEMP/aml-training" \
            --anchors-per-split 32 --batch-size 4
      - name: Show training acceptance results
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/aml-training/report.md" ]; then
            cat "$RUNNER_TEMP/aml-training/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain loss curves and per-parameter update reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: kumo-pytorch-aml-training-acceptance
          path: |
            ${{ runner.temp }}/aml-training-acquisition.json
            ${{ runner.temp }}/aml-training/report.json
            ${{ runner.temp }}/aml-training/report.md
            ${{ runner.temp }}/aml-training/*/report.json
            ${{ runner.temp }}/aml-training/*/contract.json
            ${{ runner.temp }}/aml-training/*/repeat-*/report.json
            ${{ runner.temp }}/aml-training/*/repeat-*/loss-curve.csv
          retention-days: 14

  aml-fitting-memory:
    name: >-
      Memory / ${{ fromJSON('{"account-involvement-next24h-graphsage":"AML Involvement / GraphSAGE","account-involvement-next24h-combined":"AML Involvement / Fusion","account-involvement-next24h-nuformer":"AML Involvement / nuFormer","masked-value-pretrain-pragma":"AML Masked-Value / PRAGMA","next-token-pretrain-nuformer":"AML Next-Token / nuFormer"}')[matrix.case] || matrix.case }} / Repeat ${{ fromJSON('[1,2,3]')[matrix.repeat] }}
    needs: [diskgraph-wheel, plan]
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(needs.plan.outputs.aml_cases) }}
        repeat: [0, 1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment:
      name: gha-kumo-workflow-tests
      deployment: false
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: .
    env:
      AML_CASE: ${{ matrix.case }}
      AML_REPEAT: ${{ matrix.repeat }}
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      RAYON_NUM_THREADS: '1'
      POLARS_MAX_THREADS: '1'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/kumo-pytorch-setup
        with:
          diskgraph-wheel-artifact: diskgraph-wheel
          torch-extra: cpu
      - name: Read pinned AML inputs with the Engine test role
        id: aml-credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::926922431314:role/gha-kumo-workflow-tests
          aws-region: us-west-2
          output-env-credentials: false
          output-credentials: true
          unset-current-credentials: true
      - name: Download and verify pinned sources and anchors
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aml-credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aml-credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aml-credentials.outputs.aws-session-token }}
        run: |
          python -m test.kumo_pytorch.data fetch --dataset hi-small \
            --data-dir "$RUNNER_TEMP/aml-fitting-data" --report "$RUNNER_TEMP/aml-fitting-acquisition.json"
      - name: Compare fresh fitting at 25k and 400k training anchors
        run: |
          python -m test.kumo_pytorch.aml_fitting_memory \
            --case "$AML_CASE" --data-dir "$RUNNER_TEMP/aml-fitting-data" --output "$RUNNER_TEMP/aml-fitting-memory" \
            --repetitions 3 --repeat "$AML_REPEAT" --memory-method sampled \
            --memory-interval 0.05 --worker-timeout 3600
      - name: Show fitting-memory results
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/aml-fitting-memory/report.md" ]; then
            cat "$RUNNER_TEMP/aml-fitting-memory/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Collect this repetition's reports without data or indexes
        if: ${{ always() }}
        run: |
          python3 - <<'PYCODE'
          import os, shutil
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          source = root / 'aml-fitting-memory'
          dest = root / 'aml-parallel' / 'fitting' / os.environ['AML_CASE'] / ('repeat-' + os.environ['AML_REPEAT'])
          for pattern in ('report.json', 'report.md', 'inputs/*/spec.json', 'inputs/*/contract.json',
                          'runs/*/report.json', 'runs/*/*.log', 'runs/*/*/report.json', 'runs/*/*/observations.jsonl'):
              for path in source.glob(pattern):
                  target = dest / path.relative_to(source)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(path, target)
          PYCODE
      - name: Retain fitting-memory reports and observations
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: kumo-pytorch-aml-parallel-fitting-${{ matrix.case }}-${{ matrix.repeat }}
          path: |
            ${{ runner.temp }}/aml-parallel/**/report.json
            ${{ runner.temp }}/aml-parallel/**/report.md
            ${{ runner.temp }}/aml-parallel/**/spec.json
            ${{ runner.temp }}/aml-parallel/**/contract.json
            ${{ runner.temp }}/aml-parallel/**/*.log
            ${{ runner.temp }}/aml-parallel/**/observations.jsonl
          if-no-files-found: error
          retention-days: 14

  benchmark-gpu:
    name: Profiler / GPU Metrics
    needs: diskgraph-wheel
    # NVIDIA runners do not accept pull_request jobs. Manual dispatch permits
    # validation of a reviewed internal branch before merging it into main.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on:
      group: nv-gpu-amd64-rtxpro6000-1gpu
      labels: linux-amd64-gpu-rtxpro6000-latest-1
    timeout-minutes: 22
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/kumo-pytorch-setup
        with:
          diskgraph-wheel-artifact: diskgraph-wheel
          torch-extra: cu130
      - name: Install the measurement-only NVML binding
        run: uv pip install nvidia-ml-py==13.615.71
      - name: Validate real GPU measurements
        run: |
          python -m test.kumo_pytorch.benchmarking.validate_gpu \
            --output "$RUNNER_TEMP/benchmark-gpu"
      - name: Run existing CUDA-only package regressions
        if: ${{ !cancelled() }}
        working-directory: packages/experimental/kumo-pytorch
        run: |
          python -m pytest -q --require-imports \
            tests/test_masking.py::test_masking_is_bitwise_equal_on_cpu_and_cuda \
            tests/test_model.py::test_packed_event_encoder_runs_with_cuda_fp16 \
            tests/test_varlen_metadata.py::test_varlen_attention_consumes_the_metadata_directly \
            --junitxml="$RUNNER_TEMP/benchmark-gpu/package-tests.xml"
          python - <<'PY'
          import os, xml.etree.ElementTree as ET
          from pathlib import Path
          report = ET.parse(Path(os.environ['RUNNER_TEMP']) / 'benchmark-gpu/package-tests.xml')
          assert not list(report.iter('skipped')), 'Required CUDA tests skipped on the GPU runner'
          PY
      - name: Install test-only GPU reference dependencies
        if: ${{ !cancelled() }}
        id: gpu-reference-setup
        run: uv pip install -r test/kumo_pytorch/reference_engine/gpu-requirements.txt
      - name: Validate isolated GPU loader timing and fitted-state reuse
        if: ${{ !cancelled() && steps.gpu-reference-setup.outcome == 'success' }}
        env:
          KUMO_GPU_REFERENCE_REQUIRED: '1'
        run: |
          sudo --preserve-env=KUMO_GPU_REFERENCE_REQUIRED -- "$(command -v python)" \
            -m test.kumo_pytorch.benchmarking.cgroup_run \
            --uid "$(id -u)" --gid "$(id -g)" --timeout 300 -- \
            "$(command -v python)" -m pytest -q \
            -c test/kumo_pytorch/pytest.ini --confcutdir=test/kumo_pytorch --required-coverage=gpu \
            test/kumo_pytorch/model_checks/test_benchmark_gpu_reference.py \
            --junitxml="$RUNNER_TEMP/benchmark-gpu/reference-tests.xml"
      - name: Show GPU validation report
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/benchmark-gpu/report.md" ]; then
            cat "$RUNNER_TEMP/benchmark-gpu/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: kumo-pytorch-benchmark-gpu
          path: ${{ runner.temp }}/benchmark-gpu
          retention-days: 14

  benchmark-aml:
    name: >-
      Benchmark / ${{ fromJSON('{"account-involvement-next24h-graphsage":"AML Involvement / GraphSAGE","account-involvement-next24h-combined":"AML Involvement / Fusion","account-involvement-next24h-nuformer":"AML Involvement / nuFormer","masked-value-pretrain-pragma":"AML Masked-Value / PRAGMA","next-token-pretrain-nuformer":"AML Next-Token / nuFormer"}')[matrix.case] || matrix.case }} / ${{ fromJSON('{"training":"Training","index":"Index Reuse","timing-diskgraph":"DiskGraph","timing-polars":"Polars","timing-gpu":"GPU Reference"}')[matrix.mode] || matrix.mode }}
    needs: [diskgraph-wheel, plan]
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    # Each measurement has its own runner; do not contend for one GPU.
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(needs.plan.outputs.aml_cases) }}
        mode: [training, index, timing-diskgraph, timing-polars, timing-gpu]
    runs-on:
      group: nv-gpu-amd64-rtxpro6000-1gpu
      labels: linux-amd64-gpu-rtxpro6000-latest-1
    timeout-minutes: 120
    environment:
      name: gha-kumo-workflow-tests
      deployment: false
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: .
    env:
      AML_CASE: ${{ matrix.case }}
      AML_MODE: ${{ matrix.mode }}
      POLARS_MAX_THREADS: '4'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/kumo-pytorch-setup
        with:
          diskgraph-wheel-artifact: diskgraph-wheel
          torch-extra: cu130
      - name: Install measurement-only NVML binding
        run: uv pip install nvidia-ml-py==13.615.71
      - name: Read private AML inputs with the Engine test role
        id: aml-credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::926922431314:role/gha-kumo-workflow-tests
          aws-region: us-west-2
          output-env-credentials: false
          output-credentials: true
          unset-current-credentials: true
      - name: Download and verify pinned sources and anchors
        id: aml-data
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aml-credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aml-credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aml-credentials.outputs.aws-session-token }}
        run: |
          python -m test.kumo_pytorch.data fetch --dataset hi-small \
            --data-dir "$RUNNER_TEMP/aml-data" --report "$RUNNER_TEMP/aml-acquisition.json"
      - name: Plan the selected campaign
        run: |
          python -m test.kumo_pytorch.nightly benchmark-config \
            --case "$AML_CASE" --mode "$AML_MODE" --data-dir "$RUNNER_TEMP/aml-data" \
            --output "$RUNNER_TEMP/aml-case.json"
      - name: Install test-only Polars reference
        if: matrix.mode == 'timing-polars'
        run: uv pip install polars==2.1.0
      - name: Install test-only GPU reference dependencies
        if: matrix.mode == 'timing-gpu'
        run: uv pip install -r test/kumo_pytorch/reference_engine/gpu-requirements.txt
      - name: Validate Polars timing adapters on tiny sources
        if: matrix.mode == 'timing-polars'
        run: python -m pytest -q test/kumo_pytorch/model_checks/test_benchmark_polars.py
      - name: Run the complete campaign with all repetitions
        run: |
          options=()
          if [[ "$AML_MODE" == index ]]; then options+=(--index-lifecycle); fi
          if [[ "$AML_MODE" == timing-* ]]; then options+=(--measurement-profile timing); fi
          python -m test.kumo_pytorch.benchmarking.suite \
            --config "$RUNNER_TEMP/aml-case.json" \
            --output "$RUNNER_TEMP/aml-parallel/$AML_MODE/$AML_CASE" \
            --isolate-memory --repetitions 3 --epochs 2 --worker-timeout 1800 \
            --gpu-interval 0.1 --memory-method sampled --memory-interval 0.01 "${options[@]}"
      - name: Validate sampled host memory on the GPU host
        if: ${{ always() }}
        run: |
          python - <<'PY'
          import os, subprocess, sys
          subprocess.run([
              'sudo', '--', sys.executable, '-m',
              'test.kumo_pytorch.benchmarking.cgroup_run',
              '--uid', str(os.getuid()), '--gid', str(os.getgid()), '--timeout', '60',
              '--', sys.executable, '-m', 'test.kumo_pytorch.benchmarking.validate_memory',
              '--method', 'sampled', '--output', os.environ['RUNNER_TEMP'] + '/sampled-memory-validation.json',
          ], check=True)
          PY
      - name: Show this campaign's results
        if: ${{ always() }}
        run: |
          report="$RUNNER_TEMP/aml-parallel/$AML_MODE/$AML_CASE/report.md"
          if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: kumo-pytorch-aml-parallel-${{ matrix.mode }}-${{ matrix.case }}
          path: |
            ${{ runner.temp }}/aml-parallel/**
            !${{ runner.temp }}/aml-parallel/**/work/**
            !${{ runner.temp }}/aml-parallel/**/*-fitted-state/**
            !${{ runner.temp }}/aml-parallel/**/shared-index/**
            !${{ runner.temp }}/aml-parallel/**/shared-prepared/**
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: kumo-pytorch-aml-measurement-${{ matrix.mode }}-${{ matrix.case }}
          path: |
            ${{ runner.temp }}/sampled-memory-validation.json
            ${{ runner.temp }}/aml-acquisition.json
          retention-days: 14

  aml-population:
    name: >-
      Population / ${{ fromJSON('{"account-involvement-next24h-graphsage":"AML Involvement / GraphSAGE","account-involvement-next24h-combined":"AML Involvement / Fusion","account-involvement-next24h-nuformer":"AML Involvement / nuFormer","masked-value-pretrain-pragma":"AML Masked-Value / PRAGMA","next-token-pretrain-nuformer":"AML Next-Token / nuFormer"}')[matrix.case] || matrix.case }} / ${{ matrix.mode == 'full' && 'Full' || 'Smoke' }}
    needs: [diskgraph-wheel, plan]
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(needs.plan.outputs.aml_cases) }}
        mode: [smoke, full]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment:
      name: gha-kumo-workflow-tests
      deployment: false
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: .
    env:
      AML_CASE: ${{ matrix.case }}
      AML_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/kumo-pytorch-setup
        with:
          diskgraph-wheel-artifact: diskgraph-wheel
          torch-extra: cpu
      - name: Read private AML inputs with the Engine test role
        id: aml-credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::926922431314:role/gha-kumo-workflow-tests
          aws-region: us-west-2
          output-env-credentials: false
          output-credentials: true
          unset-current-credentials: true
      - name: Download and verify pinned sources and anchors
        id: aml-data
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aml-credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aml-credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aml-credentials.outputs.aws-session-token }}
        run: |
          python -m test.kumo_pytorch.data fetch --dataset hi-small \
            --data-dir "$RUNNER_TEMP/aml-data" --report "$RUNNER_TEMP/aml-acquisition.json"
      - name: Check the complete selected population
        run: |
          options=()
          if [[ "$AML_MODE" == smoke ]]; then options+=(--smoke-anchors 4); fi
          python -m test.kumo_pytorch.population --case "$AML_CASE" --mode "$AML_MODE" \
            --data-dir "$RUNNER_TEMP/aml-data" \
            --output "$RUNNER_TEMP/aml-parallel/$AML_MODE/$AML_CASE" \
            --batch-size 4 --threads 4 "${options[@]}"
      - name: Show population results
        if: ${{ always() }}
        run: |
          report="$RUNNER_TEMP/aml-parallel/$AML_MODE/$AML_CASE/report.md"
          if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: kumo-pytorch-aml-parallel-${{ matrix.mode }}-${{ matrix.case }}
          path: |
            ${{ runner.temp }}/aml-parallel/**/report.json
            ${{ runner.temp }}/aml-parallel/**/report.md
            ${{ runner.temp }}/aml-parallel/**/contract.json
          if-no-files-found: error
          retention-days: 14

  aml-lifecycle:
    name: Lifecycle / AML
    needs: diskgraph-wheel
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: gha-kumo-workflow-tests
      deployment: false
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/kumo-pytorch-setup
        with:
          diskgraph-wheel-artifact: diskgraph-wheel
          torch-extra: cpu
      - name: Read private AML inputs with the Engine test role
        id: aml-credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::926922431314:role/gha-kumo-workflow-tests
          aws-region: us-west-2
          output-env-credentials: false
          output-credentials: true
          unset-current-credentials: true
      - name: Download and verify pinned sources and anchors
        id: aml-data
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aml-credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aml-credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aml-credentials.outputs.aws-session-token }}
        run: |
          python -m test.kumo_pytorch.data fetch --dataset hi-small \
            --data-dir "$RUNNER_TEMP/aml-data" --report "$RUNNER_TEMP/aml-acquisition.json"
      - name: Check bounded AML training lifecycle and mid-epoch resume
        if: ${{ !cancelled() && steps.aml-data.outcome == 'success' }}
        run: |
          python -m test.kumo_pytorch.run_aml \
            --data-dir "$RUNNER_TEMP/aml-data" \
            --prepared-dir "$RUNNER_TEMP/aml-lifecycle-prepared" \
            --output "$RUNNER_TEMP/aml-lifecycle" --anchors-per-split 4 \
            --batch-size 2 --steps 1 --threads 1
      - name: Check real AML multi-source histories
        if: ${{ !cancelled() && steps.aml-data.outcome == 'success' }}
        run: |
          python -m test.kumo_pytorch.history_checks \
            --data-dir "$RUNNER_TEMP/aml-data" --output "$RUNNER_TEMP/aml-histories" \
            --anchors-per-split 4 --threads 1
      - name: Show real AML history results
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/aml-histories/report.md" ]; then
            cat "$RUNNER_TEMP/aml-histories/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain real AML lifecycle reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: kumo-pytorch-aml-lifecycle
          path: |
            ${{ runner.temp }}/aml-lifecycle/report.json
            ${{ runner.temp }}/aml-lifecycle/**/result.json
            ${{ runner.temp }}/aml-lifecycle/**/report.json
            ${{ runner.temp }}/aml-lifecycle/**/*.log
          retention-days: 14

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: kumo-pytorch-aml-histories
          path: |
            ${{ runner.temp }}/aml-histories/report.json
            ${{ runner.temp }}/aml-histories/report.md
          retention-days: 14

  aml-summary:
    name: Results / AML Summary
    needs: [plan, benchmark-aml, aml-fitting-memory, aml-population, aml-lifecycle, aml-training-acceptance]
    if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: kumo-pytorch-aml-parallel-*
          path: ${{ runner.temp }}/aml-parallel
          merge-multiple: true
      - name: Account for every shard and compare all loader timings
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 -m test.kumo_pytorch.nightly summary --directory "$RUNNER_TEMP/aml-parallel"
          python3 - <<'PYCODE'
          import json, os
          results = json.loads(os.environ['JOB_RESULTS'])
          assert all(job['result'] == 'success' for job in results.values()), results
          PYCODE
      - name: Show combined results
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/aml-parallel/report.md" ]; then
            cat "$RUNNER_TEMP/aml-parallel/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: kumo-pytorch-aml-benchmarks
          path: ${{ runner.temp }}/aml-parallel
          if-no-files-found: error
          retention-days: 14

  package-regressions:
    name: Correctness / Package Tests
    needs: diskgraph-wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/kumo-pytorch-setup
        with:
          diskgraph-wheel-artifact: diskgraph-wheel
      - name: Run existing regressions in place
        # Other jobs below own conformance and the T2b lifecycle executions.
        run: |
          python -m pytest -q --require-imports tests \
            --ignore=tests/conformance --ignore=tests/e2e/test_lifecycle.py \
            --junitxml="$RUNNER_TEMP/package-regressions.xml"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: kumo-pytorch-package-regressions
          path: ${{ runner.temp }}/package-regressions.xml
          retention-days: 14

  plan:
    name: Setup / Nightly Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      aml_cases: ${{ steps.aml.outputs.cases }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - id: matrix
        run: echo "matrix=$(python3 tests/e2e/tiers.py t2b)" >> "$GITHUB_OUTPUT"
      - id: aml
        working-directory: .
        run: |
          python3 - <<'PYCODE'
          import json, os
          from test.kumo_pytorch.nightly import matrix
          selected = matrix()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('cases=' + json.dumps([row['case'] for row in selected['include']]) + '\n')
          PYCODE

  run:
    name: Lifecycle / H&M / ${{ matrix.flow == 'gnn' && 'GNN' || 'PRAGMA' }} / Seed ${{ matrix.seed }}
    needs: [diskgraph-wheel, plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/kumo-pytorch-setup
        with:
          diskgraph-wheel-artifact: diskgraph-wheel
      - name: Train, persist, infer and serve
        env:
          FLOW: ${{ matrix.flow }}
          SEED: ${{ matrix.seed }}
        run: python -m tests.e2e.runs t2b "$FLOW" "$SEED" --e2e-dir "$RUNNER_TEMP/e2e"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kumo-pytorch-t2b-${{ matrix.flow }}-seed${{ matrix.seed }}
          path: |
            ${{ runner.temp }}/e2e/t2b/${{ matrix.flow }}-seed${{ matrix.seed }}/
            !${{ runner.temp }}/e2e/t2b/**/index/**
          retention-days: 14

  aml-model-checks:
    name: Correctness / AML
    needs: diskgraph-wheel
    uses: ./.github/workflows/_kumo-pytorch-aml-checks.yml
    with:
      diskgraph-wheel-artifact: diskgraph-wheel

  checks:
    name: Lifecycle / H&M / Results
    needs: [diskgraph-wheel, run]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/kumo-pytorch-setup
        with:
          diskgraph-wheel-artifact: diskgraph-wheel
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: kumo-pytorch-t2b-*-seed*
          path: ${{ runner.temp }}/e2e-runs
      - name: Place the runs where the checks read them
        run: |
          mkdir -p "$RUNNER_TEMP/e2e/t2b"
          for run in "$RUNNER_TEMP"/e2e-runs/kumo-pytorch-t2b-*; do
            mv "$run" "$RUNNER_TEMP/e2e/t2b/${run##*/kumo-pytorch-t2b-}"
          done
      - name: Check the runs
        env:
          KUMO_PYTORCH_E2E_REUSE_ONLY: '1'
        run: |
          python -m pytest -q --require-imports --t2b --e2e-dir "$RUNNER_TEMP/e2e" --durations=0 \
            tests/e2e/test_lifecycle.py --junitxml="$RUNNER_TEMP/lifecycle.xml"
      - name: Summarize metrics and run times
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/e2e/t2b/metrics.json" ]; then
            {
              echo '### T2b metrics'
              echo '```json'
              cat "$RUNNER_TEMP/e2e/t2b/metrics.json"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: kumo-pytorch-t2b-predictions-and-metrics
          path: |
            ${{ runner.temp }}/lifecycle.xml
            ${{ runner.temp }}/e2e/t2b/metrics.json
            ${{ runner.temp }}/e2e/t2b/*/*.json
            ${{ runner.temp }}/e2e/t2b/*/*.parquet
            ${{ runner.temp }}/e2e/t2b/*/*-predictions/*
            !${{ runner.temp }}/e2e/t2b/hm-m/**
            !${{ runner.temp }}/e2e/t2b/sampled/**
            !${{ runner.temp }}/e2e/t2b/**/index/**
          retention-days: 14

  conformance:
    name: Correctness / Conformance
    needs: diskgraph-wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Pick today's seed batches
        id: seeds
        working-directory: .
        env:
          REQUESTED: ${{ github.event.inputs.seed_start }}
        run: |
          # 12 new batches a day; the required ones always run as well.
          start=${REQUESTED:-$(( $(date -u +%s) / 86400 * 12 ))}
          if ! [[ $start =~ ^[0-9]+$ ]]; then
            echo "::error::seed_start must be a non-negative integer, not '$start'"
            exit 1
          fi
          echo "start=$start" >> "$GITHUB_OUTPUT"
          echo "Conformance seed batches $start-$((start + 11)) plus the required ones;" \
            "reproduce with \`python -m conformance --engine all --seeds 12 --seed-start $start\`" \
            >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/kumo-pytorch-setup
        with:
          diskgraph-wheel-artifact: diskgraph-wheel
      - name: Check every property on the day's seed batches
        env:
          CONFORMANCE_REPROS: ${{ runner.temp }}/conformance-repros
          START: ${{ steps.seeds.outputs.start }}
        run: python -m conformance --engine all --seeds 12 --seed-start "$START"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ failure() }}
        with:
          name: kumo-pytorch-t2b-conformance-repros
          path: ${{ runner.temp }}/conformance-repros
          if-no-files-found: ignore
          retention-days: 14

  nightly-result:
    name: Results / Complete Nightly
    needs: [dataset-tooling, diskgraph-wheel, benchmark-memory, aml-training-acceptance, aml-fitting-memory, benchmark-gpu, benchmark-aml, aml-population, aml-lifecycle, aml-summary, package-regressions, plan, run, aml-model-checks, checks, conformance]
    if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Account for every required nightly job
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 -m test.kumo_pytorch.automation record --output "$RUNNER_TEMP/nightly-status/status.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: kumo-pytorch-nightly-status
          path: ${{ runner.temp }}/nightly-status/status.json
          if-no-files-found: error
          retention-days: 14
