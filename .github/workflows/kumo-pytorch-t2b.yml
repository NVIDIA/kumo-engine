name: kumo-pytorch nightly end-to-end

# Manually run the same Medium suite used by the package PR and nightly jobs.
on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      seed_start:
        description: First extra conformance seed batch (default derived from the date)
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  diskgraph-wheel:
    uses: ./.github/workflows/_diskgraph-wheel.yml

  lifecycle:
    needs: diskgraph-wheel
    uses: ./.github/workflows/_kumo-pytorch-t2b.yml
