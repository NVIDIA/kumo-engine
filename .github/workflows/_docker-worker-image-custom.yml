name: (Manual) Kumo Compute worker docker build

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      kumo_repo_ref:
        description: 'Your development branch name'
        required: true
        default: 'development'
        type: string
      snowflake_image:
        description: 'Push image to Snowflake registry?'
        required: true
        default: false
        type: boolean
      # allow for specifying the Snowflake image repo as input
      # We currently assume only the base url changes but rest of the path
      # and credentials are static.
      snowflake_image_repo:
        description: 'Base URL for the Snowflake image repo to use'
        required: false
        default: 'lfwgwbp-kumo-snowservices.registry.snowflakecomputing.com'
        type: string
      snowflake_registry_user:
        description: 'Snowflake registry user to use'
        required: false
        default: 'kumo_snowservices'
        type: string
      snowflake_registry_pat_secret:
        description: 'Secret name for the Snowflake registry PAT'
        required: false
        default: 'SNOWFLAKE_REGISTRY_PAT'
        type: string
      databricks_image:
        description: 'Build Kumo Databricks image?'
        required: true
        default: false
        type: boolean
      validate_oidc_only:
        description: Configure OIDC credentials and verify ECR login without building or pushing images
        required: false
        default: false
        type: boolean
    outputs:
      build_success:
        value: ${{ jobs.build.outputs.build_success }}
  workflow_dispatch:
    inputs:
      kumo_repo_ref:
        description: 'Your development branch name'
        required: true
        default: 'development'
      snowflake_image:
        description: 'Push image to Snowflake registry?'
        required: true
        default: false
        type: boolean
      # allow for specifying the Snowflake image repo as input
      # We currently assume only the base url changes but rest of the path
      # and credentials are static.
      snowflake_image_repo:
        description: 'Base URL for the Snowflake image repo to use'
        required: false
        default: 'lfwgwbp-kumo-snowservices.registry.snowflakecomputing.com'
        type: string
      snowflake_registry_user:
        description: 'Snowflake registry user to use'
        required: false
        default: 'kumo_snowservices'
        type: string
      snowflake_registry_pat_secret:
        description: 'Secret name for the Snowflake registry PAT'
        required: false
        default: 'SNOWFLAKE_REGISTRY_PAT'
        type: string
      databricks_image:
        description: 'Build Kumo Databricks image?'
        required: true
        default: false
        type: boolean
      validate_oidc_only:
        description: Configure OIDC credentials and verify ECR login without building or pushing images
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write
  issues: write
  pull-requests: write

env:
  ECR_IMAGE_REGISTRY: 926922431314.dkr.ecr.us-west-2.amazonaws.com
  # Snowflake registry
  SNOWFLAKE_REGISTRY: ${{ inputs.snowflake_image_repo }}
  SNOWFLAKE_REGISTRY_USER: ${{ inputs.snowflake_registry_user }}

jobs:
  build:
    if: ${{ !inputs.validate_oidc_only }}
    environment: >-
      ${{ inputs.snowflake_image
          && 'gha-kumo-worker-image-build-read'
          || 'gha-kumo-worker-image-publish' }}
    name: Build Kumo docker image
    runs-on: ubuntu-22.04-large
    outputs:
      build_success: ${{ steps.set-output.outputs.success }}

    steps:
      - name: Validate image selection
        if: ${{ inputs.snowflake_image && inputs.databricks_image }}
        shell: bash
        run: |
          echo "::error::snowflake_image and databricks_image are mutually exclusive"
          exit 1

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          ref: ${{ inputs.kumo_repo_ref }}

      - name: Clone kumo repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          repository: kumo-ai/kumo
          token: ${{ secrets.GITHUB_TOKEN }}
          path: docker/kumo
          ref: ${{ inputs.kumo_repo_ref }}

      - name: Install fuse-overlayfs (upstream)
        run: |
          sudo apt -y update
          sudo apt-get install -y fuse-overlayfs
          # apt's 1.7.1 (2021) has rmdir/ENOTEMPTY races on heavy pip uninstalls; pin upstream v1.16.
          sudo curl -fL \
            "https://github.com/containers/fuse-overlayfs/releases/download/v1.16/fuse-overlayfs-x86_64" \
            -o /usr/bin/fuse-overlayfs
          sudo chmod +x /usr/bin/fuse-overlayfs
          fuse-overlayfs --version
          mkdir -vp ~/.config/containers
          printf "[storage]\ndriver=\"overlay\"\n[storage.options]\nmount_program=\"/usr/bin/fuse-overlayfs\"\n" > ~/.config/containers/storage.conf
          cat ~/.config/containers/storage.conf

      - name: Log in to Snowflake Registry
        if: ${{ inputs.snowflake_image }}
        uses: redhat-actions/podman-login@4934294ad0449894bcd1e9f191899d7292469603   #  v1.7
        with:
          username: ${{ env.SNOWFLAKE_REGISTRY_USER }}
          password: ${{ secrets.SNOWFLAKE_REGISTRY_PAT }}
          registry: ${{ env.SNOWFLAKE_REGISTRY }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7  # v6.0.0
        with:
          role-to-assume: >-
            ${{ inputs.snowflake_image
                && 'arn:aws:iam::926922431314:role/gha-kumo-worker-image-build-read'
                || 'arn:aws:iam::926922431314:role/gha-kumo-worker-image-publish' }}
          role-duration-seconds: 14400
          aws-region: us-west-2

      - name: Log in to AWS ECR
        shell: bash
        run: |
          aws ecr get-login-password --region us-west-2 \
            | podman login --username AWS --password-stdin "${ECR_IMAGE_REGISTRY}"

      - name: Declare variables
        id: vars
        shell: bash
        run: |
          pwd
          ls
          echo ${{ inputs.kumo_repo_ref }} > ./docker/kumo_version.txt
          cat ./docker/kumo_version.txt

      - name: Check Disk Space and inodes
        run: |
          df -h
          df -i

      - name: Stage DiskGraph Source
        if: ${{ ! inputs.databricks_image && ! inputs.snowflake_image }}
        shell: bash
        run: |
          ./scripts/diskgraph stage-source --out docker/diskgraph-source

      - name: Prepare AWS build secrets
        shell: bash
        run: |
          install -d -m 700 "$RUNNER_TEMP/build-secrets"
          printf '%s' "$AWS_ACCESS_KEY_ID" > "$RUNNER_TEMP/build-secrets/aws_access_key_id"
          printf '%s' "$AWS_SECRET_ACCESS_KEY" > "$RUNNER_TEMP/build-secrets/aws_secret_access_key"
          printf '%s' "$AWS_SESSION_TOKEN" > "$RUNNER_TEMP/build-secrets/aws_session_token"
          chmod 600 "$RUNNER_TEMP/build-secrets/"*

      - name: Build Image
        id: build-image
        if: ${{ ! inputs.databricks_image }}
        uses: redhat-actions/buildah-build@7a95fa7ee0f02d552a32753e7414641a04307056  # v2
        with:
          image: kumo
          tags: ${{ inputs.kumo_repo_ref }}
          context: ./docker
          containerfiles: |
            ${{ inputs.snowflake_image && './docker/Dockerfile.worker.rootuser' || './docker/Dockerfile.worker' }}
          build-args: |
            # Snowflake integration images intentionally retain runtime AWS
            # credentials. OIDC credentials are build-only and are passed as
            # secret mounts below; they must never be baked into runtime ENV.
            BUILD_INTEGRATION_IMAGE=${{ inputs.snowflake_image && 'true' || null }}
            INTEGRATION_AWS_ACCESS_KEY_ID=${{ inputs.snowflake_image && secrets.INTEGRATION_AWS_ACCESS_KEY_ID || '' }}
            INTEGRATION_AWS_SECRET_ACCESS_KEY=${{ inputs.snowflake_image && secrets.INTEGRATION_AWS_SECRET_ACCESS_KEY || '' }}
            GITHUB_TOKEN=${{ secrets.KUMO_GITHUB_BOT_TOKEN }}
          extra-args: |
            --secret id=aws_access_key_id,src=${{ runner.temp }}/build-secrets/aws_access_key_id
            --secret id=aws_secret_access_key,src=${{ runner.temp }}/build-secrets/aws_secret_access_key
            --secret id=aws_session_token,src=${{ runner.temp }}/build-secrets/aws_session_token

      - name: Build Databricks Image
        if: ${{ inputs.databricks_image }}
        id: build-image-databricks
        uses: redhat-actions/buildah-build@7a95fa7ee0f02d552a32753e7414641a04307056  # v2
        with:
          image: kumo
          tags: ${{ inputs.kumo_repo_ref }}_databricks
          context: ./docker
          containerfiles: |
            ./docker/Dockerfile.worker.databricks
          build-args: |
            GITHUB_TOKEN=${{ secrets.KUMO_GITHUB_BOT_TOKEN }}
          extra-args: |
            --secret id=aws_access_key_id,src=${{ runner.temp }}/build-secrets/aws_access_key_id
            --secret id=aws_secret_access_key,src=${{ runner.temp }}/build-secrets/aws_secret_access_key
            --secret id=aws_session_token,src=${{ runner.temp }}/build-secrets/aws_session_token

      - name: Test Kumo Import Inside Image
        env:
          BUILT_IMAGE: ${{ steps.build-image.outputs.image || steps.build-image-databricks.outputs.image }}
          BUILT_TAGS: ${{ steps.build-image.outputs.tags || steps.build-image-databricks.outputs.tags }}
        run: |
          podman run "$BUILT_IMAGE:$BUILT_TAGS" python3 -c "import kumo, numpy, torch; torch.from_numpy(numpy.array([0]))"

      - name: Check Disk Space and inodes
        id: check-disk-space
        if: ${{ always() }}
        run: |
          df -h
          df -i

      - name: Push To AWS ECR
        if: ${{ ! inputs.snowflake_image }}
        id: push-to-ecr
        uses: redhat-actions/push-to-registry@5ed88d269cf581ea9ef6dd6806d01562096bee9c   #  v2.8
        with:
          image: ${{ steps.build-image.outputs.image || steps.build-image-databricks.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags || steps.build-image-databricks.outputs.tags }}
          registry: ${{ env.ECR_IMAGE_REGISTRY }}/kumo

      - name: Build trainer6 Image
        id: build-image-trainer6
        if: ${{ ! inputs.databricks_image && ! inputs.snowflake_image }}
        uses: redhat-actions/buildah-build@7a95fa7ee0f02d552a32753e7414641a04307056  # v2
        with:
          image: kumo
          tags: ${{ inputs.kumo_repo_ref }}_trainer6
          context: ./docker
          containerfiles: |
            ./docker/Dockerfile.worker
          build-args: |
            GITHUB_TOKEN=${{ secrets.KUMO_GITHUB_BOT_TOKEN }}
            NODE_TYPE=trainer6
          extra-args: |
            --secret id=aws_access_key_id,src=${{ runner.temp }}/build-secrets/aws_access_key_id
            --secret id=aws_secret_access_key,src=${{ runner.temp }}/build-secrets/aws_secret_access_key
            --secret id=aws_session_token,src=${{ runner.temp }}/build-secrets/aws_session_token


      - name: Test Kumo Import Inside trainer6 Image
        if: ${{ ! inputs.databricks_image && ! inputs.snowflake_image }}
        run: |
          podman run ${{ steps.build-image-trainer6.outputs.image }}:${{ steps.build-image-trainer6.outputs.tags }} python3 -c "import kumo, numpy, torch; torch.from_numpy(numpy.array([0]))"


      - name: Push trainer6 To AWS ECR
        if: ${{ ! inputs.snowflake_image && ! inputs.databricks_image }}
        id: push-to-ecr-trainer6
        uses: redhat-actions/push-to-registry@5ed88d269cf581ea9ef6dd6806d01562096bee9c   #  v2.8
        with:
          image: ${{ steps.build-image-trainer6.outputs.image }}
          tags: ${{ steps.build-image-trainer6.outputs.tags }}
          registry: ${{ env.ECR_IMAGE_REGISTRY }}/kumo


      - name: Build Databricks trainer6 Image
        if: ${{ inputs.databricks_image }}
        id: build-image-databricks-trainer6
        uses: redhat-actions/buildah-build@7a95fa7ee0f02d552a32753e7414641a04307056  # v2
        with:
          image: kumo
          tags: ${{ inputs.kumo_repo_ref }}_databricks_trainer6
          context: ./docker
          containerfiles: |
            ./docker/Dockerfile.worker.databricks
          build-args: |
            GITHUB_TOKEN=${{ secrets.KUMO_GITHUB_BOT_TOKEN }}
            NODE_TYPE=trainer6
          extra-args: |
            --secret id=aws_access_key_id,src=${{ runner.temp }}/build-secrets/aws_access_key_id
            --secret id=aws_secret_access_key,src=${{ runner.temp }}/build-secrets/aws_secret_access_key
            --secret id=aws_session_token,src=${{ runner.temp }}/build-secrets/aws_session_token

      - name: Remove AWS build secrets
        if: ${{ always() }}
        shell: bash
        run: rm -rf "$RUNNER_TEMP/build-secrets"

      - name: Push Databricks trainer6 To AWS ECR
        if: ${{ ! inputs.snowflake_image && inputs.databricks_image }}
        id: push-to-ecr-databricks-trainer6
        uses: redhat-actions/push-to-registry@5ed88d269cf581ea9ef6dd6806d01562096bee9c   #  v2.8
        with:
          image: ${{ steps.build-image-databricks-trainer6.outputs.image }}
          tags: ${{ steps.build-image-databricks-trainer6.outputs.tags }}
          registry: ${{ env.ECR_IMAGE_REGISTRY }}/kumo

      - name: Push To Snowflake Registry
        id: push-to-snowflake
        if: ${{ inputs.snowflake_image }}
        uses: redhat-actions/push-to-registry@5ed88d269cf581ea9ef6dd6806d01562096bee9c   #  v2.8
        with:
          # image and tags set by previous Build Image step
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: ${{ env.SNOWFLAKE_REGISTRY }}/kumo_app_db/image_repo/kumo_repo

      - name: Print Image Url
        run: |
          if ${{ ! inputs.snowflake_image }}; then echo "Image pushed to AWS ECR: ${{ steps.push-to-ecr.outputs.registry-paths }}"; fi
          if ${{ inputs.snowflake_image }}; then echo "Image pushed to Snowflake: ${{ steps.push-to-snowflake.outputs.registry-paths }}"; fi

      - name: Set output
        if: ${{ success() }}
        id: set-output
        run: echo "success=true" >> $GITHUB_OUTPUT

  validate-oidc:
    if: ${{ inputs.validate_oidc_only }}
    environment: gha-kumo-worker-image-publish
    runs-on: ubuntu-22.04
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7  # v6.0.0
        with:
          role-to-assume: arn:aws:iam::926922431314:role/gha-kumo-worker-image-publish
          aws-region: us-west-2
      - name: Log in to AWS ECR
        shell: bash
        run: |
          aws ecr get-login-password --region us-west-2 \
            | podman login --username AWS --password-stdin "${ECR_IMAGE_REGISTRY}"
      - name: Validate OIDC identity
        run: aws sts get-caller-identity

  post-comment-failure:
    needs: build
    if: ${{ !inputs.validate_oidc_only && (failure() || cancelled() || needs.build.outputs.build_success != 'true') }}
    uses: ./.github/workflows/_post_comment_image_build.yml
    with:
      image_type: 'worker'
      build_failure: true
    secrets: inherit
