name: Kumo Engine Nightly AWS Integration
on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
  push:
    branches: [codex/nightly-aws-ssm]
    paths:
      - '.github/workflows/kumo-engine-nightly-ssm.yml'
      - 'scripts/engine_nightly_ssm.py'
      - 'test/scripts/test_engine_nightly_ssm.py'
permissions:
  contents: read
  id-token: write
concurrency:
  group: kumo-engine-nightly-ssm-integration
  cancel-in-progress: false
jobs:
  integration:
    name: Nightly SSM connection, zero fits
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment:
      name: gha-kumo-workflow-tests
      deployment: false
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.12'
      - name: Check the controller before obtaining AWS credentials
        run: |
          aws --version
          python3 -m unittest discover -s test/scripts -p test_engine_nightly_ssm.py
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6
        id: aws
        with:
          role-to-assume: arn:aws:iam::926922431314:role/gha-kumo-workflow-tests
          role-session-name: nightly-integration-${{ github.run_id }}
          aws-region: us-east-2
          output-env-credentials: false
          output-credentials: true
      - name: Check nightly SSM and artifact transport without model execution
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws.outputs.aws-session-token }}
          NIGHTLY_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          NIGHTLY_SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 scripts/engine_nightly_ssm.py run \
            --run-id "$NIGHTLY_RUN_ID" --source-sha "$NIGHTLY_SOURCE_SHA" \
            --output-dir "$RUNNER_TEMP/nightly-ssm"
          echo 'Nightly AWS integration passed. Zero fits and no GPU model work. Full nightly validation remains separate.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: always()
        with:
          name: nightly-ssm-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nightly-ssm
          if-no-files-found: warn
