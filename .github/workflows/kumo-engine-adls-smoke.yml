name: Kumo Engine - ADLS wheel lifecycle

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      wheel_run_id:
        description: Successful candidate wheel build run in NVIDIA/kumo-engine.
        type: string
        required: true
      candidate_sha:
        description: Full commit SHA used by the selected wheel build.
        type: string
        required: true

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  adls:
    if: github.repository == 'NVIDIA/kumo-engine'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: gha-kumo-workflow-tests
      deployment: false
    env:
      WHEEL_RUN_ID: ${{ inputs.wheel_run_id }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
      AZURE_CONTAINER_NAME: ${{ vars.AZURE_CONTAINER_NAME }}
      KUMO_MLOPS_LIVE_ADLS_ROOT: ${{ vars.KUMO_MLOPS_LIVE_ADLS_ROOT }}
      CUDA_VISIBLE_DEVICES: ''
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ''
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'

      - name: Verify the selected build and Azure test root
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$WHEEL_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p "$RUNNER_TEMP/adls/results"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$WHEEL_RUN_ID" \
            > "$RUNNER_TEMP/adls/results/build.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          from urllib.parse import urlsplit

          run = json.loads((Path(os.environ['RUNNER_TEMP']) /
                            'adls/results/build.json').read_text())
          assert run['head_repository']['full_name'] == os.environ['GITHUB_REPOSITORY']
          assert run['path'] == '.github/workflows/kumo-engine-wheel.yml'
          assert run['head_sha'] == os.environ['CANDIDATE_SHA']
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          root = os.environ['KUMO_MLOPS_LIVE_ADLS_ROOT']
          if not root:
              account = os.environ['AZURE_STORAGE_ACCOUNT']
              container = os.environ['AZURE_CONTAINER_NAME']
              assert account and container, 'Configure the Azure test account and container'
              root = f'abfss://{container}@{account}.dfs.core.windows.net/engine-lifecycle'
          parsed = urlsplit(root)
          assert parsed.scheme == 'abfss' and '@' in parsed.netloc
          assert not parsed.query and not parsed.fragment
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write(f'KUMO_MLOPS_LIVE_ADLS_ROOT={root.rstrip("/")}\n')
          PY

      - name: Download the selected candidate wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: kumo-engine-wheel-x86_64-${{ inputs.candidate_sha }}
          run-id: ${{ inputs.wheel_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/adls/wheel

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: false

      - name: Install and verify the candidate wheel
        run: |
          set -euo pipefail
          unset PYTHONPATH DISKGRAPH_INGEST_BIN
          stage="$RUNNER_TEMP/adls"
          mkdir -p "$stage/tools"
          cp packages/kumo-engine/test/test_adls_mlops.py \
            packages/kumo-engine/test/wheel_mlops_lifecycle.py \
            packages/kumo-engine/test/wheel_gpu_smoke.py "$stage/tools/"
          cd "$stage"
          wheels=(wheel/kumo_engine-*.whl)
          test "${#wheels[@]}" -eq 1 && test -f "${wheels[0]}"
          uv venv --python 3.12 --seed venv
          uv pip install --python venv/bin/python --torch-backend=cpu \
            "${wheels[0]}[adls,mlflow]" pytest 2>&1 | tee results/install.log
          venv/bin/python -m pip --isolated install --no-deps --force-reinstall \
            "${wheels[0]}" >> results/install.log 2>&1
          venv/bin/python -m pip check 2>&1 | tee results/dependencies.log
          venv/bin/python -m pip freeze --all > results/dependencies.txt
          venv/bin/python -I - <<'PY'
          import email.parser, importlib.metadata, importlib.util, json, os, zipfile
          from pathlib import Path

          root = Path.cwd()
          wheel, = (root / 'wheel').glob('kumo_engine-*.whl')
          with zipfile.ZipFile(wheel) as archive:
              metadata, = [name for name in archive.namelist()
                           if name.endswith('.dist-info/METADATA')]
              version = email.parser.BytesParser().parsebytes(archive.read(metadata))['Version']
          helper = root / 'tools/wheel_mlops_lifecycle.py'
          spec = importlib.util.spec_from_file_location('lifecycle', helper)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          receipt = module.check_install(wheel, version)
          import kumo_adls.backend
          location = Path(importlib.metadata.distribution('kumo-engine').locate_file(''))
          module.verify_wheel_file(wheel, location, Path(kumo_adls.backend.__file__))
          receipt['imports']['kumo_adls.backend'] = kumo_adls.backend.__file__
          receipt.update(candidate_sha=os.environ['CANDIDATE_SHA'],
                         build_run=os.environ['WHEEL_RUN_ID'],
                         harness_sha=os.environ['GITHUB_SHA'],
                         runner_sha256=module.digest(root / 'tools/test_adls_mlops.py'))
          module.write(root / 'results/environment.json', receipt)
          PY

      - name: Log in to Azure with GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare workload credentials for Python and Arrow
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from urllib.request import Request, urlopen

          url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
          url += ('&' if '?' in url else '?') + 'audience=api%3A%2F%2FAzureADTokenExchange'
          request = Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urlopen(request, timeout=30) as response:
              token = json.load(response)['value']
          path = Path(os.environ['RUNNER_TEMP']) / 'adls-oidc-token'
          with os.fdopen(os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600), 'w') as stream:
              stream.write(token)
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write(f'AZURE_FEDERATED_TOKEN_FILE={path}\n')
          PY

      - name: Run the live two-process lifecycle
        run: |
          set -euo pipefail
          unset PYTHONPATH DISKGRAPH_INGEST_BIN
          cd "$RUNNER_TEMP/adls"
          venv/bin/python -I -m pytest --import-mode=importlib --confcutdir=tools \
            -q -s -rs -k azure --basetemp=results/tests \
            --junitxml=results/junit.xml tools/test_adls_mlops.py \
            2>&1 | tee results/lifecycle.log
          venv/bin/python -I - <<'PY'
          import xml.etree.ElementTree as ET
          suite = ET.parse('results/junit.xml').getroot()
          cases = list(suite.iter('testcase'))
          assert cases, 'No live ADLS tests ran'
          assert not list(suite.iter('skipped')), 'Live ADLS tests must not skip'
          PY

      - name: Remove workload token
        if: always()
        run: rm -f "$RUNNER_TEMP/adls-oidc-token"

      - name: Preserve ADLS lifecycle evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: engine-adls-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/adls/results
          if-no-files-found: warn
          retention-days: 14
