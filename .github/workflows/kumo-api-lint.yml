name: Kumo API - Lint and type check

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
    paths:
      - 'packages/kumo-api/**'
      - '.github/workflows/kumo-api-*'
  pull_request:
    paths:
      - 'packages/kumo-api/**'
      - '.github/workflows/kumo-api-*'
  merge_group:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ startsWith(github.ref, 'refs/pull/') || github.run_number }}  # yamllint disable-line
  # Only cancel intermediate builds if on a PR:
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  pre-commit:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.11'
          activate-environment: true

      - name: Cache pre-commit
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/pre-commit
          key: kumo-api-pre-commit-${{ hashFiles('packages/kumo-api/.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: |
          uv pip install pre-commit
          mapfile -t package_files < <(git ls-files packages/kumo-api)
          uv run --no-project pre-commit run \
            --config packages/kumo-api/.pre-commit-config.yaml \
            --files "${package_files[@]}"
        env:
          SKIP: 'no-commit-to-branch'

  ty:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.11'
          activate-environment: true

      - name: Install Kumo API
        run: |
          cd packages/kumo-api
          uv pip install -e ".[test,release-check]"

      - name: Run type checker
        run: |
          cd packages/kumo-api
          uv pip install "ty==0.0.77"
          uv run --no-project ty check --error-on-warning
