name: PR change table

"on":
  issue_comment:
    types: [created, edited, deleted]
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: pr-change-table-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
      issues: read
      statuses: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          persist-credentials: false
      - uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553  # v9
        with:
          script: |
            await require('./.github/scripts/pr-change-table.cjs').run({
              github, context, core,
              postStatus: context.payload.pull_request.head.repo?.full_name ===
                `${context.repo.owner}/${context.repo.repo}`,
            });

  validate-comment:
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      issues: read
      statuses: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553  # v9
        with:
          script: |
            await require('./.github/scripts/pr-change-table.cjs').run({ github, context, core });
