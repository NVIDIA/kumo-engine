name: Snowflake Testing and Coverage

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      full_test:
        description: "Run the full test suite"
        type: boolean
        default: true
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ startsWith(github.ref, 'refs/pull/') || github.run_number }}
  # Only cancel intermediate builds if on a PR:
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read

env:
  AWS_TEST_ROLE_ARN: arn:aws:iam::926922431314:role/gha-kumo-preprod-test-s3
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  GITHUB_REF: ${{secrets.GITHUB_REF}}
  GITHUB_API_URL: ${{secrets.GITHUB_API_URL}}
  GITHUB_REPOSITORY: ${{secrets.GITHUB_REPOSITORY}}
  GITHUB_REPOSITORY_OWNER: ${{secrets.GITHUB_REPOSITORY_OWNER}}
  GITHUB_RUN_ID: ${{secrets.GITHUB_RUN_ID}}

jobs:
  pytest:
    environment:
      name: gha-kumo-workflow-tests
      # This job uses environment-scoped OIDC; it does not deploy an application.
      deployment: false
    name: all-snowflake-tests (${{ matrix.test_name }})
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    env:
      KUMO_RUN_GCP_TESTS: '0'

    strategy:
      matrix:
        test_name:
          [
            'connector (test/connector)',
            'rest (test/rest)',
            'fsutil (test/io_utils/fsutil)',
            'backend - data (test/data/ test/graph/',
            'backend - pquery (test/pquery/bp_generator)',
            'backend - pquery (test/pquery/train_table_generator)',
            'snowflake diskgraph e2e (test/rest/integ/test_snowflake_diskgraph_e2e.py)',
            'snowflake ingestion diskgraph e2e (test/rest/integ/test_snowflake_ingestion_diskgraph_e2e.py)'
          ]
        include:
          - test_name: 'connector (test/connector)'
            test_dir: 'test/connector'
          - test_name: 'rest (test/rest)'
            test_dir: 'test/rest --ignore=test/rest/integ/test_snowflake_diskgraph_e2e.py --ignore=test/rest/integ/test_snowflake_ingestion_diskgraph_e2e.py'
          - test_name: 'fsutil (test/io_utils/fsutil)'
            test_dir: 'test/io_utils/fsutil'
          - test_name: 'backend - data (test/data/ test/graph/'
            test_dir: 'test/data/ test/graph/**snowflake**'
          - test_name: 'backend - pquery (test/pquery/bp_generator)'
            test_dir: 'test/pquery/test_pql_batch_pred_generator.py'
          - test_name: 'backend - pquery (test/pquery/train_table_generator)'
            test_dir: 'test/pquery/train_table_generator'
          - test_name: 'snowflake diskgraph e2e (test/rest/integ/test_snowflake_diskgraph_e2e.py)'
            test_dir: "test/rest/integ/test_snowflake_diskgraph_e2e.py"
          - test_name: 'snowflake ingestion diskgraph e2e (test/rest/integ/test_snowflake_ingestion_diskgraph_e2e.py)'
            test_dir: "test/rest/integ/test_snowflake_ingestion_diskgraph_e2e.py"


    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 40

      - name: Determine test impact
        id: test-impact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # Missing history and manual runs execute conservatively.
          if [ -z "$BASE_SHA" ] || ! git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" -- > "$RUNNER_TEMP/test-profile-changes"; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            python3 -c 'import sys; from tools.ci_test_profiles import integration_required; paths = [p for p in sys.stdin.buffer.read().decode("utf-8", "surrogateescape").split("\0") if p]; print("run=" + str(integration_required(paths)).lower())' < "$RUNNER_TEMP/test-profile-changes" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        if: steps.test-impact.outputs.run == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::926922431314:role/gha-kumo-workflow-tests
          aws-region: us-west-2

      - name: Set up packages
        if: steps.test-impact.outputs.run == 'true' && !contains(matrix.test_dir, 'diskgraph')
        uses: ./.github/actions/setup
        with:
          github_token: ${{ secrets.KUMO_GITHUB_BOT_TOKEN }}

      - name: Set up packages (with diskgraph)
        if: steps.test-impact.outputs.run == 'true' && contains(matrix.test_dir, 'diskgraph')
        uses: ./.github/actions/setup
        with:
          github_token: ${{ secrets.KUMO_GITHUB_BOT_TOKEN }}

      # NOTE here we use coverage.py instead of pytest-cov to obtain JSON
      # outputs that are easier to parse and manage (pytest-cov/455).
      # coverage.py also has additional nice features that may be useful in the
      # future for better coverage reports.
      - name: Run minimal test suite
        if: steps.test-impact.outputs.run == 'true' && github.event_name != 'push' && inputs.full_test != true
        timeout-minutes: 120
        run: |
          set -o pipefail
          export SPARK_LOCAL_IP="127.0.0.1"
          source ./tools/ci_pytest_log_controls.sh
          configure_pytest_ci_output
          GLOG_logtostdout=1 python -m coverage run -m pytest -p tools.pytest_test_profiles --test-profile snowflake "${PYTEST_CI_OUTPUT_ARGS[@]}" --durations=30 --runsnowflake ${{ matrix.test_dir }}
        env:
          SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER }}
          KUMO_GCP_WORKLOAD_EXCHANGE_ENABLED: 'false'
          AWS_DEFAULT_REGION: "us-west-2"
          DEPLOY_ENV_CONFIG_FILE: ${{ contains(matrix.test_dir, 'diskgraph') && 'rest/devserver/configs/diskgraph-test.json' || '' }}

      - name: Run full test suite
        if: steps.test-impact.outputs.run == 'true' && (github.event_name == 'push' || inputs.full_test == true)
        timeout-minutes: 120
        run: |
          set -o pipefail
          export SPARK_LOCAL_IP="127.0.0.1"
          source ./tools/ci_pytest_log_controls.sh
          configure_pytest_ci_output
          FULL_TEST=1 GLOG_logtostdout=1 python -m coverage run -m pytest -p tools.pytest_test_profiles --test-profile snowflake "${PYTEST_CI_OUTPUT_ARGS[@]}" --durations=30 --runsnowflake ${{ matrix.test_dir }}
        env:
          SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER }}
          KUMO_GCP_WORKLOAD_EXCHANGE_ENABLED: 'false'
          AWS_DEFAULT_REGION: "us-west-2"
          DEPLOY_ENV_CONFIG_FILE: ${{ contains(matrix.test_dir, 'diskgraph') && 'rest/devserver/configs/diskgraph-test.json' || '' }}
