name: Snowflake Testing and Coverage

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
    paths-ignore: ["apps/studio/ui/**", "apps/studio/tools/**"]
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      full_test:
        description: "Run the full test suite"
        type: boolean
        default: true
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ startsWith(github.ref, 'refs/pull/') || github.run_number }}
  # Only cancel intermediate builds if on a PR:
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read
  id-token: write

env:
  AWS_TEST_ROLE_ARN: arn:aws:iam::926922431314:role/gha-kumo-preprod-test-s3
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  GITHUB_REF: ${{secrets.GITHUB_REF}}
  GITHUB_API_URL: ${{secrets.GITHUB_API_URL}}
  GITHUB_REPOSITORY: ${{secrets.GITHUB_REPOSITORY}}
  GITHUB_REPOSITORY_OWNER: ${{secrets.GITHUB_REPOSITORY_OWNER}}
  GITHUB_RUN_ID: ${{secrets.GITHUB_RUN_ID}}

jobs:
  pytest:
    environment:
      name: gha-kumo-workflow-tests
      # This job uses environment-scoped OIDC; it does not deploy an application.
      deployment: false
    name: all-snowflake-tests
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        test_name:
          [
            'connector (development/testing/test/connector)',
            'rest (development/testing/test/rest)',
            'fsutil (development/testing/test/io_utils/fsutil)',
            'backend - data (development/testing/test/data/ development/testing/test/graph/',
            'backend - pquery (development/testing/test/pquery/bp_generator)',
            'backend - pquery (development/testing/test/pquery/train_table_generator)',
            'snowflake diskgraph e2e (development/testing/test/rest/integ/test_snowflake_diskgraph_e2e.py)',
            'snowflake ingestion diskgraph e2e (development/testing/test/rest/integ/test_snowflake_ingestion_diskgraph_e2e.py)'
          ]
        include:
          - test_name: 'connector (development/testing/test/connector)'
            test_dir: 'development/testing/test/connector'
            files_changed: |
              .github/actions/setup/action.yml
              .github/workflows/testing_snowflake.yml
              apps/studio/kumo/connector/**
              apps/studio/setup.py
              development/testing/test/connector/**
          - test_name: 'rest (development/testing/test/rest)'
            test_dir: 'development/testing/test/rest --ignore=development/testing/test/rest/integ/test_snowflake_diskgraph_e2e.py --ignore=development/testing/test/rest/integ/test_snowflake_ingestion_diskgraph_e2e.py'
            files_changed: |
              .github/actions/setup/action.yml
              .github/workflows/testing_snowflake.yml
              apps/studio/setup.py
              development/testing/test/rest/**
          - test_name: 'fsutil (development/testing/test/io_utils/fsutil)'
            test_dir: 'development/testing/test/io_utils/fsutil'
            files_changed: |
              .github/actions/setup/action.yml
              .github/workflows/testing_snowflake.yml
              apps/studio/io_utils/**
              apps/studio/setup.py
              development/testing/test/io_utils/fsutil/**
          - test_name: 'backend - data (development/testing/test/data/ development/testing/test/graph/'
            test_dir: 'development/testing/test/data/ development/testing/test/graph/**snowflake**'
            files_changed: |
              .github/actions/setup/action.yml
              .github/workflows/testing_snowflake.yml
              apps/studio/kumo/data/**
              apps/studio/kumo/stats/**
              apps/studio/io_utils/**
              apps/studio/setup.py
              development/testing/test/data/
              development/testing/test/graph/**snowflake**
          - test_name: 'backend - pquery (development/testing/test/pquery/bp_generator)'
            test_dir: 'development/testing/test/pquery/test_pql_batch_pred_generator.py'
            files_changed: |
              .github/actions/setup/action.yml
              .github/workflows/testing_snowflake.yml
              apps/studio/kumo/data/**
              apps/studio/kumo/pquery/**
              apps/studio/io_utils/**
              apps/studio/kumo/data/data_processing_backend/**
              apps/studio/setup.py
              development/testing/test/pquery/test_pql_batch_pred_generator.py
          - test_name: 'backend - pquery (development/testing/test/pquery/train_table_generator)'
            test_dir: 'development/testing/test/pquery/train_table_generator'
            files_changed: |
              .github/actions/setup/action.yml
              .github/workflows/testing_snowflake.yml
              apps/studio/kumo/data/**
              apps/studio/kumo/pquery/**
              apps/studio/io_utils/**
              apps/studio/setup.py
              development/testing/test/pquery/train_table_generator/**
          - test_name: 'snowflake diskgraph e2e (development/testing/test/rest/integ/test_snowflake_diskgraph_e2e.py)'
            test_dir: "development/testing/test/rest/integ/test_snowflake_diskgraph_e2e.py"
            files_changed: |
              .github/actions/setup/action.yml
              .github/workflows/testing_snowflake.yml
              apps/studio/kumo/connector/**
              apps/studio/rest/backends/data_backend/activities/**
              development/testing/test/rest/integ/test_snowflake_diskgraph_e2e.py
              development/testing/test/rest/integ/test_cases/test_snowflake_e2e_fixtures.json
              apps/studio/rest/devserver/configs/diskgraph-test.json
          - test_name: 'snowflake ingestion diskgraph e2e (development/testing/test/rest/integ/test_snowflake_ingestion_diskgraph_e2e.py)'
            test_dir: "development/testing/test/rest/integ/test_snowflake_ingestion_diskgraph_e2e.py"
            files_changed: |
              .github/actions/setup/action.yml
              .github/workflows/testing_snowflake.yml
              apps/studio/kumo/connector/**
              apps/studio/rest/backends/data_backend/activities/**
              development/testing/test/rest/integ/test_snowflake_ingestion_diskgraph_e2e.py
              apps/studio/rest/devserver/configs/diskgraph-test.json


    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 40

      - name: Get any data backend related changes
        id: data-backend-files-changed
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96  # v47.0.6
        with:
          files: |
            ${{ matrix.files_changed }}

      - name: Configure AWS credentials
        if: steps.data-backend-files-changed.outputs.any_changed == 'true' && steps.only-ui-files-changed.outputs.only_changed != 'true' && steps.only-rest-files-changed.outputs.only_changed != 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::926922431314:role/gha-kumo-workflow-tests
          aws-region: us-west-2

      - name: Set up packages
        if: steps.data-backend-files-changed.outputs.any_changed == 'true' && !contains(matrix.test_dir, 'diskgraph') && steps.only-ui-files-changed.outputs.only_changed != 'true' && steps.only-rest-files-changed.outputs.only_changed != 'true'
        uses: ./.github/actions/setup
        with:
          github_token: ${{ secrets.KUMO_GITHUB_BOT_TOKEN }}

      - name: Set up packages (with diskgraph)
        if: steps.data-backend-files-changed.outputs.any_changed == 'true' && contains(matrix.test_dir, 'diskgraph') && steps.only-ui-files-changed.outputs.only_changed != 'true' && steps.only-rest-files-changed.outputs.only_changed != 'true'
        uses: ./.github/actions/setup
        with:
          github_token: ${{ secrets.KUMO_GITHUB_BOT_TOKEN }}

      # NOTE here we use coverage.py instead of pytest-cov to obtain JSON
      # outputs that are easier to parse and manage (pytest-cov/455).
      # coverage.py also has additional nice features that may be useful in the
      # future for better coverage reports.
      - name: Run minimal test suite
        if: steps.data-backend-files-changed.outputs.any_changed == 'true' && github.event_name != 'push' && inputs.full_test != true && steps.only-ui-files-changed.outputs.only_changed != 'true' && steps.only-rest-files-changed.outputs.only_changed != 'true'
        timeout-minutes: 120
        run: |
          set -o pipefail
          export SPARK_LOCAL_IP="127.0.0.1"
          source ./apps/studio/tools/ci_pytest_log_controls.sh
          configure_pytest_ci_output
          GLOG_logtostdout=1 python -m coverage run -m pytest "${PYTEST_CI_OUTPUT_ARGS[@]}" --durations=30 --runsnowflake ${{ matrix.test_dir }}
        env:
          # Least-privilege CI service user; takes precedence over the AWS key.
          SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_CI_USER }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_CI_PRIVATE_KEY }}
          AWS_DEFAULT_REGION: "us-west-2"
          DEPLOY_ENV_CONFIG_FILE: ${{ contains(matrix.test_dir, 'diskgraph') && 'apps/studio/rest/devserver/configs/diskgraph-test.json' || '' }}

      - name: Run full test suite
        if: steps.data-backend-files-changed.outputs.any_changed == 'true' && (github.event_name == 'push' || inputs.full_test == true) && steps.only-ui-files-changed.outputs.only_changed != 'true' && steps.only-rest-files-changed.outputs.only_changed != 'true'
        timeout-minutes: 120
        run: |
          set -o pipefail
          export SPARK_LOCAL_IP="127.0.0.1"
          source ./apps/studio/tools/ci_pytest_log_controls.sh
          configure_pytest_ci_output
          FULL_TEST=1 GLOG_logtostdout=1 python -m coverage run -m pytest "${PYTEST_CI_OUTPUT_ARGS[@]}" --durations=30 --runsnowflake ${{ matrix.test_dir }}
        env:
          # Least-privilege CI service user; takes precedence over the AWS key.
          SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_CI_USER }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_CI_PRIVATE_KEY }}
          AWS_DEFAULT_REGION: "us-west-2"
          DEPLOY_ENV_CONFIG_FILE: ${{ contains(matrix.test_dir, 'diskgraph') && 'apps/studio/rest/devserver/configs/diskgraph-test.json' || '' }}
