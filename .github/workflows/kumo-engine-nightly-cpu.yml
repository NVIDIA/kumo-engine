name: Kumo Engine shared runner CPU checks

on:  # yamllint disable-line rule:truthy
  pull_request:
    paths:
      - '.github/workflows/kumo-engine-nightly-cpu.yml'
      - 'packages/kumo-engine/scripts/nightly_*.py'
      - 'packages/kumo-engine/test/test_nightly_*.py'
      - 'packages/kumo-engine/test/nightly/**'
      - 'docs/development/engine-nightly-ci.md'

permissions:
  contents: read

concurrency:
  group: engine-nightly-cpu-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip --isolated install --index-url https://pypi.org/simple pytest pandas pyarrow boto3
      - run: >-
          python -m pytest -q --noconftest
          packages/kumo-engine/test/test_nightly_configuration.py
          packages/kumo-engine/test/test_nightly_combine.py
          packages/kumo-engine/test/test_nightly_controls.py
          packages/kumo-engine/test/test_nightly_predictions.py
          packages/kumo-engine/test/test_nightly_source_staging.py
          packages/kumo-engine/test/test_nightly_evidence.py
          packages/kumo-engine/test/test_nightly_host.py
          packages/kumo-engine/test/test_nightly_publication_cli.py
