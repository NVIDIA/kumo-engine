name: GCS Testing

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      full_test:
        description: "Run the full test suite"
        type: boolean
        default: true
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ startsWith(github.ref, 'refs/pull/') || github.run_number }}
  # Only cancel intermediate builds if on a PR:
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read

jobs:
  pytest-gcs:
    environment:
      name: gha-kumo-workflow-tests
      # This job uses environment-scoped OIDC; it does not deploy an application.
      deployment: false
    # Keep the three existing e2e check labels when adding capability fields.
    name: gcs-e2e-tests (${{ matrix.test_dir }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_TEST_SERVICE_ACCOUNT: ${{ vars.GCP_TEST_SERVICE_ACCOUNT }}
      GCP_BIGQUERY_NO_TABLE_SERVICE_ACCOUNT: ${{ matrix.restricted_identities && vars.GCP_BIGQUERY_NO_TABLE_SERVICE_ACCOUNT || '' }}
      GCP_BIGQUERY_NO_JOB_SERVICE_ACCOUNT: ${{ matrix.restricted_identities && vars.GCP_BIGQUERY_NO_JOB_SERVICE_ACCOUNT || '' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - test_dir: test/rest/integ/test_gcs_e2e.py
            profile: gcp
            aws: false
            restricted_identities: false
          - test_dir: test/rest/integ/test_bigquery_diskgraph_e2e.py
            profile: gcp-aws
            aws: true
            restricted_identities: false
          - test_dir: test/rest/integ/test_bigquery_ingestion_diskgraph_e2e.py
            profile: gcp
            aws: false
            restricted_identities: false
          - test_dir: test/rest/integ/test_gcs_public_api_e2e.py
            profile: gcp
            aws: false
            restricted_identities: false

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 40

      - name: Determine test impact
        id: test-impact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # Missing history and manual runs execute conservatively.
          if [ -z "$BASE_SHA" ] || ! git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" -- > "$RUNNER_TEMP/test-profile-changes"; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            python3 -c 'import sys; from tools.ci_test_profiles import integration_required; paths = [p for p in sys.stdin.buffer.read().decode("utf-8", "surrogateescape").split("\0") if p]; print("run=" + str(integration_required(paths)).lower())' < "$RUNNER_TEMP/test-profile-changes" >> "$GITHUB_OUTPUT"
          fi

      # Package/wheel bootstrap uses public indexes and GitHub cache/artifacts.
      # Cloud credentials are acquired only after dependency installation.
      - name: Set up packages
        if: steps.test-impact.outputs.run == 'true'
        uses: ./.github/actions/setup

      - name: Configure AWS credentials for the S3 dataplane
        if: steps.test-impact.outputs.run == 'true' && matrix.aws
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::926922431314:role/gha-kumo-workflow-tests
          aws-region: us-west-2

      - name: Authenticate to Google Cloud with GitHub OIDC
        if: steps.test-impact.outputs.run == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TEST_SERVICE_ACCOUNT }}

      - name: Run GCP profile tests
        if: steps.test-impact.outputs.run == 'true'
        timeout-minutes: 60
        run: |
          set -o pipefail
          export SPARK_LOCAL_IP="127.0.0.1"
          source ./tools/ci_pytest_log_controls.sh
          configure_pytest_ci_output
          python -X faulthandler -m tools.ci_test_profiles run "${{ matrix.profile }}" "${PYTEST_CI_OUTPUT_ARGS[@]}" --durations=50 --timeout=1800 --timeout-method=thread ${{ matrix.test_dir }}
        env:
          GCS_TEST_BUCKET: 'kumo-test-bucket'
          GCP_STORAGE_TRANSFER_BUCKET: 'kumo-test-bucket'
          AWS_TEST_ROLE_ARN: ${{ matrix.aws && 'arn:aws:iam::926922431314:role/gha-kumo-preprod-test-s3' || '' }}
          AWS_DEFAULT_REGION: ${{ matrix.aws && 'us-west-2' || '' }}
          FULL_TEST: ${{ (github.event_name == 'push' || inputs.full_test == true) && '1' || '0' }}
          GLOG_logtostdout: '1'
          DEPLOY_STAGE: "test"
          TEMPORAL_SERVER: "localhost"
          DATA_SPARK_MEM: "1g"
          MAX_DATA_BACKEND_WORKER_PROCESSES: "1"
          CUDA: "cpu"
          KUMO_ENABLE_GLOVE: "False"
          SPARK_VERSION: "3.5"
          KUMO_TESTING: "True"
