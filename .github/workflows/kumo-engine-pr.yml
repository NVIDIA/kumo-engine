{
  "name": "Engine campaign CPU wheel",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "engine-campaign-wheel-${{ github.ref }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "wheel": {
      "runs-on": "ubuntu-22.04",
      "timeout-minutes": 60,
      "permissions": {
        "contents": "read"
      },
      "env": {
        "CARGO_BUILD_JOBS": "4",
        "CARGO_TARGET_DIR": "${{ github.workspace }}/packages/diskgraph/target",
        "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER": "${{ github.workspace }}/.engine-build-tools/zigcc",
        "CC_x86_64_unknown_linux_gnu": "${{ github.workspace }}/.engine-build-tools/zigcc",
        "CXX_x86_64_unknown_linux_gnu": "${{ github.workspace }}/.engine-build-tools/zigc++",
        "RANLIB_x86_64_unknown_linux_gnu": "${{ github.workspace }}/.engine-build-tools/zigranlib"
      },
      "steps": [
        {
          "uses": "actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "uses": "./.github/actions/rust-toolchain"
        },
        {
          "uses": "Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32",
          "with": {
            "workspaces": "packages/diskgraph -> target",
            "shared-key": "engine-pr-py312-glibc217-zig017-czb024-linker1",
            "cache-workspace-crates": false,
            "cache-bin": false,
            "save-if": "${{ github.ref == 'refs/heads/main' }}"
          }
        },
        {
          "name": "Build the candidate wheel",
          "run": "set -euo pipefail\nexport PIP_BUILD_CONSTRAINT=\"$RUNNER_TEMP/engine-build-constraints.txt\"\nprintf '%s\\n' 'ziglang==0.17.0' > \"$PIP_BUILD_CONSTRAINT\"\npython -m pip --isolated install 'pip==25.3' 'ziglang==0.17.0' 'cargo-zigbuild==0.24.0'\npython -m pip show ziglang cargo-zigbuild\npython -m ziglang version\n# Keep the linker path and target identical across cargo-zigbuild and\n# maturin's isolated executable, so Cargo can reuse their dependencies.\ncompiler_dir=\"$GITHUB_WORKSPACE/.engine-build-tools\"\nmkdir -p \"$compiler_dir\"\nfor compiler in cc c++; do\n  printf '#!/bin/sh\\nexec cargo-zigbuild zig %s -- -g -fno-sanitize=all -target x86_64-linux-gnu.2.17 -mcpu=x86_64+aes+sse2 \"$@\"\\n' \\\n    \"$compiler\" > \"$compiler_dir/zig$compiler\"\ndone\nprintf '#!/bin/sh\\nexec cargo-zigbuild zig ranlib -- \"$@\"\\n' > \"$compiler_dir/zigranlib\"\nchmod +x \"$compiler_dir\"/*\npackages/kumo-engine/scripts/build_wheel.sh --output-dir \"$RUNNER_TEMP/pr-wheel\"\n"
        },
        {
          "name": "Retain the candidate wheel",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "engine-pr-wheel-${{ github.sha }}",
            "path": "${{ runner.temp }}/pr-wheel/*.whl",
            "compression-level": 0,
            "if-no-files-found": "error",
            "retention-days": 14
          }
        }
      ],
      "name": "Build the integrated Engine wheel on CPU"
    }
  }
}
