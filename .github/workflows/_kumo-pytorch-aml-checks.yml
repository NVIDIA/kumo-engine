name: PyTorch — Dataset & Model Checks

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      diskgraph-wheel-artifact:
        description: DiskGraph wheel built from this run's candidate revision.
        type: string
        required: true

permissions:
  contents: read

jobs:
  checks:
    name: Correctness / Shared Dataset & Model Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: packages/experimental/kumo-pytorch
    env:
      KUMO_CI_LABEL: Shared dataset and model fixtures
      KUMO_CI_REPORTS: |
        $RUNNER_TEMP/*.xml
        $RUNNER_TEMP/*acquisition.json
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/kumo-pytorch-setup
        with:
          diskgraph-wheel-artifact: ${{ inputs.diskgraph-wheel-artifact }}
      - name: Install test-only Polars for required CPU coverage
        run: |
          python3 "$GITHUB_WORKSPACE/test/kumo_pytorch/ci_reporting.py" run \
            --title "$KUMO_CI_LABEL / Install test-only Polars for required CPU coverage" -- bash -e -o pipefail <<'KUMO_CI_COMMAND'
          uv pip install polars==2.1.0
          KUMO_CI_COMMAND
      - name: Check shared dataset/model consumers on tiny Kumo batches
        working-directory: .
        run: |
          python3 "$GITHUB_WORKSPACE/test/kumo_pytorch/ci_reporting.py" run \
            --title "$KUMO_CI_LABEL / Check shared dataset/model consumers on tiny Kumo batches" -- bash -e -o pipefail <<'KUMO_CI_COMMAND'
          python -m pytest -c test/kumo_pytorch/pytest.ini \
            --confcutdir=test/kumo_pytorch --basetemp="$RUNNER_TEMP/aml-checks" \
            test/kumo_pytorch/model_checks --required-coverage=cpu -q --junitxml="$RUNNER_TEMP/aml-checks.xml"
          KUMO_CI_COMMAND
      - name: Retain controlled fixture learning reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: ${{ always() }}
        with:
          name: kumo-pytorch-aml-learning
          path: |
            ${{ runner.temp }}/aml-checks.xml
            ${{ runner.temp }}/aml-checks/**/learning.json
            ${{ runner.temp }}/aml-checks/**/training-acceptance/**/report.json
            ${{ runner.temp }}/aml-checks/**/training-acceptance/**/loss-curve.csv
            ${{ runner.temp }}/aml-checks/**/results.json
            ${{ runner.temp }}/aml-checks/**/finetuning/report.json
            ${{ runner.temp }}/aml-checks/**/*.log
            ${{ runner.temp }}/aml-checks/**/result.json
            ${{ runner.temp }}/aml-checks/**/expected.json
            ${{ runner.temp }}/aml-checks/**/mid-epoch-resume/report.json
            ${{ runner.temp }}/aml-checks/**/mid-epoch-resume/restore-fingerprints.json
            ${{ runner.temp }}/aml-checks/**/coverage.json
            ${{ runner.temp }}/aml-checks/**/report.md
          retention-days: 14
      - name: Publish readable results and full logs
        if: ${{ always() }}
        uses: ./.github/actions/kumo-pytorch-results
        with:
          title: Shared dataset and model fixtures
          artifact: kumo-pytorch-diagnostics-fixtures
          status: ${{ job.status }}
