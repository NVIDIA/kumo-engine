---
name: Wheel Publish

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
    paths:
      - '.github/workflows/nightly.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'diskgraph-*/**'
  workflow_dispatch:

concurrency:
  group: diskgraph-wheel-main
  cancel-in-progress: true

jobs:
  wheel:
    strategy:
      matrix:
        os: [ubuntu-22.04]
        python: ['3.10']
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin

      - name: Set version
        run: |
          BASE_VERSION=$(grep -m1 '^version = ' diskgraph-pybind/pyproject.toml | cut -d '"' -f2)
          if [ -z "$BASE_VERSION" ]; then
            echo "Failed to parse version from diskgraph-pybind/pyproject.toml"
            exit 1
          fi
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)
          TODAY=$(date +'%Y%m%d')
          # Embed commit SHA in version for traceability.
          # PEP 440 local version: 0.1.0+g<sha> (works for direct file installs).
          VERSION="${BASE_VERSION}+g${SHORT_SHA}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "VERSION_TODAY=${BASE_VERSION}.dev${TODAY}" >> $GITHUB_ENV

      - name: Build wheel
        run: |
          # Patch pyproject.toml with versioned string before build
          sed -i "s/^version = .*/version = \"${{ env.VERSION }}\"/" diskgraph-pybind/pyproject.toml
          cat diskgraph-pybind/pyproject.toml | grep version

          maturin build \
            --manifest-path diskgraph-pybind/Cargo.toml \
            --release \
            --interpreter python${{ matrix.python }}

          WHEEL_PATH=$(find target/wheels -maxdepth 1 -type f -name '*.whl' | head -n 1)
          if [ -z "$WHEEL_PATH" ]; then
            echo "No wheel found in target/wheels"
            exit 1
          fi

          echo "WHEEL_PATH=$WHEEL_PATH" >> $GITHUB_ENV
          echo "WHEEL_BASENAME=$(basename "$WHEEL_PATH")" >> $GITHUB_ENV

      - name: Upload wheel
        run: |
          prefix="s3://kumo-diskgraph/packages/${{ matrix.os }}/py${{ matrix.python }}"
          aws s3 cp "${{ env.WHEEL_PATH }}" "$prefix/latest/${{ env.WHEEL_BASENAME }}"
          aws s3 cp "${{ env.WHEEL_PATH }}" "$prefix/${{ env.VERSION_TODAY }}/${{ env.WHEEL_BASENAME }}"
          aws s3 cp "${{ env.WHEEL_PATH }}" "$prefix/commit/${{ github.sha }}/${{ env.WHEEL_BASENAME }}"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: 'us-west-2'
