---
name: Wheel Publish

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
    paths:
      - '.github/workflows/nightly.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'diskgraph-*/**'
  workflow_dispatch:

concurrency:
  group: diskgraph-wheel-main
  cancel-in-progress: true

jobs:
  wheel:
    strategy:
      matrix:
        # Logical target identifier — embedded in the S3 upload path
        # (s3://kumo-diskgraph/packages/<os>/...). Kept stable so
        # consumers (kumo's wheel pin) don't have to change paths when
        # we move the build to a different physical runner.
        os: [ubuntu-22.04]
        python: ['3.10']
    # Physical runner: bigger box (4-core / 16 GB / 150 GB SSD) for
    # build throughput. ABI parity with `ubuntu-22.04` (same Ubuntu
    # major version, same glibc), so wheels remain compatible with
    # consumers expecting an `ubuntu-22.04`-targeted artifact.
    runs-on: ubuntu-22.04-large
    env:
      # See ci.yml for the full rationale: GNU ld peaks ~4 GB per
      # link job on the AWS-SDK / arrow / parquet chain, and 4
      # parallel link jobs (default `nproc` parallelism) exhausts
      # the larger runner's 16 GB. lld (LLVM, Apache 2.0 + LLVM
      # exception) uses a fraction of that. lld picked over mold to
      # avoid AGPL.
      #
      # `+aes,+sse2` repeated because env RUSTFLAGS overrides the
      # workspace `.cargo/config.toml` entirely; gxhash needs them.
      RUSTFLAGS: "-C target-feature=+aes,+sse2 -C link-arg=-fuse-ld=lld"

    steps:
      - uses: actions/checkout@v4

      - name: Install lld linker
        run: sudo apt-get update -qq && sudo apt-get install -y lld

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin

      - name: Set version
        run: |
          BASE_VERSION=$(grep -m1 '^version = ' diskgraph-pybind/pyproject.toml | cut -d '"' -f2)
          if [ -z "$BASE_VERSION" ]; then
            echo "Failed to parse version from diskgraph-pybind/pyproject.toml"
            exit 1
          fi
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)
          TODAY=$(date +'%Y%m%d')
          # Embed commit SHA in version for traceability.
          # PEP 440 local version: 0.1.0+g<sha> (works for direct file installs).
          VERSION="${BASE_VERSION}+g${SHORT_SHA}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "VERSION_TODAY=${BASE_VERSION}.dev${TODAY}" >> $GITHUB_ENV

      - name: Build standalone ingest binary
        # Built separately from the pybind extension because maturin
        # only builds the cdylib extension module (`diskgraph._c`),
        # not Cargo workspace `[[bin]]` targets. The wrapper at
        # kumo-side `kumo/engine/diskgraph/ingest_runner.py` spawns
        # this binary as a subprocess for OOM-recoverable ingest, so
        # it has to ship in the same wheel.
        run: cargo build --release --bin ingest

      - name: Stage ingest binary into Python package
        # Maturin treats `python-source = "python"` (per
        # `diskgraph-pybind/pyproject.toml`) as the package root and
        # bundles every file under it into the wheel. Dropping the
        # binary at `python/diskgraph/bin/ingest` makes the wheel
        # contain `diskgraph/bin/ingest`, which is exactly where the
        # consumer wrapper's `_resolve_ingest_bin()` looks (step 2
        # in its lookup order).
        run: |
          mkdir -p diskgraph-pybind/python/diskgraph/bin
          cp target/release/ingest diskgraph-pybind/python/diskgraph/bin/ingest
          chmod +x diskgraph-pybind/python/diskgraph/bin/ingest
          ls -la diskgraph-pybind/python/diskgraph/bin/

      - name: Verify staged ingest binary loads
        run: diskgraph-pybind/python/diskgraph/bin/ingest --version

      - name: Build wheel
        run: |
          # Patch pyproject.toml with versioned string before build
          sed -i "s/^version = .*/version = \"${{ env.VERSION }}\"/" diskgraph-pybind/pyproject.toml
          cat diskgraph-pybind/pyproject.toml | grep version

          maturin build \
            --manifest-path diskgraph-pybind/Cargo.toml \
            --release \
            --interpreter python${{ matrix.python }}

          WHEEL_PATH=$(find target/wheels -maxdepth 1 -type f -name '*.whl' | head -n 1)
          if [ -z "$WHEEL_PATH" ]; then
            echo "No wheel found in target/wheels"
            exit 1
          fi

          echo "WHEEL_PATH=$WHEEL_PATH" >> $GITHUB_ENV
          echo "WHEEL_BASENAME=$(basename "$WHEEL_PATH")" >> $GITHUB_ENV

      - name: Verify ingest binary is in wheel
        # Defensive check: if maturin's include rules ever change
        # (e.g. someone adds an explicit `include` directive that
        # excludes binaries), the wheel ships without the binary
        # and consumers fail at runtime with FileNotFoundError. Fail
        # the build here instead.
        run: |
          if ! python -m zipfile -l "${{ env.WHEEL_PATH }}" | grep -q 'diskgraph/bin/ingest'; then
            echo "ERROR: wheel does not contain diskgraph/bin/ingest"
            python -m zipfile -l "${{ env.WHEEL_PATH }}" | grep -E 'diskgraph/(bin|_c)' || true
            exit 1
          fi
          echo "ingest binary present in wheel"

      - name: Upload wheel
        run: |
          prefix="s3://kumo-diskgraph/packages/${{ matrix.os }}/py${{ matrix.python }}"
          aws s3 cp "${{ env.WHEEL_PATH }}" "$prefix/latest/${{ env.WHEEL_BASENAME }}"
          aws s3 cp "${{ env.WHEEL_PATH }}" "$prefix/${{ env.VERSION_TODAY }}/${{ env.WHEEL_BASENAME }}"
          aws s3 cp "${{ env.WHEEL_PATH }}" "$prefix/commit/${{ github.sha }}/${{ env.WHEEL_BASENAME }}"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: 'us-west-2'
