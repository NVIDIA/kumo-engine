---
name: Wheel Publish

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
    paths:
      - '.github/workflows/nightly.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'pyproject.toml'
      - 'scripts/build_python_wheel.sh'
      - 'diskgraph-*/**'
  workflow_dispatch:

concurrency:
  group: diskgraph-wheel-main
  cancel-in-progress: true

jobs:
  wheel:
    strategy:
      matrix:
        # Logical target identifier — embedded in the S3 upload path
        # (s3://kumo-diskgraph/packages/<os>/...). Kept stable so
        # consumers (kumo's wheel pin) don't have to change paths when
        # we move the build to a different physical runner.
        os: [ubuntu-22.04]
        # The native module is built abi3 (limited API, floor py310; see
        # pyproject.toml [tool.maturin] features pyo3/abi3-py310). One
        # cp310-abi3 wheel loads on CPython 3.10 .. 3.14+, so we build with
        # a single interpreter. `python` here only selects which CPython
        # headers maturin links and the S3 path label below — the artifact
        # itself is interpreter-independent across 3.10+. The S3 `py3.10`
        # prefix is kept stable as a consumer-contract path (kumo's wheel
        # pin reads it); the abi3 wheel there installs on 3.14 unchanged.
        python: ['3.10']
    # Physical runner: bigger box (4-core / 16 GB / 150 GB SSD) for
    # build throughput. ABI parity with `ubuntu-22.04` (same Ubuntu
    # major version, same glibc), so wheels remain compatible with
    # consumers expecting an `ubuntu-22.04`-targeted artifact.
    runs-on: ubuntu-22.04-large
    env:
      # See ci.yml for the full rationale: GNU ld peaks ~4 GB per
      # link job on the AWS-SDK / arrow / parquet chain, and 4
      # parallel link jobs (default `nproc` parallelism) exhausts
      # the larger runner's 16 GB. lld (LLVM, Apache 2.0 + LLVM
      # exception) uses a fraction of that. lld picked over mold to
      # avoid AGPL.
      #
      # `+aes,+sse2` repeated because env RUSTFLAGS overrides the
      # workspace `.cargo/config.toml` entirely; gxhash needs them.
      RUSTFLAGS: "-C target-feature=+aes,+sse2 -C link-arg=-fuse-ld=lld"

    steps:
      - uses: actions/checkout@v4

      - name: Install lld linker
        run: sudo apt-get update -qq && sudo apt-get install -y lld

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Set version
        run: |
          BASE_VERSION=$(grep -m1 '^version = ' pyproject.toml | cut -d '"' -f2)
          if [ -z "$BASE_VERSION" ]; then
            echo "Failed to parse version from pyproject.toml"
            exit 1
          fi
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)
          TODAY=$(date +'%Y%m%d')
          # Embed commit SHA in version for traceability.
          # PEP 440 local version: 0.1.0+g<sha> (works for direct file installs).
          VERSION="${BASE_VERSION}+g${SHORT_SHA}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "VERSION_TODAY=${BASE_VERSION}.dev${TODAY}" >> $GITHUB_ENV

      - name: Build wheel
        run: |
          scripts/build_python_wheel.sh \
            --python python${{ matrix.python }} \
            --version "${{ env.VERSION }}" \
            --out target/wheels \
            --zig

          WHEEL_PATH=$(find target/wheels -maxdepth 1 -type f -name '*.whl' | head -n 1)
          if [ -z "$WHEEL_PATH" ]; then
            echo "No wheel found in target/wheels"
            exit 1
          fi

          # Guard the abi3 contract: the published artifact must be the
          # stable-ABI wheel that serves 3.10 .. 3.14+. A plain cp310 (or
          # any cpXY-non-abi3) wheel here would silently break the
          # "single wheel for all interpreters" promise.
          case "$(basename "$WHEEL_PATH")" in
            *-abi3-*) echo "OK: abi3 wheel $(basename "$WHEEL_PATH")" ;;
            *) echo "ERROR: expected an abi3 wheel, got $(basename "$WHEEL_PATH")"; exit 1 ;;
          esac

          echo "WHEEL_PATH=$WHEEL_PATH" >> $GITHUB_ENV
          echo "WHEEL_BASENAME=$(basename "$WHEEL_PATH")" >> $GITHUB_ENV

      - name: Upload wheel
        run: |
          prefix="s3://kumo-diskgraph/packages/${{ matrix.os }}/py${{ matrix.python }}"
          aws s3 cp "${{ env.WHEEL_PATH }}" "$prefix/latest/${{ env.WHEEL_BASENAME }}"
          aws s3 cp "${{ env.WHEEL_PATH }}" "$prefix/${{ env.VERSION_TODAY }}/${{ env.WHEEL_BASENAME }}"
          aws s3 cp "${{ env.WHEEL_PATH }}" "$prefix/commit/${{ github.sha }}/${{ env.WHEEL_BASENAME }}"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: 'us-west-2'
