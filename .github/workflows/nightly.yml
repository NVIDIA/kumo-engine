---
name: Nightly Build

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"  # Everyday at 6:00am UTC/10:00pm PST

jobs:
  wheel:
    strategy:
      matrix:
        os: [ubuntu-22.04]
        python: ['3.10']
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin

      - name: Set version
        run: |
          VERSION=$(grep -m1 '^version = ' diskgraph-pybind/pyproject.toml | cut -d '"' -f2)
          if [ -z "$VERSION" ]; then
            echo "Failed to parse version from diskgraph-pybind/pyproject.toml"
            exit 1
          fi
          echo "VERSION_NUM=${VERSION}" >> $GITHUB_ENV

      - name: Set time
        run: echo "TODAY=$(date +'%Y%m%d')" >> $GITHUB_ENV

      - name: Set version with date
        run: echo "VERSION_TODAY=${{ env.VERSION_NUM }}.dev${{ env.TODAY }}" >> $GITHUB_ENV

      - name: Build wheel
        run: |
          maturin build \
            --manifest-path diskgraph-pybind/Cargo.toml \
            --release \
            --interpreter python${{ matrix.python }}

          WHEEL_PATH=$(find target/wheels -maxdepth 1 -type f -name '*.whl' | head -n 1)
          if [ -z "$WHEEL_PATH" ]; then
            echo "No wheel found in target/wheels"
            exit 1
          fi

          echo "WHEEL_PATH=$WHEEL_PATH" >> $GITHUB_ENV
          echo "WHEEL_BASENAME=$(basename "$WHEEL_PATH")" >> $GITHUB_ENV

      - name: Upload wheel
        run: |
          prefix="s3://kumo-diskgraph/packages/${{ matrix.os }}/py${{ matrix.python }}"
          aws s3 cp "${{ env.WHEEL_PATH }}" "$prefix/latest/${{ env.WHEEL_BASENAME }}"
          aws s3 cp "${{ env.WHEEL_PATH }}" "$prefix/${{ env.VERSION_TODAY }}/${{ env.WHEEL_BASENAME }}"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: 'us-west-2'
