name: Testing and Coverage

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
    paths-ignore: ["ui/**", "tools/**"]
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      full_test:
        description: "Run the full test suite"
        type: boolean
        default: true
        required: false
      store_durations:
        description: "Record pytest-split durations (forces minimal mode)"
        type: boolean
        default: false
        required: false
  workflow_call:
    inputs:
      full_test:
        type: boolean
        default: false
        required: false
      store_durations:
        type: boolean
        default: false
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ startsWith(github.ref, 'refs/pull/') || github.run_number }}
  # Only cancel intermediate builds if on a PR:
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read
  id-token: write

env:
  AWS_TEST_ROLE_ARN: arn:aws:iam::926922431314:role/gha-kumo-preprod-test-s3
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  GITHUB_REF: ${{secrets.GITHUB_REF}}
  GITHUB_API_URL: ${{secrets.GITHUB_API_URL}}
  GITHUB_REPOSITORY: ${{secrets.GITHUB_REPOSITORY}}
  GITHUB_REPOSITORY_OWNER: ${{secrets.GITHUB_REPOSITORY_OWNER}}
  GITHUB_RUN_ID: ${{secrets.GITHUB_RUN_ID}}
  # Where the conftest flake-diagnostics hook writes per-test dumps of
  # Temporal workflow histories + subprocess stacks. Uploaded as an
  # artifact on test failure; see the "Upload flake diagnostics" step.
  ARTIFACTS_DIR: /home/runner/kumo-test-artifacts
  # True when we should record pytest-split durations. Forces minimal-mode
  # pytest to run (bypassing the only_changed short-circuit), appends
  # --store-durations to the pytest invocation, and enables the per-shard
  # durations artifact upload + durations-aggregate job.
  STORE_DURATIONS: ${{ inputs.store_durations == true }}
  # True for push-to-main runs and for manual dispatch/call with full_test=true
  # (unless store_durations is also set, which forces minimal mode).
  RUN_FULL_TEST: ${{ github.event_name == 'push' || (inputs.full_test == true && inputs.store_durations != true) }}
  # True when pytest must run even if only_changed says no pytest-affecting
  # files changed. Currently only durations-recording runs set this — they
  # need the full matrix of tests to actually execute to produce a complete
  # .test_durations file regardless of what changed.
  FORCE_RUN_TESTS: ${{ inputs.store_durations == true }}

jobs:
  diskgraph-wheel:
    permissions:
      contents: read
    uses: ./.github/workflows/_diskgraph-wheel.yml

  pytest:
    needs: [diskgraph-wheel]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    continue-on-error: true
    environment:
      name: azure-adls-tests
      # This job uses environment-scoped credentials for tests; it does not
      # deploy an application. Avoid one deployment record per matrix shard.
      deployment: false
    permissions:
      contents: read
      id-token: write
    env:
      KUMO_RUN_ADLS_TESTS: ${{ github.repository == 'kumo-ai/kumo' && contains(matrix.test_dir, 'test/io_utils/') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '1' || '0' }}
      KUMO_RUN_GCP_TESTS: ${{ github.repository == 'kumo-ai/kumo' && (contains(matrix.test_dir, 'test/io_utils/') || contains(matrix.test_dir, 'test/connector/') || contains(matrix.test_dir, 'test/rest/test_*.py')) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '1' || '0' }}
      AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
      AZURE_CONTAINER_NAME: ${{ vars.AZURE_CONTAINER_NAME }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_TEST_SERVICE_ACCOUNT: ${{ vars.GCP_TEST_SERVICE_ACCOUNT }}
      GCP_BIGQUERY_NO_TABLE_SERVICE_ACCOUNT: ${{ vars.GCP_BIGQUERY_NO_TABLE_SERVICE_ACCOUNT }}
      GCP_BIGQUERY_NO_JOB_SERVICE_ACCOUNT: ${{ vars.GCP_BIGQUERY_NO_JOB_SERVICE_ACCOUNT }}

    strategy:
      fail-fast: false
      matrix:
        test_dir: [
          # Core components
          "test/pquery/",
          test/data/,
          "test/train/",
          "test/automl/",
          test/config/ test/connector/,
          test/engine/ test/metrics/,
          test/service_framework/ test/task/ test/utils/ test/callback/ test/async_utils/test_blockbuster_guard.py test/async_utils/test_loop_guards.py,
          test/stats/ test/explain/ test/e2e,
          test/graph/,
          "--splits 2 --group 1 test/io_utils/",
          "--splits 2 --group 2 test/io_utils/",
          # test_provision_terminal_nonretry.py needs a real Temporal Cloud
          # connection (devapp AWS SM creds or TEMPORAL_SERVER=cloud); it
          # has no local-dev-server fallback, so it can't run in this matrix.
          "test/pool --ignore=test/pool/test_provision_terminal_nonretry.py",
          "test/api_contract test/release_tests/test_build_kumo_images.py test/release_tests/test_check_updated_release_branches.py test/release_tests/test_make_kumo3_hotfix_release.py test/release_tests/test_release_v3_guards.py test/release_tests/test_start_kumo3_release.py",

          # Public API tests
          "-k graph-saas_static_multiclassclassification_base test/rest/integ/test_e2e_public_api.py",
          "-k graph-saas_static_binaryclassification_base test/rest/integ/test_e2e_public_api.py",

          # Public API parametrize cases inherited from the (now-deleted)
          # test_e2e_public_api_v1.py — covers the 4 merged tests
          # (test_freeze_pquery_at_job_launch, test_invalid_job_request,
          # test_e2e_baseline_flow_decoupled, test_e2e_flow_decoupled).

          "-k graph-saas_temporal_binaryclassification_base test/rest/integ/test_e2e_public_api.py",
          "-k graph-saas_temporal_regression_base test/rest/integ/test_e2e_public_api.py",
          "-k graph-saas_static_linkprediction_base test/rest/integ/test_e2e_public_api.py",

          # Other REST tests (public and integ should always be separated)
          "test/rest/integ/test_graph_validation.py",
          "test/rest/auth/ test/rest/public/",
          "test/rest/integ/black_box/test_public_api_key_auth_flow.py test/rest/integ/test_ml_backend.py test/rest/integ/test_schema.py test/rest/integ/test_job_tags.py",
          "test/rest/integ/test_warm_start_training_e2e.py",
          "test/rest/integ/test_ui_to_sdk_e2e.py",
          "test/rest/backends test/rest/config test/rest/driver test/rest/routers test/rest/utils test/rest/uxrt",
          "test/temporalio_commons",
          "test/docker",
          "test/deploy/test_cloud_storage_preflight.py",
          "test/rest/integ/test_data_variety/test_table_lifecycle.py",
          # GCS e2e tests moved to testing_gcs.yml (requires IS_GCP_DEPLOY=1)
          "--splits 2 --group 1 test/rest/test_*.py",
          "--splits 2 --group 2 test/rest/test_*.py",
          "-k '[local]' test/rest/integ/test_diskgraph_e2e.py",
          "-k '[s3]' test/rest/integ/test_diskgraph_e2e.py",  # needs S3 dataplane
          "-k '[local]' test/rest/integ/test_diskgraph_public_api_e2e.py",
          "-k '[s3]' test/rest/integ/test_diskgraph_public_api_e2e.py",  # needs S3 dataplane
          "-k '[local]' test/rest/integ/test_diskgraph_custom_tt_e2e.py",
          "-k '[s3]' test/rest/integ/test_diskgraph_custom_tt_e2e.py",  # needs S3 dataplane
          "test/rest/integ/test_weighted_table_e2e.py",  # custom-TT REST flow (unparked from test/legacy/)
          "test/statedb",
        ]

    outputs:
      # Push built coverage report to gh-pages only when pytest is triggered on main.
      push-gh-pages: ${{ steps.non-pytest-changes.outputs.only_changed != 'true' }}

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 40

      - name: Set up Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: "3.14"
          activate-environment: true

      # This enables us to skip the minimal python tests.
      # Note, it's not possible use the standard `on.pull_request` method to
      # do this, as we need to mark the overall workflow as success to satisfy
      # the main branch protection rule, and this does not happen if we skip
      # the entire workflow
      #
      # uv.lock is deliberately NOT in this list: `uv lock --check` (the
      # uv_lock job) only proves the lock's metadata is fresh, not that the
      # resolved versions actually install or import cleanly. A lock-only
      # dependency bump must still run the real install + test suite.
      - name: Check for only non pytest required file changes
        id: non-pytest-changes
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62  # v47.0.0
        with:
          files: |
            ui/**
            CHANGELOG.md
            tools/**
            benchmark/**

      - name: Configure AWS credentials
        if: env.FORCE_RUN_TESTS == 'true' || steps.non-pytest-changes.outputs.only_changed != 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::926922431314:role/gha-kumo-workflow-tests
          aws-region: us-west-2

      - name: Set up packages
        if: env.FORCE_RUN_TESTS == 'true' || steps.non-pytest-changes.outputs.only_changed != 'true'
        uses: ./.github/actions/setup
        with:
          github_token: ${{ secrets.KUMO_GITHUB_BOT_TOKEN }}
          diskgraph-wheel-artifact: diskgraph-wheel
          install-graphviz: ${{ matrix.test_dir == 'test/graph/' }}

      - name: Log in to Azure with GitHub OIDC
        if: (env.FORCE_RUN_TESTS == 'true' || steps.non-pytest-changes.outputs.only_changed != 'true') && env.KUMO_RUN_ADLS_TESTS == '1'
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43  # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticate to Google Cloud with GitHub OIDC
        if: (env.FORCE_RUN_TESTS == 'true' || steps.non-pytest-changes.outputs.only_changed != 'true') && env.KUMO_RUN_GCP_TESTS == '1'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TEST_SERVICE_ACCOUNT }}

      - name: Set up coverage artifact name
        run: |
          # This name must avoid using special chars and must be unique per:
          # run id (to collect coverage results in the subsequent job)
          # test dir (to avoid filename conflicts between different test dirs)
          echo "ARTIFACT_NAME_SAFE=.coverage-${{ github.run_id }}-$(echo -n ${{ matrix.test_dir }} | sha256sum | awk '{print $1}')" >> $GITHUB_ENV

      - name: Set up flake diagnostics
        run: |
          mkdir -p "$ARTIFACTS_DIR"
          # Ubuntu runners default to kernel.yama.ptrace_scope=1, which
          # blocks py-spy from attaching to sibling Python processes even
          # as the same user. Loosen so the conftest on-failure hook can
          # dump subprocess stacks.
          sudo sysctl -w kernel.yama.ptrace_scope=0 || true
          # py-spy is used by the on-failure flake-diagnostics hook to
          # dump stacks of subprocess workers the pytest faulthandler misses.
          uv pip install py-spy || true

      - name: Run minimal test suite
        if: env.RUN_FULL_TEST != 'true' && (env.FORCE_RUN_TESTS == 'true' || steps.non-pytest-changes.outputs.only_changed != 'true')
        timeout-minutes: 60
        run: |
          set -o pipefail
          export SPARK_LOCAL_IP="127.0.0.1"
          source ./tools/ci_pytest_log_controls.sh
          configure_pytest_ci_output
          start_ci_memory_monitor
          # --splitting-algorithm least_duration: default duration_based_chunks
          # leaves a trailing group empty (pytest exit 5) when a single test
          # exceeds the per-group duration target (e.g.
          # test_db_file_storage::test_compression at ~511s in
          # test/rest/test_*.py). No-op when --splits is not in matrix.test_dir.
          GLOG_logtostdout=1 python -X faulthandler -m coverage run -m pytest "${PYTEST_CI_OUTPUT_ARGS[@]}" --durations=50 --timeout=1800 --timeout-method=signal --splitting-algorithm least_duration ${{ env.STORE_DURATIONS == 'true' && '--store-durations --durations-path=.test_durations' || '' }} ${{ matrix.test_dir }}
          move_coverage_artifact
        # Mirror local-test-relevant additions in setup.cfg [tool:pytest] env.
        env:
          # Set to "1" in a PR branch to re-enable io_utils.fsutil DEBUG logs
          # while debugging filesystem behavior.
          KUMO_PYTEST_ENABLE_FSUTIL_DEBUG_LOGS: "0"
          SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          GCS_TEST_BUCKET: 'kumo-test-bucket'
          KUMO_GCP_WORKLOAD_EXCHANGE_ENABLED: ${{ env.KUMO_RUN_GCP_TESTS == '1' && 'true' || 'false' }}
          AWS_DEFAULT_REGION: "us-west-2"
          DEPLOY_STAGE: "test"
          TEMPORAL_SERVER: "localhost"
          DATA_SPARK_MEM: "1g"
          MAX_DATA_BACKEND_WORKER_PROCESSES: "1"
          CUDA: "cpu"
          KUMO_ENABLE_GLOVE: "False"
          SPARK_VERSION: "3.5"
          KUMO_TESTING: "True"
          DEPLOY_ENV_CONFIG_FILE: ${{ contains(matrix.test_dir, 'test/rest/integ/test_diskgraph') && 'rest/devserver/configs/diskgraph-test.json' || '' }}

      - name: Run full test suite
        if: env.RUN_FULL_TEST == 'true' && steps.non-pytest-changes.outputs.only_changed != 'true'
        timeout-minutes: 90
        run: |
          set -o pipefail
          export SPARK_LOCAL_IP="127.0.0.1"
          source ./tools/ci_pytest_log_controls.sh
          configure_pytest_ci_output
          # --timeout=4500 fires below the 90-min step cap so pytest-timeout
          # gets a chance to run; --timeout-method=signal so the on-failure
          # flake-diagnostics hook runs before the process exits.
          FULL_TEST=1 GLOG_logtostdout=1 python -X faulthandler -m coverage run -m pytest "${PYTEST_CI_OUTPUT_ARGS[@]}" --durations=50 --timeout=4500 --timeout-method=signal --splitting-algorithm least_duration ${{ matrix.test_dir }}
          move_coverage_artifact
        env:
          # Set to "1" in a PR branch to re-enable io_utils.fsutil DEBUG logs
          # while debugging filesystem behavior.
          KUMO_PYTEST_ENABLE_FSUTIL_DEBUG_LOGS: "0"
          SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          GCS_TEST_BUCKET: 'kumo-test-bucket'
          KUMO_GCP_WORKLOAD_EXCHANGE_ENABLED: ${{ env.KUMO_RUN_GCP_TESTS == '1' && 'true' || 'false' }}
          AWS_DEFAULT_REGION: "us-west-2"
          DEPLOY_STAGE: "test"
          TEMPORAL_SERVER: "localhost"
          DATA_SPARK_MEM: "1g"
          MAX_DATA_BACKEND_WORKER_PROCESSES: "1"
          CUDA: "cpu"
          SPARK_VERSION: "3.5"
          KUMO_TESTING: "True"
          DEPLOY_ENV_CONFIG_FILE: ${{ contains(matrix.test_dir, 'test/rest/integ/test_diskgraph') && 'rest/devserver/configs/diskgraph-test.json' || '' }}

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.ARTIFACT_NAME_SAFE }}
          path: ${{ env.ARTIFACT_NAME_SAFE }}
          include-hidden-files: true

      - name: Upload flake diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: flake-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
          path: ${{ env.ARTIFACTS_DIR }}
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Upload durations artifact
        # success() ensures a failed shard won't publish suspect durations.
        # The aggregate job's strict count check (below) turns a missed
        # upload into a loud workflow failure rather than a silent partial merge.
        if: success() && env.STORE_DURATIONS == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # The `-of-<total>` suffix lets the aggregate job verify it received
          # every shard; total tracks the matrix size automatically.
          name: durations-${{ github.run_id }}-${{ strategy.job-index }}-of-${{ strategy.job-total }}
          path: .test_durations
          include-hidden-files: true
          if-no-files-found: ignore

  diskgraph-rust:
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: '2'
      RUSTFLAGS: '-C target-feature=+aes,+sse2 -C link-arg=-fuse-ld=lld -C debuginfo=line-tables-only'
      GITHUB_TOKEN: ''
      GITHUB_REF: ${{ github.ref }}
      GITHUB_API_URL: ${{ github.api_url }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
      GITHUB_RUN_ID: ${{ github.run_id }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: packages/diskgraph
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/apt-install
        timeout-minutes: 12
        with:
          packages: lld
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          # Pinned: a new stable clippy adds lints that fail unchanged code.
          toolchain: 1.98.1
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: '3.11'
          activate-environment: true
          enable-cache: false
      - id: python
        run: echo "version=$(python -c 'import platform; print(platform.python_version())')" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: packages/diskgraph -> target
          key: rust-tests-py${{ steps.python.outputs.version }}
      - run: cargo test --locked --workspace

  diskgraph-clippy:
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: '2'
      RUSTFLAGS: '-C target-feature=+aes,+sse2 -C link-arg=-fuse-ld=lld -C debuginfo=line-tables-only'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: packages/diskgraph
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/apt-install
        timeout-minutes: 12
        with:
          packages: lld
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          # Pinned: a new stable clippy adds lints that fail unchanged code.
          toolchain: 1.98.1
          components: clippy
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: '3.11'
          activate-environment: true
          enable-cache: false
      - id: python
        run: echo "version=$(python -c 'import platform; print(platform.python_version())')" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: packages/diskgraph -> target
          key: clippy-py${{ steps.python.outputs.version }}
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  diskgraph-python:
    needs: [diskgraph-wheel]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ''
      GITHUB_REF: ${{ github.ref }}
      GITHUB_API_URL: ${{ github.api_url }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
      GITHUB_RUN_ID: ${{ github.run_id }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: '3.11'
          activate-environment: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: diskgraph-wheel
          path: dist
      - name: Build and install local wheels
        run: |
          uv build --wheel --out-dir dist packages/kumo-api
          uv build --wheel --out-dir dist packages/kumo-pql
          uv pip install dist/*.whl pytest
      - name: Run the wheel's ingest for the tests' `cargo run`
        run: |
          shim="$RUNNER_TEMP/cargo-shim"
          mkdir -p "$shim"
          cat > "$shim/cargo" <<'SH'
          #!/bin/bash
          set -euo pipefail
          # Strict on purpose: anything else would compile.
          if [ "${*:1:5}" != "run --release --bin ingest --" ]; then
            echo "cargo shim: unexpected cargo $*" >&2
            exit 1
          fi
          exec "$DISKGRAPH_INGEST" "${@:6}"
          SH
          chmod +x "$shim/cargo"
          echo "$shim" >> "$GITHUB_PATH"
          ingest=$(python -c 'import diskgraph, pathlib; print(pathlib.Path(diskgraph.__file__).parent / "bin" / "ingest")')
          echo "DISKGRAPH_INGEST=$ingest" >> "$GITHUB_ENV"
      - name: Test installed native package
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/diskgraph/diskgraph-pybind/python/tests
        run: |
          python="$VIRTUAL_ENV/bin/python"
          cd "$RUNNER_TEMP"
          "$python" -m pytest --import-mode=importlib \
            --confcutdir="$GITHUB_WORKSPACE/packages/diskgraph" \
            -k 'not test_benchmark_uses_selected_graph' \
            "$GITHUB_WORKSPACE/packages/diskgraph/diskgraph-pybind/python/tests" -q
      - name: Verify the same abi3 wheel on Python 3.14
        run: |
          wheels=(dist/diskgraph-*-abi3-*.whl)
          test -f "${wheels[0]}"
          uv venv --python 3.14 "$RUNNER_TEMP/diskgraph-abi3"
          uv pip install --python "$RUNNER_TEMP/diskgraph-abi3/bin/python" "${wheels[0]}"
          "$RUNNER_TEMP/diskgraph-abi3/bin/python" - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          import diskgraph
          import diskgraph._c as native

          assert hasattr(native, 'TimeUnit')
          ingest = Path(diskgraph.__file__).parent / 'bin' / 'ingest'
          assert os.access(ingest, os.X_OK), ingest
          subprocess.run([str(ingest), '--help'], check=True)
          PY

  packages:
    # The suites under packages/ are the only thing enforcing the source-reader
    # package boundary (a reader package may not import the monolith, may not
    # import a foreign vendor SDK, and must stay cheap to import at top level).
    # The repository's primary interpreter runs every package suite and
    # consumer check.
    needs: [diskgraph-wheel]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}

      - name: Set up packages
        uses: ./.github/actions/setup
        with:
          github_token: ${{ secrets.KUMO_GITHUB_BOT_TOKEN }}
          diskgraph-wheel-artifact: diskgraph-wheel

      - name: Build and import Kumo-core wheel
        run: |
          output_dir="${RUNNER_TEMP}/kumo-core"
          uv build --wheel --out-dir "$output_dir" packages/kumo-core
          uv build --wheel --out-dir "$output_dir" packages/kumo-api
          uv pip install --force-reinstall --no-deps "$output_dir"/*.whl
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH python -c "import kumo_core, kumo_core.encoders, kumo_core.evaluation, kumo_core.explain, kumo_core.features, kumo_core.modeling, kumo_core.sampling, kumo_core.training; print(kumo_core.__file__)"

      - name: Run the packages/ test suites
        # Each suite runs from its own package directory and with no PYTHONPATH
        # set: the import roots live in that package's
        # `[tool.pytest.ini_options] pythonpath`, and a PYTHONPATH override
        # would shadow the ini and break `kumo_core` / `sources` imports.
        # Snowflake, Databricks and BigQuery live modules require their
        # KUMO_<PROVIDER>_LIVE flag to be exactly "1". Disabled collection
        # skips before credential lookup; enabled misconfiguration fails.
        # `-rs` prints the skip reasons so an empty live tier stays visible.
        run: |
          status=0
          for package in kumo-pql kumo-core kumo-snowflake kumo-bigquery \
                         kumo-databricks kumo-s3 kumo-gcs kumo-adls; do
            echo "::group::pytest packages/$package"
            if [ "$package" = kumo-core ]; then
              (cd "packages/$package" && python -m pytest -rs --cov=kumo_core --cov-report=term-missing --cov-report=xml) || status=1
            else
              (cd "packages/$package" && python -m pytest -rs) || status=1
            fi
            echo "::endgroup::"
          done
          exit $status

      - name: Upload Kumo-core CPU coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kumo-core-cpu-coverage
          path: |
            packages/kumo-core/.coverage*
            packages/kumo-core/coverage.xml
          if-no-files-found: ignore

      - name: Test installed Kumo-core distributions
        run: make test-kumo-core-artifact

      - name: Run focused Kumo-core consumers
        run: make test-kumo-core-consumers

      # kumo-engine ships the `kumo.engine` submodule of the same `kumo`
      # namespace package the root app owns. Exercise the wheel in isolation
      # before/after install so a stale or partial install can't leave
      # `kumo.engine` resolvable when it shouldn't be.
      - name: Install ADLS provider for engine integration tests
        run: uv pip install --no-deps -e packages/kumo-adls

      - name: Build and test the isolated kumo-engine wheel
        run: |
          python -c "import importlib.util; assert importlib.util.find_spec('kumo.engine') is None"
          uv build --wheel packages/kumo-engine \
            --out-dir "$RUNNER_TEMP/kumo-engine-dist"
          wheel=$(find "$RUNNER_TEMP/kumo-engine-dist" -maxdepth 1 \
            -name 'kumo_engine-*.whl' -print -quit)
          test -n "$wheel"
          uv pip install --no-deps "$wheel"
          python - <<'PY'
          from pathlib import Path

          import kumo.engine

          package = Path(kumo.engine.__file__).resolve()
          source = (Path.cwd() / 'packages/kumo-engine').resolve()
          assert not package.is_relative_to(source), package
          print(f"testing installed local package at {package}")
          PY
          status=0
          export KUMO_ENGINE_SOURCE_ROOT="$PWD/packages/kumo-engine"
          cat > "$RUNNER_TEMP/assert_installed_kumoai.py" <<'PY'
          import os
          from pathlib import Path


          def pytest_collection_finish(session):
              import kumo.engine

              package = Path(kumo.engine.__file__).resolve()
              source = Path(os.environ['KUMO_ENGINE_SOURCE_ROOT']).resolve()
              assert not package.is_relative_to(source), package
              print(f"collected tests against installed package at {package}")
          PY
          (
            cd "$RUNNER_TEMP"
            python -m pytest --import-mode=append \
              -p assert_installed_kumoai \
              -c "$KUMO_ENGINE_SOURCE_ROOT/pyproject.toml" -rs \
              "$KUMO_ENGINE_SOURCE_ROOT/test"
          ) || status=$?
          uv pip uninstall kumo-engine
          python - <<'PY'
          import importlib.util

          assert importlib.util.find_spec('kumo.engine') is None
          PY
          exit $status

      # The SDK's own wheel matrix installs `[test]` and the Snowflake client
      # libraries alone, never `core`, so its `kumo_core`-gated tests are
      # skipped there; adding a vendor extra would pull torch onto three
      # operating systems, since every one of them names `core`. `--no-deps`
      # keeps this resolve from moving torch or pydantic under the suites
      # that just ran.
      #
      # `kumo-snowflake`, `kumo-databricks`, `kumo-bigquery`,
      # `kumo-s3` and `kumo-gcs` are installed for the same reason
      # `kumo-core` is: the SDK suite has modules that name each plugin's
      # types, and no other job installs a plugin distribution at all.
      # Without them here those modules are collected by no job.
      - name: Run the kumo-sdk suite against kumo_core
        run: |
          uv pip install --no-deps -e packages/kumo-core -e packages/kumo-s3 -e packages/kumo-gcs -e packages/kumo-snowflake -e packages/kumo-databricks -e packages/kumo-bigquery -e packages/kumo-sdk
          uv pip install pytest-mock requests-mock
          python -c "import kumo_core, kumo_s3, kumo_gcs, kumo_snowflake, kumo_databricks, kumo_bigquery, kumoai_studio"
          # snowflake-connector caps pyarrow<24 on 3.14; kumo-core pins <25 and
          # this venv resolves 24, so its import guard warns. Only skew, not a bug.
          cd packages/kumo-sdk && python -m pytest -rs \
            -W "ignore:You have an incompatible version of 'pyarrow' installed:UserWarning"

  durations-aggregate:
    runs-on: ubuntu-24.04
    needs: [pytest]
    if: always() && needs.pytest.result != 'skipped' && needs.pytest.result != 'cancelled' && inputs.store_durations == true
    steps:
      - name: Download durations artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: durations-${{ github.run_id }}-*
          path: durations/

      - name: Merge durations
        run: |
          python3 <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path("durations")
          dirs = sorted(d for d in root.iterdir() if d.is_dir())
          if not dirs:
              print("ERROR: no durations artifacts found", file=sys.stderr)
              sys.exit(1)

          # Each artifact dir is named `durations-<run>-<idx>-of-<total>`.
          # All shards share the same total; parse it from any one to learn
          # how many shards we expected.
          try:
              total = int(dirs[0].name.rsplit("-of-", 1)[1])
          except (IndexError, ValueError):
              print(f"ERROR: cannot parse total from {dirs[0].name}", file=sys.stderr)
              sys.exit(1)

          if len(dirs) != total:
              print(f"ERROR: expected {total} shard artifacts, got {len(dirs)}."
                    " Some shards failed to upload durations — re-run after"
                    " fixing the failing shard(s).", file=sys.stderr)
              for d in dirs:
                  print(f"  received: {d.name}", file=sys.stderr)
              sys.exit(1)

          merged = {}
          for d in dirs:
              f = d / ".test_durations"
              if not f.exists():
                  print(f"ERROR: {d.name} has no .test_durations file", file=sys.stderr)
                  sys.exit(1)
              with f.open() as fp:
                  merged.update(json.load(fp))

          pathlib.Path(".test_durations").write_text(
              json.dumps(dict(sorted(merged.items())), indent=2) + "\n"
          )
          print(f"Merged {len(merged)} test durations from all {total} shards")
          PY

      - name: Upload merged durations
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-durations-merged
          path: .test_durations
          include-hidden-files: true

  coverage:
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # peaceiris/actions-gh-pages pushes to gh-pages
    # Set the same group across commits in main to avoid pushing to gh-pages
    # branch at the same time. This job gets triggered on PRs and push to
    # main, but it takes one minute to complete, so we hopefully don't need
    # to cancel in-progress jobs.
    concurrency:
      group: coverage-gh-pages
      cancel-in-progress: false
    continue-on-error: true
    needs: [pytest]
    if: ${{ always() && needs.pytest.result != 'skipped' && needs.pytest.result != 'cancelled' && needs.pytest.outputs.push-gh-pages == 'true'}}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: "3.14"
          activate-environment: true

      - name: Install dependencies
        run: uv pip install -q 'coverage[toml]'

      - name: Download coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: .coverage-${{ github.run_id }}-*
          path: coverages/
          merge-multiple: true

      - name: Create a combined coverage report
        id: coverage
        continue-on-error: true
        run: |
          uv run --no-project coverage combine coverages/.coverage-*
          uv run --no-project coverage report
          uv run --no-project coverage html -d htmlcov
          uv run --no-project coverage xml
          rm htmlcov/.gitignore  # necessary to upload to gh-pages

          # Add a git commit hash to the coverage report
          find htmlcov -type f -name "*.html" -exec sed -i 's| +0000| +0000, created on <a href="https://github.com/${{ github.repository }}/commit/${{ github.sha }}">${{ github.sha }}</a>|g' {} +

      - name: Push coverage report to gh-pages
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e  # v4.0.0
        # We don't want to push to gh-pages when no pytest is triggered to
        # avoid overwriting existing report with 0% coverage report. Also
        # require RUN_FULL_TEST so minimal-mode runs (e.g. store_durations
        # refresh, or dispatch with full_test=false) don't overwrite the
        # published report with a partial-coverage snapshot.
        if: ${{ github.ref == 'refs/heads/main' && env.RUN_FULL_TEST == 'true' && steps.coverage.outcome == 'success' && needs.pytest.outputs.push-gh-pages == 'true' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./htmlcov
          # Push to a directory named after the branch name.
          destination_dir: ${{ github.ref_name }}/coverage
          force_orphan: true

      - name: Upload coverage html
        if: steps.coverage.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: .coverage-${{ github.run_id }}-html
          path: htmlcov
          include-hidden-files: true
          retention-days: 1

  pql-public:
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ''
      GITHUB_REF: ${{ github.ref }}
      GITHUB_API_URL: ${{ github.api_url }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
      GITHUB_RUN_ID: ${{ github.run_id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.14']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
      - name: Build and install in-tree wheels
        run: |
          uv build --wheel --out-dir dist packages/kumo-api
          uv build --wheel --out-dir dist packages/kumo-pql
          api=(dist/kumo_api-*.whl)
          pql=(dist/kumo_pql-*.whl)
          uv pip install "${api[0]}[test]" "${pql[0]}[test]"
      - name: Test installed PQL and its API consumer
        run: |
          python="$VIRTUAL_ENV/bin/python"
          cd "$RUNNER_TEMP"
          "$python" - <<'PY'
          from pathlib import Path
          import sys
          import kumoapi
          import kumopql

          for module in (kumoapi, kumopql):
              assert Path(module.__file__).is_relative_to(sys.prefix), module.__file__
          PY
          "$python" -m pytest --import-mode=importlib \
            --confcutdir="$GITHUB_WORKSPACE/packages/kumo-pql" \
            "$GITHUB_WORKSPACE/packages/kumo-pql/test" -o addopts='' -q
          "$python" -m pytest --import-mode=importlib \
            --confcutdir="$GITHUB_WORKSPACE/packages/kumo-api" \
            "$GITHUB_WORKSPACE/packages/kumo-api/test/pquery/test_validated_predictive_query.py" \
            -o addopts='' -q
      - name: Build PQL API documentation
        if: matrix.python == '3.11'
        run: |
          pql=(dist/kumo_pql-*.whl)
          uv pip install "${pql[0]}[docs]"
          cd "$RUNNER_TEMP"
          "$VIRTUAL_ENV/bin/python" -m sphinx -W --keep-going -b html \
            "$GITHUB_WORKSPACE/packages/kumo-pql/docs/source" pql-docs
