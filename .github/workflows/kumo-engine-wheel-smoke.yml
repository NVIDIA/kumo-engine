name: Kumo Engine - Wheel smoke

# The build workflow supplies its finished wheel. Candidate PR feedback runs
# separately through the trusted copy-pr-bot route in Kumo Engine PR.
on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      wheel_artifact:
        description: Artifact from this run containing the finished wheel.
        type: string
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  smoke:
    runs-on: linux-amd64-gpu-rtxpro6000-latest-1
    timeout-minutes: 22
    environment:
      name: gha-kumo-workflow-tests
      deployment: false
    env:
      CUDA_VISIBLE_DEVICES: '0'
      KUMO_ACCELERATOR: gpu
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout the shared GPU check
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Download the finished wheel from this build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: ${{ inputs.wheel_artifact }}
          path: ${{ runner.temp }}/wheel-smoke-input

      - name: Test the finished wheel on all eight GPU tasks
        uses: ./.github/actions/engine-gpu-smoke
        with:
          wheel-path: ${{ runner.temp }}/wheel-smoke-input/*.whl
          reload-atol: '0.005'

      - name: Preserve GPU results and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: kumo-engine-wheel-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/engine-gpu-smoke
          retention-days: 14
          if-no-files-found: warn
