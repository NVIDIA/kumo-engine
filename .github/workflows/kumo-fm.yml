name: kumo-fm

on:
  pull_request:
    paths:
      - 'packages/experimental/kumo-fm/**'
      - 'packages/experimental/kumo-pytorch/**'
      - 'packages/diskgraph/**'
      - 'uv.lock'
      - '.github/workflows/kumo-fm.yml'
  push:
    branches: [main]
    paths:
      - 'packages/experimental/kumo-fm/**'
      - 'packages/experimental/kumo-pytorch/**'
      - 'packages/diskgraph/**'
      - 'uv.lock'
      - '.github/workflows/kumo-fm.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diskgraph-wheel:
    uses: ./.github/workflows/_diskgraph-wheel.yml

  package-and-wheel:
    needs: diskgraph-wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/kumo-pytorch-setup
        with:
          diskgraph-wheel-artifact: diskgraph-wheel
      - name: Test the source package against the current native stack
        run: |
          uv sync --locked --inexact --no-install-package diskgraph --no-install-package torch \
            --package kumo-fm --extra test
          uv run --no-sync --package kumo-fm python -m pytest -q \
            packages/experimental/kumo-fm/tests
      - name: Build both finished wheels
        run: |
          uv build --wheel --package kumo-pytorch --out-dir "$RUNNER_TEMP/dist"
          uv build --sdist --package kumo-fm --out-dir "$RUNNER_TEMP/dist"
          uv build --wheel "$RUNNER_TEMP"/dist/kumo_fm-*.tar.gz --out-dir "$RUNNER_TEMP/dist"
      - name: Install finished wheels outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          uv venv --python 3.12 fresh
          uv pip install --python fresh/bin/python --torch-backend cpu \
            /tmp/diskgraph-wheel/diskgraph-*.whl dist/kumo_pytorch-*.whl \
            dist/kumo_fm-*.whl 'pytest>=8,<10'
          uv pip check --python fresh/bin/python
      - name: Run tests using only installed runtime packages
        run: |
          mkdir "$RUNNER_TEMP/stage"
          cp -R packages/experimental/kumo-fm/tests \
            packages/experimental/kumo-fm/examples "$RUNNER_TEMP/stage/"
          cd "$RUNNER_TEMP/stage"
          ../fresh/bin/python -I -c 'import kumo.fm, kumo.pytorch, diskgraph; print(kumo.fm.__file__)'
          ../fresh/bin/python -m pytest -q tests
      - name: Build matching connector and engine wheels
        run: |
          for package in kumo-api kumo-pql kumo-settings kumo-core kumo-engine; do
            uv build --wheel --package "$package" --out-dir "$RUNNER_TEMP/engine-wheels"
          done
      - name: Test connector snapshot to FM from installed wheels
        working-directory: ${{ runner.temp }}/stage
        run: |
          uv pip install --python ../fresh/bin/python --torch-backend cpu \
            ../engine-wheels/*.whl
          uv pip check --python ../fresh/bin/python
          ../fresh/bin/python -I -c 'import kumo.engine, kumo.fm, kumo.pytorch, diskgraph'
          ../fresh/bin/python -m pytest -q tests/test_connector_snapshot.py
