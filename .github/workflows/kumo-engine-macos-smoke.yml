name: Kumo Engine - macOS ARM64 smoke

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      python_version:
        description: Python version for the installed-wheel smoke
        type: choice
        default: '3.12'
        options: ['3.11', '3.12', '3.13', '3.14']
  push:
    branches: [egu/macos-arm64-smoke]

permissions:
  contents: read

concurrency:
  group: macos-arm64-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    if: >-
      github.repository == 'NVIDIA/kumo-engine' &&
      github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - uses: ./.github/actions/rust-toolchain
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false
      - name: Build the native candidate wheel
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          ./packages/kumo-engine/scripts/build_wheel.sh
          python packages/kumo-engine/scripts/verify_platform_wheel.py \
            packages/kumo-engine/dist/kumo_engine-*.whl \
            --platform-tag macosx_14_0_arm64
          mkdir -p "$RUNNER_TEMP/platform-wheel/artifacts"
          cp packages/kumo-engine/dist/kumo_engine-*.whl "$RUNNER_TEMP/platform-wheel/artifacts/"
      - name: Run the shared installed-wheel CPU smoke
        uses: ./.github/actions/engine-cpu-smoke
        with:
          platform: macos-arm64
          python-version: ${{ inputs.python_version }}
          commit: ${{ github.sha }}
      - name: Save macOS qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: engine-wheel-cpu-macos-arm64-py${{ inputs.python_version }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/platform-wheel/results
          if-no-files-found: warn
          retention-days: 14
