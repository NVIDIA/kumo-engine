name: Kumo Engine weekly

# Activation and scheduling remain separate from this change.
on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      write_reference:
        description: Explicitly replace the stored reference after review
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: engine-weekly
  cancel-in-progress: false

jobs:
  weekly:
    if: github.ref == 'refs/heads/main' && vars.ENGINE_E2E_ENABLED == 'true'
    uses: ./.github/workflows/kumo-engine-e2e.yml
    with:
      scales: '["10B", "25B"]'
      write_reference: ${{ inputs.write_reference }}
