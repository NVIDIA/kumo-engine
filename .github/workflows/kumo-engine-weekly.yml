name: Kumo Engine weekly

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      revision:
        description: Candidate commit in the default branch history
        type: string
        required: false
      mode:
        description: Compare a candidate or prepare a reference for review
        type: choice
        options: [candidate, reference]
        default: candidate
  pull_request:
    paths:
      - '.github/workflows/kumo-engine-weekly.yml'
      - 'packages/kumo-engine/scripts/weekly_*.py'
      - 'packages/kumo-engine/test/test_weekly_*.py'

permissions:
  contents: read

concurrency:
  group: engine-weekly-${{ github.repository }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  configure:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.config.outputs.matrix }}
      manifest_sha256: ${{ steps.config.outputs.manifest_sha256 }}
      reference_sha256: ${{ steps.config.outputs.reference_sha256 }}
      p1: ${{ steps.config.outputs.p1 }}
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Bind the two existing execution profiles
        id: config
        env:
          WEEKLY_CONFIG: ${{ vars.KUMO_ENGINE_WEEKLY_CONFIG }}
          MODE: ${{ inputs.mode }}
        run: |
          python - <<'PYCODE'
          import json, os, re
          from pathlib import PurePosixPath
          value = json.loads(os.environ['WEEKLY_CONFIG'])
          for key in ('manifest_sha256', 'reference_sha256'):
              if key == 'reference_sha256' and os.environ['MODE'] == 'reference':
                  continue
              if not re.fullmatch('[0-9a-f]{64}', value.get(key, '')):
                  raise SystemExit('Bind exact input and approved reference checksums')
          profiles = []
          if set(value['profiles']) != {'rtx', 'scale'}:
              raise SystemExit('Bind both existing execution profiles')
          for name in ('rtx', 'scale'):
              profile = dict(value['profiles'][name], profile=name,
                  manifest_sha256=value['manifest_sha256'], reference_sha256=value.get('reference_sha256'))
              runner = profile['runner']
              if (not isinstance(runner, dict) or set(runner) != {'group', 'labels'}
                      or any(not isinstance(v, str) or not v for v in runner.values())):
                  raise SystemExit('Bind the existing runner group and label for each profile')
              for key in ('input_root', 'reference_root', 'host_lock', 'work_root'):
                  path = profile[key]
                  if not isinstance(path, str) or not PurePosixPath(path).is_absolute() or any(c in path for c in '\r\n'):
                      raise SystemExit('Bind absolute data paths and the shared host lock')
              profiles.append(profile)
          p1 = value.get('p1', {})
          if os.environ['MODE'] == 'candidate':
              runner = p1['runner']
              if (not isinstance(runner, dict) or set(runner) != {'group', 'labels'}
                      or any(not isinstance(v, str) or not v for v in runner.values())):
                  raise SystemExit('Bind the existing P1 runner group and label')
              for key in ('input_root', 'reference', 'host_lock', 'work_root'):
                  path = p1[key]
                  if not isinstance(path, str) or not PurePosixPath(path).is_absolute() or any(c in path for c in '\r\n'):
                      raise SystemExit('Bind absolute P1 input, reference, lock, and work paths')
              for key in ('manifest_sha256', 'reference_sha256'):
                  if not re.fullmatch('[0-9a-f]{64}', p1.get(key, '')):
                      raise SystemExit('Bind the reviewed P1 manifest and reference checksums')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps(dict(include=profiles)) + '\n')
              output.write('p1=' + json.dumps(p1) + '\n')
              for key in ('manifest_sha256', 'reference_sha256'):
                  output.write(key + '=' + str(value.get(key, '')) + '\n')
          PYCODE

  cpu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip --isolated install --index-url https://pypi.org/simple duckdb pandas pyarrow pyyaml
      - run: python packages/kumo-engine/test/test_weekly_check.py
      - run: python packages/kumo-engine/test/test_weekly_reference.py
      - run: python packages/kumo-engine/test/test_weekly_workflow.py
      - run: python packages/kumo-engine/test/test_weekly_p1.py
      - run: python packages/kumo-engine/test/test_weekly_b9.py

  wheel:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'candidate'
    needs: [cpu, configure]
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.receipt.outputs.version }}
      sha256: ${{ steps.receipt.outputs.sha256 }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: product
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Admit only a commit in the default branch history
        env:
          REQUESTED_REVISION: ${{ inputs.revision }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python - <<'PY'
          import os, runpy, subprocess
          from pathlib import Path
          api = runpy.run_path('harness/packages/kumo-engine/scripts/weekly_check.py')
          revision = api['trusted_revision'](Path('product'), os.environ['REQUESTED_REVISION'],
              'refs/remotes/origin/' + os.environ['DEFAULT_BRANCH'])
          subprocess.run(['git', '-C', 'product', 'checkout', '--detach', revision], check=True)
          PY
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable
      - name: Build the selected wheel
        env:
          CARGO_BUILD_JOBS: '4'
        run: |
          set -euo pipefail
          python -m pip --isolated install --index-url https://pypi.org/simple ziglang
          mkdir -p "$RUNNER_TEMP/weekly-wheel"
          git -C product rev-parse HEAD 'HEAD^{tree}' > "$RUNNER_TEMP/weekly-wheel/source.txt"
          (cd product && packages/kumo-engine/scripts/build_wheel.sh --output-dir "$RUNNER_TEMP/weekly-wheel")
          cmp "$RUNNER_TEMP/weekly-wheel/source.txt" <(git -C product rev-parse HEAD 'HEAD^{tree}')
          test -z "$(git -C product status --porcelain)"
      - name: Record source and wheel identity
        id: receipt
        run: |
          python - <<'PY'
          import email, hashlib, json, os, zipfile
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'weekly-wheel'
          revision, tree = (root / 'source.txt').read_text().splitlines()
          [wheel] = root.glob('*.whl')
          with zipfile.ZipFile(wheel) as archive:
              [member] = [n for n in archive.namelist() if n.endswith('.dist-info/METADATA')]
              metadata = email.message_from_bytes(archive.read(member))
          if metadata['Name'].replace('_', '-') != 'kumo-engine':
              raise SystemExit('The built wheel has a different package name')
          checksum = hashlib.sha256(wheel.read_bytes()).hexdigest()
          (root / 'build.json').write_text(json.dumps(dict(revision=revision, tree=tree,
              version=metadata['Version'], wheel_sha256=checksum), indent=2))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={metadata["Version"]}\nsha256={checksum}\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: weekly-wheel-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/weekly-wheel
          compression-level: 0
          retention-days: 7

  admit:
    needs: [cpu, configure]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.configure.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      PROFILE_JSON: ${{ toJSON(matrix) }}
      MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Admit both fixed workloads before any fit
        run: |
          python - <<'PYCODE'
          import csv, fcntl, json, os, runpy, subprocess
          from pathlib import Path
          config = json.loads(os.environ['PROFILE_JSON'])
          api = runpy.run_path('packages/kumo-engine/scripts/weekly_check.py')
          with Path(config['host_lock']).open('a') as lock:
              fcntl.flock(lock, fcntl.LOCK_EX | fcntl.LOCK_NB)
              manifest = api['load_manifest'](Path(config['input_root']), config['manifest_sha256'], profile=config['profile'])
              api['check_capacity'](api['select_cases'](manifest, config['profile']), api['capacity'](Path(config['work_root'])))
              raw = subprocess.check_output(['nvidia-smi', '--id=0', '--query-gpu=compute_cap,memory.total',
                  '--format=csv,noheader,nounits'], text=True)
              [observed] = list(csv.reader(raw.splitlines()))
              capability = [int(v) for v in observed[0].strip().split('.')]
              memory = int(observed[1].strip()) * 1024 * 1024
              for case in api['select_cases'](manifest, config['profile']):
                  if (case['gpu_class']['compute_capability'] != capability
                          or memory < case['gpu_class']['minimum_memory_bytes']):
                      raise SystemExit('GPU class or memory does not admit this fixed profile')
              if os.environ['MODE'] == 'candidate':
                  api['load_reference'](Path(config['reference_root']), config['reference_sha256'],
                      manifest, config['manifest_sha256'], profile=config['profile'])
          PYCODE

  gpu:
    needs: [cpu, configure, admit, wheel]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && needs.cpu.result == 'success' && needs.admit.result == 'success' && (inputs.mode == 'reference' || needs.wheel.result == 'success') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.configure.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 720
    env:
      MODE: ${{ inputs.mode }}
      PROFILE_JSON: ${{ toJSON(matrix) }}
      CUDA_VISIBLE_DEVICES: '0'
      KUMO_ACCELERATOR: gpu
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      PIP_CONFIG_FILE: /dev/null
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: env.MODE == 'candidate'
        with:
          name: weekly-wheel-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/weekly-wheel
      - name: Admit inputs and prepare temporary storage
        run: |
          python - <<'PY'
          import json, os, runpy
          from pathlib import Path
          config = json.loads(os.environ['PROFILE_JSON'])
          api = runpy.run_path('packages/kumo-engine/scripts/weekly_check.py')
          for key in ('input_root', 'reference_root', 'host_lock', 'work_root'):
              if not Path(config[key]).is_absolute() or any(c in config[key] for c in '\r\n'):
                  raise SystemExit('Bind absolute data paths and the shared host lock')
          manifest = api['load_manifest'](Path(config['input_root']), config['manifest_sha256'], profile=config['profile'], verify_files=False)
          if os.environ['MODE'] == 'candidate':
              api['reference_header'](Path(config['reference_root']) / 'reference.json', config['reference_sha256'],
                  manifest, config['manifest_sha256'])
          root = Path(config['work_root']) / ('weekly-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'] + '-' + config['profile'])
          root.mkdir(exist_ok=False)
          api['save'](root / 'configuration.json', config)
          api['save'](root / 'reference-wheel.json', manifest['reference'])
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'WEEKLY_ROOT={root}\n')
          PY
      - name: Download the manifest-approved reference wheel
        if: env.MODE == 'reference'
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          root = Path(os.environ['WEEKLY_ROOT'])
          approved = json.loads((root / 'reference-wheel.json').read_text())
          subprocess.run(['python', '-m', 'pip', '--isolated', 'download', '--index-url', 'https://pypi.org/simple', '--only-binary=:all:',
              '--no-deps', '--dest', str(Path(os.environ['RUNNER_TEMP']) / 'weekly-wheel'),
              'kumo-engine==' + approved['version']], check=True)
          PY
      - name: Install and execute the eleven fixed cases
        run: |
          set -euo pipefail
          python -m venv "$WEEKLY_ROOT/venv"
          python - <<'PY'
          import json, os, runpy, subprocess
          from pathlib import Path
          root = Path(os.environ['WEEKLY_ROOT'])
          config = json.loads((root / 'configuration.json').read_text())
          api = runpy.run_path('packages/kumo-engine/scripts/weekly_check.py')
          [wheel] = (Path(os.environ['RUNNER_TEMP']) / 'weekly-wheel').glob('*.whl')
          build = json.loads((wheel.parent / 'build.json').read_text()) if os.environ['MODE'] == 'candidate' else json.loads((root / 'reference-wheel.json').read_text())
          if api['digest'](wheel) != build['wheel_sha256']:
              raise SystemExit('Selected wheel archive checksum differs')
          python = str(root / 'venv/bin/python')
          subprocess.run([python, '-I', '-m', 'pip', '--isolated', 'install', '--index-url', 'https://pypi.org/simple', str(wheel), 'duckdb'], check=True)
          command = [python, '-I', 'packages/kumo-engine/scripts/weekly_check.py', 'run', '--mode', os.environ['MODE'], '--profile', config['profile'],
              '--input-root', config['input_root'], '--manifest-sha256', config['manifest_sha256'],
              '--host-lock', config['host_lock'], '--output', str(root / 'evidence'), '--scratch', str(root / 'scratch'),
              '--wheel', str(wheel), '--version', build['version'], '--wheel-sha256', build['wheel_sha256']]
          if os.environ['MODE'] == 'candidate':
              command += ['--reference-root', config['reference_root'], '--reference-sha256', config['reference_sha256'], '--build-receipt', str(wheel.parent / 'build.json')]
          subprocess.run(command, check=True)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && env.WEEKLY_ROOT != ''
        with:
          name: weekly-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.profile }}
          path: ${{ env.WEEKLY_ROOT }}/evidence
          if-no-files-found: error
          retention-days: 7
      - name: Remove this job's temporary files
        if: always() && env.WEEKLY_ROOT != ''
        run: |
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          temporary = Path(os.environ['RUNNER_TEMP']).resolve()
          config = json.loads(os.environ['PROFILE_JSON'])
          root = Path(os.environ['WEEKLY_ROOT']).resolve()
          expected = 'weekly-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'] + '-' + config['profile']
          if root.parent != Path(config['work_root']).resolve() or root.name != expected:
              raise SystemExit('Unexpected cleanup directory')
          shutil.rmtree(root)
          shutil.rmtree(temporary / 'weekly-wheel', ignore_errors=True)
          PY

  p1:
    name: P1 CPU sampling
    needs: [cpu, configure, gpu, wheel]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.mode == 'candidate' && needs.cpu.result == 'success' && needs.configure.result == 'success' && needs.wheel.result == 'success' }}
    runs-on: ${{ fromJSON(needs.configure.outputs.p1).runner }}
    timeout-minutes: 120
    env:
      P1_CONFIG: ${{ needs.configure.outputs.p1 }}
      CUDA_VISIBLE_DEVICES: ''
      KUMO_ACCELERATOR: cpu
      OMP_NUM_THREADS: '8'
      MKL_NUM_THREADS: '8'
      OPENBLAS_NUM_THREADS: '8'
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_CONFIG_FILE: /dev/null
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: weekly-wheel-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/weekly-p1-wheel
      - name: Prepare an isolated P1 environment
        run: |
          python - <<'PY'
          import json, os, runpy, subprocess
          from pathlib import Path
          api = runpy.run_path('packages/kumo-engine/scripts/weekly_check.py')
          config = json.loads(os.environ['P1_CONFIG'])
          wheels = Path(os.environ['RUNNER_TEMP']) / 'weekly-p1-wheel'
          [wheel] = wheels.glob('*.whl')
          build = api['read'](wheels / 'build.json')
          api['check_build'](build, build['version'], api['digest'](wheel))
          root = Path(config['work_root']) / ('weekly-p1-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          root.mkdir(exist_ok=False)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'WEEKLY_P1_ROOT={root}\n')
          subprocess.run(['python', '-m', 'venv', str(root / 'venv')], check=True)
          python = str(root / 'venv/bin/python')
          subprocess.run([python, '-I', '-m', 'pip', '--isolated', 'install', '--index-url', 'https://pypi.org/simple', str(wheel)], check=True)
          subprocess.run([python, '-I', '-m', 'pip', '--isolated', 'check'], check=True)
          PY
      - name: Run P1 against its approved reference
        run: |
          python - <<'PY'
          import json, os, runpy, subprocess
          from pathlib import Path
          api = runpy.run_path('packages/kumo-engine/scripts/weekly_check.py')
          config = json.loads(os.environ['P1_CONFIG'])
          root = Path(os.environ['WEEKLY_P1_ROOT'])
          wheels = Path(os.environ['RUNNER_TEMP']) / 'weekly-p1-wheel'
          [wheel] = wheels.glob('*.whl')
          build = api['read'](wheels / 'build.json')
          api['check_build'](build, build['version'], api['digest'](wheel))
          subprocess.run([str(root / 'venv/bin/python'), '-I', 'packages/kumo-engine/scripts/weekly_p1.py',
              '--mode', 'candidate', '--input-root', config['input_root'], '--manifest-sha256', config['manifest_sha256'],
              '--reference', config['reference'], '--reference-sha256', config['reference_sha256'],
              '--host-lock', config['host_lock'], '--output', str(root / 'evidence'),
              '--wheel', str(wheel), '--wheel-sha256', build['wheel_sha256']], check=True)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && env.WEEKLY_P1_ROOT != ''
        with:
          name: weekly-p1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.WEEKLY_P1_ROOT }}/evidence
          if-no-files-found: error
          retention-days: 7
      - name: Remove this P1 job's temporary files
        if: always() && env.WEEKLY_P1_ROOT != ''
        run: |
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          config = json.loads(os.environ['P1_CONFIG'])
          root = Path(os.environ['WEEKLY_P1_ROOT']).resolve()
          expected = 'weekly-p1-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT']
          if root.parent != Path(config['work_root']).resolve() or root.name != expected:
              raise SystemExit('Unexpected P1 cleanup directory')
          shutil.rmtree(root)
          shutil.rmtree(Path(os.environ['RUNNER_TEMP']) / 'weekly-p1-wheel', ignore_errors=True)
          PY

  collect:
    needs: [configure, gpu]
    if: ${{ !cancelled() && needs.configure.result == 'success' }}
    runs-on: ubuntu-24.04
    env:
      MANIFEST_SHA256: ${{ needs.configure.outputs.manifest_sha256 }}
      REFERENCE_SHA256: ${{ needs.configure.outputs.reference_sha256 }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: weekly-evidence-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/weekly-shards
      - name: Require eleven fits, eleven candidate replays, and the learning gates
        run: |
          python - <<'PYCODE'
          import os, runpy
          from pathlib import Path
          api = runpy.run_path('packages/kumo-engine/scripts/weekly_check.py')
          root = Path(os.environ['RUNNER_TEMP'])
          prefix = 'weekly-evidence-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'] + '-'
          shards = [root / 'weekly-shards' / (prefix + profile) for profile in ('rtx', 'scale')]
          manifest = api['load_manifest'](shards[0], os.environ['MANIFEST_SHA256'], verify_files=False)
          report = api['collect_shards'](shards, manifest, os.environ['MANIFEST_SHA256'], root / 'weekly-summary',
              reference_sha256=os.environ.get('REFERENCE_SHA256') or None)
          if report['status'] != 'PASS':
              raise SystemExit('Weekly learning or model compatibility check failed')
          PYCODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: weekly-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/weekly-summary
          if-no-files-found: error
          retention-days: 7
