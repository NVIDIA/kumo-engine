---
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ startsWith(github.ref, 'refs/pull/') || github.run_number }}
  # Only cancel intermediate builds if on a PR
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  build-wheel:
    runs-on: ubuntu-22.04-large
    env:
      # `lld` (LLVM, Apache 2.0 + LLVM exception) keeps peak
      # link-time RAM well under budget on this workspace's AWS-SDK
      # / arrow / parquet chain. Even though the larger runner has
      # 16 GB, GNU ld's per-job peak on these crates is ~4 GB and 4
      # parallel link jobs (default `nproc` parallelism) exhausts
      # it. lld avoids that. lld picked over mold to avoid AGPL.
      #
      # `+aes,+sse2` repeated here because RUSTFLAGS env var
      # overrides `.cargo/config.toml`'s [target.x86_64] rustflags
      # entirely (cargo precedence: env > config). gxhash's
      # compile_error! macro fails the build without these.
      RUSTFLAGS: "-C target-feature=+aes,+sse2 -C link-arg=-fuse-ld=lld"
    steps:
      - uses: actions/checkout@v4

      - name: Install lld linker
        run: sudo apt-get update -qq && sudo apt-get install -y lld

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin

      - name: Build standalone ingest binary
        # Mirror of nightly.yml: maturin only builds the cdylib
        # extension module, not Cargo `[[bin]]` targets, so the
        # standalone `ingest` binary needs a separate cargo build.
        run: cargo build --release --bin ingest

      - name: Stage ingest binary into Python package
        # Maturin auto-includes everything under
        # `python-source = "python"`. Dropping the binary at
        # `python/diskgraph/bin/ingest` ships it as
        # `diskgraph/bin/ingest` in the wheel.
        run: |
          mkdir -p diskgraph-pybind/python/diskgraph/bin
          cp target/release/ingest diskgraph-pybind/python/diskgraph/bin/ingest
          chmod +x diskgraph-pybind/python/diskgraph/bin/ingest

      - name: Verify staged ingest binary loads
        run: diskgraph-pybind/python/diskgraph/bin/ingest --version

      - name: Build wheel
        run: |
          maturin build \
            --manifest-path diskgraph-pybind/Cargo.toml \
            --release \
            --interpreter python3.10

      - name: Verify ingest binary is in wheel
        run: |
          WHEEL_PATH=$(find target/wheels -maxdepth 1 -type f -name '*.whl' | head -n 1)
          if [ -z "$WHEEL_PATH" ]; then
            echo "No wheel found in target/wheels"
            exit 1
          fi
          if ! python -m zipfile -l "$WHEEL_PATH" | grep -q 'diskgraph/bin/ingest'; then
            echo "ERROR: wheel does not contain diskgraph/bin/ingest"
            python -m zipfile -l "$WHEEL_PATH" | grep -E 'diskgraph/(bin|_c)' || true
            exit 1
          fi
          echo "ingest binary present in wheel: $WHEEL_PATH"
