name: DiskGraph wheel

# Builds the abi3 DiskGraph wheel and uploads it as the `diskgraph-wheel`
# artifact, for jobs that pass it to .github/actions/setup instead of building
# DiskGraph from source.
on:  # yamllint disable-line rule:truthy
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: diskgraph-wheel
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ''
      GITHUB_REF: ${{ github.ref }}
      GITHUB_API_URL: ${{ github.api_url }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
      GITHUB_RUN_ID: ${{ github.run_id }}
    # Oldest runner image: the wheel must load on every consumer's glibc.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - id: settings
        run: |
          ./scripts/diskgraph wheel-env | tee -a "$GITHUB_ENV" >> "$GITHUB_OUTPUT"
          echo "key=$(./scripts/diskgraph wheel-key)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: /tmp/diskgraph-wheel
          key: ${{ steps.settings.outputs.key }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/apt-install
        timeout-minutes: 12
        with:
          packages: lld
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/rust-toolchain
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.11'
          activate-environment: true
          prune-cache: true
      - id: python
        if: steps.cache.outputs.cache-hit != 'true'
        run: echo "version=$(python -c 'import platform; print(platform.python_version())')" >> "$GITHUB_OUTPUT"
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31
        with:
          workspaces: packages/diskgraph -> target
          key: python-wheel-py${{ steps.python.outputs.version }}
      - name: Build wheel
        if: steps.cache.outputs.cache-hit != 'true'
        run: uv build --wheel --out-dir /tmp/diskgraph-wheel packages/diskgraph
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: /tmp/diskgraph-wheel
          key: ${{ steps.settings.outputs.key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: diskgraph-wheel
          path: /tmp/diskgraph-wheel/diskgraph-*.whl
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
