name: Linting

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - master
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ startsWith(github.ref, 'refs/pull/') || github.run_number }}
  # Only cancel intermediate builds if on a PR:
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  flake8:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Check for lockfile-only changes
        id: lockfile-only
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62  # v47.0.0
        with:
          files: |
            3rdparty/*.lock

      - name: Set up Python
        if: steps.lockfile-only.outputs.only_changed != 'true'
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.14"
          activate-environment: true

      - name: Install dependencies
        if: steps.lockfile-only.outputs.only_changed != 'true'
        run: |
          uv pip install flake8==7.1.2

      - name: Run linting
        if: steps.lockfile-only.outputs.only_changed != 'true'
        run: |
          flake8 --extend-exclude .venv .

  isort:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Check for lockfile-only changes
        id: lockfile-only
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62  # v47.0.0
        with:
          files: |
            3rdparty/*.lock

      - name: Set up Python
        if: steps.lockfile-only.outputs.only_changed != 'true'
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.14"
          activate-environment: true

      - name: Install dependencies
        if: steps.lockfile-only.outputs.only_changed != 'true'
        run: |
          uv pip install isort==5.12.0

      - name: Run linting
        if: steps.lockfile-only.outputs.only_changed != 'true'
        run: |
          isort --extend-skip .venv --check-only .

  pyroma:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Check for lockfile-only changes
        id: lockfile-only
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62  # v47.0.0
        with:
          files: |
            3rdparty/*.lock

      - name: Set up Python
        if: steps.lockfile-only.outputs.only_changed != 'true'
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.14"
          activate-environment: true

      - name: Install dependencies
        if: steps.lockfile-only.outputs.only_changed != 'true'
        run: |
          uv pip install pyroma==5.0.0 'setuptools>=80.10.2,<82' setuptools-scm[toml]==8.3.1 wheel==0.45.1

      - name: Check package metadata
        if: steps.lockfile-only.outputs.only_changed != 'true'
        run: |
          pyroma --min=9 .

  licensing:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.14"
          activate-environment: true

      - name: Install test dependencies
        run: |
          uv pip install pytest==9.0.3

      - name: Check source and manifest licensing
        run: |
          python scripts/check_license_headers.py
          python scripts/check_python_license_metadata.py
          pytest -q --confcutdir=test/scripts test/scripts/test_check_license_headers.py test/scripts/test_python_license_metadata.py

      - name: Build Python wheels
        run: |
          projects=(
            .
            packages/kumo-api
            packages/kumo-bigquery
            packages/kumo-core
            packages/kumo-databricks
            packages/kumo-gcs
            packages/kumo-pql
            packages/kumo-s3
            packages/kumo-sdk
            packages/kumo-snowflake
            packages/kumo-engine
          )
          for project in "${projects[@]}"; do
            uv build --wheel --no-build-logs --out-dir "$RUNNER_TEMP/license-wheels" "$project"
          done

      - name: Inspect wheel license metadata
        run: |
          python scripts/check_python_license_metadata.py --wheel-dir "$RUNNER_TEMP/license-wheels" --require-all

  yamllint:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Check for lockfile-only changes
        id: lockfile-only
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62  # v47.0.0
        with:
          files: |
            3rdparty/*.lock

      - name: Set up Python
        if: steps.lockfile-only.outputs.only_changed != 'true'
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.14"
          activate-environment: true

      - name: Install dependencies
        if: steps.lockfile-only.outputs.only_changed != 'true'
        run: |
          uv pip install yamllint

      - name: Run linting
        if: steps.lockfile-only.outputs.only_changed != 'true'
        run: |
          yamllint .

  deploy_static:
    name: deploy_static
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Check for deployment shell changes
        id: deploy-shell-changes
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62  # v47.0.0
        with:
          files: |
            deploy/**/*.sh

      - name: Check for deployment Terraform changes
        id: deploy-terraform-changes
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62  # v47.0.0
        with:
          files: |
            deploy/azure/terraform/**/*.tf
            deploy/azure/terraform/terraform.tfvars.example
            deploy/gcp/terraform/**/*.tf
            deploy/gcp/terraform/terraform.tfvars.example

      - name: Check for deployment Packer changes
        id: deploy-packer-changes
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62  # v47.0.0
        with:
          files: |
            deploy/**/*.pkr.hcl

      - name: Check for deployment test changes
        id: deploy-test-changes
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62  # v47.0.0
        with:
          files: |
            deploy/**
            docker/compose/docker-compose.singlehost*.yml
            scripts/compose-local-preflight.sh
            test/compose/test_compose_local_preflight.py
            test/deploy/test_cloud_storage_preflight.py

      - name: Install ShellCheck
        if: steps.deploy-shell-changes.outputs.any_changed == 'true'
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          fi

      - name: Check changed deployment shell scripts
        if: steps.deploy-shell-changes.outputs.any_changed == 'true'
        env:
          CHANGED_SHELL_FILES: ${{ steps.deploy-shell-changes.outputs.all_changed_files }}
        run: |
          read -r -a shell_files <<< "$CHANGED_SHELL_FILES"
          shellcheck "${shell_files[@]}"
          for script in "${shell_files[@]}"; do
            bash -n "$script"
          done

      - name: Set up Terraform
        if: steps.deploy-terraform-changes.outputs.any_changed == 'true'
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Check Azure and GCP Terraform
        if: steps.deploy-terraform-changes.outputs.any_changed == 'true'
        run: |
          for cloud in azure gcp; do
            terraform_dir="deploy/${cloud}/terraform"
            terraform fmt -check -recursive "$terraform_dir"
            cp "$terraform_dir/terraform.tfvars.example" "/tmp/${cloud}.tfvars"
            terraform fmt -check "/tmp/${cloud}.tfvars"
            terraform -chdir="$terraform_dir" init -backend=false -input=false
            terraform -chdir="$terraform_dir" validate
          done

      - name: Set up Packer
        if: steps.deploy-packer-changes.outputs.any_changed == 'true'
        uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789  # v3.4.0
        with:
          version: "1.15.4"

      - name: Check changed Packer template formatting
        if: steps.deploy-packer-changes.outputs.any_changed == 'true'
        env:
          CHANGED_PACKER_FILES: ${{ steps.deploy-packer-changes.outputs.all_changed_files }}
        run: |
          read -r -a packer_files <<< "$CHANGED_PACKER_FILES"
          for template in "${packer_files[@]}"; do
            packer fmt -check "$template"
            packer validate -syntax-only "$template"
          done

      - name: Set up Python for deployment tests
        if: steps.deploy-test-changes.outputs.any_changed == 'true'
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: "3.14"

      - name: Run focused offline deployment tests
        if: steps.deploy-test-changes.outputs.any_changed == 'true'
        run: |
          uvx --python 3.14 --from pytest==9.0.3 pytest -c /dev/null --confcutdir=test/deploy -q test/deploy/test_cloud_storage_preflight.py
          uvx --python 3.14 --from pytest==9.0.3 pytest -c /dev/null --confcutdir=test/compose -q test/compose/test_compose_local_preflight.py

  pyright:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Check for lockfile-only changes
        id: lockfile-only
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62  # v47.0.0
        with:
          files: |
            3rdparty/*.lock

      # This enables us to skip the pyright check for ui only changes.
      # Note, it's not possible use the standard `on.pull_request` method to
      # do this, as we need to mark the overall workflow as success to satisfy
      # the master branch protection rule, and this does not happen if we skip
      # the entire workflow
      - name: Check for only ui file changes
        id: ui-changes
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62  # v47.0.0
        with:
          files: |
            ui/**

      - name: Set up Python
        if: steps.lockfile-only.outputs.only_changed != 'true' && steps.ui-changes.outputs.only_changed != 'true'
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.14"
          activate-environment: true

      - name: Install lxml build dependencies
        if: steps.lockfile-only.outputs.only_changed != 'true' && steps.ui-changes.outputs.only_changed != 'true'
        run: |
          # The Chrome repo preinstalled on the runner image has
          # intermittently served a stale/mismatched Packages.gz, which apt
          # treats as fatal for the whole `update` rather than skipping it.
          # See .github/actions/setup/action.yml for the same cleanup.
          for apt_file in `grep -lr dl.google.com/linux/chrome /etc/apt/sources.list.d/`; do sudo rm $apt_file; done
          # redshift-connector caps lxml<6.0.0, and lxml only ships cp314
          # wheels from 6.0.1 onward, so on Python 3.14 uv builds lxml 5.4.0
          # from its sdist, which needs these dev headers.
          sudo apt-get -qq update
          sudo apt-get install -y -qq --no-install-recommends libxml2-dev libxslt1-dev
        shell: bash

      - name: Compute DiskGraph wheel cache key
        id: diskgraph-wheel-key
        if: steps.lockfile-only.outputs.only_changed != 'true' && steps.ui-changes.outputs.only_changed != 'true'
        run: echo "key=$(./scripts/diskgraph wheel-key)" >> "$GITHUB_OUTPUT"

      - name: Restore DiskGraph wheel
        id: diskgraph-wheel-cache
        if: steps.diskgraph-wheel-key.outputs.key != ''
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: /tmp/diskgraph-wheel
          key: ${{ steps.diskgraph-wheel-key.outputs.key }}

      - name: Install DiskGraph
        if: steps.lockfile-only.outputs.only_changed != 'true' && steps.ui-changes.outputs.only_changed != 'true'
        run: |
          ./scripts/diskgraph install --python "$(command -v python)" -f ${DISKGRAPH_WHEEL_DIR:+--wheel "$DISKGRAPH_WHEEL_DIR"}
        env:
          DISKGRAPH_WHEEL_DIR: ${{ steps.diskgraph-wheel-cache.outputs.cache-hit == 'true' && '/tmp/diskgraph-wheel' || '' }}

      - name: Install KUMO
        if: steps.lockfile-only.outputs.only_changed != 'true' && steps.ui-changes.outputs.only_changed != 'true'
        run: |
          uv pip install -q --no-deps -e packages/kumo-api -e packages/kumo-pql
          uv pip install -q --no-deps -e packages/kumo-core -e packages/kumo-snowflake -e packages/kumo-bigquery -e packages/kumo-databricks -e packages/kumo-s3 -e packages/kumo-gcs
          uv pip install -q --torch-backend=cpu -e '.[full,dev]' -f 3rdparty/kumo-wheels/

      - name: Install dependencies
        if: steps.lockfile-only.outputs.only_changed != 'true' && steps.ui-changes.outputs.only_changed != 'true'
        run: |
          uv pip install pyright==1.1.283

      - name: Run Kumo-core package checks
        if: steps.lockfile-only.outputs.only_changed != 'true' && steps.ui-changes.outputs.only_changed != 'true'
        run: make check-kumo-core

      - name: Run type checker
        if: steps.lockfile-only.outputs.only_changed != 'true' && steps.ui-changes.outputs.only_changed != 'true'
        run: |
          pyright -p pyrightconfig.json

      - name: Run type checker using the precommit config
        if: steps.lockfile-only.outputs.only_changed != 'true' && steps.ui-changes.outputs.only_changed != 'true'
        run: |
          pyright -p precommit-pyrightconfig.json

  uilint:
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Check for lockfile-only changes
        id: lockfile-only
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62  # v47.0.0
        with:
          files: |
            3rdparty/*.lock

      # This enables us to skip the uilint workflow.
      # Note, it's not possible use the standard `on.pull_request` method to
      # do this, as we need to mark the overall workflow as success to satisfy
      # the master branch protection rule, and this does not happen if we skip
      # the entire workflow
      - name: Check for only ui related file changes
        id: ui-changes
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62  # v47.0.0
        with:
          files: |
            ui/**

      - name: Set up Node.js
        if: steps.lockfile-only.outputs.only_changed != 'true' && steps.ui-changes.outputs.any_changed == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"

      - name: Install UI dependencies
        if: steps.lockfile-only.outputs.only_changed != 'true' && steps.ui-changes.outputs.any_changed == 'true'
        run: |
          cd ui
          npm run install:catalog
          npm ci

      - name: Run ESLint
        if: steps.lockfile-only.outputs.only_changed != 'true' && steps.ui-changes.outputs.any_changed == 'true'
        run: |
          cd ui
          npm run lint-check

      - name: Run Prettier
        if: steps.lockfile-only.outputs.only_changed != 'true' && steps.ui-changes.outputs.any_changed == 'true'
        run: |
          cd ui
          npm run format-check

  # Keep this job name stable: master branch protection requires the
  # setup_dependencies status context.
  setup_dependencies:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Check versions match VERSION
        run: python3 scripts/stamp_version.py --check

      - name: Validate first-party Kumo dependencies
        run: |
          python - <<'PY'
          import re
          import tomllib
          from pathlib import Path

          api_pyproject = Path("packages/kumo-api/pyproject.toml")
          api_version = tomllib.loads(api_pyproject.read_text())["project"]["version"]
          if re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:[a-z]+[0-9]+)?", api_version) is None:
              raise SystemExit(f"Invalid packages/kumo-api version: {api_version}")

          setup_text = Path("setup.py").read_text()
          expected = 'kumo_api_dep = f"kumo-api=={kumo_api_ver}"'
          if expected not in setup_text:
              raise SystemExit("setup.py does not use the first-party kumo-api version")

          build_text = Path("3rdparty/BUILD").read_text()
          if "KUMO_API_VERSION" in build_text:
              raise SystemExit("3rdparty/BUILD still defines external KUMO_API_VERSION")

          pql_pyproject = Path("packages/kumo-pql/pyproject.toml")
          pql_version = tomllib.loads(pql_pyproject.read_text())["project"]["version"]
          if re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:[a-z]+[0-9]+)?", pql_version) is None:
              raise SystemExit(f"Invalid packages/kumo-pql version: {pql_version}")
          if '"kumo-pql>=0.1.0,<0.2"' not in setup_text:
              raise SystemExit("setup.py does not use the first-party kumo-pql package")
          if "kumo-pql.git" in setup_text or "kumo-pql.git" in build_text:
              raise SystemExit("Kumo PQL must not be resolved from a Git URL")
          PY

  pants_check:
    runs-on: ubuntu-latest
    outputs:
      is_lockfile_error: ${{ steps.detect-lockfile-error.outputs.is_lockfile_error }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Check for lockfile-only changes
        id: lockfile-only
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62  # v47.0.0
        with:
          files: |
            3rdparty/*.lock

      # This enables us to skip the pants check for ui only changes.
      # Note, it's not possible use the standard `on.pull_request` method to
      # do this, as we need to mark the overall workflow as success to satisfy
      # the master branch protection rule, and this does not happen if we skip
      # the entire workflow
      - name: Check for only ui file changes
        id: ui-changes
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62  # v47.0.0
        with:
          files: |
            ui/**

      - name: Check for dependency file changes
        id: dep-changes
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62  # v47.0.0
        with:
          files: |
            3rdparty/BUILD
            pants.toml

      - name: Show lockfile automation notice
        if: steps.lockfile-only.outputs.only_changed != 'true' && steps.dep-changes.outputs.any_changed == 'true' && steps.ui-changes.outputs.only_changed != 'true'
        run: |
          echo "::notice::ℹ️ Dependency files changed (3rdparty/BUILD or pants.toml). If pants_check fails due to lockfile mismatch, a lockfile PR will be auto-created. See: https://github.com/kumo-ai/kumo/blob/master/3rdparty/README.md#2-regenerating-lockfiles"

      - name: Run Pants Setup
        if: steps.lockfile-only.outputs.only_changed != 'true' && steps.ui-changes.outputs.only_changed != 'true'
        uses: ./.github/actions/setup-pants/
        with:
          github_token: ${{ secrets.KUMO_GITHUB_BOT_TOKEN }}

      - name: Check all Pants targets
        id: pants-check
        if: steps.lockfile-only.outputs.only_changed != 'true' && steps.ui-changes.outputs.only_changed != 'true'
        run: |
          set -o pipefail
          scripts/ci/run_with_github_auth.sh pants check :: 2>&1 | tee /tmp/pants_check_output.log
        env:
          CUDA: cpu
          GITHUB_TOKEN: ${{ secrets.KUMO_GITHUB_BOT_TOKEN }}

      - name: Detect lockfile error
        id: detect-lockfile-error
        if: failure() && steps.pants-check.outcome == 'failure'
        run: |
          if grep -qE "not present in the lock|locked version is|lockfile.*out of date|lockfile.*mismatch|Failed to resolve compatible artifacts from lock|not satisfied, no candidates found" /tmp/pants_check_output.log 2>/dev/null; then
            echo "is_lockfile_error=true" >> $GITHUB_OUTPUT
            echo "::notice::Lockfile mismatch detected. The regenerate_pants_lockfiles job will run."
          else
            echo "is_lockfile_error=false" >> $GITHUB_OUTPUT
            echo "::warning::pants_check failed but NOT due to lockfile mismatch. Check the error above."
          fi

      - name: Comment on PR about lockfile regeneration
        if: failure() && steps.detect-lockfile-error.outputs.is_lockfile_error == 'true' && github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          token: ${{ secrets.KUMO_GITHUB_BOT_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## ⏳ Lockfile Regeneration In Progress

            A lockfile mismatch was detected. The **regenerate_pants_lockfiles** job is now running to create updated lockfiles.

            👉 **[Monitor job progress](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})**

            Once complete, a separate PR with the updated lockfiles will be created and linked here.

  regenerate_pants_lockfiles:
    needs: pants_check
    if: ${{ failure() && needs.pants_check.outputs.is_lockfile_error == 'true' && github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Run Pants Setup
        uses: ./.github/actions/setup-pants/
        with:
          github_token: ${{ secrets.KUMO_GITHUB_BOT_TOKEN }}

      - name: Pre-validate (catch non-lockfile errors early)
        run: |
          scripts/ci/run_with_github_auth.sh pants --python-enable-resolves=false check ::
        env:
          CUDA: cpu
          GITHUB_TOKEN: ${{ secrets.KUMO_GITHUB_BOT_TOKEN }}

      - name: Regenerate CUDA=cpu lockfile
        run: |
          rm -rf ~/.cache/pants/
          scripts/ci/run_with_github_auth.sh pants --pants-workdir=/tmp/pants-workdir-$CUDA -lwarn generate-lockfiles 2>&1 | tee lockfile_diff_cpu.log
        env:
          CUDA: cpu
          GITHUB_TOKEN: ${{ secrets.KUMO_GITHUB_BOT_TOKEN }}

      - name: Regenerate CUDA=cu130 lockfile
        run: |
          rm -rf ~/.cache/pants/
          scripts/ci/run_with_github_auth.sh pants --pants-workdir=/tmp/pants-workdir-$CUDA -lwarn generate-lockfiles 2>&1 | tee lockfile_diff_cu130.log
        env:
          CUDA: cu130
          GITHUB_TOKEN: ${{ secrets.KUMO_GITHUB_BOT_TOKEN }}

      - name: Prepare lockfile summary
        id: prepare_summary
        run: |
          echo "summary<<EOF" >> $GITHUB_OUTPUT
          echo "=== CUDA=cpu lockfile changes summary ===" >> $GITHUB_OUTPUT
          cat lockfile_diff_cpu.log >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "=== CUDA=cu130 lockfile changes summary ===" >> $GITHUB_OUTPUT
          cat lockfile_diff_cu130.log >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create lockfile changes PR (using files from the runner)
        id: create_pr
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0  # v8.1.0
        with:
          token: ${{ secrets.KUMO_GITHUB_BOT_TOKEN }}
          add-paths: "3rdparty/*.lock"
          branch: "auto/regenerate-lockfiles-${{ github.head_ref }}"
          base: ${{ github.head_ref }} # Target branch (the PR's source branch)
          commit-message: "Auto-regenerate lockfiles"
          title: "[ACTION REQUIRED] Merge lockfile updates into ${{ github.head_ref }}"
          assignees: ${{ github.event.pull_request.user.login }}
          reviewers: ""
          body: |
            **Note:** This is an auto-generated PR with lockfile diffs to be merged into `${{ github.head_ref }}` branch. Therefore, merging this PR should be done after self-review, and does **NOT** require code reviewer approval or passing tests.

            It is triggered by [PR](${{ github.event.pull_request.html_url }}) that modified 3rdparty/BUILD or pants.toml

            ### Lockfile changes summary
            ${{ steps.prepare_summary.outputs.summary }}

            ### CI run that triggered this PR
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Comment on original PR
        if: steps.create_pr.outputs.pull-request-url != ''
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          token: ${{ secrets.KUMO_GITHUB_BOT_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## 🔄 Lockfile Update Required

            Your changes require updated lockfiles. An auto-generated PR has been created:
            👉 **[Merge lockfile updates](${{ steps.create_pr.outputs.pull-request-url }})**

            ### Next Steps:
            1. Review the lockfile PR (usually just rubber-stamp)
            2. Merge it into your branch
            3. Pull changes locally: `git pull origin ${{ github.head_ref }}`
            4. Your CI checks should pass after that

            📚 [Learn more about lockfile automation](https://github.com/kumo-ai/kumo/blob/master/3rdparty/README.md)

      - name: Print PR URL
        run: |
          echo "Lockfile PR created: ${{ steps.create_pr.outputs.pull-request-url }}"

      - name: Notify on failure
        if: failure()
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          token: ${{ secrets.KUMO_GITHUB_BOT_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## ❌ Lockfile Regeneration Failed

            The automatic lockfile regeneration job failed. This could be due to:
            - A transient network error (retry may help)
            - An issue with the dependency changes in your PR
            - The regenerated lockfiles failing validation

            👉 **[View job logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})**

            ### What to do:
            1. Check the job logs for the specific error
            2. If it looks transient, re-run the failed job
            3. If it's a real issue, fix the dependency configuration and push again

            📚 [Learn more about lockfile automation](https://github.com/kumo-ai/kumo/blob/master/3rdparty/README.md)

  diskgraph-clippy:
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: '2'
      RUSTFLAGS: '-C target-feature=+aes,+sse2 -C link-arg=-fuse-ld=lld -C debuginfo=line-tables-only'
    runs-on: ubuntu-22.04-large
    timeout-minutes: 60
    defaults:
      run:
        working-directory: packages/diskgraph
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y lld
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          # Pinned: a new stable clippy adds lints that fail unchanged code.
          toolchain: 1.98.1
          components: clippy
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: '3.11'
          activate-environment: true
          enable-cache: false
      - id: python
        run: echo "version=$(python -c 'import platform; print(platform.python_version())')" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: packages/diskgraph -> target
          key: clippy-py${{ steps.python.outputs.version }}
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
