name: "Pull Request and Issue Labeler"
on:  # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
      - labeled
      - unlabeled

permissions:
  contents: read

jobs:
  assign-labels:
    name: Assign labels based on changed files
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/labeler@f27b608878404679385c85cfa523b85ccb86e213
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          configuration-path: .github/labeler.yml
          sync-labels: true

  assign-author:
    permissions:
      pull-requests: write
    name: Assign to author if unassigned
    runs-on: ubuntu-24.04
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.type == 'User' && !github.event.pull_request.assignees[0] }}
    steps:
      - name: Assign the pull request to its author
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: gh api --method POST "repos/$REPO/issues/$PR_NUMBER/assignees" -f "assignees[]=$AUTHOR" --silent
