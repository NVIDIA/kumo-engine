name: Weekly pytest-split Durations Refresh

# Runs testing.yml weekly in store-durations mode and opens a PR that
# updates the committed `.test_durations` file. PR will not trigger CI
# (GITHUB_TOKEN-authored pushes don't fire workflows); merge directly —
# `.test_durations` is a data file with no code impact.

on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: "0 7 * * 0"  # Sunday 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-tests:
    # Guard: only run against main. Durations recorded on a feature branch
    # would bias the committed file toward that branch's test set. If
    # dispatched from a non-main ref, this job (and open-pr) is skipped.
    if: github.ref_name == 'main'
    permissions:
      # Reusable-workflow validation checks nested job permissions up front.
      # testing.yml defines a coverage job with `contents: write`, even though
      # that path stays skipped for store_durations runs.
      contents: write
    uses: ./.github/workflows/testing.yml
    with:
      store_durations: true
      full_test: false
    secrets: inherit

  open-pr:
    runs-on: ubuntu-latest
    needs: [run-tests]
    if: github.ref_name == 'main'
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BRANCH: auto-refresh-test-durations
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Download merged durations
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: test-durations-merged
          path: .

      - name: Commit and open PR
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- .test_durations; then
            echo "No change to .test_durations; skipping PR."
            exit 0
          fi

          git checkout -B "$BRANCH"
          git add .test_durations
          git commit -m "Refresh pytest-split durations"
          git push --force-with-lease origin "$BRANCH"

          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            echo "PR already open on $BRANCH; force-push updated it."
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Refresh pytest-split durations" \
              --body "Automated weekly refresh of \`.test_durations\` from the latest testing.yml run in store-durations mode. Safe to merge without CI — this is a data file that only affects pytest-split shard balancing."
          fi
