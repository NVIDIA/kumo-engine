name: kumo-pytorch alert

# After each kumo-pytorch workflow run on main (push or schedule): reruns the
# failed jobs of a first attempt that failed, then tells the team channel when a
# workflow starts failing and when it recovers.
on:  # yamllint disable-line rule:truthy
  workflow_run:
    workflows:
      - kumo-pytorch tests
      - kumo-pytorch DiskGraph
      - kumo-pytorch end-to-end
      - kumo-pytorch nightly end-to-end
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.workflow_id }}
  cancel-in-progress: false

jobs:
  alert:
    name: Rerun or report the run
    if: >-
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'schedule')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      # The default branch's copy of the script; nothing from the triggering run.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/kumo-pytorch-alert.py
          sparse-checkout-cone-mode: false
      - name: Rerun failed jobs, or report a change of state
        env:
          GH_TOKEN: ${{ github.token }}
          SLACK_WEBHOOK_URL: ${{ secrets.KUMO_PYTORCH_SLACK_WEBHOOK_URL }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: python3 .github/scripts/kumo-pytorch-alert.py
