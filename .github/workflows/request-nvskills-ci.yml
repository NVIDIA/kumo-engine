#
# NVSkills CI: evaluates and signs changes under skills/, which the NVIDIA/skills catalog syncs
# from. This is NVIDIA/skills' request workflow, unchanged except for the SHA pin, which this
# repository's workflow-security policy requires. When NVIDIA/skills changes the template, re-pin
# to its current main. A maintainer or admin comments `/nvskills-ci` on a PR to start a run.
# Requires the NVSKILLS_CI_DISPATCH_TOKEN secret. PRs that do not touch skills/ skip it.

name: Request NVSkills CI

on:  # yamllint disable-line rule:truthy
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:

jobs:
  request:
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/nvskills-ci')) ||
      (github.event_name == 'push' &&
        github.actor == (vars.NVSKILLS_SIGNATURE_PUSH_ACTOR || 'nv-skills-ci[bot]') &&
        startsWith(github.event.head_commit.message, vars.NVSKILLS_SIGNATURE_COMMIT_TITLE || 'Attach NVSkills validation signatures'))
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    uses: NVIDIA/skills/.github/workflows/team-request.yml@b707bbe61ff1026dd59a44140610f92c8eae1151  # main, 2026-11-06
    secrets:
      NVSKILLS_CI_DISPATCH_TOKEN: ${{ secrets.NVSKILLS_CI_DISPATCH_TOKEN }}
