name: Kumo API - Cut new release

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      expected_release_version:
        description: 'Expected release tag (vX.Y.0 or vX.Y.0bN)'
        required: true
        type: string
      dry_run:
        description: 'Build and validate without changing remote state'
        required: true
        default: true
        type: boolean

env:
  REGISTRY_USER: kumo+kumo_internal
  RELEASE_VERSION_INPUT: ${{ inputs.expected_release_version }}
  DRY_RUN: ${{ inputs.dry_run }}

permissions:
  contents: write

jobs:
  cut-release:
    name: Cut New Release of Kumo API
    runs-on: ubuntu-22.04
    outputs:
      release_success: ${{ steps.set-output.outputs.success }}

    defaults:
      run:
        shell: bash
        working-directory: packages/kumo-api

    steps:
      - name: Validate dispatch source
        run: |
          if [[ "$DRY_RUN" == false && "$GITHUB_REF" != refs/heads/master ]]; then
            echo "Live releases require refs/heads/master, found $GITHUB_REF."
            exit 1
          fi

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
          ref: master
          fetch-depth: 0

      - name: Configure Git Author
        run: |
          git config user.name "kumo-release-bot"
          git config user.email "kumo-release-bot@users.noreply.github.com"

      - name: Plan release
        id: release-plan
        run: |
          git fetch origin --tags
          if [[ ! "$RELEASE_VERSION_INPUT" =~ ^v([0-9]+)\.([0-9]+)\.0(b[1-9][0-9]*)?$ ]]; then
            echo "Expected vX.Y.0 or vX.Y.0bN, found $RELEASE_VERSION_INPUT."
            exit 1
          fi
          requested_branch="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          artifact_version=${RELEASE_VERSION_INPUT#v}
          is_prerelease=$([[ "$artifact_version" == *b* ]] && echo true || echo false)
          release_ref="kumo-api-$RELEASE_VERSION_INPUT"
          if git rev-parse --verify --quiet "refs/tags/$release_ref"; then
            echo "Release tag $release_ref already exists."
            exit 1
          fi
          VERSION=$(awk '/^\[project\]/{p=1;next} p&&/^version/{gsub(/[^0-9.]/, "", $3);print $3;exit}' pyproject.toml)
          echo "Current version from pyproject.toml: $VERSION"
          plan_args=()
          while IFS= read -r branch; do
            plan_args+=(--existing-branch "$branch")
          done < <(git for-each-ref --format='%(refname:strip=3)' \
            'refs/remotes/origin/kumo-api-v*' | sed 's/^kumo-api-//')
          while IFS= read -r tag; do
            plan_args+=(--existing-tag "$tag")
          done < <(git tag --list 'kumo-api-v*' | sed 's/^kumo-api-//')
          python tools/release_plan.py \
            --current-version "$VERSION" \
            --requested-branch "$requested_branch" \
            --dry-run "$DRY_RUN" \
            "${plan_args[@]}"
          {
            echo "artifact_version=$artifact_version"
            echo "release_tag=$RELEASE_VERSION_INPUT"
            echo "is_prerelease=$is_prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Update pyproject.toml
        if: >-
          steps.release-plan.outputs.needs_version_update == 'true' ||
          steps.release-plan.outputs.is_prerelease == 'true'
        env:
          IS_PRERELEASE: ${{ steps.release-plan.outputs.is_prerelease }}
          TARGET_VERSION: ${{ steps.release-plan.outputs.artifact_version }}
        run: |
          awk -v version_line="version = \"${TARGET_VERSION}\"" -i inplace '/^\[project\]/{p=1} p&&/^version/{if(!done){sub(/^version = .*/,version_line);done=1}} 1' pyproject.toml
          awk -v version_line="version = \"${TARGET_VERSION}\"" -i inplace '/^\[tool.poetry\]/{p=1} p&&/^version/{if(!done){sub(/^version = .*/,version_line);done=1}} 1' pyproject.toml
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            sed -i 's/Development Status :: 5 - Production\/Stable/Development Status :: 4 - Beta/' pyproject.toml
          fi
          git add pyproject.toml
          git commit -m "Update version to $TARGET_VERSION"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: '3.11'
          activate-environment: true

      - name: Verify import
        uses: ./packages/kumo-api/.github/actions/verify-import
        with:
          pydantic-version: 'pydantic>=2.7'

      - name: Build and validate release wheel
        env:
          TARGET_VERSION: ${{ steps.release-plan.outputs.artifact_version }}
        run: |
          uv pip install twine build
          rm -rf dist
          python -m build --wheel
          python -m twine check dist/*.whl
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [[ ${#wheels[@]} -ne 1 ]]; then
            echo "Expected one release wheel, found ${#wheels[@]}."
            exit 1
          fi
          expected="kumo_api-${TARGET_VERSION}-py3-none-any.whl"
          if [[ $(basename "${wheels[0]}") != "$expected" ]]; then
            echo "Unexpected wheel filename: ${wheels[0]}"
            exit 1
          fi
          sha256sum "${wheels[0]}"

      - name: Retain release wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kumo-api-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: packages/kumo-api/dist/*.whl
          if-no-files-found: error
          retention-days: 14

      # - name: Check schema compatibility (Pydantic v1)
      #   run: |
      #     uv pip install '.[release-check]' 'pydantic<2'
      #     python -m tools.schema_compat check-release --version ${NEW_VERSION_INPUT#v}.0
      #   env:
      #     AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #     AWS_DEFAULT_REGION: us-west-2

      # - name: Check schema compatibility (Pydantic v2)
      #   run: |
      #     uv pip install '.[release-check]' 'pydantic>=2.7'
      #     python -m tools.schema_compat check-release --version ${NEW_VERSION_INPUT#v}.0
      #   env:
      #     AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #     AWS_DEFAULT_REGION: us-west-2

      - name: Push version update to master
        if: >-
          steps.release-plan.outputs.mutate_remote == 'true' &&
          steps.release-plan.outputs.needs_version_update == 'true' &&
          steps.release-plan.outputs.is_prerelease != 'true'
        run: |
          git remote -v
          git push origin master

      - name: Prepare and cut release
        env:
          IS_PRERELEASE: ${{ steps.release-plan.outputs.is_prerelease }}
          MUTATE_REMOTE: ${{ steps.release-plan.outputs.mutate_remote }}
          RELEASE_BRANCH: kumo-api-${{ steps.release-plan.outputs.target_branch }}
          TAG: kumo-api-${{ steps.release-plan.outputs.release_tag }}
        run: |
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            git tag "$TAG"
          else
            git checkout -b "$RELEASE_BRANCH"
            git tag "$TAG"
          fi

          if [[ "$MUTATE_REMOTE" != "true" ]]; then
            echo "Dry run: would push release refs and create the GitHub release for $TAG."
            exit 0
          fi

          if [[ "$IS_PRERELEASE" == "true" ]]; then
            git push origin "$TAG"
          else
            git push --atomic origin "$RELEASE_BRANCH" "$TAG"
          fi

      - name: Publish to PyPI
        if: steps.release-plan.outputs.mutate_remote == 'true'
        run: |
          if [ -n "$GITHUB_TOKEN" ];
          then
            echo 'GITHUB_TOKEN is set, not safe to publish to pypi'
            exit 1
          fi
          twine upload --skip-existing dist/*.whl
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

      - name: Create GitHub release after PyPI succeeds
        if: steps.release-plan.outputs.mutate_remote == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          IS_PRERELEASE: ${{ steps.release-plan.outputs.is_prerelease }}
          PREV_VERSION: kumo-api-${{ steps.release-plan.outputs.previous_tag }}
          TAG: kumo-api-${{ steps.release-plan.outputs.release_tag }}
        run: |
          release_args=(--verify-tag --generate-notes --title "$TAG" --notes-start-tag "$PREV_VERSION")
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$TAG" "${release_args[@]}"

      # - name: Upload schema to S3 (Pydantic v1)
      #   run: |
      #     uv pip install '.[release-check]' 'pydantic<2'
      #     python -m tools.schema_compat upload --version ${NEW_VERSION_INPUT#v}.0
      #   env:
      #     AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #     AWS_DEFAULT_REGION: us-west-2

      # - name: Upload schema to S3 (Pydantic v2)
      #   run: |
      #     uv pip install '.[release-check]' 'pydantic>=2.7'
      #     python -m tools.schema_compat upload --version ${NEW_VERSION_INPUT#v}.0
      #   env:
      #     AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #     AWS_DEFAULT_REGION: us-west-2

      - name: Set output
        if: ${{ success() }}
        id: set-output
        run: echo "success=true" >> "$GITHUB_OUTPUT"
