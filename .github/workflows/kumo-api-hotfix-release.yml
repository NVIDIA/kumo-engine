name: Kumo API - Cut hotfix release

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      minor_version:
        description: 'Kumo API release branch to update (kumo-api-vX.Y)'
        required: true
        type: string

env:
  REGISTRY_USER: kumo+kumo_internal
  MINOR_VERSION: ${{ inputs.minor_version }}

permissions:
  contents: write
  id-token: write

jobs:
  cut-release:
    name: Cut New Release of Kumo API
    runs-on: ubuntu-22.04
    outputs:
      release_success: ${{ steps.set-output.outputs.success }}

    defaults:
      run:
        shell: bash
        working-directory: packages/kumo-api

    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
          fetch-depth: 0

      - name: Configure Git Author
        run: |
          git config user.name "kumo-release-bot"
          git config user.email "kumo-release-bot@users.noreply.github.com"

      - name: Validate dispatch branch
        run: |
          if [[ ! "$MINOR_VERSION" =~ ^kumo-api-v[0-9]+\.[0-9]+$ ]]; then
            echo "minor_version must match kumo-api-vX.Y, found $MINOR_VERSION."
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "$MINOR_VERSION" ]]; then
            echo "This workflow must be dispatched from the release branch named by minor_version."
            echo "Dispatch ref: $GITHUB_REF_NAME"
            echo "minor_version: $MINOR_VERSION"
            exit 1
          fi

      - name: Get Next Hotfix/Patch Version
        run: |
          git fetch origin --tags
          git checkout "$MINOR_VERSION"

          # Add v to the package version for comparison with the namespaced tag.
          CURRENT_VERSION="v$(awk '/^\[project\]/{p=1;next} p&&/^version/{gsub(/[^0-9.]/, "", $3);print $3;exit}' pyproject.toml)"
          echo "Current version from pyproject.toml: $CURRENT_VERSION"
          # check that CURRENT_VERSION matches up with existing tags:
          LATEST_TAG=$(git tag --list "${MINOR_VERSION}.*" | grep -E "^kumo-api-v[0-9]+\.[0-9]+\.[0-9]+$" | sort -V | tail -1)
          LATEST_VERSION=${LATEST_TAG#kumo-api-}
          if [[ "$CURRENT_VERSION" != "$LATEST_VERSION" ]]; then
            echo "Error: current version $CURRENT_VERSION does not match latest tag $LATEST_TAG; resolve pyproject.toml and release discrepancy before continuing"
            exit 1
          fi

          # determine vx.y.(z+1)
          NEW_PATCH=$(awk -F. -v OFS=. '{$NF += 1 ; print}' <<< "$CURRENT_VERSION")
          echo "New minor version: $NEW_PATCH"
          {
            echo "NEW_PATCH=$NEW_PATCH"
            echo "NEW_TAG=kumo-api-$NEW_PATCH"
            echo "PREV_VERSION=$LATEST_TAG"
          } >> "$GITHUB_ENV"

      - name: Update pyproject.toml on Version Branch
        run: |
          git checkout "$MINOR_VERSION"
          git pull origin "$MINOR_VERSION"
          echo "current branch: $(git branch --show-current) NEW MINOR: $NEW_PATCH"
          awk -v version_line="version = \"${NEW_PATCH#v}\"" -i inplace '/^\[project\]/{p=1} p&&/^version/{if(!done){sub(/^version = .*/,version_line);done=1}} 1' pyproject.toml
          awk -v version_line="version = \"${NEW_PATCH#v}\"" -i inplace '/^\[tool.poetry\]/{p=1} p&&/^version/{if(!done){sub(/^version = .*/,version_line);done=1}} 1' pyproject.toml
          git add pyproject.toml
          git commit -m "Update version to $NEW_PATCH"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.11'
          activate-environment: true

      - name: Verify import
        uses: ./packages/kumo-api/.github/actions/verify-import
        with:
          pydantic-version: 'pydantic>=2.7'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::926922431314:role/gha-kumo-api-schema-publish
          aws-region: us-west-2

      - name: Check schema compatibility
        run: |
          uv pip install '.[release-check]' 'pydantic>=2.7'
          python -m tools.schema_compat check-release --version "${NEW_PATCH#v}"

      - name: Clear AWS credentials after schema compatibility checks
        if: ${{ always() }}
        run: |
          {
            echo "AWS_ACCESS_KEY_ID="
            echo "AWS_SECRET_ACCESS_KEY="
            echo "AWS_SESSION_TOKEN="
            echo "AWS_DEFAULT_REGION="
            echo "AWS_REGION="
          } >> "$GITHUB_ENV"

      - name: Push version update to branch
        run: git push origin "$MINOR_VERSION"

      - name: Cut Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "current branch: $(git branch --show-current)"
          echo "PREV_VERSION for notes: $PREV_VERSION"

          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"
          gh release create "$NEW_TAG" --verify-tag --generate-notes \
            --title "$NEW_TAG" --notes-start-tag "$PREV_VERSION"

      - name: Publish to PyPI
        run: |
          if [ -n "$GITHUB_TOKEN" ];
          then
            echo 'GITHUB_TOKEN is set, not safe to publish to pypi'
            exit 1
          fi
          uv pip install twine build
          python -m build --wheel
          twine check dist/*
          twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

      - name: Configure AWS credentials for schema upload
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::926922431314:role/gha-kumo-api-schema-publish
          aws-region: us-west-2

      - name: Upload schema to S3
        run: |
          uv pip install '.[release-check]' 'pydantic>=2.7'
          python -m tools.schema_compat upload --version "${NEW_PATCH#v}"

      - name: Clear AWS credentials after schema upload
        if: ${{ always() }}
        run: |
          {
            echo "AWS_ACCESS_KEY_ID="
            echo "AWS_SECRET_ACCESS_KEY="
            echo "AWS_SESSION_TOKEN="
            echo "AWS_DEFAULT_REGION="
            echo "AWS_REGION="
          } >> "$GITHUB_ENV"

      - name: Set output
        if: ${{ success() }}
        id: set-output
        run: echo "success=true" >> "$GITHUB_OUTPUT"
