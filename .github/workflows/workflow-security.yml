name: Workflow security policy

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Workflow security policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Test workflow security policy
        run: node --test .github/scripts/workflow-security.test.cjs
      - name: Reject new workflow security findings
        run: node .github/scripts/workflow-security.cjs . --baseline .github/workflow-security-baseline.json
