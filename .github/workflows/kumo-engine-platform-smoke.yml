name: Kumo Engine - Platform wheel CPU qualification

on:  # yamllint disable-line rule:truthy
  workflow_call:

permissions:
  contents: read

jobs:
  smoke:
    name: CPU wheel (${{ matrix.target.platform }}, Python ${{ matrix.python }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
        target:
          - platform: windows-native
            runner: windows-2022
            artifact: windows-x86_64
          - platform: windows-wsl
            runner: wsl-amd64-gpu-t4-latest-1
            artifact: x86_64
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            artifact: aarch64
    runs-on: ${{ matrix.target.runner }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ''
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      CUDA_VISIBLE_DEVICES: ''
      UV_LINK_MODE: copy
      UV_NO_CONFIG: 'true'
      SMOKE_PLATFORM: ${{ matrix.target.platform }}
      SMOKE_PYTHON: ${{ matrix.python }}
      CANDIDATE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout the candidate test harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download the candidate wheel from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: kumo-engine-wheel-${{ matrix.target.artifact }}-${{ github.sha }}
          path: ${{ runner.temp }}/platform-wheel/artifacts

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false

      - name: Clean install and qualify the finished wheel
        run: |
          set -euo pipefail
          unset PYTHONPATH
          stage="$RUNNER_TEMP/platform-wheel"
          if [ "$RUNNER_OS" = Windows ]; then
            stage="$(cygpath -u "$stage")"
          fi
          mkdir -p "$stage/results" "$stage/test"
          cp packages/kumo-engine/test/smoke_platform.py "$stage/test/"
          cp packages/kumo-engine/scripts/verify_installed_wheel.py "$stage/test/"
          cd "$stage"
          wheels=(artifacts/kumo_engine-*.whl)
          if [ "${#wheels[@]}" -ne 1 ] || [ ! -f "${wheels[0]}" ]; then
            echo 'Expected exactly one candidate engine wheel.' >&2
            exit 1
          fi
          uv venv --python "$SMOKE_PYTHON" --seed venv
          if [ "$RUNNER_OS" = Windows ]; then
            python="$stage/venv/Scripts/python.exe"
          else
            python="$stage/venv/bin/python"
          fi
          uv pip install --python "$python" --torch-backend=cpu \
            "${wheels[0]}" pytest 2>&1 | tee results/install.log
          uv pip check --python "$python" 2>&1 | tee results/dependencies.log
          "$python" test/verify_installed_wheel.py \
            --wheel "${wheels[0]}" --platform "$SMOKE_PLATFORM" \
            --python-version "$SMOKE_PYTHON" --commit "$CANDIDATE_SHA" \
            --output results/environment.json
          cd test
          "$python" -m pytest -q -s --confcutdir=. \
            --junitxml=../results/junit.xml smoke_platform.py \
            2>&1 | tee ../results/smoke.log

      - name: Save platform qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: engine-wheel-cpu-${{ matrix.target.platform }}-py${{ matrix.python }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/platform-wheel/results
          if-no-files-found: warn
          retention-days: 14

  # Save, restart, reload and predict two tasks (desktop_reload_qualification.py).
  # A person runs the macOS 14 and MPS rows (docs/development/releasing-kumo-engine.md).
  reload:
    name: Reload ${{ matrix.name }} ${{ matrix.device }} (Python 3.12)
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-x86_64, runner: ubuntu-24.04, artifact: x86_64, device: cpu, torch: --torch-backend=cpu}
          - {name: linux-x86_64, runner: linux-amd64-gpu-rtxpro6000-latest-1, artifact: x86_64, device: gpu}
          - {name: linux-arm64, runner: ubuntu-24.04-arm, artifact: aarch64, device: cpu, torch: --torch-backend=cpu, extra: '[cpu]'}
          - {name: windows-wsl, runner: wsl-amd64-gpu-t4-latest-1, artifact: x86_64, device: cpu, torch: --torch-backend=cpu}
          - {name: windows-wsl, runner: wsl-amd64-gpu-t4-latest-1, artifact: x86_64, device: gpu}
          - {name: macos-15, runner: macos-15, artifact: arm64, device: cpu}
          - {name: macos-26, runner: macos-26, artifact: arm64, device: cpu}
    runs-on: ${{ matrix.runner }}
    # The tasks read the GPU smoke's private PR172 fixture object.
    environment: {name: gha-kumo-workflow-tests, deployment: false}
    permissions: {contents: read, id-token: write}
    defaults: {run: {shell: bash}}
    env: {PYTHONPATH: '', UV_LINK_MODE: copy, UV_NO_CONFIG: 'true'}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: kumo-engine-wheel-${{ matrix.artifact }}-${{ github.sha }}
          path: ${{ runner.temp }}/reload/artifacts
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with: {enable-cache: false}
      - id: aws
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6
        with:
          role-to-assume: arn:aws:iam::926922431314:role/gha-kumo-workflow-tests
          aws-region: us-west-2
          output-env-credentials: false
          output-credentials: true
          unset-current-credentials: true
      - name: Download and check the pinned PR172 inputs
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws.outputs.aws-session-token }}
        # A separate tool environment keeps boto3 out of the candidate venv.
        run: |
          uv run --no-project --python 3.12 --with 'boto3>=1.34,<2' python -I - <<'PY'
          import hashlib, json, os, tarfile
          from pathlib import Path
          import boto3
          spec = json.loads(Path('packages/kumo-engine/test/pr172/inputs.json').read_text())
          archive = Path(os.environ['RUNNER_TEMP'], 'reload-inputs.tar.gz')
          boto3.client('s3', region_name=spec['region']).download_file(spec['bucket'], spec['key'], str(archive))
          if hashlib.sha256(archive.read_bytes()).hexdigest() != spec['sha256']:
              raise SystemExit('PR172 input checksum differs')
          with tarfile.open(archive) as source:
              source.extractall(Path(os.environ['RUNNER_TEMP'], 'reload-inputs'), filter='data')
          PY
      - name: Clean install, then train, reload and compare in new processes
        run: |
          # Only the pinned credential step may mint OIDC tokens.
          unset ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN
          cd "$RUNNER_TEMP/reload"
          mkdir test results
          cp "$GITHUB_WORKSPACE"/packages/kumo-engine/test/{desktop_reload_qualification,wheel_gpu_smoke}.py test/
          wheels=(artifacts/kumo_engine-*.whl) && [ "${#wheels[@]}" -eq 1 ]
          uv venv --python 3.12 venv
          uv pip install --python venv/bin/python ${{ matrix.torch }} "${wheels[0]}${{ matrix.extra }}"
          uv pip check --python venv/bin/python
          uv pip freeze --python venv/bin/python > results/freeze.txt
          venv/bin/python -I test/desktop_reload_qualification.py run --wheel "${wheels[0]}" \
            --device ${{ matrix.device }} --data-dir "$RUNNER_TEMP/reload-inputs" \
            --output-dir results --commit ${{ github.sha }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: engine-wheel-reload-${{ matrix.name }}-${{ matrix.device }}-${{ github.sha }}-${{ github.run_attempt }}
          # Leave out predictions and the files with the private fixture's IDs and classes.
          path: |
            ${{ runner.temp }}/reload/results
            !${{ runner.temp }}/reload/results/**/*.parquet
            !${{ runner.temp }}/reload/results/*/*.json

  # Marks each configuration and task PASS, FAIL or UNVERIFIED and requires
  # the CI rows. The release report adds the Mac rows.
  reload-report:
    needs: [reload]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          pattern: engine-wheel-reload-*-${{ github.sha }}-*
          path: ${{ runner.temp }}/reload-evidence
      - shell: bash
        run: >-
          python3 -I packages/kumo-engine/test/desktop_reload_qualification.py report
          --hosted "$RUNNER_TEMP/reload-evidence" | tee -a "$GITHUB_STEP_SUMMARY"
