name: Kumo Engine - Platform wheel CPU qualification

on:  # yamllint disable-line rule:truthy
  workflow_call:
  # Qualify wheels that an earlier build run already uploaded. Use this when
  # an unrelated build target in that run failed and skipped this workflow.
  workflow_dispatch:
    inputs:
      wheel_run_id:
        description: ID of the build run that uploaded the candidate wheels.
        type: string
        required: true
      wheel_sha:
        description: Commit that the build run built (its artifact suffix).
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    name: CPU wheel (${{ matrix.target.platform }}, Python ${{ matrix.python }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
        target:
          - platform: windows-native
            runner: windows-2022
            artifact: windows-x86_64
          - platform: windows-wsl
            runner: wsl-amd64-gpu-t4-latest-1
            artifact: x86_64
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            artifact: aarch64
    runs-on: ${{ matrix.target.runner }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ''
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      CUDA_VISIBLE_DEVICES: ''
      UV_LINK_MODE: copy
      UV_NO_CONFIG: 'true'
      SMOKE_PLATFORM: ${{ matrix.target.platform }}
      SMOKE_PYTHON: ${{ matrix.python }}
      CANDIDATE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout the candidate test harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download the candidate wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: kumo-engine-wheel-${{ matrix.target.artifact }}-${{ inputs.wheel_sha || github.sha }}
          path: ${{ runner.temp }}/platform-wheel/artifacts
          run-id: ${{ inputs.wheel_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false

      - name: Clean install and qualify the finished wheel
        run: |
          set -euo pipefail
          unset PYTHONPATH
          stage="$RUNNER_TEMP/platform-wheel"
          if [ "$RUNNER_OS" = Windows ]; then
            stage="$(cygpath -u "$stage")"
          fi
          mkdir -p "$stage/results" "$stage/test"
          cp packages/kumo-engine/test/smoke_platform.py "$stage/test/"
          cp packages/kumo-engine/scripts/verify_installed_wheel.py "$stage/test/"
          cd "$stage"
          wheels=(artifacts/kumo_engine-*.whl)
          if [ "${#wheels[@]}" -ne 1 ] || [ ! -f "${wheels[0]}" ]; then
            echo 'Expected exactly one candidate engine wheel.' >&2
            exit 1
          fi
          uv venv --python "$SMOKE_PYTHON" --seed venv
          if [ "$RUNNER_OS" = Windows ]; then
            python="$stage/venv/Scripts/python.exe"
          else
            python="$stage/venv/bin/python"
          fi
          uv pip install --python "$python" --torch-backend=cpu \
            "${wheels[0]}" pytest 2>&1 | tee results/install.log
          uv pip check --python "$python" 2>&1 | tee results/dependencies.log
          "$python" test/verify_installed_wheel.py \
            --wheel "${wheels[0]}" --platform "$SMOKE_PLATFORM" \
            --python-version "$SMOKE_PYTHON" --commit "$CANDIDATE_SHA" \
            --output results/environment.json
          cd test
          "$python" -m pytest -q -s --confcutdir=. \
            --junitxml=../results/junit.xml smoke_platform.py \
            2>&1 | tee ../results/smoke.log

      - name: Save platform qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: engine-wheel-cpu-${{ matrix.target.platform }}-py${{ matrix.python }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/platform-wheel/results
          if-no-files-found: warn
          retention-days: 14

  # Fresh-process save and reload on every supported desktop configuration.
  # A producer process trains and exports the model and snapshot; the job
  # deletes its scratch, caches and inputs; a new consumer process reloads
  # and predicts. A GPU row passes only with work observed on that GPU.
  reload:
    name: Reload ${{ matrix.target.name }} ${{ matrix.target.device }} (Python ${{ matrix.python }})
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
        target:
          - name: linux-x86_64
            runner: ubuntu-24.04
            artifact: x86_64
            device: cpu
            torch_backend: cpu
            extra: ''
          - name: linux-x86_64
            runner: linux-amd64-gpu-rtxpro6000-latest-1
            artifact: x86_64
            device: gpu
            torch_backend: ''
            extra: ''
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            artifact: aarch64
            device: cpu
            torch_backend: cpu
            extra: '[cpu]'
          - name: windows-wsl
            runner: wsl-amd64-gpu-t4-latest-1
            artifact: x86_64
            device: cpu
            torch_backend: cpu
            extra: ''
          - name: windows-wsl
            runner: wsl-amd64-gpu-t4-latest-1
            artifact: x86_64
            device: gpu
            torch_backend: ''
            extra: ''
          - name: macos-14
            runner: macos-14
            artifact: arm64
            device: cpu
            torch_backend: ''
            extra: ''
          - name: macos-15
            runner: macos-15
            artifact: arm64
            device: cpu
            torch_backend: ''
            extra: ''
          # Standard macOS runners expose no Metal device to PyTorch.
          - name: macos-14
            runner: macos-14-xlarge
            artifact: arm64
            device: mps
            torch_backend: ''
            extra: ''
          - name: macos-15
            runner: macos-15-xlarge
            artifact: arm64
            device: mps
            torch_backend: ''
            extra: ''
    runs-on: ${{ matrix.target.runner }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ''
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      UV_LINK_MODE: copy
      UV_NO_CONFIG: 'true'
      RELOAD_LABEL: ${{ matrix.target.name }}-${{ matrix.target.device }}-py${{ matrix.python }}
      RELOAD_DEVICE: ${{ matrix.target.device }}
      RELOAD_PYTHON: ${{ matrix.python }}
      RELOAD_EXTRA: ${{ matrix.target.extra }}
      RELOAD_TORCH_BACKEND: ${{ matrix.target.torch_backend }}
      CANDIDATE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout the candidate test harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download the candidate wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: kumo-engine-wheel-${{ matrix.target.artifact }}-${{ inputs.wheel_sha || github.sha }}
          path: ${{ runner.temp }}/reload/artifacts
          run-id: ${{ inputs.wheel_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false

      - name: Clean install, then train, reload and compare in new processes
        run: |
          set -euo pipefail
          unset PYTHONPATH
          stage="$RUNNER_TEMP/reload"
          mkdir -p "$stage/results" "$stage/test"
          cp packages/kumo-engine/test/desktop_reload_qualification.py \
            packages/kumo-engine/test/test_desktop_reload_harness.py \
            "$stage/test/"
          cd "$stage"
          wheels=(artifacts/kumo_engine-*.whl)
          if [ "${#wheels[@]}" -ne 1 ] || [ ! -f "${wheels[0]}" ]; then
            echo 'Expected exactly one candidate engine wheel.' >&2
            exit 1
          fi
          uv venv --python "$RELOAD_PYTHON" --seed venv
          python="$stage/venv/bin/python"
          args=()
          if [ -n "$RELOAD_TORCH_BACKEND" ]; then
            args+=(--torch-backend="$RELOAD_TORCH_BACKEND")
          fi
          uv pip install --python "$python" ${args[@]+"${args[@]}"} \
            "${wheels[0]}${RELOAD_EXTRA}" pytest 2>&1 | tee results/install.log
          uv pip check --python "$python" 2>&1 | tee results/dependencies.log
          uv pip freeze --python "$python" > results/freeze.txt
          sha256sum "${wheels[0]}" 2>/dev/null > results/wheel.sha256 \
            || shasum -a 256 "${wheels[0]}" > results/wheel.sha256
          if [ "$RELOAD_DEVICE" = gpu ]; then
            nvidia-smi 2>&1 | tee results/nvidia-smi.log
          fi
          if [ "$RELOAD_DEVICE" = mps ]; then
            system_profiler SPDisplaysDataType 2>&1 | tee results/gpu.log
          fi
          (cd test && "$python" -m pytest -q -p no:cacheprovider \
            --confcutdir=. --noconftest test_desktop_reload_harness.py \
            --junitxml=../results/harness-junit.xml) 2>&1 \
            | tee results/harness-tests.log
          "$python" -I test/desktop_reload_qualification.py run \
            --wheel "${wheels[0]}" --device "$RELOAD_DEVICE" \
            --case numerical --case static_link --case temporal_link \
            --negative-checks --label "$RELOAD_LABEL" \
            --commit "$CANDIDATE_SHA" --attempt "$GITHUB_RUN_ATTEMPT" \
            --work-dir "$stage/work" \
            --output-dir "$stage/results/cases" 2>&1 \
            | tee results/reload.log

      - name: Save reload qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: engine-wheel-reload-${{ matrix.target.name }}-${{ matrix.target.device }}-py${{ matrix.python }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reload/results
          if-no-files-found: warn
          retention-days: 30

  # One matrix of every required configuration and case. A configuration
  # whose job produced no evidence is UNVERIFIED, and the job then fails.
  reload-report:
    needs: [reload]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the candidate test harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Every attempt: re-running only failed jobs keeps earlier passes, and
      # the report uses the newest attempt for each configuration.
      - name: Download every reload result from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          pattern: engine-wheel-reload-*-${{ github.sha }}-*
          path: ${{ runner.temp }}/reload-evidence

      - name: Build the qualification matrix
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          EVIDENCE: ${{ runner.temp }}/reload-evidence
          REPORT: ${{ runner.temp }}/reload-report
        run: |
          mkdir -p "$EVIDENCE"
          set +e
          python3 -I packages/kumo-engine/test/desktop_reload_qualification.py \
            report --evidence-dir "$EVIDENCE" --output-dir "$REPORT" \
            --commit "$CANDIDATE_SHA"
          status=$?
          set -e
          cat "$REPORT/matrix.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Save the qualification matrix
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: engine-reload-matrix-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reload-report
          if-no-files-found: warn
          retention-days: 30
