name: Kumo Engine - Platform wheel CPU qualification

on:  # yamllint disable-line rule:truthy
  workflow_call:

permissions:
  contents: read

jobs:
  smoke:
    name: CPU wheel (${{ matrix.target.platform }}, Python ${{ matrix.python }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
        target:
          - platform: windows-native
            runner: windows-2022
            artifact: windows-x86_64
          - platform: windows-wsl
            runner: wsl-amd64-gpu-t4-latest-1
            artifact: x86_64
          - platform: macos-arm64
            runner: macos-15
            artifact: arm64
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            artifact: aarch64
    runs-on: ${{ matrix.target.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout the candidate test harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download the candidate wheel from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: kumo-engine-wheel-${{ matrix.target.artifact }}-${{ github.sha }}
          path: ${{ runner.temp }}/platform-wheel/artifacts

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false

      - name: Clean install and qualify the finished wheel
        uses: ./.github/actions/engine-cpu-smoke
        with:
          platform: ${{ matrix.target.platform }}
          python-version: ${{ matrix.python }}
          commit: ${{ github.sha }}

      - name: Save platform qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: engine-wheel-cpu-${{ matrix.target.platform }}-py${{ matrix.python }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/platform-wheel/results
          if-no-files-found: warn
          retention-days: 14
