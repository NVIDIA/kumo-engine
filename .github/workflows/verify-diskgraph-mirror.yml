name: Verify DiskGraph mirror

'on':
  pull_request:
    paths:
      - packages/diskgraph/**
      - tools/migrations/diskgraph/**

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
      - run: python tools/migrations/diskgraph/verify_import.py
