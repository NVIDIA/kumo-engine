name: Verify DiskGraph mirror

'on':
  pull_request:
    paths:
      - packages/diskgraph/**
      - tools/migrations/diskgraph/**

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - run: python tools/migrations/diskgraph/verify_import.py
