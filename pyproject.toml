[build-system]
requires = ["setuptools>=77", "setuptools-scm[toml]==8.3.1", "toml>=0.10.2", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
git_describe_command = "git describe --dirty --tags --long --match v[1-9]*"

[project]
name = "kumo"
description = "AI on the Modern Data Stack"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0 AND BSD-3-Clause AND MIT"
license-files = ["LICENSE", "KUMO-THIRD-PARTY.txt"]
dynamic = [
    "version",
    "authors",
    "keywords",
    "classifiers",
    "dependencies",
    "optional-dependencies",
]

[dependency-groups]
# Public engine tests use CPU Torch with the engine's GPU Faiss dependency.
public-tests = ["torch"]

[tool.poetry]
name = "kumo"
version = "0.1.0"
description = "AI on the Modern Data Stack"
authors = []
readme = "README.md"
packages = [{include = "kumo"}]

[tool.poetry.dependencies]
python = "^3.11"

[tool.uv.workspace]
# kumo-databricks-connector has no checked-in pyproject.toml and kumo-ui-catalog is a Node/TS project -- neither is a uv
# workspace member. packages/scripts/ has no pyproject.toml either.
members = [
  "packages/kumo-api",
  "packages/kumo-pql",
  "packages/kumo-core",
  "packages/diskgraph",
  "packages/kumo-snowflake",
  "packages/kumo-bigquery",
  "packages/kumo-databricks",
  "packages/kumo-gcs",
  "packages/kumo-s3",
  "packages/kumo-engine",
  "packages/kumo-sdk",
  "tools/glove-6b-50d",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cpu", group = "public-tests" },
  { index = "pytorch-cu130", extra = "cu130" },
  { index = "pytorch-cu132", extra = "cu132" },
]
kumo-api = { workspace = true }
kumo-pql = { workspace = true }
kumo-core = { workspace = true }
diskgraph = { workspace = true }
kumo-gcs = { workspace = true }
kumo-s3 = { workspace = true }
kumo-snowflake = { workspace = true }
kumo-bigquery = { workspace = true }
kumo-databricks = { workspace = true }
kumo-glove-6b-50d = { workspace = true }

[tool.uv]
# Exactly one torch build per environment.
conflicts = [[{ extra = "cpu" }, { extra = "cu130" }, { extra = "cu132" }, { group = "public-tests" }]]
# Delay newly uploaded artifacts long enough for compromised releases to be
# detected or yanked before local and CI installs resolve them.
exclude-newer = "7 days"
# Allow the requested PyG 2.8.1 release, published on 2026-10-12.
exclude-newer-package = { torch-geometric = "2026-10-13T00:00:00Z" }

find-links = [
  # The GPU image workflow stages checksum-pinned custom CUDA Faiss wheels
  # here for GPUs not covered by the public wheel.
  # See 3rdparty/kumo-wheels/README.md.
  "3rdparty/kumo-wheels/",
]

# snowflake-ml-python caps fsspec<2026; fsspec 2026.6.0 fixes
# GHSA-27vj-qcqg-25rc. Remove once snowflake-ml-python lifts the cap.
# This overrides every fsspec requirement (incl. the setup.py and gcsfs
# pins), so bump it together with them.
override-dependencies = ["fsspec[http]==2026.6.0"]

# snowflake-connector-python 4.7.1+ (GHSA-5cc2-282f-jjq2 fix) caps pyarrow<24
# on all Python 3.14 for a crash that only affects free-threaded 3.14t
# (snowflakedb/snowflake-connector-python#2934). Kumo runs GIL 3.14 and
# DiskGraph pins pyarrow 24, so this entry restates the 4.7.5 metadata without
# the cap, pinning the connector at 4.7.5. To move it, copy the new release's
# metadata here. Remove this entry before adopting free-threaded Python.
[[tool.uv.dependency-metadata]]
name = "snowflake-connector-python"
version = "4.7.5"
requires-python = ">=3.10"
provides-extras = ["boto", "azure", "development", "pandas", "secure-local-storage"]
requires-dist = [
  "asn1crypto<2.0.0,>0.24.0",
  "cryptography>=46.0.5",
  "pyOpenSSL>=24.0.0",
  "pyjwt<3.0.0,>=2.10.1",
  "pytz",
  "requests<3.0.0,>=2.32.4",
  "packaging",
  "charset_normalizer<4,>=2",
  "idna<4,>=3.7",
  "certifi>=2024.7.4",
  "typing_extensions<5,>=4.3",
  "filelock<4,>=3.5",
  "sortedcontainers>=2.4.0",
  "platformdirs<5.0.0,>=2.6.0",
  "tomlkit",
  "boto3>=1.24",
  "botocore>=1.24",
  "boto3>=1.24; extra == 'boto'",
  "botocore>=1.24; extra == 'boto'",
  "azure-identity>=1.16; extra == 'azure'",
  "Cython>=3.1; extra == 'development'",
  "azure-identity>=1.16; extra == 'development'",
  "coverage; extra == 'development'",
  "mitmproxy>=12.0.0; (python_version >= '3.12' and python_version < '3.14') and extra == 'development'",
  "more-itertools; extra == 'development'",
  "numpy<=2.4.3; extra == 'development'",
  "pendulum!=2.1.1; extra == 'development'",
  "pexpect; extra == 'development'",
  "pytest<9,>=8.4; extra == 'development'",
  "pytest-asyncio<2,>=1.4.0; extra == 'development'",
  "pytest-cov; extra == 'development'",
  "pytest-rerunfailures<16.0; extra == 'development'",
  "pytest-timeout; extra == 'development'",
  "pytest-xdist; extra == 'development'",
  "pytzdata; extra == 'development'",
  "responses; extra == 'development'",
  "pandas<3.0.0,>=1.0.0; python_version < '3.13' and extra == 'pandas'",
  "pandas<3.0.0,>=2.1.2; python_version >= '3.13' and extra == 'pandas'",
  # Upstream: "pyarrow<24,>=14.0.1; python_version >= '3.14' and extra == 'pandas'"
  # and "pyarrow>=14.0.1; python_version < '3.14' and extra == 'pandas'".
  "pyarrow>=14.0.1; extra == 'pandas'",
  "keyring<26.0.0,>=23.1.0; extra == 'secure-local-storage'",
]

[tool.vulture]
# Include high-confidence findings such as unused imports while avoiding the
# noisier 60% class, function, method, and variable findings for now.
min_confidence = 80
paths = ["."]
exclude = [
  ".agents/",
  ".git/",
  ".venv/",
  "3rdparty/",
  "kumo/pquery/grammar/",
  # Imported DiskGraph files must remain identical to their source.
  "packages/diskgraph/",
  "*/conftest.py",
  "*/examples/*",
  "*/test/*",
  "*/tests/*",
  "*/test_*.py",
  "*_test.py",
]
