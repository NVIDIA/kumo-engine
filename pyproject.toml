[tool.uv.workspace]
# kumo-databricks-connector has no checked-in pyproject.toml and kumo-ui-catalog is a Node/TS project -- neither is a uv
# workspace member. packages/scripts/ has no pyproject.toml either.
members = [
  "apps/studio",
  "packages/contracts/kumo-api",
  "packages/contracts/kumo-settings",
  "packages/contracts/kumo-pql",
  "packages/runtime/kumo-core",
  "packages/data/diskgraph",
  "packages/integrations/kumo-snowflake",
  "packages/integrations/kumo-bigquery",
  "packages/integrations/kumo-databricks",
  "packages/integrations/kumo-gcs",
  "packages/integrations/kumo-adls",
  "packages/integrations/kumo-s3",
  "packages/clients/kumo-engine",
  "packages/clients/kumo-sdk",
  "packages/experimental/kumo-pytorch",
  "packages/models/glove-6b-50d",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
kumo-api = { workspace = true }
kumo-pql = { workspace = true }
kumo-core = { workspace = true }
diskgraph = { workspace = true }
kumo-gcs = { workspace = true }
kumo-adls = { workspace = true }
kumo-s3 = { workspace = true }
kumo-snowflake = { workspace = true }
kumo-bigquery = { workspace = true }
kumo-databricks = { workspace = true }
kumo-glove-6b-50d = { workspace = true }

[tool.uv]
# development/config/.mise.toml repeats this version, and the backend Dockerfiles read this line.
required-version = "==0.13.7"
# Exactly one torch build per environment.
conflicts = [[{ package = "kumo", extra = "cpu" }, { package = "kumo", extra = "cu130" }, { package = "kumo", extra = "cu132" }, { package = "kumo", group = "public-tests" }]]
# Delay newly uploaded artifacts long enough for compromised releases to be
# detected or yanked before local and CI installs resolve them.
exclude-newer = "7 days"
# Allow the requested PyG 2.8.1 release, published on 2026-10-12.
# Allow Pillow 13.0.0, released on 2026-10-16, for CVE-2026-112404.
# Allow Certifi's 2026-10-19 fix for GHSA-6q48-6c7w-9gw2.
exclude-newer-package = { torch-geometric = "2026-10-13T00:00:00Z", pillow = "2026-10-17T00:00:00Z", certifi = "2026-10-21T00:00:00Z" }

find-links = [
  # The GPU image workflow stages checksum-pinned custom CUDA Faiss wheels
  # here for GPUs not covered by the public wheel.
  # See development/third-party/kumo-wheels/README.md.
  "development/third-party/kumo-wheels/",
]

# snowflake-ml-python caps fsspec<2026; fsspec 2026.6.0 fixes
# GHSA-27vj-qcqg-25rc. Remove once snowflake-ml-python lifts the cap.
# This overrides every fsspec requirement (incl. the apps/studio/setup.py and gcsfs
# pins), so bump it together with them.
override-dependencies = ["fsspec[http]==2026.6.0"]

# snowflake-connector-python 4.7.1+ (GHSA-5cc2-282f-jjq2 fix) caps pyarrow<24
# on all Python 3.14 for a crash that only affects free-threaded 3.14t
# (snowflakedb/snowflake-connector-python#2934). Kumo runs GIL 3.14 and
# DiskGraph pins pyarrow 24, so this entry restates the 4.7.5 metadata without
# the cap, pinning the connector at 4.7.5. To move it, copy the new release's
# metadata here. Remove this entry before adopting free-threaded Python.
[[tool.uv.dependency-metadata]]
name = "snowflake-connector-python"
version = "4.7.5"
requires-python = ">=3.10"
provides-extras = ["boto", "azure", "development", "pandas", "secure-local-storage"]
requires-dist = [
  "asn1crypto<2.0.0,>0.24.0",
  "cryptography>=46.0.5",
  "pyOpenSSL>=24.0.0",
  "pyjwt<3.0.0,>=2.10.1",
  "pytz",
  "requests<3.0.0,>=2.32.4",
  "packaging",
  "charset_normalizer<4,>=2",
  "idna<4,>=3.7",
  "certifi>=2024.7.4",
  "typing_extensions<5,>=4.3",
  "filelock<4,>=3.5",
  "sortedcontainers>=2.4.0",
  "platformdirs<5.0.0,>=2.6.0",
  "tomlkit",
  "boto3>=1.24",
  "botocore>=1.24",
  "boto3>=1.24; extra == 'boto'",
  "botocore>=1.24; extra == 'boto'",
  "azure-identity>=1.16; extra == 'azure'",
  "Cython>=3.1; extra == 'development'",
  "azure-identity>=1.16; extra == 'development'",
  "coverage; extra == 'development'",
  "mitmproxy>=12.0.0; (python_version >= '3.12' and python_version < '3.14') and extra == 'development'",
  "more-itertools; extra == 'development'",
  "numpy<=2.4.3; extra == 'development'",
  "pendulum!=2.1.1; extra == 'development'",
  "pexpect; extra == 'development'",
  "pytest<9,>=8.4; extra == 'development'",
  "pytest-asyncio<2,>=1.4.0; extra == 'development'",
  "pytest-cov; extra == 'development'",
  "pytest-rerunfailures<16.0; extra == 'development'",
  "pytest-timeout; extra == 'development'",
  "pytest-xdist; extra == 'development'",
  "pytzdata; extra == 'development'",
  "responses; extra == 'development'",
  "pandas<3.0.0,>=1.0.0; python_version < '3.13' and extra == 'pandas'",
  "pandas<3.0.0,>=2.1.2; python_version >= '3.13' and extra == 'pandas'",
  # Upstream: "pyarrow<24,>=14.0.1; python_version >= '3.14' and extra == 'pandas'"
  # and "pyarrow>=14.0.1; python_version < '3.14' and extra == 'pandas'".
  "pyarrow>=14.0.1; extra == 'pandas'",
  "keyring<26.0.0,>=23.1.0; extra == 'secure-local-storage'",
]

[tool.vulture]
# Include high-confidence findings such as unused imports while avoiding the
# noisier 60% class, function, method, and variable findings for now.
min_confidence = 80
paths = ["."]
exclude = [
  ".agents/",
  ".git/",
  ".venv/",
  "development/third-party/",
  "apps/studio/kumo/pquery/grammar/",
  "packages/data/diskgraph/",
  "*/conftest.py",
  "*/examples/*",
  "*/test/*",
  "*/tests/*",
  "*/test_*.py",
  "*_test.py",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
addopts = ["--capture=no", "--color=yes", "-vv", "-m", "not benchmark and not compose_e2e"]
norecursedirs = ["submodules/*"]
filterwarnings = ["ignore::DeprecationWarning:tensorboard.*", "ignore:distutils:DeprecationWarning", "ignore:invalid escape sequence", "ignore:.*pkg_resources.*", "ignore::DeprecationWarning:pkg_resources.*"]
xfail_strict = true
python_files = ["test_*.py", "*_test.py", "apps/studio/kumo/testing/*.py"]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')", "compose_e2e: end-to-end test that boots a docker compose stack; opt-in via '-m compose_e2e'"]
env = ["D:DEPLOY_STAGE=test", "D:KUMO_TESTING=True", "D:MAX_DATA_BACKEND_WORKER_PROCESSES=1", "D:AWS_REQUEST_CHECKSUM_CALCULATION=when_required"]
pythonpath = ["apps/studio", "development/tooling", "development/testing"]

[tool.coverage.run]
source = ["async_utils", "io_utils", "kumo", "rest", "service_framework", "temporalio_commons"]
omit = ["apps/studio/kumo/testing/*", "apps/studio/rest/devserver/*", "apps/studio/rest/scripts/*"]
branch = true
concurrency = ["thread", "multiprocessing"]
relative_files = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "warn", "raise", "except", "raise NotImplementedError", "if 0:", "if __name__ == .__main__.:", "@(abc\\.)?abstractmethod"]
