[package]
name = "diskgraph-gateway"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
diskgraph-core = { path = "../diskgraph-core" }
diskgraph-engine = { path = "../diskgraph-engine" }
diskgraph-index = { path = "../diskgraph-index" }
diskgraph-rowpack = { path = "../diskgraph-rowpack" }
arrow-flight = "58.4.0"
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
arrow-ipc = "58.4.0"
tonic = "0.14"
tokio = { workspace = true }
tokio-stream = "0.1"
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
prost = "0.13"
prost-derive = "0.13"
gxhash = "3.5"
bincode = "1.3"
uuid = { version = "1.4", features = ["v4"] }
parking_lot = "0.12"
clap = { version = "4.4", features = ["derive"] }

[dev-dependencies]
tempfile = "3.8"
