<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="/favicon.ico" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#000000" />
        <meta name="description" content="Kumo AI web application" />
        <link rel="apple-touch-icon" href="/logo192.png" />
        <!--
          NVIDIA Kaizen fonts.
          NVIDIA Sans (proprietary) is served from NVIDIA's public web-assets
          CDN — the real font, with no font files committed to the repo. If the
          CDN is unreachable (e.g. an air-gapped / no-internet deployment), the
          browser automatically uses the metric-matched "NVIDIA Sans Fallback".
          JetBrains Mono (open-source, SIL OFL 1.1) is embedded/self-hosted from
          /public/fonts; its @font-face plus the fallback faces live in
          /public/fonts.css.
        -->
        <link rel="preconnect" href="https://brand-assets.cne.ngc.nvidia.com" />
        <link
            rel="stylesheet"
            href="https://webassets.nvidia.com/kaizen-ui-foundations/1.1.0/fonts.css" />
        <link rel="stylesheet" href="/fonts.css" />
        <script src="/env-config.js"></script>
        <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
        <link rel="manifest" href="/manifest.json" />
        <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
        <title>Kumo AI</title>
    </head>

    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
        <script type="module" src="/src/entry.ts"></script>
    </body>
</html>
