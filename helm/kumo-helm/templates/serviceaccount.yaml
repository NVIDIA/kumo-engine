{{- $roles := list "frontend" "control" "worker" "controller" -}}
{{- range $role := $roles -}}
{{- $config := include "kumo.serviceAccountConfig" (dict "root" $ "role" $role) | fromJson -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $config.name }}
  labels:
    {{- include "kumo.commonLabels" $ | nindent 4 }}
  {{- with $config.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ include "kumo.serviceAccountAutomount" (dict "root" $ "role" $role) }}
{{- /* Runtime-created pods use the worker SA. Keeping imagePullSecrets on every
       role lets any workload pull from a private registry. */ -}}
{{- include "kumo.imagePullSecrets" $ | nindent 0 }}
{{ end }}
