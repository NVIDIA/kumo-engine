apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workload-manager
  labels:
    {{- include "kumo.commonLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workload-manager
subjects:
{{- $root := . }}
# Workers can create activity resources; the controller owns daemon, Job, PVC,
# Service, and PodDisruptionBudget lifecycles. Bind only those two identities.
{{- range $role := list "worker" "controller" }}
- kind: ServiceAccount
  name: {{ include "kumo.serviceAccountName" (dict "root" $root "role" $role) }}
  namespace: {{ $root.Release.Namespace }}
{{- end }}
