apiVersion: apps/v1
kind: Deployment
metadata:
  name: kumo-rest
  labels:
    app: kumo-rest
    {{- include "kumo.commonLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.workloads.rest.replicas }}
  revisionHistoryLimit: 2
  {{- include "kumo.noSurgeRollingStrategy" . | nindent 2 }}
  selector:
    matchLabels:
      app: kumo-rest
  template:
    metadata:
      annotations:
        checksum/kumo-config: {{ include (print $.Template.BasePath "/configmap-kumo-config.yaml") . | sha256sum }}
        {{- include "kumo.podAnnotations" . | nindent 8 }}
      labels:
        app: kumo-rest
        tenant: {{ .Values.global.tenant }}
        {{- include "kumo.frontendPodLabels" (dict "root" . "component" "backend") | nindent 8 }}
        {{- include "kumo.workloadPodLabels" (dict "root" . "role" "control") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "kumo.serviceAccountName" (dict "root" . "role" "control") }}
      automountServiceAccountToken: {{ include "kumo.serviceAccountAutomount" (dict "root" . "role" "control") }}
      securityContext:
        {{- include "kumo.podSecurityContext" (dict "root" . "extra" dict) | nindent 8 }}
      {{- include "kumo.nodeTargeting" . | nindent 6 }}
      {{- include "kumo.imagePullSecrets" . | nindent 6 }}
      containers:
      - name: kumo-rest
        image: {{ include "kumo.restImage" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
          {{- include "kumo.containerSecurityContext" (dict "root" . "extra" dict) | nindent 10 }}
        command: ["/bin/sh"]
        args: ["-c", "python3 /opt/app/rest/main.py"]
        ports:
        - containerPort: 8000
          name: http
        - containerPort: 9123
          name: metrics
        env:
        - name: REST_API_PORT
          value: "8000"
        - name: METRICS_PORT
          value: "9123"
        - name: OC_CAUSE
          value: "1"
        # Trusts X-Forwarded-For from any peer. The chart no longer ships a
        # NetworkPolicy — see examples/networkpolicy.yaml to restrict callers.
        # Explicit env wins over envFrom.
        - name: FORWARDED_ALLOW_IPS
          value: "*"
        # Customer edges may collapse all browsers onto one gateway peer.
        # Retain the per-email limiter while disabling that shared IP bucket.
        - name: DIRECT_CONNECT_PASSWORD_LOGIN_IP_RATE_LIMIT_ENABLED
          value: "false"
        {{- include "kumo.authEnv" . | nindent 8 }}
        {{- include "kumo.tenantSecretKeyEnv" . | nindent 8 }}
        {{- include "kumo.downwardApiEnv" . | nindent 8 }}
        envFrom:
        - configMapRef:
            name: kumo-config
        resources:
          {{- toYaml .Values.workloads.rest.resources | nindent 10 }}
        volumeMounts:
        - name: runtime-tmp
          mountPath: /tmp
        - name: runtime-cache
          mountPath: /home/kumouser/.cache
        {{- include "kumo.temporalVolumeMount" . | nindent 8 }}
        {{- include "kumo.secretsVolumeMount" . | nindent 8 }}
        {{- include "kumo.gcpApplicationCredentialsVolumeMount" . | nindent 8 }}
      volumes:
      - name: runtime-tmp
        emptyDir: {}
      - name: runtime-cache
        emptyDir: {}
      {{- include "kumo.temporalVolume" . | nindent 6 }}
      {{- include "kumo.secretsVolume" . | nindent 6 }}
      {{- include "kumo.gcpApplicationCredentialsVolume" . | nindent 6 }}
