{{- include "kumoEdge.validate" . -}}
{{- if eq .Values.mode "alb-acm" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "kumoEdge.name" . }}
  labels:
    {{- include "kumoEdge.labels" . | nindent 4 }}
  annotations:
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/scheme: {{ .Values.alb.scheme | quote }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.alb.certificateArn | quote }}
    alb.ingress.kubernetes.io/healthcheck-path: {{ .Values.alb.healthcheckPath | quote }}
    {{- with .Values.extraAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: alb
  rules:
    - host: {{ .Values.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.target.service }}
                port:
                  number: {{ .Values.target.port }}
{{- end }}
