storageClass:
  create: true
  name: managed-csi-xfs
  skuName: Premium_LRS
  fsType: xfs
  reclaimPolicy: Delete

devicePlugin:
  enabled: true
  image:
    repository: nvcr.io/nvidia/k8s-device-plugin
    tag: v0.19.0
    pullPolicy: IfNotPresent
  nodeSelector:
    kumo.ai/gpu-node: "true"
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
