{{- if and (eq .Values.operators.mode "dedicated") .Values.clusterPolicy.create }}
apiVersion: nvidia.com/v1
kind: ClusterPolicy
metadata:
  name: {{ .Values.clusterPolicy.name }}
  labels:
    {{- include "kumo-platform-aro.labels" . | nindent 4 }}
spec:
  daemonsets: {}
  dcgm:
    enabled: true
  dcgmExporter:
    enabled: {{ .Values.clusterPolicy.dcgmExporterEnabled }}
  devicePlugin:
    enabled: true
  driver:
    enabled: true
    use_ocp_driver_toolkit: true
  gfd:
    enabled: true
  nodeStatusExporter:
    enabled: true
  operator:
    defaultRuntime: crio
  toolkit:
    enabled: true
{{- end }}
