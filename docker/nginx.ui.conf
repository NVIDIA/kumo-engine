worker_processes auto;
pid /tmp/kumo-ui/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    client_body_temp_path /tmp/kumo-ui/client_temp;
    proxy_temp_path /tmp/kumo-ui/proxy_temp;
    fastcgi_temp_path /tmp/kumo-ui/fastcgi_temp;
    uwsgi_temp_path /tmp/kumo-ui/uwsgi_temp;
    scgi_temp_path /tmp/kumo-ui/scgi_temp;

    server {
        listen 3000;
        listen [::]:3000;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Runtime-generated config should not be cached.
        location = /env-config.js {
            root /tmp/kumo-ui;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            try_files $uri =404;
        }

        # SPA routing fallback.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
