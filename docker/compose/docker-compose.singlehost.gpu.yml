services:
  kumo-pool-worker:
    image: ${KUMO_GPU_IMAGE:-${KUMO_IMAGE_REGISTRY:-kumo}/kumo-backend-gpu:${KUMO_IMAGE_TAG}}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
