global:
  scrape_interval: 15s
  evaluation_interval: 15s

  # Attach these labels to any time series or alerts when communicating with
  # external systems (federation, remote storage, Alertmanager).
  external_labels:
    monitor: "kumo"

scrape_configs:
  - job_name: "nodeexporter"
    scrape_interval: 15s
    static_configs:
      - targets: ["localhost:9100"]

  - job_name: "dcgm-exporter"
    scrape_interval: 10s
    static_configs:
      - targets: ["localhost:9400"]

  - job_name: "cadvisor"
    scrape_interval: 10s
    static_configs:
      - targets: ["localhost:8080"]

  - job_name: "prometheus"
    scrape_interval: 10s
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "pushgateway"
    scrape_interval: 10s
    honor_labels: true
    static_configs:
      - targets: ["localhost:9091"]

  - job_name: "smartctl"
    scrape_interval: 5s
    static_configs:
      - targets: ["localhost:9902"]

  - job_name: "rest-api"
    scrape_interval: 10s
    static_configs:
      - targets: ["localhost:8000"]

  - job_name: "rest-api-public"
    scrape_interval: 10s
    static_configs:
      - targets: ["localhost:8001"]

  - job_name: "temporalworker-rest"
    scrape_interval: 10s
    static_configs:
      - targets: ["localhost:8002"]

  - job_name: "temporalworker-dataworkflow"
    scrape_interval: 10s
    static_configs:
      - targets: ["localhost:8003"]

  - job_name: "temporalworker-mlworkflow"
    scrape_interval: 10s
    static_configs:
      - targets: ["localhost:8005"]
