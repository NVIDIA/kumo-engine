# The public pilot imports checked-out source without the hosted test fixtures.
[pytest]
addopts = --strict-config --strict-markers -ra
pythonpath =
    ../..
    ../../packages/kumo-api
    ../../packages/kumo-core
    ../../packages/kumo-core/src
    ../../packages/kumo-core/tests
    ../../packages/kumo-s3/src
    ../../packages/kumo-gcs/src
    ../../packages/kumo-adls/src
    ../../packages/kumo-bigquery/src
    ../../packages/kumo-databricks/src
    ../../packages/kumo-snowflake/src

# Keep the core package's strict expected-failure and future-warning policy.
xfail_strict = true
filterwarnings =
    error::FutureWarning
