[package]
name = "diskgraph-explain"
version = "0.1.0"
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
arrow-array = { workspace = true }
arrow-buffer = { workspace = true }
arrow-schema = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }
diskgraph-index = { path = "../diskgraph-index" }
diskgraph-core = { path = "../diskgraph-core" }
diskgraph-rowpack = { path = "../diskgraph-rowpack" }

parquet = "58.4.0"
rand = "0.8"
rayon = "1.10"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
tempfile = "3"
diskgraph-ingest = { path = "../diskgraph-ingest" }

[[bin]]
name = "explain"
path = "src/bin/explain.rs"

[[bin]]
name = "explain_cli"
path = "src/bin/explain_cli.rs"
