[metadata]
version=attr:kumo.__version__

classifiers =
   Development Status :: 1 - Planning
   Programming Language :: Python
   Programming Language :: Python :: 3.6
   Programming Language :: Python :: 3.7
   Programming Language :: Python :: 3.8
   Programming Language :: Python :: 3.9
   Programming Language :: Python :: 3 :: Only

[options]
package_dir=
   =.

[aliases]
test=pytest

[tool:pytest]
asyncio_mode = strict
addopts=
   --capture=no
   --color=yes
   -vv
   -m 'not benchmark and not compose_e2e'
norecursedirs=submodules/*
filterwarnings=
   ignore::DeprecationWarning:tensorboard.*
   ignore:distutils:DeprecationWarning
   ignore:invalid escape sequence
   ignore:.*pkg_resources.*
   ignore::DeprecationWarning:pkg_resources.*
xfail_strict=true
python_files = test_*.py *_test.py kumo/testing/*.py
markers =
   slow: marks tests as slow (deselect with '-m "not slow"')
   compose_e2e: end-to-end test that boots a docker compose stack; opt-in via '-m compose_e2e'
# Defaults mirroring the CI test env (.github/workflows/testing.yml).
# D: prefix sets only when unset, so shell/CI exports win.
# AWS_REQUEST_CHECKSUM_CALCULATION: botocore >=1.36 streams uploads with
# aws-chunked checksum trailers by default; moto 4.x can't parse that framing
# and stores corrupted bodies (verified against moto 4.2.14 + botocore
# 1.42.97). "when_required" restores the pre-1.36 behavior for mocked S3.
env =
   D:DEPLOY_STAGE=test
   D:KUMO_TESTING=True
   D:MAX_DATA_BACKEND_WORKER_PROCESSES=1
   D:AWS_REQUEST_CHECKSUM_CALCULATION=when_required

[flake8]
# packages/kumo-core and packages/kumo-sdk use package-owned checks in CI.
# extend-ignore (not ignore) so flake8's default-ignore set is preserved —
# notably E226, which Python 3.14 surfaces inside f-strings (PEP 701
# tokenization) but which is in flake8's default-ignore upstream.
extend-ignore=F811,W503,W504,E731,E125,E501
exclude=kumo/pquery/grammar,.nodeenv,packages/diskgraph,packages/kumo-api,packages/kumo-core,packages/kumo-pql/kumopql/grammar,packages/kumo-sdk
per-file-ignores =
   kumo/__init__.py: E402

[isort]
# packages/kumo-sdk retains the authoritative standalone formatting policy.
multi_line_output = 3
include_trailing_comma = true
skip=.gitignore,__init__.py,kumo/pquery/grammar,packages/diskgraph,packages/kumo-api,packages/kumo-core,packages/kumo-pql/kumopql/grammar,packages/kumo-sdk
skip_glob=packages/diskgraph/**,packages/kumo-api/**,packages/kumo-core/**,packages/kumo-pql/kumopql/grammar/**

[yapf]
exclude=kumo/pquery/grammar,packages/diskgraph,packages/kumo-api,packages/kumo-core,packages/kumo-pql/kumopql/grammar,packages/kumo-sdk

[pylint.'MESSAGES CONTROL']
disable=unnecessary-lambda-assignment,missing-module-docstring,missing-class-docstring,missing-function-docstring,empty-docstring,import-outside-toplevel,invalid-name,redefined-outer-name,redefined-builtin,no-name-in-module,too-many-arguments,too-many-locals,too-many-statements,too-many-return-statements,too-many-instance-attributes,attribute-defined-outside-init,unused-argument,fixme,global-statement,cyclic-import,consider-using-from-import,no-member,c-extension-no-member,import-error,duplicate-code,abstract-method,wrong-import-position,no-value-for-parameter,logging-fstring-interpolation
generated-members=torch.*
