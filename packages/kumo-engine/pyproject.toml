[project]
name="kumo-engine"
dynamic=["dependencies", "version"]
authors=[
    {name="NVIDIA Corporation"},
]
license="Apache-2.0"
license-files=["LICENSE"]
description="Local, in-process relational deep learning with Kumo"
readme="README.md"
requires-python=">=3.11"
keywords=[
    "deep-learning",
    "graph-neural-networks",
]
classifiers=[
    "Development Status :: 5 - Production/Stable",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
# Keep the required backend on Linux x86_64/macOS; both distributions own
# the same import namespace. This extra does not select Torch or its device.
cpu=["faiss-cpu==1.14.3; sys_platform != 'linux' or platform_machine != 'x86_64'"]
test=[
    "boto3>=1.34,<2",
    "botocore>=1.34,<2",
    "diskgraph>=0.1.0",
    "numpy>=1.26,<3",
    "pytest",
    "pytest-mock",
    "torch>=2.9,<2.13",
]
# kumo-core (Torch/PyG/DiskGraph included) is always required. Faiss is required
# on Linux x86_64 and macOS; other platforms opt in -- see setup.py.
# Unlike kumo-sdk, where the equivalent `core` extra is optional because
# CloudBackend is the default path, this package has no non-training use
# case. These per-vendor extras only need to add their own plugin package on
# top of that.
snowflake=[
    "kumo-snowflake[sdk]>=0.1.0.dev1",
]
# databricks-sdk 0.68 added the data_quality API the monitor recipe uses.
databricks=[
    "kumo-databricks>=0.1.0.dev1",
    "databricks-sdk>=0.68",
]
bigquery=[
    "kumo-bigquery>=0.1.0.dev1",
]
s3=[
    "kumo-s3>=0.1.0.dev1",
]
# glove.6B 50d, the default model for text columns.
text=[
    "kumo-glove-6b-50d>=1.0.0,<2",
]
gcs=[
    "kumo-gcs>=0.1.0.dev1",
]
# mlflow-skinny 3.5 added download_artifacts(registry_uri=), which loading
# by alias uses; nvidia-ml-py adds GPU system metrics.
mlflow=[
    "mlflow-skinny>=3.5,<4",
    "nvidia-ml-py",
]
# SageMaker managed MLflow: 0.5.0 added the per-thread boto3 session
# (sagemaker_mlflow.session.use_session) that explicit AWS identities use.
sagemaker=[
    "kumo-engine[mlflow,s3]",
    "sagemaker-mlflow>=0.5.0",
]

# Reports this wheel's release version as the Kumo version. The provider is a
# top-level module (see `[tool.setuptools] py-modules`) because importing
# anything under `kumo.engine` would import the whole engine.
[project.entry-points."kumo_core.version_providers"]
kumo-engine = "kumo_engine_version:installed_version"

[project.urls]
homepage="https://github.com/NVIDIA/kumo-engine"
documentation="https://docs.nvidia.com/sdgm/kumo-engine/get-started-with-kumo-engine/overview"
issues="https://github.com/NVIDIA/kumo-engine/issues"

[tool.uv.sources]
kumo-core = { workspace = true }
kumo-snowflake = { workspace = true }
kumo-databricks = { workspace = true }
kumo-bigquery = { workspace = true }
kumo-s3 = { workspace = true }
kumo-gcs = { workspace = true }
kumo-glove-6b-50d = { workspace = true }

[build-system]
requires = ["setuptools>=77", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules=["kumo_engine_version"]

[tool.setuptools.packages.find]
where=["."]
include=["kumo*"]
namespaces=true

[tool.setuptools.package-data]
"kumo.engine.datasets" = ["shop/*.parquet"]

# The version is the root VERSION file, stamped into this module by
# scripts/stamp_version.py (shared with kumo-sdk, the platform and the charts).
[tool.setuptools.dynamic]
version = {attr = "kumo.engine._version.__version__"}

[tool.pytest.ini_options]
addopts = [
    "--capture=no",
    "--color=yes",
    "-vv",
]
