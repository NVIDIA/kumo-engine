[build-system]
requires = ["setuptools>=77", "pyarrow==24.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kumo-fm"
dynamic = ["version"]
description = "FM payload loader over Kumo PyTorch and DiskGraph"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "kumo-pytorch>=0.1.0a1",
  "numpy>=1.26,<3",
  "pyarrow==24.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.uv.sources]
kumo-pytorch = {workspace = true}

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["kumo.fm*"]
namespaces = true

[tool.setuptools.dynamic]
version = {attr = "kumo.fm.__about__.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
