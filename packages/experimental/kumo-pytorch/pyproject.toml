[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kumo-pytorch"
dynamic = ["version"]
description = "Declarative, point-in-time-correct model batches from relational data"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "NVIDIA Corporation"}]
keywords = ["data-loading", "deep-learning", "relational-data", "temporal-data"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "diskgraph>=0.2.0",
  "numpy>=1.26,<3",
  "pyarrow>=15,<25",
  "tokenizers>=0.22,<1",
  "torch>=2.7,<3",
]
urls = {Homepage = "https://github.com/NVIDIA/kumo-engine/tree/main/packages/experimental/kumo-pytorch", Issues = "https://github.com/NVIDIA/kumo-engine/issues", Repository = "https://github.com/NVIDIA/kumo-engine"}

[project.optional-dependencies]
dev = ["pytest>=8"]
examples = ["torch-geometric>=2.7,<3"]

[tool.uv.sources]
diskgraph = {workspace = true}

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["kumo.pytorch*"]
namespaces = true

[tool.setuptools.dynamic]
version = {attr = "kumo.pytorch.__about__.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not notebook'"
markers = ["notebook: executes an examples/ notebook; deselected unless -m notebook"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs/api", "scripts/check_license_headers.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
