site_name: Transaction Foundation Model kit
site_description: Reference architectures for transaction foundation models
repo_name: NVIDIA/kumo-engine
repo_url: https://github.com/NVIDIA/kumo-engine
edit_uri: ""

# Site-only pages (the API reference). Everything else is laid out at its
# repository path by scripts/gen_doc_pages.py, so links work on the site and
# on GitHub alike.
docs_dir: docs/_site
site_dir: site

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - content.code.copy

plugins:
  - search
  - gen-files:
      scripts:
        - scripts/gen_doc_pages.py
  - mkdocs-jupyter:
      execute: false
      include: ["notebooks/**/*.ipynb"]
      include_source: true
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            show_symbol_type_heading: true
            members_order: source
            filters: ["!^_"]
            docstring_style: google
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite

validation:
  omitted_files: info
  absolute_links: warn
  unrecognized_links: info
  anchors: info

exclude_docs: |
  AGENTS.md
  */AGENTS.md

nav:
  - Home: README.md
  - Learn:
      - Start here: notebooks/README.md
      - "Blueprint v1 on TabFormer":
          - notebooks/blueprint_v1/README.md
          - notebooks/blueprint_v1/01_dataset_baseline.ipynb
          - notebooks/blueprint_v1/02_seq_preproc_tokenization.ipynb
          - notebooks/blueprint_v1/03_foundation_model_training.ipynb
          - notebooks/blueprint_v1/04_inference_embedding_extraction.ipynb
          - notebooks/blueprint_v1/05_xgboost_fraud_detection.ipynb
      - "PRAGMA-like and Blueprint v2 on pragmatiq":
