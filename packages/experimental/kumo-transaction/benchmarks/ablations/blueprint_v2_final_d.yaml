seed: 42

# Blueprint v2 final-sweep candidate D: recipes/blueprint_v2/config.yaml with
# the four overrides that won benchmarks/results/blueprint_v2_final_sweep.md.
# Seed 42 of this setting is the GTC Berlin lab's pretrained checkpoint
# (blueprint_v2_lab_tuned), trained at commit 124ab93.
#
#   training.max_steps                3000   (recipe: 1500)
#   training.optimizer.warmup_steps   150    (recipe: 75; 5% of the steps)
#   fraud_task.finetune.rank          16     (recipe: 8)
#   fraud_task.finetune.alpha         16.0   (recipe: 8.0)
#
# Every other key equals the recipe's; tests/unit/test_blueprint_v2_configs.py
# holds them equal. The recipe keeps 1,500 steps and rank 8, the setting that
# pragma_like and the blueprint_v2_seeds record are matched on.
#
# It reads the recipe's token cache (same data, features, and data.token_cache);
# build that once with the command in the recipe config's header. Pretraining
# takes about 42 minutes on one GB10:
#   export TFM_PRAGMATIQ_ROOT=~/data/pragmatiq/data/synth_100k_gen2_m31_seed0
#   PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True \
#   uv run tfm report --config benchmarks/ablations/blueprint_v2_final_d.yaml \
#     --device cuda --run-dir outputs/ablations/blueprint_v2_final_d

data:
  adapter: pragmatiq
  path: null
  observation_window: 730d
  sequence_length: 128
  # The cache's per-event cap. With the identity keys hashed, the longest
  # event is 9 tokens; 40 is kept so the cache matches benchmarks/ablations/blueprint_v2_lab.yaml's.
  max_tokens: 40
  n_entities: 10000
  max_entities: 10000
  events_per_entity: 128
  pretrain_windows:
    events: 128
  token_cache: ~/data/tfm_cache/synth_100k_gen2_m31_seed0_lab_hkey
  temporal_split:
    train_end: "2024-06-01T00:00:00Z"
    validation_end: "2024-09-01T00:00:00Z"
    label_delay: 0h
  fraud_labels: spliced_identity_theft
  identity_theft:
    victim_fraction: 0.2
    negative_window: 7d
    theft_lookback: 28d
    donors: matched

features:
  tokenizer: key_value_time
  categorical_keys: [mcc, app_version]
  hashed_keys: [merchant, device_id, counterparty]
  hash_buckets: 4096

model:
  composition:
    granularity:
      type: profile_event_decoder
      profile_depth: 2
      event_depth: 4
      varlen: true
      decoder:
        depth: 4
        mask: causal
        hidden_size: 256
        num_heads: 8
        dropout: 0.0
        max_seq_len: 40
    position: time_rope
    attention: sdpa
    objective: next_event_fields
    readout: last_token
    heads:
      fraud: binary

objective:
  auxiliary: [token_event_key_mlm]
  mlm:
    p_token: 0.15
    p_event: 0.10
    p_key: 0.10
    p_unk: 0.10
    label_smoothing: 0.1

training:
  max_steps: 3000
  batch_size: 128
  learning_rate: 0.001
  precision: bf16
  backend: eager
  shuffle: true
  optimizer:
    name: muon
    muon:
      learning_rate: 0.01
    max_grad_norm: 1.0
    betas: [0.9, 0.95]
    weight_decay: 0.01
    lr_schedule: cosine
    warmup_steps: 150
    min_learning_rate: 0.00002

fraud_task:
  head: logistic_regression
  use_raw_features: true
  use_tfm_embeddings: true
  finetune:
    enabled: true
    method: lora
    head: linear
    rank: 16
    alpha: 16.0
    targets: [qkv, out, ff.0, ff.2]
    max_steps: 3000
    learning_rate: 0.001
    batch_size: 32
    validation_fraction: 0.2
    eval_every: 50
    patience: 4

evaluation:
  precision_at_k: 50
  history_window:
    enabled: true
    max_rows: 4000
  surprise: true
  tabular_baselines:
    enabled: true
    xgboost_trials: 0
    xgboost_params:
      max_depth: 5
      learning_rate: 0.05
      min_child_weight: 8.0
      subsample: 0.75
      colsample_bytree: 0.6
      reg_lambda: 0.04
      reg_alpha: 0.05
      scale_pos_weight: 1.0

runtime:
  device: auto
