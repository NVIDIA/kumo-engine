seed: 42

data:
  adapter: synthetic
  observation_window: 90d
  sequence_length: 12
  max_tokens: 192
  n_entities: 24
  events_per_entity: 16
  temporal_split:
    train_end: "2024-01-04T00:00:00Z"
    validation_end: "2024-01-07T00:00:00Z"
    label_delay: 12h

features:
  tokenizer: transaction_field_tokenizer

model:
  composition:
    granularity:
      type: flat
      decoder:
        depth: 2
        mask: causal
        hidden_size: 64
        num_heads: 4
        dropout: 0.0
        max_seq_len: 192
    position: nope
    attention: eager
    objective: next_event
    readout: last_token
    heads:
      fraud: binary


training:
  max_steps: 8
  batch_size: 8
  learning_rate: 0.0003
  precision: fp32

fraud_task:
  head: logistic_regression
  use_raw_features: true
  use_tfm_embeddings: true

evaluation:
  precision_at_k: 5

runtime:
  device: auto
