seed: 42

# Blueprint v2 hybrid at PRAGMA-M width on a pragmatiq Generator v2 book.
#
# d=512, 8 heads, profile/event/decoder depths 3/16/12: about 99M parameters
# outside the embedding table (Blueprint v2 guide). The decoder is twice PRAGMA-M's
# 6-layer history encoder, which brings the model to ~100M.
#
# Needs a real pragmatiq book and a GPU. The book used during development is
# Generator v2 from pragmatiq tag v1.1.0, 100k users, seed 0:
#   export TFM_PRAGMATIQ_ROOT=../pragmatiq/data/synth_100k_gen2_m31_seed0
#   uv run tfm train --recipe blueprint_v2 \
#     --config recipes/blueprint_v2/config.scale.yaml --device cuda
#
# Tokens, corpus, optimizer, and fine-tuning carry over the lab-size search
# (config.yaml; benchmarks/results/blueprint_v2_hybrid_gb10_tuning.md):
# hashed identity keys, every train-side window of the sample, Muon on the
# hidden matrices, bf16, clipping at 1.0, and early-stopped LoRA on the
# attention and MLP projections. Rates were scaled, not searched, at this
# width: Muon's 0.01 is kept (its update is normalized per matrix), and
# AdamW's 1e-3 at d=256 is halved for d=512.
#
# `training.backend: ddp` is the eager loop in one process. For N GPUs:
#   uv run torchrun --nproc-per-node N -m tfm.cli.main report --recipe blueprint_v2 \
#     --config recipes/blueprint_v2/config.scale.yaml \
#     --run-dir outputs/blueprint_v2/<run-id> --device cuda
# `training.batch_size` is per rank, so the global batch is N x 16.
#
# Not used by CI, and no result is recorded for it yet.

data:
  loader: kumo_pytorch
  adapter: pragmatiq
  path: null
  observation_window: 730d
  sequence_length: 256
  # With the identity keys hashed, the longest event is 9 tokens.
  max_tokens: 16
  n_entities: 50000
  max_entities: 50000
  events_per_entity: 256
  # Pretrain on every 256-event train-side window of the sampled users. A
  # token cache would read all 100k users; this config samples instead.
  pretrain_windows:
    events: 256
  temporal_split:
    train_end: "2024-06-01T00:00:00Z"
    validation_end: "2024-09-01T00:00:00Z"
    label_delay: 0h

features:
  tokenizer: key_value_time
  categorical_keys: [mcc, app_version]
  hashed_keys: [merchant, device_id, counterparty]
  hash_buckets: 4096

model:
  composition:
    granularity:
      type: profile_event_decoder
      profile_depth: 3
      event_depth: 16
      varlen: true
      decoder:
        depth: 12
        mask: causal
        hidden_size: 512
        num_heads: 8
        dropout: 0.0
        max_seq_len: 16
    position: time_rope
    attention: sdpa
    objective: next_event_fields
    readout: last_token
    heads:
      fraud: binary

objective:
  auxiliary: [token_event_key_mlm]
  mlm:
    p_token: 0.15
    p_event: 0.10
    p_key: 0.10
    p_unk: 0.10
    label_smoothing: 0.1

training:
  max_steps: 5000
  batch_size: 16
  learning_rate: 0.0005
  precision: bf16
  backend: ddp
  optimizer:
    name: muon
    muon:
      learning_rate: 0.01
    max_grad_norm: 1.0
    betas: [0.9, 0.95]
    weight_decay: 0.01
    lr_schedule: cosine
    warmup_steps: 250
    min_learning_rate: 0.00001

fraud_task:
  head: logistic_regression
  use_raw_features: true
  use_tfm_embeddings: true
  finetune:
    method: lora
    enabled: true
    rank: 8
    alpha: 8.0
    dropout: 0.0
    targets: [qkv, out, ff.0, ff.2]
    max_steps: 3000
    learning_rate: 0.001
    # 256-event sequences: 16 per step peaked near 60 GB on an 80 GB H100 in
    # fp32 with 24-token events, and 32 did not fit.
    batch_size: 16
    validation_fraction: 0.2
    eval_every: 50
    patience: 4

evaluation:
  precision_at_k: 50

runtime:
  device: auto
