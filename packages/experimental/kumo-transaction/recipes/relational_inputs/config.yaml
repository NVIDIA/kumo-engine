recipe_family: sequence
seed: 42
data:
  adapter: tfm.data.adapters.synthetic_relational:adapter
  loader: kumo_pytorch
  n_entities: 8
  sequence_length: 8
  max_tokens: 16
  temporal_split:
    train_end: '2024-01-16'
    validation_end: '2024-01-17'
  pretrain_end: '2024-01-21'
  horizon_days: 2
  relational:
    root: entities
    history_paths:
      activity: [owns, activity]
    labels:
      table: outcomes
      root_columns: [owner]
      timestamp: cutoff
      target: outcome
      available_at: available
      horizon_days: 2
      label_delay_days: 1
    label_cutoffs:
      train: '2024-01-16'
      validation: '2024-01-17'
      test: '2024-01-18'
features:
  tokenizer: key_value_time
model:
  composition:
    objective: binary
    attention: sdpa
    position: time_rope
    granularity:
      type: profile_event_decoder
      decoder:
        hidden_size: 8
        num_heads: 2
        depth: 1
        dropout: 0.0
        max_seq_len: 32
training:
  backend: eager
  objective: binary
  batch_size: 4
  max_steps: 1
  learning_rate: 0.001
sequence_training:
  backend: eager
  batch_size: 4
  max_steps: 1
  learning_rate: 0.001
runtime:
  device: cpu
