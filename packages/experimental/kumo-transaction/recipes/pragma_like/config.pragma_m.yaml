seed: 42

# PRAGMA-M on the v2 SDK: the middle rung of the published size ladder.
#
# Dimensions follow dynamiq-ai/pragmatiq's `medium` preset (d=512, 8 heads,
# profile/event/history depths 3/16/6, nominally 100M parameters).
#
# Vocabulary here is this kit's byte-level key-value-time tokenizer rather than
# a ~28k BPE vocabulary, so the parameter count is not expected to match
# pragmatiq's.
#
# Needs a real pragmatiq book and a GPU:
#   export TFM_PRAGMATIQ_ROOT=../pragmatiq/data/synth_1m_seed0
#   uv run tfm train --recipe pragma_like \
#     --config recipes/pragma_like/config.pragma_m.yaml --device cuda
#
# Not used by CI. See docs/reference/roadmap.md for the PRAGMA comparison criteria
# and config.pragma_s.yaml / config.pragma_l.yaml for the other rungs.

data:
  loader: kumo_pytorch
  adapter: pragmatiq
  path: null
  observation_window: 730d
  sequence_length: 256
  max_tokens: 24
  n_entities: 50000
  max_entities: 50000
  events_per_entity: 256
  temporal_split:
    train_end: "2024-06-01T00:00:00Z"
    validation_end: "2024-09-01T00:00:00Z"
    label_delay: 0h

features:
  tokenizer: key_value_time

model:
  composition:
    granularity:
      type: profile_history
      profile_depth: 3
      event_depth: 16
      history_depth: 6
      varlen: true
      decoder:
        depth: 16
        mask: causal
        hidden_size: 512
        num_heads: 8
        dropout: 0.0
        max_seq_len: 24
    position: time_rope
    attention: sdpa
    objective: token_event_key_mlm
    readout: usr_token
    heads:
      fraud: binary

objective:
  mlm:
    p_token: 0.15
    p_event: 0.10
    p_key: 0.10
    p_unk: 0.10
    label_smoothing: 0.1

training:
  max_steps: 5000
  batch_size: 16
  learning_rate: 0.0002
  precision: fp32
  backend: eager
  optimizer:
    betas: [0.9, 0.95]
    weight_decay: 0.01
    lr_schedule: cosine
    warmup_steps: 250
    min_learning_rate: 0.00001

fraud_task:
  head: logistic_regression
  use_raw_features: true
  use_tfm_embeddings: true
  finetune:
    method: lora
    enabled: true
    rank: 8
    alpha: 16.0
    dropout: 0.0
    targets: [qkv, out]
    max_steps: 300
    learning_rate: 0.001
    # 256-event sequences: 32 per step peaks at the 80 GB H100 limit; 16 peaks
    # near 41 GB.
    batch_size: 16

evaluation:
  precision_at_k: 50

runtime:
  device: auto
