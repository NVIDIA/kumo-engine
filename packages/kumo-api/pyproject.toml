[build-system]
requires = [
    "setuptools>=80.0.0",
    "setuptools_scm[toml]>=6.2",
    "toml>=0.10.2",
]
build-backend = "setuptools.build_meta"

[project]
name = "kumo-api"
version = "3.0.0"
authors=[
    {name="Kumo.AI", email="hello@kumo.ai"},
]
license="Apache-2.0"
license-files=["LICENSE"]
description = "RESTful datamodels for Kumo AI"
readme = "README.md"
requires-python=">=3.10"
keywords=[
    "deep-learning",
    "graph-neural-networks",
    "cloud-data-warehouse",
]
classifiers=[
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies=[
    # v2.7 or higher is needed, for serialization context
    "pydantic>=2.7",
    "pydantic-core>=2,<3",
    "numpy",
    "pandas",
    "tabulate>=0.8.10,<1",
    "typing_extensions>=4.12.2",
]

[project.optional-dependencies]
test=[
    "pytest",
    "pyarrow",
    "tabulate",
    "cryptography",
]

[tool.setuptools.packages.find]
include = ["kumoapi*"]

[tool.poetry]
name = "kumo-api"
version = "3.0.0"
description = "RESTful datamodels for Kumo AI"
authors = []
readme = "README.md"
packages = [{include = "kumoapi"}]

[tool.poetry.dependencies]
python = "^3.11"

[project.urls]
homepage="https://kumo.ai"
documentation="https://kumo.ai/docs"

[tool.yapf]
based_on_style="pep8"
split_before_named_assigns=false
blank_line_before_nested_class_or_def=false

[tool.isort]
multi_line_output=3
include_trailing_comma=true
skip=[".gitignore", "__init__.py"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
respect-ignore-files = true

[[tool.ty.overrides]]
include = ["kumoapi/model_plan.py"]
rules.invalid-type-form = "ignore"

[[tool.ty.overrides]]
include = ["setup.py"]
rules.unresolved-import = "ignore"

[tool.pytest.ini_options]
addopts=[
    "--capture=no",
    "--color=yes",
    "-vv",
]
