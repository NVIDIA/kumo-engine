[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kumo-adls"
version = "0.1.0.dev1"
description = "Azure Data Lake Storage Gen2 source and sink integration for Kumo"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "kumo-core==0.1.0.dev1",
  "kumo-api>=3.0.0",
  "pyarrow>=14",
  "fsspec",
  "requests>=2.31,<3",
  "azure-core>=1.31,<2",
  "azure-identity>=1.25,<2",
  "azure-storage-file-datalake>=12.22,<13",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.entry-points."kumoai_studio.sources"]
adls = "kumo_adls.backend:ADLSSourceBackend"

[project.entry-points."kumoai_studio.sinks"]
adls = "kumo_adls.sink:ADLSSinkBackend"

[project.entry-points."kumoai_studio.identities"]
adls = "kumo_adls.session"

[tool.uv.sources]
kumo-core = { workspace = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src", "../kumo-api", "../kumo-core/src", "../kumo-core/tests"]
