[package]
name = "diskgraph-infer"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
futures = { workspace = true }
diskgraph-ingest = { path = "../diskgraph-ingest" }
diskgraph-rowpack = { path = "../diskgraph-rowpack" }
diskgraph-fs = { path = "../diskgraph-fs" }
object_store = { version = "0.13.1", features = ["aws", "gcp", "azure"] }
parquet = { version = "58.4.0", features = ["arrow", "async"] }
arrow-schema = "58.4.0"
arrow-array = "58.4.0"
csv = "1.3"
bytes = "1"
url = "2"
clap = { version = "4.4", features = ["derive"] }
tempfile = "3"

[dev-dependencies]
diskgraph-index = { path = "../diskgraph-index" }
