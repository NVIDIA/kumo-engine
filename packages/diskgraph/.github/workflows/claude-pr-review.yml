name: Claude PR Meta-Review

"on":
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  meta-review:
    if: github.event.label.name == 'ai-meta-review-requested'
    # Matches what the called reusable workflow's job declares; a caller that
    # grants less makes the run fail at startup. That job checks out the repo
    # and comments on and unlabels the PR with GITHUB_TOKEN; id-token: write
    # is its own declaration for anthropics/claude-code-action.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    uses: kumo-ai/.github/.github/workflows/claude-pr-review.yml@main
    with:
      pr_number: ${{ github.event.pull_request.number }}
      pr_body: ${{ github.event.pull_request.body }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      GH_TOKEN: ${{ secrets.KUMO_GITHUB_BOT_TOKEN }}
