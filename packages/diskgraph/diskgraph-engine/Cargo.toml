[package]
name = "diskgraph-engine"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
diskgraph-core = { path = "../diskgraph-core" }
diskgraph-index = { path = "../diskgraph-index" }
diskgraph-rowpack = { path = "../diskgraph-rowpack" }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
parquet = { version = "59.3.2", features = ["arrow"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
half = { workspace = true }
serde = { workspace = true }
rand = "0.8"
rand_chacha = "0.3"
tracing = { workspace = true }
gxhash = "3.5"
smallvec = "1.11"
parking_lot = { workspace = true }
byteorder = "1.4"
tempfile = "3.8"
bincode = "1.3"
# Developer-only terminal interface. Ratatui 0.30.2 accepts lru 0.18.2+,
# which fixes RUSTSEC-2026-0002 and RUSTSEC-2026-0253.
ratatui = { version = "0.30.2", optional = true }
crossterm = { version = "0.29", optional = true }
clap = { version = "4.4", features = ["derive"] }
sysinfo = "0.30"
hdrhistogram = "7.5"
tokio = { workspace = true }
serde_json = { workspace = true }
uuid_simd = { package = "uuid-simd", version = "0.8.0", default-features = false, features = ["std"] }
rayon = "1.11.0"
uuid = { workspace = true, features = ["v4", "serde"] }
arrow = "59.3.2"
arrow-select = "59.3.2"

[features]
default = []
# Build the interactive sampler explorer:
#   cargo run -p diskgraph-engine --bin sampler_tui --features sampler-tui
sampler-tui = ["dep:ratatui", "dep:crossterm"]

[[bin]]
name = "sampler_tui"
path = "src/bin/sampler_tui.rs"
required-features = ["sampler-tui"]
