[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kumo-core"
version = "0.1.0.dev1"
description = "Portable runtime contracts for Kumo training pipelines"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0 AND MIT"
license-files = ["LICENSE", "THIRD-PARTY.txt"]
authors = [
  {name = "Kumo.AI", email = "hello@kumo.ai"},
]
keywords = [
  "deep-learning",
  "graph-neural-networks",
  "cloud-data-warehouse",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "diskgraph>=0.1.0",
  "filelock>=3.13.1",
  "fsspec>=2023.5.0",
  "kumo-api>=3.0.0",
  "kumo-pql>=0.1.0,<0.2",
  "matplotlib>=3.10.0",
  "numpy>=1.26,<3",
  "optuna>=4,<5",
  "pandas>=1.5,<3",
  "pyarrow>=15,<25",
  "pydantic>=2.11",
  "pydantic-core",
  # Needed by `OptunaSearcher.analyze`; optuna only declares it as an extra.
  "scikit-learn>=1.6.1",
  # Custom SQL Table identity and gates (kumo_core/custom_sql.py). One minor,
  # because this parse feeds a digest that lands in `graph_id`. Must stay
  # byte-identical to `SQLGLOT_VERSION` in `3rdparty/BUILD`; enforced by
  # `packages/kumo-core/tests/test_custom_sql_golden.py`.
  "sqlglot==30.17.*",
  "torch>=2.7.0,<3",
  "pytorch-lightning==2.6.5",
  "psutil==7.2.2",
  "tabulate==0.8.10",
  "tensorboard>=2.16.2,<3",
  "pytorch-frame==0.3.0",
  "torch-geometric>=2.8.0",
  "torchmetrics==1.8.1",
  "typing-extensions>=4.12.2",
]

[project.urls]
homepage = "https://kumo.ai"
documentation = "https://kumo.ai/docs"

[project.optional-dependencies]
cpu = ["faiss-cpu==1.14.2"]
gpu = ["faiss-gpu==1.14.3"]
text = ["kumo-glove-6b-50d==1.0.0"]
test = [
  "faiss-cpu==1.14.2",
  "packaging>=24",
  "pytest>=8",
  "pytest-cov>=5",
]
dev = [
  "faiss-cpu==1.14.2",
  "packaging>=24",
  "pytest>=8",
  "pytest-cov>=5",
  "ty==0.0.23",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kumo_core = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "--import-mode=importlib"]
pythonpath = ["src"]
xfail_strict = true
filterwarnings = [
  "ignore:distutils:DeprecationWarning",
  "ignore:faiss:DeprecationWarning",
  "ignore:.*pkg_resources.*:DeprecationWarning",
  "ignore:No (positive|negative) samples in targets:UserWarning",
  "error::FutureWarning",
]

[tool.coverage.run]
branch = false
relative_files = true
source = ["kumo_core"]

[tool.coverage.report]
exclude_also = [
  "pragma: no cover",
  "raise NotImplementedError",
  "except ImportError",
  "if __name__ == .__main__.:",
  "@(abc\\.)?abstractmethod",
]

[tool.ty.analysis]
allowed-unresolved-imports = ["setuptools.**", "tabulate.**"]

[[tool.ty.overrides]]
include = ["tests/**"]
rules = { unresolved-import = "ignore" }

[tool.ty.rules]
unresolved-attribute = "ignore"
call-non-callable = "ignore"
invalid-argument-type = "ignore"
unsupported-operator = "ignore"
possibly-missing-attribute = "ignore"
