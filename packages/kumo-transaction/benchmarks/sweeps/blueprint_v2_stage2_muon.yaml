# Stage 2: Muon on the hidden matrices, AdamW (stage 1's lr 1e-3) on the rest.
#
# Also re-scores the stage 1 checkpoints with the surprise readout and the
# unmasked per-key cross-entropy, both added to proxy_eval.py after stage 1
# ran, so every row of the search is scored by the same proxy. Like stage 1,
# ran with one hash-bucket range shared by the hashed keys (see stage 1's note).
#
#   export TFM_PRAGMATIQ_ROOT=~/data/pragmatiq/data/synth_100k_gen2_m31_seed0
#   uv run --all-extras python benchmarks/proxy_sweep.py \
#     --spec benchmarks/sweeps/blueprint_v2_stage2_muon.yaml \
#     --run-root outputs/proxy/stage2 --summary outputs/proxy/stage2.json
base: benchmarks/ablations/blueprint_v2_lab.yaml
set:
  data.token_cache: ~/data/tfm_cache/synth_100k_gen2_m31_seed0_lab_hashed
  features.categorical_keys: [mcc, app_version]
  features.hashed_keys: [merchant, device_id, counterparty]
  data.pretrain_windows.events: 128
  training.batch_size: 128
  training.max_steps: 1500
  training.learning_rate: 0.001
  training.optimizer.warmup_steps: 75
  training.optimizer.max_grad_norm: 1.0
tasks: [history_window, fraud, churn_6m]
xgboost_trials: 8
variants:
  - name: random_init
    train: false
  - name: adamw_lr5e-4
    checkpoint: outputs/proxy/stage1/adamw_lr5e-4/model.pt
  - name: adamw_lr1e-3
    checkpoint: outputs/proxy/stage1/adamw_lr1e-3/model.pt
  - name: adamw_lr2e-3
    checkpoint: outputs/proxy/stage1/adamw_lr2e-3/model.pt
  - name: muon_lr0.01
    set: {training.optimizer.name: muon, training.optimizer.muon.learning_rate: 0.01}
  - name: muon_lr0.02
    set: {training.optimizer.name: muon, training.optimizer.muon.learning_rate: 0.02}
