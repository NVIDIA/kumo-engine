seed: 42

data:
  adapter: pragmatiq
  path: null
  observation_window: 90d
  sequence_length: 8
  max_tokens: 24
  n_entities: 32
  max_entities: 32
  events_per_entity: 6
  temporal_split:
    train_end: "2024-06-01T00:00:00Z"
    validation_end: "2024-09-01T00:00:00Z"
    label_delay: 0h

features:
  tokenizer: key_value_time

model:
  composition:
    granularity:
      type: profile_history
      profile_depth: 1
      event_depth: 2
      history_depth: 1
      decoder:
        depth: 2
        mask: causal
        hidden_size: 32
        num_heads: 4
        dropout: 0.0
        max_seq_len: 24
    position: time_rope
    attention: eager
    objective: token_event_key_mlm
    readout: usr_token
    heads:
      fraud: binary


training:
  max_steps: 4
  batch_size: 4
  learning_rate: 0.0003
  precision: fp32

fraud_task:
  head: logistic_regression
  use_raw_features: true
  use_tfm_embeddings: true

evaluation:
  precision_at_k: 5

runtime:
  device: cpu
