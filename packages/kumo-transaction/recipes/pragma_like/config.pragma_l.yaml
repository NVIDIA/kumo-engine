seed: 42

# PRAGMA-L on the v2 SDK: the large rung of the published size ladder.
#
# Dimensions follow dynamiq-ai/pragmatiq's `large` preset (d=1024, 16 heads,
# profile/event/history depths 9/45/18, nominally 1B parameters). This rung
# needs multiple 80GB GPUs; it is committed so the ladder is documented, not
# because a single-GPU run of it is expected to finish.
#
# Vocabulary here is this kit's byte-level key-value-time tokenizer rather than
# a ~28k BPE vocabulary, so the parameter count is not expected to match
# pragmatiq's.
#
# Needs a real pragmatiq book and GPUs:
#   export TFM_PRAGMATIQ_ROOT=../pragmatiq/data/synth_1m_seed0
#   uv run torchrun --nproc-per-node 2 -m tfm.cli.main train --recipe pragma_like \
#     --config recipes/pragma_like/config.pragma_l.yaml --device cuda \
#     --run-dir outputs/pragma_like/<run-id>
#
# Not used by CI. See docs/reference/roadmap.md for the PRAGMA comparison criteria
# and config.pragma_s.yaml / config.pragma_m.yaml for the smaller rungs.

data:
  adapter: pragmatiq
  path: null
  observation_window: 730d
  sequence_length: 256
  max_tokens: 24
  n_entities: 50000
  max_entities: 50000
  events_per_entity: 256
  temporal_split:
    train_end: "2024-06-01T00:00:00Z"
    validation_end: "2024-09-01T00:00:00Z"
    label_delay: 0h

features:
  tokenizer: key_value_time

model:
  composition:
    granularity:
      type: profile_history
      profile_depth: 9
      event_depth: 45
      history_depth: 18
      varlen: true
      decoder:
        depth: 45
        mask: causal
        hidden_size: 1024
        num_heads: 16
        dropout: 0.0
        max_seq_len: 24
    position: time_rope
    attention: sdpa
    objective: token_event_key_mlm
    readout: usr_token
    heads:
      fraud: binary

objective:
  mlm:
    p_token: 0.15
    p_event: 0.10
    p_key: 0.10
    p_unk: 0.10
    label_smoothing: 0.1

training:
  max_steps: 20000
  # 256-event sequences on an 80 GB H100: fp32 runs out of memory even at 4 per
  # step; bf16 at 4 peaks near 60 GB and at 8 does not fit. The batch is per
  # rank, so `torchrun --nproc-per-node 2` restores the global batch of 8.
  batch_size: 4
  learning_rate: 0.0001
  precision: bf16
  backend: ddp
  optimizer:
    betas: [0.9, 0.95]
    weight_decay: 0.01
    lr_schedule: cosine
    warmup_steps: 500
    min_learning_rate: 0.00001

fraud_task:
  head: logistic_regression
  use_raw_features: true
  use_tfm_embeddings: true
  finetune:
    method: lora
    enabled: true
    rank: 8
    alpha: 16.0
    dropout: 0.0
    targets: [qkv, out]
    max_steps: 300
    learning_rate: 0.001
    # LoRA follows training.precision. In bf16, 4 per step peaks near 47 GB and
    # 8 at the 80 GB limit.
    batch_size: 4

evaluation:
  precision_at_k: 50

runtime:
  device: auto
