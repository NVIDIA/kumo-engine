# Artifact notices target Linux release outputs. Development-only dependencies
# do not enter those outputs; build dependencies are policy-checked by
# cargo-deny but do not appear in the redistributed-component notice.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "MIT-CMU",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unlicense",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "PSF-2.0",
    "Python-2.0",
    "OLDAP-2.8",
]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
ignore-transitive-dependencies = false
private = { ignore = true }

# nix 0.26.4 declares MIT and ships this exact MIT license file. Clarifying it
# prevents cargo-about's recursive scanner from treating an unused Linux
# kernel-module test fixture inside the crate archive as GPL-2.0 package code.
[nix.clarify]
license = "MIT"

[[nix.clarify.files]]
path = "LICENSE"
checksum = "66e3ee1fa7f909ad3c612d556f2a0cdabcd809ad6e66f3b0605015ac64841b70"
