global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "kumo-singlehost"

scrape_configs:
  - job_name: "prometheus"
    scrape_interval: 10s
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "rest-api"
    scrape_interval: 10s
    static_configs:
      - targets: ["kumo-rest:8007"]

  - job_name: "rest-api-public"
    scrape_interval: 10s
    static_configs:
      - targets: ["kumo-rest-public:8008"]

  - job_name: "temporalworker-rest"
    scrape_interval: 10s
    static_configs:
      - targets: ["kumo-rest:8002"]

  - job_name: "temporalworker-dataworkflow"
    scrape_interval: 10s
    static_configs:
      - targets: ["kumo-worker-data:8003"]

  - job_name: "temporalworker-mlworkflow"
    scrape_interval: 10s
    static_configs:
      - targets: ["kumo-worker-mlworkflow:8005"]

  - job_name: "pool-controller"
    scrape_interval: 10s
    static_configs:
      - targets: ["kumo-pool-controller:8009"]

  - job_name: "pool-worker"
    scrape_interval: 10s
    static_configs:
      - targets: ["kumo-pool-worker:8010"]
