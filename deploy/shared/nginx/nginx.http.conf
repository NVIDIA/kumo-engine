events {
    worker_connections 1024;
}

http {
    # Allow slow synchronous requests (e.g. train-table create) to complete
    # instead of hitting nginx's 60s default proxy_read_timeout and 504-ing.
    proxy_connect_timeout 75s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;
    send_timeout          300s;

    # Re-resolve Docker service IPs after Compose recreates a container.
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream kumo_rest { zone kumo_rest 64k; server kumo-rest:8000 resolve; }
    upstream kumo_rest_public { zone kumo_rest_public 64k; server kumo-rest-public:8001 resolve; }
    upstream kumo_ui { zone kumo_ui 64k; server kumo-ui:3000 resolve; }

    server {
        listen 80;
        listen [::]:80;

        # Internal REST API (UI backend): /v0/... and /v1/... -> kumo-rest:8000
        location /v0/ {
            proxy_pass http://kumo_rest/v0/;
            proxy_redirect default;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /v1/ {
            proxy_pass http://kumo_rest/v1/;
            proxy_redirect default;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Public REST API (SDK): /api/... -> kumo-rest-public:8001 (strip /api prefix)
        location /api/ {
            proxy_pass http://kumo_rest_public/;
            proxy_redirect ~^https?://[^/]+(/.*)$ /api$1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # UI (React static build) - catch-all, must be last
        location / {
            proxy_pass http://kumo_ui;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
