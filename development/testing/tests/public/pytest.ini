# The public pilot imports checked-out source without the hosted test fixtures.
[pytest]
addopts = --strict-config --strict-markers -ra
pythonpath =
    ../../../../apps/studio
    ../../../../development/tooling
    ../../../../development/testing
    ../../../..
    ../../../../packages/contracts/kumo-api
    ../../../../packages/runtime/kumo-core
    ../../../../packages/runtime/kumo-core/src
    ../../../../packages/runtime/kumo-core/tests
    ../../../../packages/integrations/kumo-s3/src
    ../../../../packages/integrations/kumo-gcs/src
    ../../../../packages/integrations/kumo-adls/src
    ../../../../packages/integrations/kumo-bigquery/src
    ../../../../packages/integrations/kumo-databricks/src
    ../../../../packages/integrations/kumo-snowflake/src

# Keep the core package's strict expected-failure and future-warning policy.
xfail_strict = true
filterwarnings =
    error::FutureWarning
