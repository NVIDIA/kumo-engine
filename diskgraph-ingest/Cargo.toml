[package]
name = "diskgraph-ingest"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
tokio = { workspace = true, features = ["rt-multi-thread", "fs"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
filetime = "0.2"
diskgraph-core = { path = "../diskgraph-core" }
diskgraph-fs = { path = "../diskgraph-fs" }
diskgraph-rowpack = { path = "../diskgraph-rowpack" }
diskgraph-index = { path = "../diskgraph-index" }
arrow-array = "58.4.0"
arrow-buffer = "58.4.0"
arrow-data = "58.4.0"
arrow-schema = "58.4.0"
arrow-csv = "58.4.0"
arrow-ipc = "58.4.0"
parquet = { version = "58.4.0", features = ["arrow"] }
object_store = { version = "0.13.1", features = ["aws", "gcp", "azure"] }
bytes = "1"
url = "2"
tempfile = "3"
gxhash = "3.5.0"
dashmap = "6"
arc-swap = { workspace = true }
parking_lot = { workspace = true }
uuid_simd = { package = "uuid-simd", version = "0.8.0", default-features = false, features = ["std"] }
base64 = "0.22"
num-bigint = "0.4"
num-traits = "0.2"
fasteval = "0.2"
half = "2"
clap = { version = "4.4", features = ["derive"] }
indicatif = "0.17"
pprof = { version = "0.13", features = ["prost-codec"] }
lz4_flex = { version = "0.12", default-features = false, features = ["frame"] }
ptr_hash = { workspace = true, features = ["epserde"] }
epserde = { workspace = true }
memmap2 = "0.9"
libc = "0.2"
jemallocator = { version = "0.5", optional = true, features = ["profiling"] }
jemalloc-ctl = { version = "0.5", optional = true }
sysinfo = "0.30"
ureq = { version = "2", default-features = false }
ratatui = "0.26"
crossterm = "0.27"
dirs = { version = "5", optional = true }

[[bin]]
name = "ingest_tui"
path = "src/bin/ingest_tui.rs"
required-features = ["ingest-tui"]

[dev-dependencies]
bincode = "1.3"
diskgraph-engine = { path = "../diskgraph-engine" }
# Used by disk_manager::tests to force serial execution of the
# real-disk-pressure tests. They measure /tmp's actual free space and
# race against any other tempdir-writing test running concurrently in
# the same binary. `#[serial(disk_manager_real_fs)]` puts them all in
# one group that runs one at a time.
serial_test = "3"

[features]
default = []
ingest-tui = ["dep:dirs"]
mem-profile = ["jemallocator", "jemalloc-ctl", "jemallocator/profiling"]
unsafe-vars = []
pkhash128 = []
