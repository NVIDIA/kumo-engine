[package]
name = "diskgraph-ingest"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "fs"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
diskgraph-core = { path = "../diskgraph-core" }
diskgraph-fs = { path = "../diskgraph-fs" }
diskgraph-rowpack = { path = "../diskgraph-rowpack" }
diskgraph-index = { path = "../diskgraph-index" }
arrow-array = "57.1.0"
arrow-buffer = "57.1.0"
arrow-schema = "57.1.0"
arrow-csv = "57.1.0"
parquet = { version = "57.1.0", features = ["arrow"] }
object_store = { version = "0.12.4", features = ["aws", "gcp", "azure"] }
bytes = "1"
url = "2"
tempfile = "3"
gxhash = "3.5.0"
uuid_simd = { package = "uuid-simd", version = "0.8.0", default-features = false, features = ["std"] }
base64 = "0.22"
num-bigint = "0.4"
num-traits = "0.2"
fasteval = "0.2"
half = "2"
clap = { version = "4.4", features = ["derive"] }
indicatif = "0.17"
pprof = { version = "0.13", features = ["flamegraph", "prost-codec"] }
lz4_flex = { version = "0.12", default-features = false, features = ["frame"] }
ptr_hash = { workspace = true, features = ["epserde"] }
epserde = { workspace = true }
memmap2 = "0.9"
libc = "0.2"
jemallocator = { version = "0.5", optional = true, features = ["profiling"] }
jemalloc-ctl = { version = "0.5", optional = true }

[features]
mem-profile = ["jemallocator", "jemalloc-ctl", "jemallocator/profiling"]
unsafe-vars = []
