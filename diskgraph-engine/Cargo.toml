[package]
name = "diskgraph-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
diskgraph-core = { path = "../diskgraph-core" }
diskgraph-index = { path = "../diskgraph-index" }
diskgraph-rowpack = { path = "../diskgraph-rowpack" }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
parquet = { version = "57.2.0", features = ["arrow"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
half = { workspace = true }
serde = { workspace = true }
rand = "0.8"
rand_chacha = "0.3"
tracing = { workspace = true }
gxhash = "3.5"
smallvec = "1.11"
parking_lot = { workspace = true }
byteorder = "1.4"
tempfile = "3.8"
bincode = "1.3"
ratatui = "0.26"
crossterm = "0.27"
clap = { version = "4.4", features = ["derive"] }
sysinfo = "0.30"
hdrhistogram = "7.5"
tokio = { workspace = true }
serde_json = { workspace = true }
uuid_simd = { package = "uuid-simd", version = "0.8.0", default-features = false, features = ["std"] }