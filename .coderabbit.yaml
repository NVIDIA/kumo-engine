language: en-US
early_access: false

tone_instructions: >-
  Be direct, technical, brief. No praise, emojis, headings, style or formatting
  comments. Prefix findings: critical (correctness/security/data loss), important
  (must fix), suggestion (optional).

reviews:
  profile: quiet

  high_level_summary: false
  high_level_summary_in_walkthrough: false
  changed_files_summary: false
  sequence_diagrams: true
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  poem: false
  in_progress_fortune: false
  collapse_walkthrough: true

  # ---------------------------------------------------------------------
  # Boilerplate.
  # ---------------------------------------------------------------------
  # Strips the "Prompt for AI Agents" block appended to every inline comment.
  enable_prompt_for_ai_agents: false
  review_details: false
  review_status: true
  review_progress: true

  request_changes_workflow: false

  # ---------------------------------------------------------------------
  # Tools. Match the actual toolchain: flake8 + isort + yapf + pyright.
  # ---------------------------------------------------------------------
  tools:
    ruff:
      enabled: false
    pylint:
      enabled: false
    flake8:
      enabled: true
    # OSS Readiness CI owns Gitleaks enforcement and release-history scans.
    gitleaks:
      enabled: false
    # Keep a different credential scanner as secondary review feedback.
    trufflehog:
      enabled: true
    # Enable this after the repository contains a Semgrep ruleset.
    semgrep:
      enabled: false
    languagetool:
      enabled: false
    markdownlint:
      enabled: false

  path_filters:
    - "!**/*.lock"
    - "!**/generated/**"
    - "!**/*_pb2.py"
    - "!**/*_pb2.pyi"

  path_instructions:
    - path: "**"
      instructions: |
        Apply docs/development/code-review.md to changed behavior and affected
        callers. Verify the observed problem, causal fix and owning abstraction
        against source; a smaller fix or no change may be right. Check contracts,
        resource ownership/scaling, failure paths, usability and independent
        behavioral evidence where relevant. Trace actual representations and
        reachable paths before claiming a defect. Report only actionable,
        evidence-backed regressions or material design flaws with a trigger,
        consequence and correction. Label uncertainty as a question; do not
        invent a defect, demand speculative generalization, or request benchmarks
        or design documents merely because a category changed. Check added or
        modified code comments for accurate, necessary information and concise
        rationale, not restated code or excuses for an avoidable defect. Preserve
        legal/provenance headers and useful explanations; avoid wording nits.
        Use PR-level feedback for cross-cutting design or description concerns;
        use inline findings for naturally localized defects. Do not force a
        whole-PR concern onto an arbitrary line or duplicate it across channels.
        CI owns formatting.
    - path: "packages/diskgraph/**"
      instructions: |
        Check persisted-format and Python/native contracts, ID and timestamp
        domains, shard/worker coverage, ordering, error timing and old-index
        compatibility. For performance changes, inspect allocations and I/O per
        row/batch/worker/process, warm versus cold state and end-to-end effects.
        Equivalence tests should exercise the changed branch, including boundary
        and degenerate cases; random workload size alone is not branch coverage.
        Verify claims against the writer, reader and real memory representation.
    - path: "packages/kumo-engine/**"
      instructions: |
        Trace public API through runtime, saved bundle, reload and prediction,
        plus affected tracking/registry/connector adapters. Preserve model/data
        identity, effective configuration and source immutability. Check defaults,
        optional dependencies, unsupported cases, actionable errors and whether
        examples exercise the installed interface. Passing mocked delegation is
        not evidence of a working artifact or user lifecycle.
    - path: "packages/experimental/kumo-pytorch/**"
      instructions: |
        Check native/reference output parity, fitted/restored state, temporal
        leakage, empty/keyless inputs, ragged/padded layouts and resource cleanup
        where changed. Derive budget/memory claims from actual tensors and index
        maps, not an imagined dense representation. Test reused caches and later
        epochs when affected. Separate loader/kernel timing from training claims;
        reject unsupported paths explicitly rather than silently changing meaning.
    - path: "kumo/**/*.py"
      instructions: |
        For dead-code findings, consider only code added by this pull request,
        or code made unused or unreachable by this pull request. Report it only
        with concrete repository evidence. Before reporting, check direct
        callers, imports and exports, decorators, registries, configuration
        and string references, framework discovery, serialization hooks, and
        public compatibility or API roles. Do not report pre-existing unused
        code. State the exact symbol and location, plus the evidence showing
        that no reachable use remains.

  auto_review:
    enabled: true
    drafts: false
    ignore_usernames:
      - "dependabot[bot]"
      - "github-actions[bot]"

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false

  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: "off"
    description:
      mode: "off"
    issue_assessment:
      mode: "off"
    custom_checks:
      - name: "Change map design review"
        mode: "warning"
        instructions: |
          Review the PR description, linked problem/design when accessible,
          change-map comment (<!-- kumo-pr-change-map -->) and code together.
          If linked context or that comment is unavailable, use the PR body
          and checked-in design and state the limit; missing context alone is
          not a proven defect.
          Apply docs/development/code-review.md. Is the problem demonstrated or
          the requested behavior clear? Does this change address its cause at
          the right layer, reuse the existing contract, and stop at the needed
          scope? Does it fix the root cause rather than hide the symptom?
          For feature/design proposals, verify assumptions against actual
          workloads and contracts. Does the description explain relevant
          alternatives and why they were not chosen, and disclose material
          costs, limitations and tradeoffs? Distinguish facts from assumptions.
          Is the explanation human-readable and organized into clear sections
          proportional to complexity, with evidence and caveats easy to find?
          Flag missing rationale that obstructs assessing the design, not prose
          preferences. Consider simpler alternatives; do not invent rejected
          designs or require a new document, issue or benchmark.
          Check omitted behavior and compatibility, and whether validation and
          performance claims establish what they say. For broader designs trace
          data/control flow, ownership, lifecycle and failure recovery across
          components. An accurate file table or much prose is not design proof.
          Report concrete causal/design flaws with repository evidence and a
          suggested correction; distinguish questions and unavailable evidence
          from proven defects. No change needed is a valid outcome. Preserve the
          existing change-map scope convention (function/non-function scope at
          <=1000 additions plus deletions; file-level allowed above that).
          The deterministic change-table check owns coverage and formatting;
          do not repeat it or enumerate every symbol. Keep optional refinements
          separate and do not duplicate inline findings. Explain cross-cutting
          findings at proposal level in this check's Walkthrough result, with
          evidence and consequences; no single diff-line anchor is required.
      - name: "PR size"
        mode: "warning"
        instructions: |
          Count the files changed in this pull request.
          Fail if the count exceeds 40. In the failure message, state the
          file count and recommend splitting the PR into reviewable units.
          Pass in all other cases. Ignore line counts entirely.
      - name: "Public resource access"
        mode: "error"
        instructions: |
          Inspect only external resource references whose reference text is
          added or modified by this pull request. Ignore unchanged lines, diff
          context, references that exist only on the base branch, pre-existing
          references elsewhere in the repository, and unchanged references in
          changed files. If the pull request adds or changes no external
          resource reference, pass.

          For each added or modified URL, repository location, or package
          source location required to understand, build, test, use, or
          contribute to the changed code, verify that an anonymous public user
          can access it. CodeRabbit app or organization access is not proof.
          Exclude illustrative or example references and local test fixtures.

          Fail only when an added or modified reference is confirmed
          inaccessible. If access cannot be tested reliably, report
          Inconclusive and do not fail. On failure, report the changed file and
          line, the inaccessible reference, and how to replace it with a public
          resource or include the required information in this repository.

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - files: "docs/development/code-review.md"
        applyTo: "**"
  learnings:
    scope: local
    approval_delay: 0
