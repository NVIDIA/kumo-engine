<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Connected tables become model context</title><desc id="desc">Three schematic stages show customers and orders tables, customer 42 connected to three orders, and a selected historical context retaining customer 42 and two orders. The future prediction window is separate.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8396aa"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#19232d}.h{font-size:25px;font-weight:700}.b{font-size:21px}.s{font-size:18px;fill:#52616e}.m{font:19px monospace}.w{fill:white}.n{font-size:20px;font-weight:700;text-anchor:middle}.edge{stroke:#8396aa;stroke-width:2.5;fill:none}</style><rect width="1200" height="650" rx="16" fill="#f6f8fa"/><text x="32" y="44" class="h" >Connected tables become model context</text><text x="32" y="77" class="b" >Will this customer order in the next 30 days?</text><g transform="translate(24,106)"><rect width="360" height="468" rx="12" fill="white" stroke="#d8e0e6"/><text x="26" y="41" class="h" >1  Define tables</text><rect x="26" y="75" width="300" height="116" rx="9" fill="#eef7df" stroke="#527d00"/><path d="M35 75H317Q326 75 326 84V118H26V84Q26 75 35 75Z" fill="#527d00"/><text x="42" y="105" class="h w" >customers</text><text x="42" y="148" class="m" >customer_id  PK</text><text x="42" y="179" class="m" >segment</text><path d="M176 255V195" class="edge" marker-end="url(#arrow)"/><text x="189" y="225" class="s" >FK → PK</text><rect x="26" y="270" width="300" height="147" rx="9" fill="#e9f2fd" stroke="#2469a8"/><path d="M35 270H317Q326 270 326 279V313H26V279Q26 270 35 270Z" fill="#2469a8"/><text x="42" y="300" class="h w" >orders</text><text x="42" y="343" class="m" >order_id     PK</text><text x="42" y="374" class="m" >customer_id  FK</text><text x="42" y="405" class="m" >order_time</text><text x="26" y="448" class="s" >Keys define table relationships.</text></g><g transform="translate(416,106)"><rect width="360" height="468" rx="12" fill="white" stroke="#d8e0e6"/><text x="26" y="41" class="h" >2  Connect records</text><text x="180" y="99" class="b" text-anchor="middle">customer_id = 42</text><path d="M180 171L65 294M180 171L180 344M180 171L295 294" class="edge"/><circle cx="180" cy="171" r="39" fill="#eef7df" stroke="#527d00" stroke-width="2.5"/><text x="180" y="178" class="n" >C42</text><circle cx="65" cy="294" r="27" fill="#e9f2fd" stroke="#2469a8" stroke-width="2.5"/><text x="65" y="301" class="n" >O1</text><circle cx="180" cy="344" r="27" fill="#e9f2fd" stroke="#2469a8" stroke-width="2.5"/><text x="180" y="351" class="n" >O2</text><circle cx="295" cy="294" r="27" fill="#e9f2fd" stroke="#2469a8" stroke-width="2.5"/><text x="295" y="301" class="n" >O3</text><text x="65" y="341" class="s" text-anchor="middle">Nov 8</text><text x="180" y="390" class="s" text-anchor="middle">Nov 19</text><text x="295" y="341" class="s" text-anchor="middle">Nov 27</text><text x="26" y="448" class="s" >Each circle is one record.</text></g><g transform="translate(808,106)"><rect width="360" height="468" rx="12" fill="white" stroke="#d8e0e6"/><text x="26" y="41" class="h" >3  Build model context</text><rect x="26" y="75" width="308" height="230" rx="12" fill="#f3f8e9" stroke="#9dbd6f" stroke-dasharray="6 4"/><text x="180" y="107" class="s" text-anchor="middle">Selected historical context</text><path d="M180 155L117 241M180 155L243 241" class="edge"/><circle cx="180" cy="155" r="31" fill="#eef7df" stroke="#527d00" stroke-width="2.5"/><text x="180" y="162" class="n" >C42</text><circle cx="117" cy="241" r="27" fill="#e9f2fd" stroke="#2469a8" stroke-width="2.5"/><text x="117" y="248" class="n" >O2</text><circle cx="243" cy="241" r="27" fill="#e9f2fd" stroke="#2469a8" stroke-width="2.5"/><text x="243" y="248" class="n" >O3</text><text x="180" y="284" class="s" text-anchor="middle">Sampling shown is illustrative.</text><path d="M48 367H315" class="edge" marker-end="url(#arrow)"/><rect x="194" y="328" width="140" height="57" rx="5" fill="#ede9f6"/><path d="M48 367H315" class="edge" marker-end="url(#arrow)"/><path d="M194 318V393" stroke="#19232d" stroke-width="2.5"/><text x="102" y="349" class="s" text-anchor="middle">History</text><text x="264" y="349" class="s" text-anchor="middle">Next 30 days</text><text x="194" y="418" class="s" text-anchor="middle">Prediction time</text><text x="26" y="448" class="s" >Future outcomes stay outside.</text></g><text x="32" y="615" class="s" >C = customer  ·  O = order</text><text x="1168" y="615" class="s" text-anchor="end">Schematic example · IDs and dates are illustrative</text></svg>