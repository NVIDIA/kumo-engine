[workspace]
members = [
    "diskgraph-core",
    "diskgraph-ingest",
    "diskgraph-datagenerator",
    "diskgraph-index",
    "diskgraph-fs",
    "diskgraph-limits",
    "diskgraph-rowpack",
    "diskgraph-infer",
    "diskgraph-ptrhash",
    "diskgraph-explain",
    "diskgraph-train-table",
    "diskgraph-engine",
    "diskgraph-gateway",
    "diskgraph-pybind",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
authors = ["DiskGraph Team <eng@diskgraph.example.com>"]
homepage = "https://example.com/diskgraph"
repository = "https://example.com/diskgraph/repo"
rust-version = "1.72"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.33", features = ["full"] }
async-trait = "0.1"
uuid = { version = "1.4", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
axum = { version = "0.6", features = ["json"] }
hyper = { version = "0.14", features = ["full"] }
http = "0.2"
bytes = "1.5"
arrow-array = "58.4.0"
arrow-buffer = "58.4.0"
arrow-cast = "58.4.0"
arrow-schema = "58.4.0"
bincode = "1.3"
parking_lot = "0.12"
arc-swap = "1"
chrono = { version = "0.4", features = ["serde"] }
serde_with = "3.4"
futures = "0.3"
half = "2.3"
# fast-float2 is the maintained fork of the abandoned `fast-float`, which
# carries RUSTSEC-2024-0379 (multiple soundness issues) and RUSTSEC-2025-0003
# (out-of-bounds read in `AsciiStr::first` on an empty input). The fork keeps
# the same `parse` entry point.
#
# fast-float2 inherited that empty-input out-of-bounds read (the same upstream
# issue #38) as RUSTSEC-2025-0002, fixed in 0.2.2. The requirement must stay
# at or above 0.2.2; do not relax it to a bare "0.2", which would admit 0.2.0
# and 0.2.1 and the advisory with them.
fast-float2 = "0.2.4"
ptr_hash = { package = "diskgraph-ptrhash", path = "diskgraph-ptrhash", features = ["epserde"] }
epserde = { version = "0.8", features = ["std", "derive"] }

# Release profile uses panic = "abort" so any allocation failure or
# explicit panic exits with SIGABRT (rc=134) instead of unwinding and
# possibly converting to anyhow::Err (rc=1). This makes OOM detection
# by exit code reliable for the ingest_runner wrapper:
#   rc 134 / 137 / 139 -> OOM-class (halve threads + resume)
#   rc 1 / 101         -> non-OOM application error (raise, do not retry)
[profile.release]
panic = "abort"
