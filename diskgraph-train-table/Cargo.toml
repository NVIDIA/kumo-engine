[package]
name = "diskgraph-train-table"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
pest = "2.7"
pest_derive = "2.7"
diskgraph-core = { path = "../diskgraph-core" }
diskgraph-rowpack = { path = "../diskgraph-rowpack" }
diskgraph-index = { path = "../diskgraph-index" }
chrono = { workspace = true }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
parquet = { version = "57.2.0", features = ["arrow"] }
half = "2"
rustyline = "12"
rayon = "1"

[dev-dependencies]
serde_json = { workspace = true }
tempfile = "3"
bincode = "1.3"
